<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a8285a">
<meta name="description" content="ZackHandel – die App für Händler, Service und Kleinunternehmer: Kunden, Artikel, Rechnungen, Kassenbuch, Service, Lizenzen, Ankauf. Offline, ohne Abo.">
<title>ZackHandel</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23a8285a'/%3E%3Cpath d='M14 22h36l-4 22H18z' fill='none' stroke='%23fff' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M24 22c0-6 4-9 8-9s8 3 8 9' fill='none' stroke='%23e9b949' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root{--g:#a8285a;--g2:#861d47;--g3:#651536;--gl:#f8e3ec;--gll:#fcf4f7;--sea:#2f7d6d;--seal:#dcefe9;--gold:#d99a2b;--goldl:#fbefd6;--red:#c0392b;--redl:#fbe6e3;--blue:#2c6e9b;--bluel:#e3eef6;--ink:#1d2329;--ink2:#3a434c;--muted:#6c737a;--bg:#f6f3f4;--card:#fff;--line:#e7dfe3;--line2:#f2edef;--side-bg:#231621;--side-ink:#d9e1e7;--side-mut:#8fa0ad;--sh:0 1px 2px rgba(50,15,30,.05),0 6px 20px rgba(50,15,30,.06);--r:16px;--side:256px;color-scheme:light}
[data-theme=dark]{--g:#e8709c;--g2:#f095b6;--g3:#f6bcd1;--gl:#3d1a29;--gll:#2a141e;--sea:#5cc0a8;--seal:#183630;--gold:#f2b84b;--goldl:#3a2e14;--red:#ff7b6b;--redl:#3d1d19;--blue:#7fb5e0;--bluel:#172b3b;--ink:#ece7e1;--ink2:#cfc7bf;--muted:#9a938c;--bg:#14171a;--card:#1d2125;--line:#2d3237;--line2:#24282c;--side-bg:#0e1418;--sh:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--g)}
svg{width:18px;height:18px;flex:none}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:13px}.r{text-align:right}.nowrap{white-space:nowrap}
.app{display:flex;min-height:100vh}
/* Seitenleiste – dunkles Nordsee-Blau mit Klinker-Akzent */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.side:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--g) 0 70%,#e9b949 70% 100%)}
.brand{display:flex;gap:12px;align-items:center;padding:24px 20px 18px}
.crest{width:44px;height:44px;border-radius:13px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;overflow:hidden;flex:none;box-shadow:0 6px 16px rgba(168,40,90,.4)}
.crest img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:17px;letter-spacing:-.01em;line-height:1.15;color:#fff}
.brand span{font-size:12px;color:var(--side-mut);display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{flex:1;overflow:auto;padding:2px 12px 12px}
.nav h6{margin:16px 10px 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-mut);font-weight:700}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 12px;border-radius:11px;cursor:pointer;color:var(--side-ink);font-weight:550;text-align:left;font-size:14.5px}
.nav button svg{color:var(--side-mut)}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:rgba(232,112,156,.18);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--g)}
.nav button.on svg{color:#f2c96b}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);color:var(--side-ink);border-radius:20px;padding:1px 8px;white-space:nowrap}
.nav .cnt.warn{background:rgba(217,154,43,.22);color:#f6cf86}.nav .cnt.bad{background:rgba(224,90,70,.25);color:#ffb3a6}
.side-foot{border-top:1px solid rgba(255,255,255,.08);padding:12px 16px;font-size:12px;color:var(--side-mut);display:flex;gap:8px;align-items:center;justify-content:space-between}
.side-foot .iconbtn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);color:var(--side-ink)}
.main{flex:1;margin-left:var(--side);min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;gap:10px;padding:0 30px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:15px;margin:0;font-weight:650;flex:1;color:var(--muted)}
.iconbtn.burger{display:none}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.iconbtn:hover{border-color:var(--g);color:var(--g)}
.demo-bar{background:var(--sea);color:#fff;font-weight:700;font-size:13px;text-align:center;padding:6px}
.demo-bar .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
.content{padding:28px 30px 64px;max-width:1380px;width:100%}
.head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.head h2{margin:0;font-size:30px;letter-spacing:-.025em;line-height:1.1;font-weight:800}
.head p{margin:6px 0 0;color:var(--muted);max-width:660px}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 15px;font-weight:650;cursor:pointer;white-space:nowrap;color:var(--ink);text-decoration:none;font-size:14.5px}
.btn:hover{border-color:var(--g)}
.btn-p{background:var(--g);border-color:var(--g);color:#fff;box-shadow:0 4px 12px rgba(168,40,90,.25)}
.btn-p:hover{background:var(--g2);border-color:var(--g2)}
[data-theme=dark] .btn-p{color:#2a0814}
.btn-sea{background:var(--sea);border-color:var(--sea);color:#fff}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#2e2100}
.btn-red{color:var(--red)}.btn-red:hover{border-color:var(--red)}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.025em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi .ic{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:11px;background:var(--gl);color:var(--g);display:grid;place-items:center}
.kpi.sea .ic,.kpi.g .ic{background:var(--seal);color:var(--sea)}.kpi.gold .ic{background:var(--goldl);color:#a26d0e}.kpi.red .ic{background:var(--redl);color:var(--red)}.kpi.blue .ic{background:var(--bluel);color:var(--blue)}
.hero{background:var(--side-bg);color:#fff;border-radius:20px;padding:26px 28px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:26px;align-items:center;position:relative;overflow:hidden;margin-bottom:16px}
.hero:after{content:"";position:absolute;right:-40px;bottom:-70px;width:260px;height:260px;border-radius:50%;border:38px solid rgba(245,165,36,.14)}
.hero h2{margin:0;font-size:15px;font-weight:650;color:#b9c6cf;text-transform:uppercase;letter-spacing:.08em}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:18px;color:#9fb0bc;font-weight:650}
.hero p{margin:0;color:#c5d0d7}
.hero .meter{height:12px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden;margin:14px 0 8px}
.hero .meter i{display:block;height:100%;background:linear-gradient(90deg,#f5a524,#ffd27a);border-radius:8px}
.hero .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.18)}
.hero .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;position:relative;z-index:1}
.hero .stats div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 14px}
.hero .stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.hero .stats span{font-size:12px;color:#9fb0bc}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.sec-t h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:center}
.sec-t h3 svg{color:var(--g)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line2)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li b{font-weight:650}
.av{width:38px;height:38px;border-radius:12px;background:var(--gl);color:var(--g2);display:grid;place-items:center;font-weight:750;font-size:13px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.sea,.av.g{background:var(--seal);color:var(--sea)}.av.gold{background:var(--goldl);color:#9a6700}.av.blue{background:var(--bluel);color:var(--blue)}.av.red{background:var(--redl);color:var(--red)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:220px;max-width:360px}
.search input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--side-bg);border-color:var(--side-bg);color:#fff}
[data-theme=dark] .chip.on{background:var(--g);border-color:var(--g);color:#2a0814}
.chip i{font-style:normal;opacity:.6;margin-left:3px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--muted);font-weight:700;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--gll);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.tbl td{padding:12px 16px;border-top:1px solid var(--line2);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl tbody tr:hover td{background:var(--gll)}
.tbl tr.click{cursor:pointer}
.tbl .sub{display:block;font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow:auto;border-radius:var(--r)}
.tbl tfoot td{font-weight:750;border-top:2px solid var(--line);background:var(--gll)}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--line2);color:var(--ink2);white-space:nowrap}
.pill.g,.pill.sea{background:var(--seal);color:var(--sea)}.pill.gold{background:var(--goldl);color:#8a5a00}.pill.red{background:var(--redl);color:var(--red)}.pill.blue{background:var(--bluel);color:var(--blue)}.pill.brick{background:var(--gl);color:var(--g2)}
[data-theme=dark] .pill.gold{color:var(--gold)}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--sea)}.neg{color:var(--red)}
.rowacts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:5px;min-width:230px;z-index:40}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 11px;border-radius:8px;cursor:pointer;font-weight:550}
.menu button:hover{background:var(--gll)}
.menu button.red{color:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(30,10,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:60;overflow:auto}
.modal{background:var(--card);border-radius:20px;width:100%;max-width:640px;box-shadow:0 24px 70px rgba(0,0,0,.28);display:flex;flex-direction:column;max-height:92vh}
.modal.wide{max-width:900px}.modal.xwide{max-width:1120px}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 24px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;flex:1;font-size:19px;letter-spacing:-.01em}
.modal-b{padding:20px 24px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f .l{margin-right:auto}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:650;color:var(--ink2)}
.f label .req{color:var(--red)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--card);width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid color-mix(in srgb,var(--g) 30%,transparent);border-color:var(--g)}
.f textarea{min-height:80px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.f .err{font-size:12px;color:var(--red)}
.f.check{flex-direction:row;align-items:center;gap:9px}
.f.check input{width:18px;height:18px;accent-color:var(--g)}
.f.check label{font-weight:550}
.fsec{grid-column:1/-1;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--g);margin-top:8px;padding-top:12px;border-top:1px solid var(--line2)}
.fsec:first-child{margin-top:0;padding-top:0;border-top:0}
.note{background:var(--gll);border:1px solid var(--gl);border-radius:13px;padding:12px 14px;font-size:13.5px;color:var(--ink2)}
.note.sea{background:var(--seal);border-color:#bfe0d6;color:#1d5348}
.note.gold{background:var(--goldl);border-color:#f2d9a3;color:#5c4200}
.note.red{background:var(--redl);border-color:#f2c3bd;color:#7a1c15}
[data-theme=dark] .note.gold{color:var(--gold);border-color:#5a4615}[data-theme=dark] .note.red{color:var(--red);border-color:#5a2520}[data-theme=dark] .note.sea{color:var(--sea);border-color:#1f4a41}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--side-bg);color:#fff;padding:12px 16px;border-radius:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:550;max-width:min(560px,92vw);display:flex;gap:12px;align-items:center}
.toast.err{background:var(--red);color:#fff}
.toast button{background:none;border:0;color:#f6cf86;font-weight:800;cursor:pointer}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:650;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--g2);border-bottom-color:var(--g)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:7px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.bar{height:8px;background:var(--line2);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea);border-radius:8px}
.bar.gold i{background:var(--gold)}.bar.red i{background:var(--red)}.bar.brick i{background:var(--g)}
/* Häuser-Karten */
.house{overflow:hidden;display:flex;flex-direction:column}
.house .roof{height:86px;background:var(--side-bg);position:relative;display:flex;align-items:flex-end;padding:14px 18px;color:#fff;overflow:hidden}
.house .roof:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 13px,rgba(255,255,255,.04) 13px 14px),repeating-linear-gradient(90deg,transparent 0 27px,rgba(255,255,255,.035) 27px 28px)}
.house .roof:after{content:"";position:absolute;right:16px;top:14px;width:58px;height:58px;background:var(--g);clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%);opacity:.9}
.house .roof b{font-size:18px;position:relative;z-index:1}.house .roof span{display:block;font-size:12.5px;color:#b9c6cf;position:relative;z-index:1}
.house .body{padding:14px 18px 16px;flex:1;display:flex;flex-direction:column;gap:10px}
.unitrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;background:var(--gll);border:1px solid var(--line2);cursor:pointer}
.unitrow:hover{border-color:var(--g)}
.unitrow .dot{width:9px;height:9px;border-radius:50%;background:var(--sea);flex:none}.unitrow .dot.vac{background:var(--gold)}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.statgrid div{background:var(--gll);border-radius:11px;padding:9px 11px}.statgrid b{display:block;font-variant-numeric:tabular-nums}.statgrid span{font-size:11.5px;color:var(--muted)}
/* Mietkalender */
.mgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.mgrid i{display:block;height:26px;border-radius:7px;background:var(--line2);font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted);display:grid;place-items:center}
.mgrid i.g{background:var(--seal);color:var(--sea)}.mgrid i.gold{background:var(--goldl);color:#8a5a00}.mgrid i.red{background:var(--redl);color:var(--red)}
.result{border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.result.nach{background:var(--redl);color:#7a1c15}.result.gut{background:var(--seal);color:#1d5348}
[data-theme=dark] .result.nach{color:var(--red)}[data-theme=dark] .result.gut{color:var(--sea)}
.result b{font-size:22px;font-variant-numeric:tabular-nums}
.ob{max-width:640px;margin:6vh auto;padding:0 16px}
.ob .card{padding:30px}
.ob h1{margin:0 0 6px;font-size:30px;letter-spacing:-.025em}
.steps{display:flex;gap:6px;margin:0 0 18px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps i.on{background:var(--g)}
.scrim{display:none}
.mtable input{border:1px solid var(--line);border-radius:9px;padding:7px 9px;width:120px;background:var(--card);text-align:right}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .side{transform:translateX(-102%);box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  .main{margin-left:0}.iconbtn.burger{display:grid}
  .top{padding:0 14px}.content{padding:18px 14px 72px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .fg,.fg.c3{grid-template-columns:minmax(0,1fr)}
  .head h2{font-size:24px}
  .tbl .hm{display:none}
  .kv{grid-template-columns:120px 1fr}
  .hero .big{font-size:32px}
}

/* Pipeline-Tafel */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:1 0 214px;min-width:214px;background:var(--line2);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.col.over{outline:2px dashed var(--g);outline-offset:-4px;background:var(--gl)}
.col-h{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.col-h b{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.col-h b i{font-style:normal;font-size:11.5px;background:var(--card);border-radius:20px;padding:1px 8px;color:var(--muted)}
.col-h span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-h .bar{height:4px;margin-top:8px}.col-h .bar i{background:var(--g)}
.col-b{padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:80px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 12px;cursor:grab;box-shadow:0 1px 2px rgba(50,15,30,.05);position:relative}
.dcard:hover{border-color:var(--g)}
.dcard.drag{opacity:.45}
.dcard b{display:block;font-size:14px;line-height:1.25;margin-bottom:3px}
.dcard .co{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
.dcard .ft .amt{font-weight:750;font-size:14px}
.dcard .nx{font-size:12px;margin-top:6px;display:flex;gap:5px;align-items:center;color:var(--muted)}
.dcard .nx svg{width:14px;height:14px}
.dcard .nx.late{color:var(--red);font-weight:650}.dcard .nx.none{color:#a26d0e;font-weight:650}
.dcard .who{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:7px;background:var(--gl);color:var(--g2);font-size:10.5px;font-weight:800;display:grid;place-items:center}
.dropzones{display:flex;gap:12px;margin-top:12px}
.dz{flex:1;border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;font-weight:700;color:var(--muted)}
.dz.won{border-color:#9fd8c6;color:var(--sea)}.dz.lost{border-color:#f0b9b2;color:var(--red)}
.dz.over{background:var(--gl)}
/* Verlauf */
.tl{display:flex;flex-direction:column;gap:0;position:relative}
.tl .it{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}
.tl .it:first-child{border-top:0}
.tl .it .av{width:34px;height:34px}
.tl .it .grow{flex:1;min-width:0}
.tl .it .t{font-size:12.5px;color:var(--muted)}
.tl .it p{margin:3px 0 0;white-space:pre-wrap;font-size:14px}
.stage{display:flex;gap:4px;margin:2px 0 14px}
.stage button{flex:1;border:0;padding:8px 4px;font-size:12px;font-weight:700;background:var(--line2);color:var(--muted);cursor:pointer;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%)}
.stage button:first-child{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%);border-radius:8px 0 0 8px}
.stage button.on{background:var(--g);color:#fff}.stage button.done{background:var(--gl);color:var(--g2)}
.timer{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart i{display:block;width:100%;max-width:34px;background:var(--g);border-radius:6px 6px 2px 2px;min-height:2px}
.chart i.f{background:repeating-linear-gradient(45deg,var(--gl) 0 5px,#efc0d3 5px 10px)}
.chart span{font-size:11px;color:var(--muted)}.chart em{font-style:normal;font-size:10.5px;color:var(--ink2);font-weight:700}
.funnel div{display:flex;align-items:center;gap:10px;margin:6px 0}
.funnel div b{width:130px;font-size:13px;font-weight:650;flex:none}
.funnel div .bar{flex:1;height:22px;border-radius:7px}.funnel div .bar i{background:var(--g);border-radius:7px}
.funnel div span{width:120px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.consent{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:860px){.col{flex-basis:78vw;max-height:none}.dropzones{position:sticky;bottom:8px}}

/* Verkauf / Positionen */
.sellgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(340px,1fr);gap:16px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px}
.tile:hover{border-color:var(--g);box-shadow:var(--sh)}
.tile b{font-size:14px;line-height:1.25;hyphens:auto;overflow-wrap:anywhere}.tile .p{margin-top:auto;font-weight:800;font-variant-numeric:tabular-nums;color:var(--g2)}.tile .s{font-size:11.5px;color:var(--muted)}
.tile.low{border-color:#f0c58a}.tile.out{opacity:.5}
.cart{position:sticky;top:80px}
.cart .ln{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line2)}
.cart .ln:first-child{border-top:0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--gll);width:28px;height:28px;cursor:pointer;font-weight:800}
.qty input{width:44px;border:0;text-align:center;background:var(--card);height:28px}
.sum{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.paybtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paybtns .btn{padding:12px 8px;flex-direction:column;gap:3px;font-size:13px}
.status-steps{display:flex;gap:4px;flex-wrap:wrap}
.status-steps button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.status-steps button.on{background:var(--g);border-color:var(--g);color:#fff}
.lock{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.lock svg{width:13px;height:13px}
@media (max-width:1000px){.sellgrid{grid-template-columns:minmax(0,1fr)}.cart{position:static}}

/* ---------- Speicher (IndexedDB, Notfall localStorage) ---------- */
const store = (() => {
  let dbp = null, mode = 'idb';
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('kein IndexedDB'));
    let q; try { q = indexedDB.open(DB_NAME, 1); } catch (e) { return rej(e); }
    q.onupgradeneeded = () => q.result.createObjectStore('kv');
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); q.onblocked = () => rej(new Error('blockiert'));
  }));
  const tx = async (m, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('kv', m); const out = fn(t.objectStore('kv')); t.oncomplete = () => res(typeof out === 'function' ? out() : out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return {
    get mode() { return mode; },
    async init() { try { await open(); await tx('readonly', s => { s.count(); }); } catch (e) { mode = 'ls'; } return mode; },
    async get(k) { if (mode === 'ls') { try { const v = localStorage.getItem(LS_PREFIX + k); return v ? JSON.parse(v) : undefined; } catch (e) { return undefined; } } return tx('readonly', s => { let r; const q = s.get(k); q.onsuccess = () => { r = q.result; }; return () => r; }); },
    async set(k, v) { if (mode === 'ls') { localStorage.setItem(LS_PREFIX + k, JSON.stringify(v)); return; } return tx('readwrite', s => { s.put(v, k); }); },
    async del(k) { if (mode === 'ls') { localStorage.removeItem(LS_PREFIX + k); return; } return tx('readwrite', s => { s.delete(k); }); },
    async keys() { if (mode === 'ls') return Object.keys(localStorage).filter(k => k.startsWith(LS_PREFIX)).map(k => k.slice(LS_PREFIX.length)); return tx('readonly', s => { let r = []; const q = s.getAllKeys(); q.onsuccess = () => { r = q.result.map(String); }; return () => r; }); },
    async clear() { if (mode === 'ls') { Object.keys(localStorage).filter(k => k.startsWith(LS_PREFIX)).forEach(k => localStorage.removeItem(k)); return; } return tx('readwrite', s => { s.clear(); }); }
  };
})();

}

const diffMargin = (it, amount) => { const mg = amount - num(it.buy) * num(it.qty); return num(it.qty) < 0 ? Math.min(0, mg) : Math.max(0, mg); };
function docTotals(d) {
  const small = !!d.smallBiz, groups = {}; let diffSum = 0, diffTax = 0;
  const lines = d.items.map(it => {
    const up = r2(num(it.price) * (1 - num(it.disc) / 100)), amount = r2(num(it.qty) * up);
    if (it.diff && !small) { diffSum += amount; diffTax += diffMargin(it, amount) * 19 / 119; return { ...it, up, amount }; }
    const rate = small ? 0 : Number(it.vat ?? 19); (groups[rate] ||= { rate, base: 0 }).base = r2(groups[rate].base + amount); return { ...it, up, amount, rate };
  });
  let net = 0, vat = 0, gross = 0;
  const taxes = Object.values(groups).sort((a, b) => b.rate - a.rate).map(g => {
    if (d.gross) { const t = r2(g.base * g.rate / (100 + g.rate)); net += g.base - t; vat += t; gross += g.base; return { rate: g.rate, net: r2(g.base - t), tax: t, gross: g.base }; }
    const t = r2(g.base * g.rate / 100); net += g.base; vat += t; gross += g.base + t; return { rate: g.rate, net: g.base, tax: t, gross: r2(g.base + t) };
  });

}
function docStatus(d) {

function periodRange(p) {
  const t = today(), y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7));
  if (p === 'heute') return [t, t];
  if (p === 'monat') return [`${t.slice(0, 7)}-01`, t];
  if (p === 'vormonat') { const s = addMonths(`${t.slice(0, 7)}-01`, -1); return [s, addDays(`${t.slice(0, 7)}-01`, -1)]; }
  if (p === 'quartal') { const qm = Math.floor((m - 1) / 3) * 3 + 1; return [`${y}-${pad2(qm)}-01`, t]; }

}

function salesStats(from, to) {

  const byKind = {}, byArt = {}, byCust = {}, byRate = {}; let net = 0, vat = 0, gross = 0, diffSum = 0, diffTax = 0, cost = 0;
  ds.forEach(d => { const t = docTotals(d); net += t.net + (t.diffSum - t.diffTax); vat += t.vat + t.diffTax; gross += t.gross; diffSum += t.diffSum; diffTax += t.diffTax;
    t.taxes.forEach(x => { (byRate[x.rate] ||= { rate: x.rate, net: 0, tax: 0 }); byRate[x.rate].net += x.net; byRate[x.rate].tax += x.tax; });
    const f = t.gross ? (t.net + t.diffSum - t.diffTax) / t.gross : 1;
    t.lines.forEach(l => { const a = artById(l.art), k = l.diff ? 'gebraucht' : a?.kind || 'ware', v = r2(l.diff && !d.smallBiz ? l.amount - diffMargin(l, l.amount) * 19 / 119 : d.gross ? l.amount / (1 + (l.rate || 0) / 100) : l.amount);
      byKind[k] = r2((byKind[k] || 0) + v); const key = l.art || l.text; (byArt[key] ||= { name: a?.name || l.text, qty: 0, v: 0 }); byArt[key].qty += num(l.qty); byArt[key].v = r2(byArt[key].v + v);

function readForm(form, fields) {

  fields.forEach(f => {

    if (f.type === 'multi') { out[f.k] = $$(`[data-multi="${f.k}"] input:checked`, form).map(i => i.value); return; }
    const el = form.elements[f.k]; if (!el) return;
    let v = el.value.trim();
    if (f.type === 'money' || f.type === 'number') v = v === '' ? (f.type === 'money' ? 0 : '') : num(v);

}

function backupLabel() { const b = data.meta.lastBackup; if (!b) return '⚠ Noch nie gesichert'; const d = daysBetween(b.slice(0, 10), today()); return d === 0 ? '✓ Heute gesichert' : `Gesichert vor ${plural(d, 'Tag', 'Tagen')}`; }
function go(v, state = {}) { if (!VIEWS[v]) v = 'dashboard'; view = v; viewState = state; document.body.classList.remove('nav-open'); try { history.replaceState(null, '', '#' + v); } catch (e) {} render(); window.scrollTo(0, 0); }

/* ---------- Seiten-Bausteine ---------- */
const head = (title, text, acts = '') => `<div class="head"><div><h2>${title}</h2>${text ? `<p>${text}</p>` : ''}</div><div class="acts">${acts}</div></div>`;
const emptyBox = (title, text, btn = '') => `<div class="empty"><b>${title}</b>${text}${btn ? `<div style="margin-top:12px">${btn}</div>` : ''}</div>`;
const pill = (t, cls = '') => `<span class="pill ${cls}">${esc(t)}</span>`;
const kpi = (l, v, s, icon, cls = '') => `<div class="card kpi ${cls}"><div class="ic">${svg(icon)}</div><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
const moreBtn = acts => `<div class="menu-wrap"><button class="iconbtn" data-menu='${esc(JSON.stringify(acts))}' aria-label="Mehr">${svg('more')}</button></div>`;
const searchBox = (val, ph = 'Suchen …') => `<div class="search">${svg('search')}<input type="search" id="q" value="${esc(val || '')}" placeholder="${esc(ph)}" aria-label="Suchen"></div>`;
const chips = (key, opts, cur) => `<div class="chips">${opts.map(([v, l, n]) => `<button class="chip${String(cur) === String(v) ? ' on' : ''}" data-chip="${key}:${esc(v)}">${esc(l)}${n !== undefined ? `<i>${n}</i>` : ''}</button>`).join('')}</div>`;
const avatar = (name, cls = '') => `<div class="av ${cls}">${esc(initials(name))}</div>`;
const amt = (n, signed = false) => `<span class="amt ${signed ? (n < 0 ? 'neg' : n > 0 ? 'pos' : '') : ''}">${fmtMoney(n)}</span>`;
const matchQ = (q, ...vals) => !q || vals.join(' ').toLowerCase().includes(q.toLowerCase());

/* ---------- Rendern ---------- */
const VIEWS = {};
function render() {
  if (!data.meta.setupDone && !IS_DEMO) { renderOnboarding(); return; }
  if (!$('#side')) shell();
  renderNav();
  $('#title').textContent = LABELS[view] || APPNAME;
  const keepQ = document.activeElement?.id === 'q' ? document.activeElement.selectionStart : null;
  try { $('#content').innerHTML = VIEWS[view](); } catch (e) { console.error(e); $('#content').innerHTML = `<div class="note red">Fehler beim Anzeigen: ${esc(e.message)}</div>`; }
  if (keepQ !== null) { const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(keepQ, keepQ); } }
  VIEWS[view].after && VIEWS[view].after();
}
function shell() {
  document.body.innerHTML = `${IS_DEMO ? '<div class="demo-bar">DEMO-VERSION – alle Kunden, Artikel und Zahlen sind erfunden. <button class="btn btn-sm" data-act="demoReset" style="margin-left:8px;padding:1px 9px">Demo zurücksetzen</button></div>' : ''}
  <div class="app"><aside class="side" id="side"></aside><div class="scrim" data-act="navClose"></div>
  <div class="main"><header class="top"><button class="iconbtn burger" data-act="nav" aria-label="Menü">${svg('menu')}</button><h1 id="title"></h1>
  <button class="iconbtn" data-act="quickAdd" title="Neu anlegen" aria-label="Neu anlegen">${svg('plus')}</button><button class="iconbtn" data-act="backup" title="Sicherung speichern" aria-label="Sicherung speichern">${svg('download')}</button></header>
  <main class="content" id="content"></main></div></div><div id="toasts" class="toasts"></div>`;
}

/* ---------- Aktionen (Klicks) ---------- */
const ACTS = {};
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go, g.dataset.state ? JSON.parse(g.dataset.state) : {}); return; }
  const mb = e.target.closest('[data-menu]'); if (mb) { e.stopPropagation(); if (mb.parentElement.querySelector('.menu')) { closeMenus(); return; } openMenu(mb, JSON.parse(mb.dataset.menu)); return; }
  const ch = e.target.closest('[data-chip]'); if (ch) { const [k, ...v] = ch.dataset.chip.split(':'); viewState[k] = v.join(':'); render(); return; }
  const tab = e.target.closest('[data-tab]'); if (tab) { viewState.tab = tab.dataset.tab; render(); return; }
  const a = e.target.closest('[data-act]'); if (!a) { const row = e.target.closest('tr[data-open]'); if (row && !e.target.closest('button,a,input,label,select')) runAct(row.dataset.open); return; }
  e.preventDefault(); closeMenus(); runAct(a.dataset.act, a);
});
function runAct(s, el) { const [name, ...args] = String(s).split(':'); const f = ACTS[name]; if (!f) { console.warn('Unbekannt', name); return; } try { window.__actEl = el; const r = f(...args); if (r && r.catch) r.catch(err => { console.error(err); toast('Fehler: ' + err.message, { err: true }); }); } catch (err) { console.error(err); toast('Fehler: ' + err.message, { err: true }); } }
document.addEventListener('input', debounce(e => { if (e.target.id === 'q') { viewState.q = e.target.value; render(); } }, 180));
ACTS.nav = () => document.body.classList.toggle('nav-open');
ACTS.navClose = () => document.body.classList.remove('nav-open');
ACTS.theme = () => { const cur = document.documentElement.dataset.theme === 'dark' ? '' : 'dark'; data.meta.theme = cur; applyTheme(); save(); };
function applyTheme() { document.documentElement.dataset.theme = data.meta.theme || ''; }
ACTS.quickAdd = () => {
  openModal({ title: 'Neu anlegen', body: `<div class="grid g2">${[['go:sell', 'cart', 'Verkauf / Schnellrechnung'], ['newDoc:rechnung', 'file', 'Rechnung'], ['newDoc:angebot', 'file', 'Angebot'], ...(data.settings.mods.service ? [['newService', 'wrench', 'Service-Auftrag']] : []), ...(data.settings.mods.ankauf ? [['newPurchase', 'recycle', 'Ankauf']] : []), ...(data.settings.mods.licenses ? [['newLicense', 'disc', 'Lizenz']] : []), ['newCustomer', 'user', 'Kunde'], ['newArticle', 'box', 'Artikel'], ['newExpense', 'receipt', 'Ausgabe'], ['cashEntry', 'cash', 'Kassenbuch-Eintrag']].map(([a, i, l]) => `<button class="btn" style="justify-content:flex-start;padding:14px" data-act="${a}" onclick="closeModal()">${svg(i)} ${l}</button>`).join('')}</div>` });
};
ACTS.go = (v, ...st) => go(v);

/* =========================================================
   Rechnungen, Angebote, Storno, Zahlungen, Druck, XRechnung
   ========================================================= */
VIEWS.docs = () => {
  const f = viewState.f || 'rechnung', st = viewState.st || '', q = viewState.q || '';
  const all = data.docs.slice().sort((a, b) => (b.date + (b.no || '')).localeCompare(a.date + (a.no || '')));
  const list = all.filter(d => f === 'alle' || d.type === f || (f === 'rechnung' && d.type === 'storno')).filter(d => !st || docStatus(d) === st || (st === 'offen' && ['offen', 'teilbezahlt', 'überfällig'].includes(docStatus(d)))).filter(d => matchQ(q, d.no, custName(custById(d.customer)), d.items.map(i => i.text).join(' ')));
  const oi = openInvoices();
  return head('Rechnungen & Angebote', 'Alle Belege mit fortlaufender Nummer. Festgeschriebene Rechnungen lassen sich nicht mehr ändern – nur stornieren.', `<button class="btn" data-act="newDoc:angebot">${svg('plus')} Angebot</button><button class="btn btn-p" data-act="newDoc:rechnung">${svg('plus')} Rechnung</button>`) +
  (oi.length ? `<div class="note ${oi.some(d => docStatus(d) === 'überfällig') ? 'red' : 'gold'}" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1"><b>${plural(oi.length, 'Rechnung', 'Rechnungen')} offen: ${fmtMoney(sum(oi, d => docTotals(d).open))}</b>${oi.some(d => docStatus(d) === 'überfällig') ? ` – davon ${oi.filter(d => docStatus(d) === 'überfällig').length} überfällig` : ''}</div><button class="btn btn-sm" data-chip="st:offen">Anzeigen</button></div>` : '') +
  `<div class="tools">${searchBox(q, 'Nummer, Kunde, Artikel …')}${chips('f', [['rechnung', 'Rechnungen'], ['angebot', 'Angebote'], ['alle', 'Alle']], f)}${chips('st', [['', 'Jeder Status'], ['offen', 'Offen'], ['bezahlt', 'Bezahlt'], ['entwurf', 'Entwurf'], ['storniert', 'Storniert']], st)}</div>` +
  (list.length ? `<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Beleg</th><th>Kunde</th><th class="hm">Datum</th><th class="r">Betrag</th><th>Status</th><th></th></tr></thead><tbody>${list.map(d => { const t = docTotals(d), s = docStatus(d);
    return `<tr class="click" data-open="openDoc:${d.id}"><td><b>${esc(d.no || 'Entwurf')}</b><span class="sub">${DOC_TYPES[d.type][0]}${d.service ? ' · Service' : ''}${d.pos ? ' · Verkauf' : ''}</span></td><td>${esc(custName(custById(d.customer)))}<span class="sub">${esc(d.items.slice(0, 2).map(i => i.text).join(', ').slice(0, 60))}</span></td><td class="hm">${fmtDate(d.date)}${d.due && d.type === 'rechnung' && s !== 'bezahlt' ? `<span class="sub">fällig ${fmtDate(d.due)}</span>` : ''}</td><td class="r">${amt(t.gross)}${t.open > 0.004 && d.final && d.type === 'rechnung' && s !== 'storniert' ? `<span class="sub">offen ${fmtMoney(t.open)}</span>` : ''}</td><td>${pill(s, DOC_CLS[s])}</td>
    <td><div class="rowacts">${d.type === 'rechnung' && d.final && ['offen', 'teilbezahlt', 'überfällig'].includes(s) ? `<button class="btn btn-sm" data-act="payDoc:${d.id}">${svg('euro')} Zahlung</button>` : ''}<button class="btn btn-sm" data-act="printDoc:${d.id}">${svg('print')}</button></div></td></tr>`; }).join('')}</tbody></table></div>` :
  `<div class="card">${emptyBox('Keine Belege', 'Schreibe eine Rechnung oder ein Angebot – oder verkaufe direkt unter „Verkauf“.', `<button class="btn btn-p" data-act="newDoc:rechnung">${svg('plus')} Rechnung</button>`)}</div>`);
};

/* ---------- Beleg anlegen / bearbeiten ---------- */
ACTS.newDoc = (type, custId) => { const c = custById(custId); docEditor({ id: '', type, date: today(), customer: custId || '', gross: c ? !isBusiness(c) && data.settings.privGross : !!data.settings.privGross, items: [], payments: [], valid: type === 'angebot' ? addDays(today(), Number(data.settings.quoteDays) || 30) : '', text: '' }); };
ACTS.openDoc = id => { const d = docById(id); closeModal(); if (!d.final) docEditor(JSON.parse(JSON.stringify(d))); else docView(d); };
function docEditor(d) {
  const priceLbl = () => d.gross ? 'Preis brutto' : 'Preis netto';
  const itemRow = (it, i) => `<tr data-i="${i}"><td><input data-k="text" value="${esc(it.text)}" placeholder="Beschreibung" style="width:100%;min-width:220px;text-align:left">${it.diff ? '<span class="sub">Gebrauchtware · Differenzbesteuerung</span>' : ''}</td><td><input data-k="qty" value="${esc(fmtNum(num(it.qty), num(it.qty) % 1 ? 2 : 0))}" style="width:58px;text-align:right"></td><td><input data-k="unit" value="${esc(it.unit || '')}" style="width:56px"></td><td><input data-k="price" value="${esc(fmtNum(num(it.price), 2))}" style="width:92px;text-align:right"></td><td>${data.settings.smallBiz || it.diff ? '<span class="muted small">–</span>' : `<select data-k="vat">${VAT_RATES.map(r => `<option value="${r}"${Number(it.vat ?? 19) === r ? ' selected' : ''}>${r} %</option>`).join('')}</select>`}</td><td><input data-k="disc" value="${esc(num(it.disc) ? fmtNum(num(it.disc), 1) : '')}" placeholder="0" style="width:48px;text-align:right"></td><td class="r" data-sum></td><td><button class="iconbtn" style="width:32px;height:32px" data-rm="${i}" aria-label="Entfernen">${svg('trash')}</button></td></tr>`;
  const md = openModal({ title: `${DOC_TYPES[d.type][0]}${d.no ? ' ' + esc(d.no) : ' (Entwurf)'}`, xwide: true,
    body: `<form id="dF"><div class="fg c3"><div class="f"><label>Kunde</label><select name="customer">${custOpts().map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(d.customer) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div><div class="f"><label>Datum</label><input type="date" name="date" value="${esc(d.date)}"></div>
      ${d.type === 'angebot' ? `<div class="f"><label>Gültig bis</label><input type="date" name="valid" value="${esc(d.valid || '')}"></div>` : `<div class="f"><label>Leistungsdatum (wenn abweichend)</label><input type="date" name="served" value="${esc(d.served || '')}"></div>`}
      <div class="f full"><label>Betreff / Hinweis</label><input name="subject" value="${esc(d.subject || '')}" placeholder="z. B. Ihre Bestellung vom …"></div></div>
      <div style="display:flex;gap:16px;align-items:center;margin-top:8px;flex-wrap:wrap">${data.settings.smallBiz ? '<span class="pill blue">Kleinunternehmer – ohne Umsatzsteuer</span>' : `<label class="f check" style="margin:0"><input type="checkbox" name="gross" ${d.gross ? 'checked' : ''}><label>Preise brutto (für Privatkunden)</label></label>`}<button type="button" class="btn btn-sm" id="dNewCust">${svg('plus')} Neuer Kunde</button></div></form>
      <div class="sec-t" style="margin-top:14px"><h3>${svg('box')} Positionen</h3><div style="display:flex;gap:6px;flex-wrap:wrap"><select id="dArt" class="btn btn-sm" style="max-width:300px"><option value="">+ Artikel / Leistung …</option>${data.articles.filter(a => !a.inactive && (!tracksStock(a) || num(a.stock) > 0 || a.kind === 'ware')).sort((a, b) => a.name.localeCompare(b.name, 'de')).map(a => `<option value="${a.id}">${esc(a.name)} – ${fmtMoney(grossOf(a))}${tracksStock(a) ? ` (${fmtNum(num(a.stock))})` : ''}</option>`).join('')}</select><button class="btn btn-sm" id="dAdd">${svg('plus')} Freie Position</button></div></div>
      <div class="tbl-wrap" style="border:1px solid var(--line)"><table class="tbl mtable" style="font-size:14px"><thead><tr><th>Beschreibung</th><th class="r">Menge</th><th>Einheit</th><th class="r" id="dPL">${priceLbl()}</th><th>USt</th><th class="r">Rabatt %</th><th class="r">Summe</th><th></th></tr></thead><tbody id="dItems"></tbody></table></div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px"><table class="tbl" style="width:auto;min-width:320px" id="dTot"></table></div>
      <div class="f" style="margin-top:10px"><label>Schlusstext (optional)</label><textarea id="dText" style="min-height:52px" placeholder="z. B. Vielen Dank für Ihren Einkauf!">${esc(d.text || '')}</textarea></div>`,
    foot: `${d.id ? `<button class="btn btn-red l" id="dDel">${svg('trash')} Entwurf löschen</button>` : ''}<button class="btn" id="dSave">Als Entwurf speichern</button>${d.type === 'angebot' ? `<button class="btn btn-p" id="dFinal">${svg('print')} Speichern & drucken</button>` : `<button class="btn btn-p" id="dFinal">${svg('lock')} Festschreiben & drucken</button>`}` });
  const tb = $('#dItems', md), form = $('#dF', md);
  const read = () => { const f = form.elements; Object.assign(d, { customer: f.customer.value, date: f.date.value, valid: f.valid?.value || d.valid, served: f.served?.value || '', subject: f.subject.value, text: $('#dText', md).value, gross: data.settings.smallBiz ? d.gross : f.gross.checked });
    $$('tr[data-i]', tb).forEach(tr => { const it = d.items[Number(tr.dataset.i)], g = k => tr.querySelector(`[data-k="${k}"]`); it.text = g('text').value; it.qty = num(g('qty').value); it.unit = g('unit').value; it.price = num(g('price').value); it.disc = num(g('disc').value); if (g('vat')) it.vat = Number(g('vat').value); }); };
  const tot = () => { read(); const t = docTotals({ ...d, smallBiz: data.settings.smallBiz }); $$('tr[data-i]', tb).forEach((tr, i) => { tr.querySelector('[data-sum]').textContent = fmtMoney(t.lines[i]?.amount || 0); });
    $('#dTot', md).innerHTML = (d.gross ? '' : `<tr><td>Summe netto</td><td class="r">${fmtMoney(t.net)}</td></tr>`) + t.taxes.filter(x => x.rate).map(x => `<tr><td>${d.gross ? 'enthaltene' : 'zzgl.'} USt ${x.rate} %</td><td class="r">${fmtMoney(x.tax)}</td></tr>`).join('') + (t.diffSum ? `<tr><td>Gebrauchtware (§ 25a)</td><td class="r">${fmtMoney(t.diffSum)}</td></tr>` : '') + `<tr><td><b>Gesamt</b></td><td class="r"><b>${fmtMoney(t.gross)}</b></td></tr>`; $('#dPL', md).textContent = priceLbl(); };
  const redraw = () => { tb.innerHTML = d.items.map(itemRow).join('') || `<tr><td colspan="8" class="muted small" style="padding:14px">Noch keine Positionen – oben einen Artikel wählen oder eine freie Position anlegen.</td></tr>`; tot(); };
  tb.addEventListener('input', tot); tb.addEventListener('change', tot);
  form.addEventListener('change', e => { if (e.target.name === 'gross') { const was = !e.target.checked; read(); d.items.forEach(it => { if (it.diff || data.settings.smallBiz) return; const r = 1 + Number(it.vat ?? 19) / 100; it.price = r2(was ? it.price / r : it.price * r); }); redraw(); } if (e.target.name === 'customer') { const c = custById(e.target.value); if (c && !data.settings.smallBiz && !d.items.length) { form.elements.gross.checked = !isBusiness(c) && data.settings.privGross; read(); tot(); } } });
  tb.addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (!b) return; read(); d.items.splice(Number(b.dataset.rm), 1); redraw(); });
  $('#dAdd', md).onclick = () => { read(); d.items.push({ text: '', qty: 1, unit: 'Stk.', price: 0, vat: data.settings.smallBiz ? 0 : 19, disc: 0 }); redraw(); $$('tr[data-i]', tb).at(-1).querySelector('input').focus(); };
  $('#dArt', md).onchange = e => { const a = artById(e.target.value); if (!a) return; read(); const ex = d.items.find(i => i.art === a.id && !a.serial); if (ex) ex.qty = num(ex.qty) + 1; else d.items.push(itemFromArt(a, d.gross)); e.target.value = ''; redraw(); };
  $('#dNewCust', md).onclick = () => { read(); ACTS.newCustomer(null, c => { d.customer = c.id; if (!data.settings.smallBiz && !d.items.length) d.gross = !isBusiness(c) && data.settings.privGross; closeModal(); docEditor(d); }); };
  redraw();
  const persist = () => { read(); if (!d.items.length) { toast('Bitte mindestens eine Position eintragen.', { err: true }); return false; } d.items = d.items.filter(i => i.text || i.price); if (!d.id) d.id = pid(); upsert('docs', d); return true; };
  $('#dSave', md).onclick = () => { if (!persist()) return; closeModal(); render(); toast('Entwurf gespeichert.'); };
  $('#dFinal', md).onclick = async () => { if (!persist()) return;
    if (d.type === 'rechnung') { const c = custById(d.customer), t = docTotals(d); if (!c && t.gross > 250) { toast('Rechnungen über 250 € brauchen Name und Anschrift des Kunden. Bitte einen Kunden wählen.', { err: true, ms: 6000 }); return; } if (!await confirmBox(`Rechnung über <b>${fmtMoney(t.gross)}</b> festschreiben? Danach bekommt sie eine feste Nummer und lässt sich nicht mehr ändern – nur noch stornieren.`, 'Festschreiben')) return; }
    finalizeDoc(d); afterFinalize(d); upsert('docs', d); closeModal(); render(); ACTS.printDoc(d.id); toast(`${DOC_TYPES[d.type][0]} ${d.no} erstellt.`); setTimeout(() => docView(docById(d.id)), 80); };
  if (d.id) $('#dDel', md).onclick = async () => { if (!await confirmBox('Diesen Entwurf löschen?', 'Löschen', true)) return; removeFrom('docs', d.id); closeModal(); render(); };
}

/** Verknüpfungen nach dem Festschreiben: Service abgerechnet, Lizenz verlängert */
function afterFinalize(d) {
  if (d.type !== 'rechnung') return;
  const o = docById(d.fromOffer); if (o) { o.status = 'angenommen'; touch(o); }
  const s = svcById(d.service); if (s) { s.doc = d.id; touch(s); }
  const l = licById(d.license); if (l && d.licExtend) { l.end = d.licExtend; l.lastDoc = d.id; touch(l); }
}
/* ---------- Beleg ansehen (festgeschrieben) ---------- */
function docView(d) {
  const t = docTotals(d), s = docStatus(d), c = custById(d.customer), ref = docById(d.ref) || docById(d.cancelled);
  const md = openModal({ title: `${DOC_TYPES[d.type][0]} ${esc(d.no || '')} ${pill(s, DOC_CLS[s])}`, wide: true,
    body: `<div class="grid g3" style="margin-bottom:14px">${kpi('Betrag', fmtMoney(t.gross), d.gross ? 'brutto' : `netto ${fmtMoney(t.net)}`, 'euro')}${kpi('Bezahlt', fmtMoney(t.paid), d.payments.length ? plural(d.payments.length, 'Zahlung', 'Zahlungen') : '–', 'check', 'sea')}${kpi('Offen', fmtMoney(d.type === 'rechnung' && !d.cancelled ? Math.max(0, t.open) : 0), d.due && d.type === 'rechnung' ? 'fällig ' + fmtDate(d.due) : '', 'clock', t.open > 0.004 && !d.cancelled ? 'red' : '')}</div>
      <dl class="kv"><dt>Kunde</dt><dd>${c ? `<a href="#" data-act="openCustomer:${c.id}">${esc(custName(c))}</a>` : 'Laufkunde'}</dd><dt>Datum</dt><dd>${fmtDate(d.date)}${d.served ? ' · Leistung ' + fmtDate(d.served) : ''}</dd>${ref ? `<dt>${d.type === 'storno' ? 'Storniert' : 'Storno'}</dt><dd><a href="#" data-act="openDoc:${ref.id}">${esc(ref.no)}</a></dd>` : ''}<dt>Festgeschrieben</dt><dd><span class="lock">${svg('lock')} ${d.finalAt ? fmtDate(d.finalAt.slice(0, 10)) + ' ' + d.finalAt.slice(11, 16) : '–'}</span></dd></dl>

ACTS.cartPay = async method => {
  if (!cart.items.length) return;

const licFields = () => [

const licDef = l => ({ title: l.id ? 'Lizenz bearbeiten' : 'Neue Lizenz', wide: true, fields: () => licFields().filter(f => l.id ? f.k !== 'invoice' : f.k !== 'ended'),
  onOpen: form => { const sync = () => { const a = artById(form.elements.art.value); if (a) { if (!form.elements.product.value) form.elements.product.value = a.name; if (!num(form.elements.price.value)) form.elements.price.value = fmtNum(grossOf(a), 2); } };
    form.elements.art.onchange = sync; const per = () => { if (!form.elements.end.value && form.elements.start.value && form.elements.period.value !== 'einmalig') form.elements.end.value = addMonths(form.elements.start.value, form.elements.period.value === 'monat' ? 1 : 12); }; form.elements.period.onchange = per; form.elements.start.onchange = per; },
  save: x => { const isNew = !x.id; if (isNew) x.id = pid(); const inv = x.invoice; delete x.invoice; upsert('licenses', x);

ACTS.newLicense = custId => openForm(licDef({}), { customer: custId || '', start: today(), period: 'jahr', end: addMonths(today(), 12), seats: 1, invoice: true });
ACTS.editLicense = id => { closeModal(); openForm(licDef(licById(id)), licById(id)); };
function licInvoice(l, renew) {
  const c = custById(l.customer), a = artById(l.art), gross = data.settings.smallBiz || !isBusiness(c), rate = a ? vatOf(a) : data.settings.smallBiz ? 0 : 19;
  const newEnd = renew ? licNext(l) : '';
  const per = renew ? ` – Verlängerung ${fmtDate(addDays(l.end, 1))} bis ${fmtDate(newEnd)}` : l.end ? ` – Laufzeit ${fmtDate(l.start)} bis ${fmtDate(l.end)}` : '';
  const price = num(l.price) || (a ? grossOf(a) : 0);
  docEditor({ id: '', type: 'rechnung', date: today(), customer: l.customer, gross, payments: [], license: l.id, licExtend: newEnd, served: renew ? addDays(l.end, 1) : l.start,
    items: [{ art: l.art || '', text: `${l.product}${num(l.seats) > 1 ? ` (${num(l.seats)} Plätze)` : ''}${per}`, qty: 1, unit: 'Lizenz', price: gross ? price : r2(price / (1 + rate / 100)), vat: rate, disc: 0, kind: 'software' }],
    subject: renew ? `Verlängerung Ihrer Lizenz ${l.product}` : '' });
}
ACTS.renewLicense = async id => { const l = licById(id); if (l.period === 'einmalig') return toast('Kauflizenzen laufen nicht ab.', { err: true });

  closeModal(); licInvoice(l, true); };

const COND = ['neuwertig', 'sehr gut', 'gut', 'gebraucht', 'defekt / Bastler'];
VIEWS.ankauf = () => {
  const q = viewState.q || '', y = viewState.y || String(new Date().getFullYear());
  const list = data.purchases.filter(p => p.date.startsWith(y) && matchQ(q, p.no, custName(custById(p.seller)), p.items.map(i => i.text + ' ' + (i.serial || '')).join(' '))).sort((a, b) => b.date.localeCompare(a.date) || b.no.localeCompare(a.no));
  const years = [...new Set([String(new Date().getFullYear()), ...data.purchases.map(p => p.date.slice(0, 4))])].sort().reverse();
  const onStock = data.articles.filter(a => a.kind === 'gebraucht' && num(a.stock) > 0 && !a.inactive);
  return head('Ankauf', 'Gebrauchte Ware von Privatleuten ankaufen – mit Ankaufbeleg, Ausweis-Prüfung und Eigentumserklärung. Die Ware landet automatisch im Lager.', `<button class="btn btn-p" data-act="newPurchase">${svg('plus')} Ankauf</button>`) +
  `<div class="grid g3" style="margin-bottom:14px">${kpi('Ankäufe ' + y, data.purchases.filter(p => p.date.startsWith(y)).length, fmtMoney(sum(data.purchases.filter(p => p.date.startsWith(y)), p => sum(p.items, i => num(i.price)))), 'recycle')}${kpi('Auf Lager', onStock.length, 'Gebrauchtware zum Verkauf', 'box', 'blue')}${kpi('Lagerwert', fmtMoney(sum(onStock, a => num(a.buy) * num(a.stock))), 'zum Ankaufpreis', 'euro', 'sea')}</div>
  <div class="note" style="margin-bottom:12px">Gebrauchtware von privat wird beim Verkauf <b>differenzbesteuert</b> (§ 25a UStG): Umsatzsteuer fällt nur auf deinen Gewinn an und steht nicht auf der Rechnung. Das rechnet ZackHandel automatisch.</div>
  <div class="tools">${searchBox(q, 'Beleg, Verkäufer, Artikel, Seriennummer …')}${chips('y', years.map(v => [v, v]), y)}</div>` +
  (list.length ? `<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Beleg</th><th>Verkäufer</th><th>Ware</th><th class="r">Ankaufpreis</th><th class="hm">Bezahlt</th></tr></thead><tbody>${list.map(p => `<tr class="click" data-open="openPurchase:${p.id}"><td><b>${esc(p.no)}</b><span class="sub">${fmtDate(p.date)}</span></td><td>${esc(custName(custById(p.seller)))}${p.idChecked ? `<span class="sub">${svg('check')} Ausweis geprüft</span>` : ''}</td><td>${esc(p.items.map(i => i.text).join(', ').slice(0, 70))}<span class="sub">${plural(p.items.length, 'Teil', 'Teile')}</span></td><td class="r">${amt(sum(p.items, i => num(i.price)))}</td><td class="hm">${esc(p.method)}</td></tr>`).join('')}</tbody></table></div>` :
  `<div class="card">${emptyBox('Noch keine Ankäufe', 'Kaufe Handys, Notebooks, Spiele oder Werkzeug von Privatleuten an – der Beleg wird gleich gedruckt.', `<button class="btn btn-p" data-act="newPurchase">${svg('plus')} Ankauf</button>`)}</div>`);
};

ACTS.importCustomers = async () => {

  const hdr = rows[0].map(h => h.trim().toLowerCase()), col = re => hdr.findIndex(h => re.test(h));
  const ix = { company: col(/firma|unternehmen|company/), first: col(/vorname|first/), last: col(/^nachname|^name$|last/), street: col(/stra|street|adresse/), zip: col(/plz|zip/), city: col(/^ort|stadt|city/), phone: col(/tel|phone/), email: col(/mail/), custNo: col(/kunden.?nr|kundennummer|nr\.?$/) };
  if (ix.last < 0 && ix.company < 0) return toast('Keine Spalte „Nachname“ oder „Firma“ gefunden.', { err: true });
  let n = 0; rows.slice(1).forEach(r => { const g = k => ix[k] >= 0 ? (r[ix[k]] || '').trim() : ''; if (!g('last') && !g('company')) return; if (data.customers.some(c => (g('email') && c.email === g('email')) || (c.last === g('last') && c.first === g('first') && c.company === g('company')))) return;
    data.customers.push(touch({ id: pid(), kind: g('company') ? 'firma' : 'privat', company: g('company'), first: g('first'), last: g('last'), street: g('street'), zip: g('zip'), city: g('city'), phone: g('phone'), email: g('email'), custNo: g('custNo') || 'K' + String(data.customers.length + 1001), created: today() })); n++; });
  save(); render(); toast(`${plural(n, 'Kunde', 'Kunden')} übernommen.`);
};
function parseCSV(text) {
  const first = text.split('\n')[0], sep = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i]; if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; } else if (ch === '"') q = true; else if (ch === sep) { row.push(cur); cur = ''; } else if (ch === '\n') { row.push(cur.replace(/\r$/, '')); rows.push(row); row = []; cur = ''; } else cur += ch; }
  if (cur || row.length) { row.push(cur.replace(/\r$/, '')); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}

/* =========================================================
   Kassenbuch (offene Ladenkasse), Ausgaben, Auswertung
   ========================================================= */
const CASH_CATS = { ein: ['Erlös', 'Privateinlage', 'Geldtransit (von Bank)', 'Sonstige Einnahme'], aus: ['Ausgabe', 'Privatentnahme', 'Geldtransit (zur Bank)', 'Ankauf', 'Wareneinkauf', 'Sonstige Ausgabe'] };
const DENOMS = [500, 200, 100, 50, 20, 10, 5, 2, 1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01];
VIEWS.cash = () => {
  const m = viewState.m || today().slice(0, 7);
  const rows = cashSorted(); let bal = num(data.settings.cashStart); const withBal = rows.map(e => { bal = r2(bal + (e.type === 'ein' ? e.amount : -e.amount)); return { ...e, bal }; });
  const list = withBal.filter(e => e.date.startsWith(m)).reverse(), lc = lastClosing(), open = cashSinceClosing();
  const months = [...new Set([today().slice(0, 7), ...data.cash.map(e => e.date.slice(0, 7))])].sort().reverse().slice(0, 12);
  const mIn = sum(list.filter(e => e.type === 'ein'), e => e.amount), mOut = sum(list.filter(e => e.type === 'aus'), e => e.amount);
  return head('Kassenbuch', 'Alle Bargeld-Bewegungen der Ladenkasse – fortlaufend nummeriert. Barverkäufe und Barausgaben werden automatisch eingetragen.', `<div class="menu-wrap"><button class="btn" data-menu='${esc(JSON.stringify([['printCash:' + m, 'Monat drucken'], ['exportCash:' + m, 'Monat als Excel (CSV)'], ['cashEntry:aus:Privatentnahme', 'Privatentnahme'], ['cashEntry:ein:Privateinlage', 'Privateinlage'], ['cashEntry:aus:Geldtransit (zur Bank)', 'Geld zur Bank']]))}'>${svg('more')} Mehr</button></div><button class="btn" data-act="cashEntry:aus">${svg('minus')} Ausgabe</button><button class="btn" data-act="cashEntry:ein">${svg('plus')} Einnahme</button><button class="btn btn-p" data-act="closeDay">${svg('lock')} Tagesabschluss</button>`) +
  `<div class="grid g4" style="margin-bottom:14px">${kpi('Kassenbestand', fmtMoney(cashBalance()), 'laut Kassenbuch', 'cash', cashBalance() < 0 ? 'red' : 'sea')}${kpi('Einnahmen ' + monthName(m), fmtMoney(mIn), '', 'plus')}${kpi('Ausgaben ' + monthName(m), fmtMoney(mOut), '', 'minus')}${kpi('Letzter Abschluss', lc ? fmtDate(lc.date) : '–', lc ? `gezählt ${fmtMoney(lc.ist)}${Math.abs(lc.diff) > 0.004 ? ` · Differenz ${fmtMoney(lc.diff)}` : ''}` : 'noch keiner', 'lock', open.length && (!lc || lc.date < today()) ? 'gold' : '')}</div>` +
  (cashBalance() < 0 ? `<div class="note red" style="margin-bottom:12px">Der Kassenbestand ist negativ. Das geht in einer echten Kasse nicht – vermutlich fehlt eine Einnahme oder der Anfangsbestand (Einstellungen → Regeln).</div>` : '') +
  `<div class="tools">${chips('m', months.map(v => [v, monthName(v)]), m)}</div>` +
  (list.length ? `<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Nr.</th><th>Datum</th><th>Text</th><th class="hm">Art</th><th class="r">Einnahme</th><th class="r">Ausgabe</th><th class="r">Bestand</th><th></th></tr></thead><tbody>${list.map(e => `<tr${e.storno ? ' style="opacity:.6"' : ''}><td>${e.seq}</td><td>${fmtDate(e.date)}<span class="sub">${esc(e.time || '')}</span></td><td>${esc(e.text)}${e.storno ? '<span class="sub">storniert</span>' : ''}${e.receipt ? `<span class="sub">Beleg ${esc(e.receipt)}</span>` : ''}</td><td class="hm">${esc(e.cat || '')}</td><td class="r">${e.type === 'ein' ? fmtMoney(e.amount) : ''}</td><td class="r">${e.type === 'aus' ? fmtMoney(e.amount) : ''}</td><td class="r"><b>${fmtMoney(e.bal)}</b></td><td>${cashLocked(e) ? `<span class="lock" title="durch Tagesabschluss gesperrt">${svg('lock')}</span>` : !e.ref && !e.storno && !e.isStorno ? `<button class="btn btn-sm" data-act="cashStorno:${e.id}">Storno</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` :
  `<div class="card">${emptyBox('Keine Buchungen in diesem Monat', 'Barverkäufe erscheinen hier automatisch. Trage den Anfangsbestand unter Einstellungen → Regeln ein.', `<button class="btn btn-p" data-act="cashEntry:ein">${svg('plus')} Einnahme</button>`)}</div>`) +
  `<p class="small muted" style="margin-top:12px">Offene Ladenkasse: Am Ende jedes Geschäftstags zählst du das Bargeld und machst den Tagesabschluss. Danach sind die Buchungen gesperrt – Fehler korrigierst du mit einer Gegenbuchung. ZackHandel ist keine Registrierkasse mit TSE.</p>`;
};
ACTS.cashEntry = (type = 'ein', cat) => openForm({ title: type === 'ein' ? 'Bar-Einnahme' : 'Bar-Ausgabe', wide: false, saveLabel: 'Buchen',
  intro: type === 'aus' && !cat ? 'Für Ausgaben mit Vorsteuer (Einkauf, Material …) nimm besser „Ausgaben“ und wähle dort „Bar“ – dann landet sie in beiden Listen.' : '',
  fields: () => [{ k: 'cat', label: 'Art', type: 'select', opts: CASH_CATS[type] }, { k: 'amount', label: 'Betrag', type: 'money', req: true }, { k: 'text', label: 'Text', req: true, list: ['Wechselgeld', 'Porto', 'Trinkgeld', 'Kaffee für Kunden'] }, { k: 'receipt', label: 'Beleg-Nr. (optional)' }, { k: 'date', label: 'Datum', type: 'date' }],
  save: x => { if (x.amount <= 0) throw new Error('Bitte einen Betrag eintragen.'); if (type === 'aus' && x.amount > cashBalance() + 0.004) throw new Error(`So viel Bargeld ist nicht in der Kasse (Bestand ${fmtMoney(cashBalance())}).`);
    const e = cashBook(type, x.amount, x.text, x.cat, '', x.date || today()); if (x.receipt) e.receipt = x.receipt; save(); toast('Gebucht.'); } }, { cat: cat || CASH_CATS[type][0], date: today(), text: cat || '' });
ACTS.cashStorno = async id => { const e = data.cash.find(x => x.id === id); if (cashLocked(e)) return toast('Diese Buchung ist durch den Tagesabschluss gesperrt.', { err: true });
  if (!await confirmBox(`Buchung Nr. ${e.seq} „${esc(e.text)}“ über ${fmtMoney(e.amount)} stornieren? Es entsteht eine Gegenbuchung – das Original bleibt sichtbar.`, 'Stornieren', true)) return;
  e.storno = true; touch(e); const s = cashBook(e.type === 'ein' ? 'aus' : 'ein', e.amount, `Storno zu Nr. ${e.seq}: ${e.text}`, e.cat); s.isStorno = e.id; save(); render(); };
ACTS.closeDay = () => {
  const soll = cashBalance(), open = cashSinceClosing();
  const md = openModal({ title: 'Tagesabschluss – Kasse zählen', wide: true, body: `<p class="muted" style="margin-top:0">Zähle das Bargeld in der Kasse. Soll laut Kassenbuch: <b>${fmtMoney(soll)}</b> (${plural(open.length, 'neue Buchung', 'neue Buchungen')} seit dem letzten Abschluss).</p>
    <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 10px">${DENOMS.map(d => `<label style="display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:700">${d >= 1 ? d + ' €' : Math.round(d * 100) + ' ct'}<input data-den="${d}" inputmode="numeric" placeholder="0" style="text-align:right;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:500"><span class="small muted" style="font-weight:500;min-height:15px" data-den-sum="${d}"></span></label>`).join('')}</div>
    <div class="f" style="margin-top:12px"><label>Oder Gesamtbetrag direkt eintragen</label><input id="cdTotal" inputmode="decimal" placeholder="${fmtNum(soll, 2)}"></div>
    <div class="grid g3" style="margin-top:12px">${kpi('Soll', fmtMoney(soll), '', 'file')}<div id="cdIst">${kpi('Gezählt', fmtMoney(0), '', 'cash')}</div><div id="cdDiff">${kpi('Differenz', fmtMoney(0), '', 'alert')}</div></div>
    <div class="f" style="margin-top:12px"><label>Bemerkung</label><input id="cdNote" placeholder="z. B. Differenz: Wechselgeld falsch herausgegeben"></div>`,
    foot: `<button class="btn" data-close>Abbrechen</button><button class="btn btn-p" id="cdOk">${svg('lock')} Abschluss buchen & drucken</button>` });
  let ist = 0; const counts = {};
  const calc = () => { let s = 0; $$('[data-den]', md).forEach(i => { const n = Math.max(0, Math.round(num(i.value))); counts[i.dataset.den] = n; s += n * Number(i.dataset.den); $(`[data-den-sum="${i.dataset.den}"]`, md).textContent = n ? fmtMoney(n * Number(i.dataset.den)) : ''; }); const t = $('#cdTotal', md).value; ist = r2(t.trim() ? num(t) : s);
    const diff = r2(ist - soll); $('#cdIst', md).innerHTML = kpi('Gezählt', fmtMoney(ist), '', 'cash'); $('#cdDiff', md).innerHTML = kpi('Differenz', fmtMoney(diff), Math.abs(diff) < 0.005 ? 'stimmt' : diff > 0 ? 'Überschuss' : 'Fehlbetrag', 'alert', Math.abs(diff) < 0.005 ? 'sea' : 'red'); };
  md.addEventListener('input', calc); calc();
  $('#cdOk', md).onclick = async () => { const diff = r2(ist - soll);
    if (Math.abs(diff) > 0.004 && !await confirmBox(`Es gibt eine Differenz von <b>${fmtMoney(diff)}</b>. Sie wird als „Kassendifferenz“ gebucht, damit das Kassenbuch zum gezählten Bestand passt.`, 'Buchen')) return;
    if (Math.abs(diff) > 0.004) cashBook(diff > 0 ? 'ein' : 'aus', Math.abs(diff), 'Kassendifferenz beim Tagesabschluss', 'Kassendifferenz');
    const seq = Math.max(0, ...data.cash.map(c => Number(c.seq) || 0));
    const day = open.filter(e => e.cat !== 'Kassendifferenz');
    const c = touch({ id: pid(), date: today(), time: nowHM(), seq, soll, ist, diff, counts: { ...counts }, note: $('#cdNote', md).value.trim(), ein: sum(day.filter(e => e.type === 'ein'), e => e.amount), aus: sum(day.filter(e => e.type === 'aus'), e => e.amount), n: day.length });
    data.closings.push(c); save(); closeModal(); render(); ACTS.printClosing(c.id); toast('Tagesabschluss gebucht.'); };
};
ACTS.printClosing = id => { const c = data.closings.find(x => x.id === id), prev = data.closings.filter(x => Number(x.seq) < Number(c.seq)).sort((a, b) => b.seq - a.seq)[0];
  const es = cashSorted().filter(e => Number(e.seq) > Number(prev?.seq || 0) && Number(e.seq) <= Number(c.seq));
  printHTML(`Kassenbericht ${fmtDate(c.date)}`, `${letterhead()}<h1>Kassenbericht / Tagesabschluss ${fmtDate(c.date)}</h1><p>Abschluss um ${esc(c.time || '')} Uhr · Buchungen Nr. ${es[0]?.seq ?? '–'} bis ${c.seq}</p>
  <table><thead><tr><th>Nr.</th><th>Zeit</th><th>Text</th><th class="r">Einnahme</th><th class="r">Ausgabe</th></tr></thead><tbody>${es.map(e => `<tr><td>${e.seq}</td><td>${fmtDate(e.date)} ${esc(e.time || '')}</td><td>${esc(e.text)}</td><td class="r">${e.type === 'ein' ? fmtMoney(e.amount) : ''}</td><td class="r">${e.type === 'aus' ? fmtMoney(e.amount) : ''}</td></tr>`).join('') || '<tr><td colspan="5">Keine Buchungen</td></tr>'}</tbody></table>
  <table style="width:60%;margin-left:auto"><tbody><tr><td>Bestand laut Kassenbuch (Soll)</td><td class="r">${fmtMoney(c.soll)}</td></tr><tr><td>Gezählter Bestand (Ist)</td><td class="r"><b>${fmtMoney(c.ist)}</b></td></tr><tr><td>Differenz</td><td class="r">${fmtMoney(c.diff)}</td></tr></tbody></table>
  ${Object.values(c.counts || {}).some(Boolean) ? `<h2>Zählprotokoll</h2><table style="width:60%"><tbody>${DENOMS.filter(d => c.counts[d]).map(d => `<tr><td>${c.counts[d]} × ${d >= 1 ? d + ' €' : Math.round(d * 100) + ' ct'}</td><td class="r">${fmtMoney(c.counts[d] * d)}</td></tr>`).join('')}</tbody></table>` : ''}${c.note ? `<p>Bemerkung: ${esc(c.note)}</p>` : ''}<div class="sig"><div>Gezählt von</div><div>Datum / Unterschrift</div></div>${ownerFoot()}`); };
ACTS.printCash = m => { let bal = num(data.settings.cashStart); const rows = cashSorted().map(e => { bal = r2(bal + (e.type === 'ein' ? e.amount : -e.amount)); return { ...e, bal }; }); const list = rows.filter(e => e.date.startsWith(m)), before = rows.filter(e => e.date < m + '-01').at(-1)?.bal ?? num(data.settings.cashStart);

ACTS.saveSettings = async kind => {
  const form = $('#setF'), fields = kind === 'club' ? clubFields() : ruleFields(), v = readForm(form, fields);
  if (kind === 'club') {
    if (!v.name) return toast('Bitte den Namen eintragen.', { err: true });

    if (String(v.logo || '').startsWith('data:')) { if (data.owner.logo) await delPhoto(data.owner.logo); v.logo = await savePhoto(v.logo); } else if (!v.logo && data.owner.logo) await delPhoto(data.owner.logo);

  } else {
    if (v.smallBiz !== data.settings.smallBiz && !await confirmBox(v.smallBiz ? 'Ab jetzt Rechnungen <b>ohne</b> Umsatzsteuer (Kleinunternehmer)? Schon geschriebene Rechnungen bleiben unverändert.' : 'Ab jetzt Rechnungen <b>mit</b> Umsatzsteuer? Prüfe danach die USt-Sätze deiner Artikel.', 'Ja, umstellen')) return;

async function snapshot() { await flushSave(); const photos = {}; for (const [k, v] of photoCache) photos[k] = v; return { app: APPNAME, version: VERSION, demo: IS_DEMO, created: new Date().toISOString(), data, photos }; }

async function readJsonFile() { const f = await pickFile('.json,application/json'); if (!f) return null; try { return JSON.parse(await f.text()); } catch (e) { toast('Die Datei ist keine ZackHandel-Sicherung.', { err: true }); return null; } }
ACTS.restore = async () => {
  const s = await readJsonFile(); if (!s) return; if (!String(s.app || '').startsWith('ZackHandel') || !s.data) return toast('Das ist keine ZackHandel-Sicherung.', { err: true });
  if (!await confirmBox(`Sicherung vom ${fmtDate(s.created.slice(0, 10))} laden? Alle Daten auf diesem Gerät werden ersetzt.`, 'Laden', true)) return;
  await store.clear(); photoCache.clear(); for (const [k, v] of Object.entries(s.photos || {})) { await store.set(k, v); photoCache.set(k, v); }
  data = normalize(s.data); data.meta.setupDone = true; await flushSave(); applyTheme(); render(); toast('Sicherung geladen.');
};
ACTS.syncOut = async () => { if (!data.meta.device.code) { toast('Bitte zuerst Name und Kürzel für dieses Gerät eintragen und speichern.', { err: true }); return; } const s = await snapshot(); s.sync = true; s.device = data.meta.device; downloadFile(`zackhandel_abgleich_${data.meta.device.code}_${today()}.json`, JSON.stringify(s), 'application/json'); toast('Abgleich-Datei erstellt. Jetzt auf dem anderen Gerät einlesen.'); };
ACTS.syncIn = async () => {
  const s = await readJsonFile(); if (!s) return; if (!String(s.app || '').startsWith('ZackHandel') || !s.data) return toast('Das ist keine ZackHandel-Datei.', { err: true });
  if (s.device?.code && s.device.code === data.meta.device.code) return toast('Diese Datei kommt von diesem Gerät selbst (gleiches Kürzel).', { err: true });
  const r = mergeData(data, normalize(s.data));
  for (const [k, v] of Object.entries(s.photos || {})) if (!photoCache.has(k)) { await store.set(k, v); photoCache.set(k, v); }
  save(); render(); toast(`Abgleich fertig: ${r.added} neu, ${r.updated} aktualisiert, ${r.removed} gelöscht.`, { ms: 6000 });
};
function mergeData(mine, theirs) {
  const res = { added: 0, updated: 0, removed: 0 }, delMine = mine.meta.deleted || [], delTheirs = theirs.meta.deleted || [];
  const isDel = (list, col, id) => list.some(d => d.col === col && d.id === String(id));
  COLLECTIONS.forEach(col => {
    const map = new Map(mine[col].map(x => [String(x.id), x]));
    theirs[col].forEach(x => { const id = String(x.id); if (isDel(delMine, col, id)) return; const cur = map.get(id); if (!cur) { mine[col].push(x); res.added++; } else if ((x.updatedAt || '') > (cur.updatedAt || '')) { Object.keys(cur).forEach(k => delete cur[k]); Object.assign(cur, x); res.updated++; } });
    const before = mine[col].length; mine[col] = mine[col].filter(x => !isDel(delTheirs, col, String(x.id))); res.removed += before - mine[col].length;
  });
  mine.meta.deleted = [...delMine, ...delTheirs.filter(d => !isDel(delMine, d.col, d.id))];
  if ((theirs.meta.updated || '') > (mine.meta.updated || '')) { mine.owner = { ...mine.owner, ...theirs.owner }; mine.settings = { ...mine.settings, ...theirs.settings }; mine.settings.ctr = { ...mine.settings.ctr }; Object.keys(theirs.settings.ctr || {}).forEach(k => { mine.settings.ctr[k] = Math.max(Number(mine.settings.ctr[k]) || 0, Number(theirs.settings.ctr[k]) || 0); }); }
  return res;
}
function mergePayments(a = [], b = []) { const m = new Map(a.map(p => [p.id, p])); b.forEach(p => { if (!m.has(p.id)) m.set(p.id, p); }); return [...m.values()].sort((x, y) => x.date.localeCompare(y.date)); }
