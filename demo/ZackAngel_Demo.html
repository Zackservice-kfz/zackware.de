<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#063f53">
<meta name="description" content="ZackAngel – die App für Angelvereine: Fangbuch mit Schonzeit-Warnung, Fangstatistik, Gewässer und Besatz, Erlaubnisscheine, Gastkarten, Arbeitsdienst, Hegefischen, Beiträge. Offline, ohne Abo.">
<title>ZackAngel</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230b6e8f'/%3E%3Cpath d='M8 20c4-6 13-8 20-2l4-3v10l-4-3c-7 6-16 4-20-2z' fill='%23fff'/%3E%3Ccircle cx='28' cy='7' r='3' fill='%23ff8a2a'/%3E%3C/svg%3E">
<style>:root{--g:#16794c;--g2:#0f5c39;--g3:#0b4a2e;--gl:#e6f4ec;--gll:#f2faf5;--gold:#f0a500;--goldl:#fff4d6;--red:#c8382f;--redl:#fdecea;--blue:#2f6fb5;--bluel:#e8f0fa;--ink:#17261f;--ink2:#34453d;--muted:#66776e;--bg:#f4f6f2;--card:#fff;--line:#e1e7e2;--line2:#eef2ee;--sh:0 1px 2px rgba(16,40,28,.06),0 4px 14px rgba(16,40,28,.06);--r:14px;--side:252px;color-scheme:light}
[data-theme=dark]{--g:#3fbf80;--g2:#62d39a;--g3:#9fe8c2;--gl:#16352a;--gll:#122a21;--gold:#ffbf3c;--goldl:#3a2f12;--red:#ff7a70;--redl:#3c1d1a;--blue:#7fb2ff;--bluel:#172a44;--ink:#e8f1ec;--ink2:#c9d7cf;--muted:#93a69b;--bg:#0f1714;--card:#17221d;--line:#26352e;--line2:#1d2a24;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--g)}
svg{width:18px;height:18px;flex:none}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:13px}.r{text-align:right}.nowrap{white-space:nowrap}
.app{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.brand{display:flex;gap:11px;align-items:center;padding:18px 18px 14px}
.crest{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,var(--g),var(--g3));color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;overflow:hidden;flex:none;box-shadow:0 3px 10px rgba(22,121,76,.3)}
.crest img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:15.5px;line-height:1.2;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted)}
.nav{flex:1;overflow:auto;padding:4px 10px 10px}
.nav h6{margin:14px 10px 5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 11px;border-radius:10px;cursor:pointer;color:var(--ink2);font-weight:550;text-align:left}
.nav button:hover{background:var(--gll)}
.nav button.on{background:var(--gl);color:var(--g2);font-weight:700}
.nav button.on svg{color:var(--g)}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--line2);color:var(--muted);border-radius:20px;padding:1px 8px}
.nav .cnt.warn{background:var(--goldl);color:#8a5a00}.nav .cnt.bad{background:var(--redl);color:var(--red)}
[data-theme=dark] .nav .cnt.warn{color:var(--gold)}
.side-foot{border-top:1px solid var(--line);padding:10px 14px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:space-between}
.main{flex:1;margin-left:var(--side);min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;gap:10px;padding:0 26px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1}
.iconbtn.burger{display:none}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.iconbtn:hover{border-color:var(--g);color:var(--g)}
.demo-bar{background:repeating-linear-gradient(135deg,#f0a500 0 14px,#f4b528 14px 28px);color:#3b2a00;font-weight:700;font-size:13px;text-align:center;padding:5px}
.content{padding:24px 26px 60px;max-width:1360px;width:100%}
.head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.head h2{margin:0;font-size:27px;letter-spacing:-.02em;line-height:1.15}
.head p{margin:4px 0 0;color:var(--muted);max-width:640px}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:8px 14px;font-weight:650;cursor:pointer;white-space:nowrap;color:var(--ink);text-decoration:none;font-size:14.5px}
.btn:hover{border-color:var(--g)}
.btn-p{background:var(--g);border-color:var(--g);color:#fff}
.btn-p:hover{background:var(--g2);border-color:var(--g2)}
[data-theme=dark] .btn-p{color:#06261a}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#2e2100}
.btn-red{color:var(--red)}.btn-red:hover{border-color:var(--red)}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi .ic{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;background:var(--gl);color:var(--g);display:grid;place-items:center}
.kpi.gold .ic{background:var(--goldl);color:#b77d00}.kpi.red .ic{background:var(--redl);color:var(--red)}.kpi.blue .ic{background:var(--bluel);color:var(--blue)}
.hero{background:linear-gradient(120deg,var(--g3),var(--g) 60%,#2a9a63);color:#fff;border-radius:18px;padding:22px 24px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:relative;overflow:hidden;margin-bottom:16px}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h2{margin:0;font-size:24px}.hero p{margin:4px 0 0;opacity:.85}
.hero .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.22)}
[data-theme=dark] .hero{background:linear-gradient(120deg,#0c3a25,#14603e 60%,#1a7a4f)}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-t h3{margin:0;font-size:16px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li b{font-weight:650}
.av{width:36px;height:36px;border-radius:50%;background:var(--gl);color:var(--g2);display:grid;place-items:center;font-weight:750;font-size:13px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.gold{background:var(--goldl);color:#9a6700}.av.blue{background:var(--bluel);color:var(--blue)}.av.red{background:var(--redl);color:var(--red)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{position:relative;flex:1;min-width:220px;max-width:360px}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip i{font-style:normal;opacity:.6;margin-left:3px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:650;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--gll);white-space:nowrap}
.tbl td{padding:11px 14px;border-top:1px solid var(--line2);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl tbody tr:hover td{background:var(--gll)}
.tbl tr.click{cursor:pointer}
.tbl .sub{display:block;font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow:auto;border-radius:var(--r)}
.tbl tfoot td{font-weight:750;border-top:2px solid var(--line);background:var(--gll)}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--line2);color:var(--ink2);white-space:nowrap}
.pill.g{background:var(--gl);color:var(--g2)}.pill.gold{background:var(--goldl);color:#8a5a00}.pill.red{background:var(--redl);color:var(--red)}.pill.blue{background:var(--bluel);color:var(--blue)}
[data-theme=dark] .pill.gold{color:var(--gold)}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--g)}.neg{color:var(--red)}
.rowacts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:5px;min-width:220px;z-index:40}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 11px;border-radius:8px;cursor:pointer;font-weight:550}
.menu button:hover{background:var(--gll)}
.menu button.red{color:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(12,28,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:60;overflow:auto}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:92vh}
.modal.wide{max-width:900px}.modal.xwide{max-width:1100px}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;flex:1;font-size:19px}
.modal-b{padding:20px 22px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f .l{margin-right:auto}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:650;color:var(--ink2)}
.f label .req{color:var(--red)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid color-mix(in srgb,var(--g) 35%,transparent);border-color:var(--g)}
.f textarea{min-height:80px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.f .err{font-size:12px;color:var(--red)}
.f.check{flex-direction:row;align-items:center;gap:9px}
.f.check input{width:18px;height:18px;accent-color:var(--g)}
.f.check label{font-weight:550}
.fsec{grid-column:1/-1;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--g);margin-top:8px;padding-top:10px;border-top:1px solid var(--line2)}
.fsec:first-child{margin-top:0;padding-top:0;border-top:0}
.note{background:var(--gll);border:1px solid var(--gl);border-radius:12px;padding:11px 14px;font-size:13.5px;color:var(--ink2)}
.note.gold{background:var(--goldl);border-color:#f6dc9a;color:#5c4200}
.note.red{background:var(--redl);border-color:#f3c3be;color:#7a1c15}
[data-theme=dark] .note.gold{color:var(--gold);border-color:#5a4615}[data-theme=dark] .note.red{color:var(--red);border-color:#5a2520}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--card);padding:11px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:550;max-width:min(560px,92vw);display:flex;gap:12px;align-items:center}
.toast.err{background:var(--red);color:#fff}
.toast button{background:none;border:0;color:var(--gold);font-weight:800;cursor:pointer}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:650;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--g2);border-bottom-color:var(--g)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .dh{background:var(--gll);font-size:12px;font-weight:700;color:var(--muted);padding:8px;text-align:center}
.cal .d{background:var(--card);min-height:96px;padding:6px;cursor:pointer;font-size:13px}
.cal .d.o{background:var(--bg);color:var(--muted)}
.cal .d.t .n{background:var(--g);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.cal .n{font-weight:700;width:24px;height:24px;display:grid;place-items:center}
.cal .ev{display:block;font-size:11.5px;border-radius:6px;padding:2px 5px;margin-top:3px;background:var(--gl);color:var(--g2);font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;width:100%;text-align:left;cursor:pointer}
.cal .ev.gold{background:var(--goldl);color:#8a5a00}.cal .ev.blue{background:var(--bluel);color:var(--blue)}.cal .ev.red{background:var(--redl);color:var(--red)}
.bar{height:8px;background:var(--line2);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:8px}
.bar.gold i{background:var(--gold)}.bar.red i{background:var(--red)}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.att label{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:8px 10px;cursor:pointer;font-weight:550}
.att label:has(input:checked){background:var(--gl);border-color:var(--g)}
.att input{width:18px;height:18px;accent-color:var(--g)}
.photo-box{display:flex;gap:12px;align-items:center}
.photo-box .av{width:64px;height:64px;font-size:20px}
.sig{border:1.5px dashed var(--line);border-radius:12px;background:#fff;width:100%;height:150px;touch-action:none}
.agenda-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--gll)}
.agenda-item h4{margin:0 0 8px;font-size:15px}
.vote{display:grid;grid-template-columns:repeat(3,1fr) 1.3fr;gap:8px;margin-top:8px}
.vote input,.vote select{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--card);width:100%}
.chart{width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ob{max-width:620px;margin:6vh auto;padding:0 16px}
.ob .card{padding:28px}
.ob h1{margin:0 0 6px;font-size:28px;letter-spacing:-.02em}
.steps{display:flex;gap:6px;margin:0 0 18px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps i.on{background:var(--g)}
.scrim{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .side{transform:translateX(-102%);box-shadow:0 0 40px rgba(0,0,0,.2)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .main{margin-left:0}.iconbtn.burger{display:grid}
  .top{padding:0 14px}.content{padding:16px 14px 70px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .fg,.fg.c3{grid-template-columns:minmax(0,1fr)}
  .head h2{font-size:23px}
  .tbl .hm{display:none}
  .kv{grid-template-columns:110px 1fr}
  .cal .d{min-height:62px;padding:4px}.cal .ev{font-size:10px;padding:1px 3px}
  .vote{grid-template-columns:repeat(3,1fr)}.vote select{grid-column:1/-1}
}
@media (max-width:520px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:21px}.modal-bg{padding:0}.modal{border-radius:0;max-height:100vh;min-height:100vh}}
.daynav{display:flex;gap:6px;margin-top:10px}.daynav .btn{min-width:34px}
.okb{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}.okb.on{background:var(--ok);border-color:var(--ok);color:#fff}.okb svg{width:14px;height:14px}
.tick{width:19px;height:19px;accent-color:var(--g);cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}.dot.red{background:var(--red)}.dot.gold{background:var(--gold)}.dot.g{background:var(--ok)}
/* ---------- ZackAngel: Wasser-Thema ---------- */
:root{--g:#0b6e8f;--g2:#095a75;--g3:#063f53;--gl:#e2f1f6;--gll:#f1f8fb;--gold:#f08a24;--goldl:#fff0e0;--red:#c0392b;--redl:#fdecea;--blue:#2d6cdf;--bluel:#e7eefb;--ok:#2a8a52;--okl:#e3f4e9;--ink:#15232b;--ink2:#33444d;--muted:#647681;--bg:#f2f6f8;--line:#dde6eb;--line2:#ecf2f5}
[data-theme=dark]{--g:#4cc3e6;--g2:#7fd5ee;--g3:#b5e8f6;--gl:#12303b;--gll:#0f252e;--gold:#ffa64d;--goldl:#3a2a12;--red:#ff7a70;--redl:#3c1d1a;--ok:#4fd18a;--okl:#123222;--bg:#0e171b;--card:#152228;--line:#243840;--line2:#1b2b32;--ink:#e6f0f3;--ink2:#c4d4da;--muted:#8fa3ac}
.side{background:#0a2f3d;border-right:0;color:#e3eef2}
.side .brand span,.side .nav h6,.side-foot{color:#8fb0bd}.side-foot{border-top-color:#164252}
.side .nav button{color:#d4e5eb}.side .nav button:hover{background:#11404f}
.side .nav button.on{background:#0b6e8f;color:#fff}.side .nav button.on svg{color:#fff}
.side .nav .cnt{background:#1a4d5e;color:#c4d9e0}.side .nav .cnt.warn{background:#f08a24;color:#fff}.side .nav .cnt.bad{background:#fff;color:#c0392b}
.side .nav button.on .cnt{background:rgba(255,255,255,.25);color:#fff}
.side .iconbtn{background:#11404f;border-color:#1a4d5e;color:#d4e5eb}
.side .brand{border-bottom:3px solid #f08a24}

/* ---------- Speicher (IndexedDB, Notfall localStorage) ---------- */
const store = (() => {
  let dbp = null, mode = 'idb';
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('kein IndexedDB'));
    let q; try { q = indexedDB.open(DB_NAME, 1); } catch (e) { return rej(e); }
    q.onupgradeneeded = () => q.result.createObjectStore('kv');
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); q.onblocked = () => rej(new Error('blockiert'));
  }));
  const tx = async (m, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('kv', m); const out = fn(t.objectStore('kv')); t.oncomplete = () => res(typeof out === 'function' ? out() : out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return {
    get mode() { return mode; },
    async init() { try { await open(); await tx('readonly', s => { s.count(); }); } catch (e) { mode = 'ls'; } return mode; },
    async get(k) { if (mode === 'ls') { try { const v = localStorage.getItem(LS_PREFIX + k); return v ? JSON.parse(v) : undefined; } catch (e) { return undefined; } } return tx('readonly', s => { let r; const q = s.get(k); q.onsuccess = () => { r = q.result; }; return () => r; }); },
    async set(k, v) { if (mode === 'ls') { localStorage.setItem(LS_PREFIX + k, JSON.stringify(v)); return; } return tx('readwrite', s => { s.put(v, k); }); },
    async del(k) { if (mode === 'ls') { localStorage.removeItem(LS_PREFIX + k); return; } return tx('readwrite', s => { s.delete(k); }); },
    async keys() { if (mode === 'ls') return Object.keys(localStorage).filter(k => k.startsWith(LS_PREFIX)).map(k => k.slice(LS_PREFIX.length)); return tx('readonly', s => { let r = []; const q = s.getAllKeys(); q.onsuccess = () => { r = q.result.map(String); }; return () => r; }); },
    async clear() { if (mode === 'ls') { Object.keys(localStorage).filter(k => k.startsWith(LS_PREFIX)).forEach(k => localStorage.removeItem(k)); return; } return tx('readwrite', s => { s.clear(); }); }
  };
})();

async function delPhoto(k) { if (!k || !String(k).startsWith('ph_')) return; await store.del(k); photoCache.delete(k); }
function shrinkImage(file, max = 1280, q = 0.82) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function pickFile(accept, capture) {
  return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; if (capture) i.capture = 'environment'; i.onchange = () => res(i.files[0] || null); i.click(); });
}

const COLLECTIONS = ['members', 'waters', 'stockings', 'catches', 'permits', 'guests', 'events', 'workx', 'controls', 'bookings', 'species', 'tasks'];

function normalize(d) {
  const f = freshData();
  d = d && typeof d === 'object' ? d : f;
  d.meta = { ...f.meta, ...(d.meta || {}) }; d.meta.device = { ...f.meta.device, ...(d.meta.device || {}) };
  d.club = { ...f.club, ...(d.club || {}) };
  d.settings = { ...f.settings, ...(d.settings || {}) };
  COLLECTIONS.forEach(c => { if (!Array.isArray(d[c])) d[c] = []; });
  if (!d.species.length) d.species = DEFAULT_SPECIES.map(([name, min, closed, prot]) => ({ id: 'sp_' + name.toLowerCase().replace(/[^a-zäöüß]+/g, '_'), name, min, closed, prot }));
  d.members.forEach(m => { m.funcs = Array.isArray(m.funcs) ? m.funcs : []; if (!m.dept) m.dept = 'Aktiv'; });
  d.waters.forEach(w => { w.rules = Array.isArray(w.rules) ? w.rules : []; });
  d.permits.forEach(p => { p.waters = Array.isArray(p.waters) ? p.waters : []; });
  d.events.forEach(e => { e.present = Array.isArray(e.present) ? e.present : []; e.results = Array.isArray(e.results) ? e.results : []; });
  return d;
}

function nextNo(col, prefix, field = 'no') {
  const y = new Date().getFullYear(), dev = data.meta.device.code ? data.meta.device.code + '-' : '';
  const re = new RegExp(`^${prefix}-${dev}${y}-(\\d+)$`);
  const max = data[col].reduce((m, x) => { const r = re.exec(x[field] || ''); return r ? Math.max(m, Number(r[1])) : m; }, 0);
  return `${prefix}-${dev}${y}-${String(max + 1).padStart(3, '0')}`;
}

function toast(msg, { err = false, ms = 3800, action = null } = {}) {
  let root = $('#toasts'); if (!root) { root = document.createElement('div'); root.id = 'toasts'; root.className = 'toasts'; document.body.appendChild(root); }
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.setAttribute('role', 'status');

  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { action.fn(); t.remove(); }; t.appendChild(b); }

const modalStack = [];
function openModal({ title, body, foot = '', wide = false, xwide = false, onOpen, onClose }) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal${wide ? ' wide' : ''}${xwide ? ' xwide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(String(title).replace(/<[^>]+>/g, ''))}">
    <div class="modal-h"><h3>${title}</h3><button class="iconbtn" data-close aria-label="Schließen">${svg('x')}</button></div>
    <div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  document.body.appendChild(bg);
  const entry = { bg, onClose }; modalStack.push(entry);
  bg.addEventListener('mousedown', e => { if (e.target === bg) entry.down = true; });
  bg.addEventListener('click', e => { if (e.target === bg && entry.down) closeModal(); entry.down = false; if (e.target.closest('[data-close]')) closeModal(); });
  const first = bg.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea'); if (first && !('ontouchstart' in window)) setTimeout(() => first.focus(), 30);
  onOpen && onOpen(bg.querySelector('.modal'));
  return bg.querySelector('.modal');
}
function closeModal() { const e = modalStack.pop(); if (!e) return; e.bg.remove(); e.onClose && e.onClose(); }
const topModal = () => modalStack.length ? modalStack[modalStack.length - 1].bg.querySelector('.modal') : null;
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('.menu')) closeMenus(); else if (modalStack.length) closeModal(); } });

function fieldHTML(f, x) {
  if (f.type === 'sec') return `<div class="fsec">${esc(f.label)}</div>`;
  if (f.type === 'note') return `<div class="f full"><div class="note ${f.cls || ''}">${f.html}</div></div>`;
  const id = 'f_' + f.k, v = x[f.k] ?? (f.def ?? ''), req = f.req ? ' required' : '';
  const lab = `<label for="${id}">${esc(f.label)}${f.req ? ' <span class="req">*</span>' : ''}</label>`;
  const hint = f.hint ? `<span class="hint">${f.hint}</span>` : '';
  const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
  const cls = 'f' + (f.full ? ' full' : '');
  switch (f.type) {
    case 'textarea': return `<div class="${cls}">${lab}<textarea id="${id}" name="${f.k}"${ph}${req}>${esc(v)}</textarea>${hint}</div>`;
    case 'select': case 'member': {
      const opts = f.type === 'member' ? hunterOpts(f.filter) : optList(f.opts);
      return `<div class="${cls}">${lab}<select id="${id}" name="${f.k}"${req}>${opts.map(([ov, ol]) => `<option value="${esc(ov)}"${String(ov) === String(v) ? ' selected' : ''}>${esc(ol)}</option>`).join('')}</select>${hint}</div>`;
    }
    case 'check': return `<div class="f check${f.full ? ' full' : ''}"><input type="checkbox" id="${id}" name="${f.k}"${v ? ' checked' : ''}><label for="${id}">${esc(f.label)}</label>${hint}</div>`;
    case 'multi': {
      const opts = optList(f.opts), vals = (Array.isArray(v) ? v : []).map(String);
      return `<div class="f full">${lab}<div class="chips" data-multi="${f.k}">${opts.length ? opts.map(([ov, ol]) => `<label class="chip${vals.includes(String(ov)) ? ' on' : ''}"><input type="checkbox" value="${esc(ov)}" ${vals.includes(String(ov)) ? 'checked' : ''} hidden>${esc(ol)}</label>`).join('') : '<span class="muted small">Noch nichts angelegt.</span>'}</div>${hint}</div>`;
    }
    case 'money': return `<div class="${cls}">${lab}<input id="${id}" name="${f.k}" inputmode="decimal" value="${v === '' ? '' : esc(fmtNum(v, 2))}"${ph}${req}>${hint}</div>`;
    case 'number': return `<div class="${cls}">${lab}<input id="${id}" name="${f.k}" type="number" step="${f.step || 'any'}" value="${esc(v)}"${ph}${req}>${hint}</div>`;
    case 'iban': return `<div class="${cls}">${lab}<input id="${id}" name="${f.k}" value="${esc(v ? fmtIban(v) : '')}" autocomplete="off" placeholder="DE00 0000 0000 0000 0000 00"${req}><span class="err hidden" data-err="${f.k}">Diese IBAN stimmt nicht – bitte prüfen.</span>${hint}</div>`;
    case 'photo': return `<div class="f full">${lab}<div class="photo-box"><div class="av" data-photo-prev="${f.k}">${photoSrc(v) ? `<img src="${photoSrc(v)}" alt="">` : svg('camera')}</div><input type="hidden" name="${f.k}" value="${esc(v)}"><button type="button" class="btn btn-sm" data-photo-pick="${f.k}">Foto wählen</button><button type="button" class="btn btn-sm btn-red${v ? '' : ' hidden'}" data-photo-del="${f.k}">Entfernen</button></div>${hint}</div>`;
    default: return `<div class="${cls}">${lab}<input id="${id}" name="${f.k}" type="${f.type || 'text'}" value="${esc(v)}"${ph}${req}${f.list ? ` list="dl_${f.k}"` : ''}>${f.list ? `<datalist id="dl_${f.k}">${optList(f.list).map(([o]) => `<option value="${esc(o)}">`).join('')}</datalist>` : ''}${hint}</div>`;
  }
}
function readForm(form, fields) {
  const out = {};
  fields.forEach(f => {
    if (!f.k || ['sec', 'note'].includes(f.type)) return;
    if (f.type === 'check') { out[f.k] = !!form.elements[f.k]?.checked; return; }
    if (f.type === 'multi') { out[f.k] = $$(`[data-multi="${f.k}"] input:checked`, form).map(i => i.value); return; }
    const el = form.elements[f.k]; if (!el) return;
    let v = el.value.trim();
    if (f.type === 'money' || f.type === 'number') v = v === '' ? (f.type === 'money' ? 0 : '') : num(v);
    if (f.type === 'iban') v = cleanIban(v);
    out[f.k] = v;
  });
  return out;
}
/** Allgemeines Formular. def: { title, fields(x), wide, validate(x)->Fehlertext, save(x) } */
function openForm(def, item = {}) {
  const x = { ...item };
  const fields = def.fields(x);
  const m = openModal({
    title: esc(def.title), wide: def.wide !== false,
    body: `<form id="genForm" novalidate>${def.intro ? `<div class="note" style="margin-bottom:14px">${def.intro}</div>` : ''}<div class="fg${def.c3 ? ' c3' : ''}">${fields.map(f => fieldHTML(f, x)).join('')}</div></form>`,
    foot: `${def.del ? `<button class="btn btn-red l" id="fDel">${svg('trash')} Löschen</button>` : ''}<button class="btn" data-close>Abbrechen</button><button class="btn btn-p" id="fSave">${esc(def.saveLabel || 'Speichern')}</button>`
  });
  const form = $('#genForm', m);
  $$('[data-multi] label', form).forEach(l => l.addEventListener('click', e => { e.preventDefault(); const i = l.querySelector('input'); i.checked = !i.checked; l.classList.toggle('on', i.checked); }));
  $$('[data-photo-pick]', form).forEach(b => b.onclick = async () => { const file = await pickFile('image/*'); if (!file) return; const url = await shrinkImage(file, 800); const k = b.dataset.photoPick; form.elements[k].value = url; $(`[data-photo-prev="${k}"]`, form).innerHTML = `<img src="${url}" alt="">`; $(`[data-photo-del="${k}"]`, form).classList.remove('hidden'); });
  $$('[data-photo-del]', form).forEach(b => b.onclick = () => { const k = b.dataset.photoDel; form.elements[k].value = ''; $(`[data-photo-prev="${k}"]`, form).innerHTML = svg('camera'); b.classList.add('hidden'); });
  $$('input[name]', form).forEach(i => { const f = fields.find(f => f.k === i.name); if (f?.type === 'iban') i.addEventListener('blur', () => { const v = cleanIban(i.value); i.value = v ? fmtIban(v) : ''; $(`[data-err="${f.k}"]`, form).classList.toggle('hidden', !v || ibanOk(v)); }); if (f?.type === 'money') i.addEventListener('blur', () => { if (i.value.trim()) i.value = fmtNum(num(i.value), 2); }); });
  def.onOpen && def.onOpen(form, m);
  form.addEventListener('submit', e => { e.preventDefault(); $('#fSave', m).click(); });
  $('#fSave', m).onclick = async () => {
    const vals = readForm(form, fields);
    for (const f of fields) if (f.req && (vals[f.k] === '' || vals[f.k] == null)) { toast(`Bitte „${f.label}“ ausfüllen.`, { err: true }); form.elements[f.k]?.focus(); return; }
    for (const f of fields) if (f.type === 'iban' && vals[f.k] && !ibanOk(vals[f.k])) { toast('Die IBAN stimmt nicht. Bitte prüfen.', { err: true }); form.elements[f.k]?.focus(); return; }
    const merged = { ...x, ...vals };
    for (const f of fields) if (f.type === 'photo' && String(merged[f.k] || '').startsWith('data:')) { if (x[f.k]) await delPhoto(x[f.k]); merged[f.k] = await savePhoto(merged[f.k]); } else if (f.type === 'photo' && !merged[f.k] && x[f.k]) await delPhoto(x[f.k]);
    const err = def.validate && def.validate(merged, form); if (err) { toast(err, { err: true }); return; }
    let r; try { r = await def.save(merged, form); } catch (e) { toast(e.message, { err: true, ms: 6000 }); return; } if (r === false) return;
    closeModal(); render();
  };
  if (def.del) $('#fDel', m).onclick = async () => { try { if (await def.del(x)) { closeModal(); render(); } } catch (e) { toast(e.message, { err: true, ms: 6000 }); } };
  return m;
}

/* ---------- Fischarten, Schonzeiten, Regeln ---------- */
const spById = id => byId('species', id);

function parsePeriods(s) { return String(s || '').split(/[;,]/).map(p => /(\d{1,2})\.(\d{1,2})\.?\s*[-–]\s*(\d{1,2})\.(\d{1,2})\.?/.exec(p)).filter(Boolean).map(m => [`${pad2(m[2])}-${pad2(m[1])}`, `${pad2(m[4])}-${pad2(m[3])}`]); }
function inClosed(s, date = today()) { const md = date.slice(5); return parsePeriods(s).some(([a, b]) => a <= b ? md >= a && md <= b : md >= a || md <= b); }
const fmtPeriods = s => parsePeriods(s).map(([a, b]) => `${Number(a.slice(3))}.${Number(a.slice(0, 2))}. – ${Number(b.slice(3))}.${Number(b.slice(0, 2))}.`).join(', ');
/* Regel für Art an Gewässer: Gewässer-Regel schlägt Landesregel */
function ruleFor(spId, waterId) {
  const sp = spById(spId) || {}, w = byId('waters', waterId), r = (w?.rules || []).find(x => x.sp === spId) || {};
  return { name: sp.name, prot: r.prot ?? sp.prot, min: num(r.min) || num(sp.min), max: num(r.max) || 0, closed: r.closed || sp.closed || '', perDay: num(r.perDay), perYear: num(r.perYear), own: !!(w && (w.rules || []).some(x => x.sp === spId)) };
}
function checkCatch(c) {
  const out = []; if (!c.sp) return out; const r = ruleFor(c.sp, c.water), len = num(c.len);
  if (!c.kept) return out;
  if (r.prot) out.push(`${r.name} ist ganzjährig geschützt – zurücksetzen!`);
  if (r.closed && inClosed(r.closed, c.date)) out.push(`${r.name} hat Schonzeit (${fmtPeriods(r.closed)}).`);
  if (r.min && len && len < r.min) out.push(`${r.name} unter Mindestmaß (${r.min} cm).`);
  if (r.max && len && len > r.max) out.push(`${r.name} über dem Entnahmefenster (bis ${r.max} cm).`);
  if (c.member && (r.perDay || r.perYear)) {
    const mine = data.catches.filter(x => x.id !== c.id && x.kept && x.member === c.member && x.sp === c.sp);
    const d = mine.filter(x => x.date === c.date).length + 1, y = mine.filter(x => yearOf(x.date) === yearOf(c.date)).length + 1;
    if (r.perDay && d > r.perDay) out.push(`Tageslimit ${r.name}: höchstens ${r.perDay} (das wäre Nr. ${d}).`);
    if (r.perYear && y > r.perYear) out.push(`Jahreslimit ${r.name}: höchstens ${r.perYear} (das wäre Nr. ${y}).`);
  }
  return out;
}

VIEWS.stats = () => {

  const bySp = data.species.map(s => { const l = all.filter(x => x.sp === s.id), k = l.filter(x => x.kept); return { s, n: l.length, kept: k.length, back: l.length - k.length, kg: sum(k, x => x.kg), big: Math.max(0, ...l.map(x => num(x.len))) }; }).filter(r => r.n).sort((a, b) => b.n - a.n);
  const byW = data.waters.map(wa => { const l = data.catches.filter(x => yearOf(x.date) === y && x.water === wa.id), k = l.filter(x => x.kept), st = data.stockings.filter(s => s.water === wa.id && yearOf(s.date) === y); return { wa, n: l.length, kg: sum(k, x => x.kg), stKg: sum(st, s => s.kg), cost: sum(st, s => s.cost), area: num(wa.area) }; });

  const maxN = Math.max(1, ...bySp.map(r => r.n));

  return head('Fangstatistik', 'Was wurde wo gefangen? Für die Jahreshauptversammlung, den Gewässerwart und den Verband.', `${yearSel('catches', y)}<button class="btn" data-act="printStats:${y}">${svg('print')} Fangstatistik</button><button class="btn" data-act="printEel:${y}">${svg('print')} Aal-Jahresmeldung</button>`) +

  (tab === 'w' ? `<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Gewässer</th><th class="r">Fänge</th><th class="r">entnommen kg</th><th class="r hm">kg / ha</th><th class="r">Besatz kg</th><th class="r hm">Besatzkosten</th></tr></thead><tbody>${byW.map(r => `<tr><td><b>${esc(r.wa.name)}</b><span class="sub">${esc(r.wa.kind || '')}${r.area ? ' · ' + fmtNum(r.area, 1) + ' ha' : ''}</span></td><td class="r">${r.n}</td><td class="r">${fmtNum(r.kg, 1)}</td><td class="r hm">${r.area ? fmtNum(r.kg / r.area, 1) : '–'}</td><td class="r">${fmtNum(r.stKg, 0)}</td><td class="r hm">${fmtMoney(r.cost)}</td></tr>`).join('')}</tbody></table></div>`

    <div class="card tbl-wrap" style="margin-top:16px"><table class="tbl"><thead><tr><th>Fischart</th><th class="r">Fänge</th><th class="r">entnommen</th><th class="r">zurück</th><th class="r">kg</th><th class="r hm">größter</th></tr></thead><tbody>${bySp.map(r => `<tr><td>${esc(r.s.name)}</td><td class="r">${r.n}</td><td class="r">${r.kept}</td><td class="r">${r.back}</td><td class="r">${fmtNum(r.kg, 1)}</td><td class="r hm">${r.big ? r.big + ' cm' : ''}</td></tr>`).join('')}</tbody></table></div>`);

VIEWS.species = () => {
  const T = today();
  return head('Schonzeiten & Mindestmaße', `Vorbelegt nach der Binnenfischereiordnung ${esc(data.club.state || 'Niedersachsen')}. Eigene, strengere Regeln je Gewässer trägst du beim Gewässer ein.`, `<button class="btn" data-act="printRules">${svg('print')} Übersicht drucken</button><button class="btn btn-p" data-act="newSpecies">${svg('plus')} Fischart</button>`) +
  `<div class="note gold" style="margin-bottom:14px">${svg('info')} Die Werte sind sorgfältig übernommen, aber ohne Gewähr. Bitte mit der aktuellen Verordnung eures Landes und der Gewässerordnung eures Verbands vergleichen – und hier anpassen.</div>
  <div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Fischart</th><th class="r">Mindestmaß</th><th>Schonzeit</th><th>Heute</th></tr></thead><tbody>${data.species.map(s => `<tr class="click" data-open="editSpecies:${s.id}"><td><b>${esc(s.name)}</b></td><td class="r">${s.prot ? '' : s.min ? s.min + ' cm' : '–'}</td><td>${s.prot ? pill('ganzjährig geschützt', 'red') : s.closed ? esc(fmtPeriods(s.closed)) : '–'}</td><td>${s.prot || inClosed(s.closed, T) ? pill('geschont', 'red') : pill('frei', 'g')}</td></tr>`).join('')}</tbody></table></div>`;
};
function speciesDef(s) { const isNew = !byId('species', s.id); return { title: isNew ? 'Neue Fischart' : s.name, wide: false, fields: () => [{ k: 'name', label: 'Fischart', req: true, full: true }, { k: 'min', label: 'Mindestmaß (cm, 0 = keins)', type: 'number', step: '1', full: true }, { k: 'closed', label: 'Schonzeit', full: true, ph: 'z. B. 1.2.-15.4.', hint: 'Mehrere Zeiträume mit Semikolon trennen.' }, { k: 'prot', label: 'Ganzjährig geschützt', type: 'check', full: true }], validate: v => v.closed && !parsePeriods(v.closed).length ? 'Schonzeit bitte so schreiben: 1.2.-15.4.' : '', save: v => { v.min = Number(v.min) || 0; upsert('species', v); toast('Gespeichert.'); }, del: isNew ? null : async v => { if (data.catches.some(c => c.sp === v.id)) { toast('Diese Fischart steht im Fangbuch und kann nicht gelöscht werden.', { err: true }); return false; } removeFrom('species', v.id); return true; } }; }
ACTS.newSpecies = () => openForm(speciesDef({}), { id: pid(), min: 0, closed: '', prot: false });
ACTS.editSpecies = id => { const s = byId('species', id); openForm(speciesDef(s), s); };
ACTS.printRules = () => printHTML('Schonzeiten und Mindestmaße', `${letterhead()}<h1>Schonzeiten und Mindestmaße</h1><p>Stand ${fmtDate(today())} · Grundlage: Binnenfischereiordnung ${esc(data.club.state)} und Gewässerordnung des Vereins</p><table><thead><tr><th>Fischart</th><th class="r">Mindestmaß</th><th>Schonzeit</th></tr></thead><tbody>${data.species.map(s => `<tr><td>${esc(s.name)}</td><td class="r">${s.prot ? '–' : s.min ? s.min + ' cm' : '–'}</td><td>${s.prot ? '<b>ganzjährig geschützt</b>' : esc(fmtPeriods(s.closed) || '–')}</td></tr>`).join('')}</tbody></table>${data.waters.filter(w => w.rules.length).map(w => `<h2>Besondere Regeln: ${esc(w.name)}</h2>${rulesTable(w)}`).join('')}`);
function rulesTable(w) { return `<table><thead><tr><th>Fischart</th><th>Entnahme</th><th>Schonzeit</th><th>Limit</th></tr></thead><tbody>${w.rules.map(r => `<tr><td>${esc(spName(r.sp))}</td><td>${r.prot ? 'geschützt' : [r.min ? 'ab ' + r.min + ' cm' : '', r.max ? 'bis ' + r.max + ' cm' : ''].filter(Boolean).join(' ') || '–'}</td><td>${esc(fmtPeriods(r.closed) || '–')}</td><td>${[r.perDay ? r.perDay + ' / Tag' : '', r.perYear ? r.perYear + ' / Jahr' : ''].filter(Boolean).join(', ') || '–'}</td></tr>`).join('')}</tbody></table>`; }

/* =========================================================
   Gewässer & Besatz, Erlaubnisscheine, Gastkarten, Fischereiaufsicht
   ========================================================= */
VIEWS.waters = () => {
  const y = curYear(), tab = viewState.tab || 'w';
  const ws = data.waters.filter(w => tab === 'old' ? w.inactive : !w.inactive);
  const card = w => { const c = data.catches.filter(x => x.water === w.id && yearOf(x.date) === y), st = data.stockings.filter(s => s.water === w.id && yearOf(s.date) === y); return `<div class="card pad mcard wcard" data-act="openWater:${w.id}">
    <div style="display:flex;gap:12px;align-items:flex-start"><div class="av blue">${svg('wave')}</div><div class="grow"><h3 style="margin:0">${esc(w.name)}</h3><div class="small muted">${esc([w.kind, w.area && fmtNum(w.area, 1) + ' ha', w.length && fmtNum(w.length, 1) + ' km', w.place].filter(Boolean).join(' · '))}</div></div>${w.leaseUntil ? pill('Pacht bis ' + fmtDate(w.leaseUntil), w.leaseUntil <= addDays(today(), 365) ? 'gold' : '') : w.owned ? pill('Eigentum', 'g') : ''}</div>
    <div class="meta" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${pill(c.length + ' Fänge ' + y, 'blue')}${pill(fmtNum(sum(c.filter(x => x.kept), x => x.kg), 0) + ' kg entnommen')}${pill(fmtNum(sum(st, s => s.kg), 0) + ' kg Besatz')}${w.rules.length ? pill(plural(w.rules.length, 'eigene Regel', 'eigene Regeln'), 'gold') : ''}</div></div>`; };
  return head('Gewässer & Besatz', 'Eure Gewässer mit Pacht, eigenen Regeln und Besatzbuch. Daraus druckst du die Gewässerordnung.', `<button class="btn" data-act="newStocking">${svg('plus')} Besatz</button><button class="btn btn-p" data-act="newWater">${svg('plus')} Gewässer</button>`) +
  `<div class="tabs">${[['w', 'Gewässer'], ['st', 'Besatzbuch'], ['old', 'Abgegeben']].map(([k, l]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>` +
  (tab === 'st' ? stockTab() : ws.length ? `<div class="grid g2">${ws.map(card).join('')}</div>` : emptyBox(tab === 'old' ? 'Keine abgegebenen Gewässer' : 'Noch keine Gewässer', tab === 'old' ? '' : 'Leg eure Gewässer an – See, Teich, Fluss oder Tief.', tab === 'old' ? '' : `<button class="btn btn-p" data-act="newWater">${svg('plus')} Gewässer</button>`));
};
function stockTab() {
  const l = [...data.stockings].sort((a, b) => b.date.localeCompare(a.date));
  return `<div class="tools"><span class="muted small">Besatz eintragen – mit Lieferant und Kosten. Er erscheint in der Fangstatistik und in der Aal-Jahresmeldung.</span>${moreBtn([['printStock:' + curYear(), 'Besatzbuch ' + curYear() + ' drucken']])}</div><div class="card tbl-wrap">${l.length ? `<table class="tbl"><thead><tr><th>Datum</th><th>Gewässer</th><th>Fischart</th><th class="hm">Größe</th><th class="r">Stück</th><th class="r">kg</th><th class="r hm">Kosten</th></tr></thead><tbody>${l.map(s => `<tr class="click" data-open="editStocking:${s.id}"><td class="nowrap">${fmtDate(s.date)}</td><td>${esc(waterName(s.water))}</td><td><b>${esc(spName(s.sp))}</b>${s.supplier ? `<span class="sub">${esc(s.supplier)}</span>` : ''}</td><td class="hm small">${esc(s.size || '')}</td><td class="r">${s.qty ? fmtNum(s.qty) : ''}</td><td class="r">${s.kg ? fmtNum(s.kg, 1) : ''}</td><td class="r hm">${s.cost ? fmtMoney(s.cost) : ''}</td></tr>`).join('')}</tbody></table>` : emptyBox('Noch kein Besatz eingetragen', '')}</div>`;
}
function waterDef(w) {
  const isNew = !byId('waters', w.id);
  return { title: isNew ? 'Neues Gewässer' : w.name, fields: () => [
    { k: 'name', label: 'Name', req: true, ph: 'z. B. Großes Meer, Osteeler Tief' }, { k: 'kind', label: 'Art', type: 'select', opts: WATER_KINDS },
    { k: 'area', label: 'Fläche (ha)', type: 'number', step: '0.1' }, { k: 'length', label: 'Länge (km, bei Fließgewässern)', type: 'number', step: '0.1' },
    { k: 'place', label: 'Lage / Gemeinde' }, { k: 'access', label: 'Zufahrt / Parken', ph: 'z. B. Parkplatz am Deich' },
    { type: 'sec', label: 'Pacht' }, { k: 'owned', label: 'Gewässer gehört dem Verein', type: 'check' }, { k: 'lessor', label: 'Verpächter', ph: 'z. B. Sielacht, Gemeinde, Landwirt' },
    { k: 'leaseUntil', label: 'Pachtvertrag bis', type: 'date' }, { k: 'leaseCost', label: 'Pacht pro Jahr (€)', type: 'money' },
    { type: 'sec', label: 'Gewässerordnung' }, { k: 'order', label: 'Besondere Bestimmungen', type: 'textarea', full: true, ph: 'z. B. Angeln nur vom Ufer. Nachtangeln nur mit Anmeldung. Höchstens 2 Ruten. Kein lebender Köderfisch.' },
    { k: 'note', label: 'Notiz (Gewässerwart)', type: 'textarea', full: true }, { k: 'inactive', label: 'Gewässer abgegeben', type: 'check' }
  ], save: v => { upsert('waters', v); toast('Gespeichert.'); },
  del: isNew ? null : async v => { if (data.catches.some(c => c.water === v.id) || data.stockings.some(s => s.water === v.id)) { toast('Zu diesem Gewässer gibt es Fänge oder Besatz. Bitte „abgegeben“ anhaken.', { err: true, ms: 6000 }); return false; } if (!await confirmBox(`${esc(v.name)} löschen?`, 'Löschen', true)) return false; removeFrom('waters', v.id); return true; } };
}
ACTS.newWater = () => openForm(waterDef({}), { id: pid(), kind: 'See', rules: [] });
ACTS.editWater = id => { if (topModal()) closeModal(); const w = byId('waters', id); openForm(waterDef(w), w); };
ACTS.openWater = id => {
  const w = byId('waters', id), y = curYear(), st = data.stockings.filter(s => s.water === id).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);
  openModal({ title: esc(w.name), wide: true, body: `<dl class="kv"><dt>Art</dt><dd>${esc(w.kind || '–')}${w.area ? ' · ' + fmtNum(w.area, 1) + ' ha' : ''}${w.length ? ' · ' + fmtNum(w.length, 1) + ' km' : ''}</dd><dt>Pacht</dt><dd>${w.owned ? 'Eigentum des Vereins' : `${esc(w.lessor || '–')}${w.leaseUntil ? ' · bis ' + fmtDate(w.leaseUntil) : ''}${w.leaseCost ? ' · ' + fmtMoney(w.leaseCost) + ' / Jahr' : ''}`}</dd>${w.access ? `<dt>Zufahrt</dt><dd>${esc(w.access)}</dd>` : ''}${w.order ? `<dt>Bestimmungen</dt><dd style="white-space:pre-line">${esc(w.order)}</dd>` : ''}</dl>
    <div class="fsec">Eigene Regeln (strenger als das Gesetz)</div>${w.rules.length ? `<table class="tbl"><thead><tr><th>Fischart</th><th>Entnahme</th><th>Schonzeit</th><th>Limit</th><th></th></tr></thead><tbody>${w.rules.map((r, i) => `<tr><td>${esc(spName(r.sp))}</td><td>${r.prot ? 'geschützt' : [r.min ? 'ab ' + r.min : '', r.max ? 'bis ' + r.max : ''].filter(Boolean).join(' ') + (r.min || r.max ? ' cm' : '–')}</td><td>${esc(fmtPeriods(r.closed) || '–')}</td><td>${[r.perDay ? r.perDay + '/Tag' : '', r.perYear ? r.perYear + '/Jahr' : ''].filter(Boolean).join(', ') || '–'}</td><td class="r"><button class="btn btn-sm" data-act="ruleEdit:${w.id}:${i}">${svg('edit')}</button></td></tr>`).join('')}</tbody></table>` : '<p class="muted">Keine – es gelten die Landesregeln.</p>'}<button class="btn btn-sm" data-act="ruleEdit:${w.id}:-1">${svg('plus')} Regel</button>
    <div class="fsec">Letzter Besatz</div>${st.length ? `<table class="tbl"><tbody>${st.map(s => `<tr><td>${fmtDate(s.date)}</td><td>${esc(spName(s.sp))}</td><td>${esc(s.size || '')}</td><td class="r">${s.kg ? fmtNum(s.kg, 1) + ' kg' : ''}${s.qty ? ' · ' + fmtNum(s.qty) + ' St.' : ''}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Noch kein Besatz.</p>'}<button class="btn btn-sm" data-act="newStocking:${w.id}">${svg('plus')} Besatz</button>`,
    foot: `<button class="btn l" data-act="printOrder:${w.id}">${svg('print')} Gewässerordnung</button><button class="btn" data-close>Schließen</button><button class="btn btn-p" data-act="editWater:${w.id}">${svg('edit')} Bearbeiten</button>` });
};
ACTS.ruleEdit = (wid, i) => {
  closeModal(); const w = byId('waters', wid); i = Number(i); const r = i >= 0 ? w.rules[i] : { sp: '' };
  openForm({ title: 'Regel für ' + w.name, intro: 'Nur ausfüllen, was vom Gesetz abweicht. Leere Felder = Landesregel.', fields: () => [
    { k: 'sp', label: 'Fischart', type: 'select', opts: () => [['', '– bitte wählen –'], ...speciesOpts()], req: true }, { k: 'prot', label: 'An diesem Gewässer ganz geschützt', type: 'check' },
    { k: 'min', label: 'Mindestmaß (cm)', type: 'number', step: '1' }, { k: 'max', label: 'Höchstmaß – Entnahmefenster bis (cm)', type: 'number', step: '1' },
    { k: 'closed', label: 'Schonzeit', ph: 'z. B. 1.2.-15.4.' }, { k: 'perDay', label: 'Höchstens pro Tag', type: 'number', step: '1' }, { k: 'perYear', label: 'Höchstens pro Jahr', type: 'number', step: '1' }
  ], del: i >= 0 ? async () => { w.rules.splice(i, 1); upsert('waters', w); return true; } : null,
  validate: v => v.closed && !parsePeriods(v.closed).length ? 'Schonzeit bitte so schreiben: 1.3.-31.5.' : '',
  save: v => { const x = { sp: v.sp, prot: v.prot, min: Number(v.min) || 0, max: Number(v.max) || 0, closed: v.closed, perDay: Number(v.perDay) || 0, perYear: Number(v.perYear) || 0 }; if (i >= 0) w.rules[i] = x; else { w.rules = w.rules.filter(q => q.sp !== x.sp); w.rules.push(x); } upsert('waters', w); toast('Regel gespeichert.'); } }, r);

function stockingDef(s) {
  const isNew = !byId('stockings', s.id);
  return { title: isNew ? 'Fischbesatz eintragen' : 'Besatz', fields: () => [
    { k: 'date', label: 'Datum', type: 'date', req: true }, { k: 'water', label: 'Gewässer', type: 'select', opts: () => waterOpts(), req: true },
    { k: 'sp', label: 'Fischart', type: 'select', opts: () => [['', '– bitte wählen –'], ...speciesOpts()], req: true }, { k: 'size', label: 'Größe / Altersstufe', ph: 'z. B. K2, 15–20 cm, Glasaal', list: ['Brut', 'K1', 'K2', 'K3', 'Satzaal', 'Glasaal', 'vorgestreckt', '10–15 cm', '15–20 cm', '20–25 cm', 'fangfähig'] },
    { k: 'qty', label: 'Stück', type: 'number', step: '1' }, { k: 'kg', label: 'Gewicht (kg)', type: 'number', step: '0.1' },
    { k: 'cost', label: 'Kosten (€)', type: 'money' }, { k: 'supplier', label: 'Lieferant', ph: 'z. B. Fischzucht Müller' },

  ], save: v => { v.qty = v.qty === '' ? '' : Number(v.qty); v.kg = v.kg === '' ? '' : Number(v.kg); upsert('stockings', v); syncBooking('st:' + v.id, v.book && v.cost > 0, { date: v.date, type: 'out', cat: 'Fischbesatz', amount: v.cost, text: `Besatz ${spName(v.sp)} – ${waterName(v.water)}` }); toast('Besatz gespeichert.'); },
  del: isNew ? null : async v => { if (!await confirmBox('Besatz löschen?', 'Löschen', true)) return false; syncBooking('st:' + v.id, false); removeFrom('stockings', v.id); return true; } };
}
ACTS.newStocking = (wid = '') => { if (topModal()) closeModal(); openForm(stockingDef({}), { id: pid(), date: today(), water: wid || data.waters.find(w => !w.inactive)?.id || '', book: true }); };
ACTS.editStocking = id => { const s = byId('stockings', id); openForm(stockingDef(s), s); };
ACTS.printStock = y => printHTML('Besatzbuch ' + y, `${letterhead()}<h1>Besatzbuch ${y}</h1>${besatzTable(data.stockings.filter(s => yearOf(s.date) === Number(y)))}<div class="sig"><div>Gewässerwart/in</div><div>Kassenwart/in</div></div>`);
ACTS.printOrder = id => { const w = byId('waters', id); printHTML('Gewässerordnung', `${letterhead()}<h1>Gewässerordnung – ${esc(w.name)}</h1><p>${esc([w.kind, w.area && fmtNum(w.area, 1) + ' ha', w.place].filter(Boolean).join(' · '))}${w.access ? '<br>Zufahrt: ' + esc(w.access) : ''}</p>

  ${w.order ? `<h2>Besondere Bestimmungen</h2><p style="white-space:pre-line">${esc(w.order)}</p>` : ''}${w.rules.length ? `<h2>Eigene Fangregeln an diesem Gewässer</h2>${rulesTable(w)}` : ''}
  <h2>Schonzeiten und Mindestmaße (Landesrecht)</h2><table><thead><tr><th>Fischart</th><th class="r">Mindestmaß</th><th>Schonzeit</th></tr></thead><tbody>${data.species.filter(s => s.min || s.closed || s.prot).map(s => `<tr><td>${esc(s.name)}</td><td class="r">${s.prot ? '–' : s.min ? s.min + ' cm' : '–'}</td><td>${s.prot ? '<b>ganzjährig geschützt</b>' : esc(fmtPeriods(s.closed) || '–')}</td></tr>`).join('')}</tbody></table><p class="small">Stand ${fmtDate(today())} · Der Vorstand</p>`); };

/* ---------- Erlaubnisscheine (Jahreskarten) ---------- */
VIEWS.permits = () => {
  const y = Number(viewState.y || (today().slice(5) < '04-01' ? curYear() - 1 : curYear())), f = viewState.f || '', q = viewState.q || '';
  const all = permitsOf(y), list = all.filter(p => (!f || (f === 'open' ? !p.returned : p.returned)) && matchQ(q, p.no, memberLabel(p.member))).sort((a, b) => String(a.no).localeCompare(String(b.no), 'de', { numeric: true }));
  const without = data.members.filter(m => ['Aktiv', 'Jugend'].includes(m.dept) && !all.some(p => p.member === m.id));
  return head('Erlaubnisscheine', `Jahreskarten für eure Mitglieder – mit Nummer und Rückgabe der Fangliste bis zum ${fmtMD(data.settings.returnBy)} des Folgejahres.`, `${yearSel('permits', y, 'year')}<button class="btn" data-act="issueAll:${y}">${svg('card')} Für alle ausstellen</button><button class="btn btn-p" data-act="newPermit:${y}">${svg('plus')} Erlaubnisschein</button>`) +
  `<div class="grid g4" style="margin-bottom:16px">${kpi('Ausgestellt ' + y, fmtNum(all.length), without.length ? `${without.length} aktive Mitglieder noch ohne` : 'alle aktiven Mitglieder', 'card')}${kpi('Fangliste zurück', fmtNum(all.filter(p => p.returned).length), all.length ? Math.round(all.filter(p => p.returned).length / all.length * 100) + ' %' : '', 'check', 'blue')}${kpi('Fehlt noch', fmtNum(all.filter(p => !p.returned).length), y < curYear() ? 'Bitte mahnen' : 'Rückgabe nach Jahresende', 'alert', y < curYear() ? 'red' : 'gold')}${kpi('Gewässer', fmtNum(data.waters.filter(w => !w.inactive).length), 'auf den Karten', 'wave')}</div>
  <div class="tools">${searchBox(q, 'Nummer, Name …')}${chips('f', [['', 'Alle', all.length], ['open', 'Fangliste fehlt', all.filter(p => !p.returned).length], ['ret', 'Zurück', all.filter(p => p.returned).length]], f)}${moreBtn([['printPermitList:' + y, 'Ausgabeliste drucken'], ['printReminders:' + y, 'Mahnliste Fanglisten']])}</div>
  <div class="card tbl-wrap">${list.length ? `<table class="tbl"><thead><tr><th>Nr.</th><th>Mitglied</th><th class="hm">Ausgestellt</th><th class="hm">Gewässer</th><th>Fangliste</th><th></th></tr></thead><tbody>${list.map(p => `<tr class="click" data-open="editPermit:${p.id}"><td><b>${esc(p.no)}</b></td><td>${esc(memberLabel(p.member))}</td><td class="hm">${fmtDate(p.issued)}</td><td class="hm small">${p.waters.length ? esc(p.waters.map(waterName).join(', ')) : 'alle'}</td><td>${p.returned ? pill('zurück ' + fmtDate(p.returnedDate), 'g') : p.year >= curYear() ? '<span class="muted small">nach Jahresende</span>' : `<button class="btn btn-sm" data-act="permitReturn:${p.id}">${svg('check')} Zurück</button>`}</td><td class="r"><button class="btn btn-sm" data-act="printPermit:${p.id}" title="Drucken">${svg('print')}</button></td></tr>`).join('')}</tbody></table>` : emptyBox('Noch keine Erlaubnisscheine für ' + y, 'Mit „Für alle ausstellen“ bekommt jedes aktive Mitglied eine Karte mit fortlaufender Nummer.')}</div>`;
};
VIEWS.permits.after = yearAfter;
const nextPermitNo = y => String(Math.max(0, ...permitsOf(y).map(p => parseInt(String(p.no).split('-').pop()) || 0)) + 1).padStart(3, '0');
function permitDef(p) { const isNew = !byId('permits', p.id); return { title: isNew ? 'Erlaubnisschein ' + p.year : 'Erlaubnisschein ' + p.no, fields: () => [
  { k: 'member', label: 'Mitglied', type: 'member', req: true }, { k: 'no', label: 'Nummer', req: true }, { k: 'issued', label: 'Ausgestellt am', type: 'date' },

ACTS.printMembers = dept => { const l = data.members.filter(m => dept ? m.dept === dept : m.dept !== 'Ausgetreten').sort((a, b) => sortName(a).localeCompare(sortName(b))); printHTML('Mitgliederliste', `${letterhead()}<h1>Mitgliederliste ${esc(dept || '')}</h1><table><thead><tr><th>Nr.</th><th>Name</th><th>Geb.</th><th>Anschrift</th><th>Status</th><th>Eintritt</th></tr></thead><tbody>${l.map(m => `<tr><td>${esc(m.no || '')}</td><td>${esc(fullName(m))}</td><td>${fmtDate(m.birth)}</td><td class="small">${esc([m.street, [m.zip, m.city].filter(Boolean).join(' ')].filter(Boolean).join(', '))}</td><td>${esc(m.dept)}</td><td>${fmtDate(m.entry)}</td></tr>`).join('')}</tbody></table><p class="small">${plural(l.length, 'Mitglied', 'Mitglieder')} · Stand ${fmtDate(today())}</p>`); };

/* ---------- Arbeitsdienst ---------- */
VIEWS.work = () => {
  const y = Number(viewState.y || curYear()), f = viewState.f || '', s = data.settings;
  const all = workList(y).filter(w => w.duty > 0 || w.done > 0), list = all.filter(w => !f || (f === 'open' ? w.rest > 0 : w.rest === 0)).sort((a, b) => b.rest - a.rest || sortName(a.m).localeCompare(sortName(b.m)));
  const evs = data.events.filter(e => e.kind === 'Arbeitsdienst' && yearOf(e.date) === y).sort((a, b) => b.date.localeCompare(a.date));
  return head('Arbeitsdienst', `Pflicht: ${s.workHours} Stunden pro Jahr für aktive Mitglieder von ${s.workFrom} bis ${s.workTo - 1} Jahren. Fehlende Stunden kosten ${fmtMoney(s.workRate)} pro Stunde.`, `${yearSel('events', y)}<button class="btn" data-act="newEvent:Arbeitsdienst">${svg('calendar')} Arbeitseinsatz</button><button class="btn btn-p" data-act="newWorkx">${svg('plus')} Stunden</button>`) +
  `<div class="grid g4" style="margin-bottom:16px">${kpi('Geleistet', fmtNum(sum(all, w => w.done), 1) + ' h', `von ${fmtNum(sum(all, w => w.duty))} h Soll`, 'shovel')}${kpi('Erfüllt', fmtNum(all.filter(w => w.duty && w.rest === 0).length), `von ${all.filter(w => w.duty).length} Pflichtigen`, 'check', 'blue')}${kpi('Fehlen noch', fmtNum(sum(all, w => w.rest), 1) + ' h', `${all.filter(w => w.rest > 0).length} Mitglieder`, 'alert', 'gold')}${kpi('Ersatzgeld', fmtMoney(sum(all, w => w.money)), 'wenn niemand mehr kommt', 'euro', 'red')}</div>
  <div class="grid g2" style="align-items:start"><div><div class="tools">${chips('f', [['', 'Alle'], ['open', 'Noch offen', all.filter(w => w.rest > 0).length], ['ok', 'Erfüllt', all.filter(w => w.rest === 0).length]], f)}${moreBtn([['printWork:' + y, 'Stundenliste drucken'], ['workCharge:' + y, 'Ersatzgeld abrechnen']])}</div>
  <div class="card tbl-wrap">${list.length ? `<table class="tbl"><thead><tr><th>Name</th><th class="r">Soll</th><th class="r">Ist</th><th style="width:30%">Stand</th><th class="r">Ersatz</th></tr></thead><tbody>${list.map(w => { const pc = w.duty ? Math.min(100, Math.round(w.done / w.duty * 100)) : 100; return `<tr class="click" data-open="newWorkx:${w.m.id}"><td>${esc(fullName(w.m))}</td><td class="r">${w.duty || '–'}</td><td class="r"><b>${fmtNum(w.done, 1)}</b></td><td><div class="bar ${pc < 50 ? 'red' : pc < 100 ? 'gold' : ''}"><i style="width:${pc}%"></i></div></td><td class="r">${w.money ? fmtMoney(w.money) : ''}</td></tr>`; }).join('')}</tbody></table>` : emptyBox('Niemand', '')}</div></div>
  <div class="card pad"><div class="sec-t"><h3>${svg('calendar')} Arbeitseinsätze ${y}</h3></div>${evs.length ? `<div class="list">${evs.map(e => `<div class="li" style="cursor:pointer" data-act="editEvent:${e.id}"><div class="dt${e.date < today() ? ' past' : ''}"><b>${parseD(e.date).getDate()}</b><span>${MONTHS[parseD(e.date).getMonth()].slice(0, 3)}</span></div><div class="grow"><b>${esc(e.title || 'Arbeitsdienst')}</b><div class="small muted">${fmtNum(num(e.hours), 1)} h · ${e.present.length} dabei${e.water ? ' · ' + esc(waterName(e.water)) : ''}</div></div>${e.date <= today() && !e.present.length ? `<button class="btn btn-sm btn-p" data-act="attendEvent:${e.id}">Wer war da?</button>` : ''}</div>`).join('')}</div>` : emptyBox('Noch keine Einsätze', 'Arbeitseinsatz anlegen, danach „Wer war da?“ antippen – die Stunden zählen automatisch.')}</div></div>`;
};
VIEWS.work.after = yearAfter;
ACTS.newWorkx = (mid = '') => openForm({ title: 'Arbeitsstunden eintragen', intro: 'Für Arbeit außerhalb der gemeinsamen Einsätze, z. B. Mäharbeiten oder Fischbesatz helfen.', fields: () => [{ k: 'member', label: 'Mitglied', type: 'member', req: true }, { k: 'date', label: 'Datum', type: 'date', req: true }, { k: 'hours', label: 'Stunden', type: 'number', step: '0.5', req: true }, { k: 'text', label: 'Was wurde gemacht?', full: true }], validate: v => num(v.hours) <= 0 ? 'Bitte Stunden eintragen.' : '', save: v => { upsert('workx', { ...v, hours: num(v.hours) }); toast('Stunden eingetragen.'); } }, { id: pid(), member: mid, date: today(), hours: '' });
ACTS.printWork = y => { const l = workList(Number(y)).filter(w => w.duty || w.done).sort((a, b) => sortName(a.m).localeCompare(sortName(b.m))); printHTML('Arbeitsdienst ' + y, `${letterhead()}<h1>Arbeitsdienst ${y}</h1><table><thead><tr><th>Name</th><th class="r">Soll</th><th class="r">Ist</th><th class="r">Fehlt</th><th class="r">Ersatzgeld</th></tr></thead><tbody>${l.map(w => `<tr><td>${esc(fullName(w.m))}</td><td class="r">${w.duty}</td><td class="r">${fmtNum(w.done, 1)}</td><td class="r">${w.rest ? fmtNum(w.rest, 1) : ''}</td><td class="r">${w.money ? fmtMoney(w.money) : ''}</td></tr>`).join('')}</tbody><tfoot><tr><td>Summe</td><td class="r">${sum(l, w => w.duty)}</td><td class="r">${fmtNum(sum(l, w => w.done), 1)}</td><td class="r">${fmtNum(sum(l, w => w.rest), 1)}</td><td class="r">${fmtMoney(sum(l, w => w.money))}</td></tr></tfoot></table>`); };
ACTS.workCharge = async y => { y = Number(y); const l = workList(y).filter(w => w.money > 0 && !data.bookings.some(b => b.src === `work:${w.m.id}:${y}`)); if (!l.length) return toast('Kein offenes Ersatzgeld.'); if (!await confirmBox(`Ersatzgeld für ${l.length} Mitglieder als offene Forderung unter „Beiträge“ vormerken? Insgesamt ${fmtMoney(sum(l, w => w.money))}.`, 'Vormerken')) return; l.forEach(w => { w.m.workDue = w.m.workDue || {}; w.m.workDue[y] = w.money; touch(w.m); }); save(); render(); toast('Vorgemerkt – unter Beiträge abhaken, wenn bezahlt.'); };

/* ---------- Termine & Hegefischen ---------- */
VIEWS.events = () => {
  const y = Number(viewState.y || curYear()), all = data.events.filter(e => yearOf(e.date) === y).sort((a, b) => a.date.localeCompare(b.date));
  const fut = all.filter(e => e.date >= today()), past = all.filter(e => e.date < today()).reverse();
  const champ = championship(y);
  const li = e => `<div class="li" style="cursor:pointer" data-act="editEvent:${e.id}"><div class="dt${e.date < today() ? ' past' : ''}"><b>${parseD(e.date).getDate()}</b><span>${MONTHS[parseD(e.date).getMonth()].slice(0, 3)}</span></div><div class="grow"><b>${esc(e.title || e.kind)}</b><div class="small muted">${WD[(parseD(e.date).getDay() + 6) % 7]} ${esc(e.from || '')} · ${esc(e.kind)}${e.water ? ' · ' + esc(waterName(e.water)) : ''}</div></div>${COMP_KINDS.includes(e.kind) ? (e.results.length ? pill(`${e.results.length} Ergebnisse`, 'g') : e.date <= today() ? `<button class="btn btn-sm btn-p" data-act="results:${e.id}">Ergebnisse</button>` : '') : e.kind === 'Arbeitsdienst' && e.date <= today() && !e.present.length ? `<button class="btn btn-sm btn-p" data-act="attendEvent:${e.id}">Wer war da?</button>` : ''}</div>`;
  return head('Termine & Hegefischen', 'Arbeitsdienst, Hegefischen, Vereinsmeisterschaft, Versammlungen. Beim Hegefischen trägst du das Gewicht ein – die App macht die Rangliste.', `${yearSel('events', y)}<button class="btn" data-act="printEvents:${y}">${svg('print')} Terminplan</button><button class="btn btn-p" data-act="newEvent">${svg('plus')} Termin</button>`) +
  `<div class="grid g2" style="align-items:start"><div class="card pad"><div class="sec-t"><h3>${svg('calendar')} Kommend</h3></div>${fut.length ? `<div class="list">${fut.map(li).join('')}</div>` : emptyBox('Nichts geplant', '')}<div class="sec-t" style="margin-top:14px"><h3>Vergangen</h3></div>${past.length ? `<div class="list">${past.map(li).join('')}</div>` : emptyBox('–', '')}</div>
  <div class="card pad"><div class="sec-t"><h3>${svg('award')} Vereinsmeister ${y}</h3>${champ.length ? `<button class="btn btn-sm" data-act="printChamp:${y}">${svg('print')}</button>` : ''}</div><p class="small muted" style="margin-top:0">Summe der Gewichte aus allen Wertungsangeln (Hegefischen, Gemeinschaftsfischen, Vereinsmeisterschaft).</p>${champ.length ? `<table class="tbl"><thead><tr><th>Platz</th><th>Name</th><th class="r">Angeln</th><th class="r">Gewicht</th></tr></thead><tbody>${champ.map((r, i) => `<tr><td>${i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1}</td><td>${esc(fullName(r.m))}</td><td class="r">${r.n}</td><td class="r"><b>${fmtNum(r.g / 1000, 2)} kg</b></td></tr>`).join('')}</tbody></table>` : emptyBox('Noch keine Wertung', 'Nach dem Hegefischen auf „Ergebnisse“.')}</div></div>`;
};
VIEWS.events.after = yearAfter;
function championship(y) { const t = {}; data.events.filter(e => yearOf(e.date) === y && ['Hegefischen', 'Gemeinschaftsfischen', 'Vereinsmeisterschaft'].includes(e.kind)).forEach(e => e.results.forEach(r => { if (!r.m) return; (t[r.m] ||= { m: memberById(r.m), g: 0, n: 0 }); t[r.m].g += num(r.g); t[r.m].n++; })); return Object.values(t).filter(r => r.m).sort((a, b) => b.g - a.g); }
function eventDef(e) { const isNew = !byId('events', e.id); return { title: isNew ? 'Neuer Termin' : (e.title || e.kind), fields: () => [
  { k: 'date', label: 'Datum', type: 'date', req: true }, { k: 'kind', label: 'Art', type: 'select', opts: EVENT_KINDS }, { k: 'from', label: 'Beginn', type: 'time' }, { k: 'to', label: 'Ende', type: 'time' },
  { k: 'title', label: 'Titel', full: true, ph: 'z. B. Frühjahrsputz am Großen Meer, Königsangeln' }, { k: 'water', label: 'Gewässer', type: 'select', opts: () => waterOpts('– kein Gewässer –') }, { k: 'place', label: 'Treffpunkt' },
  { k: 'hours', label: 'Stunden pro Teilnehmer (Arbeitsdienst)', type: 'number', step: '0.5' }, { k: 'lead', label: 'Leitung', type: 'member' }, { k: 'note', label: 'Notiz / Bericht', type: 'textarea', full: true }
], save: v => { if (v.kind === 'Arbeitsdienst' && !num(v.hours) && v.from && v.to) { const [a, b] = [v.from, v.to].map(t => t.split(':').map(Number)); v.hours = Math.max(0, r2(((b[0] * 60 + b[1]) - (a[0] * 60 + a[1])) / 60)); } upsert('events', v); toast('Gespeichert.'); },
  del: isNew ? null : async v => { if (!await confirmBox('Termin löschen?' + (v.present.length || v.results.length ? ' Anwesenheit und Ergebnisse gehen verloren.' : ''), 'Löschen', true)) return false; removeFrom('events', v.id); return true; } }; }
ACTS.newEvent = (kind = 'Arbeitsdienst') => openForm(eventDef({}), { id: pid(), date: today(), kind, from: kind === 'Arbeitsdienst' ? '09:00' : '', to: kind === 'Arbeitsdienst' ? '13:00' : '', hours: kind === 'Arbeitsdienst' ? 4 : '', present: [], results: [] });
ACTS.editEvent = id => { const e = byId('events', id); const m = openForm(eventDef(e), e); $('.modal-f', m).insertAdjacentHTML('afterbegin', e.kind === 'Arbeitsdienst' ? `<button class="btn l" data-act="attendEvent:${e.id}">${svg('check')} Wer war da?${e.present.length ? ` (${e.present.length})` : ''}</button>` : COMP_KINDS.includes(e.kind) ? `<button class="btn l" data-act="results:${e.id}">${svg('award')} Ergebnisse</button>${e.results.length ? `<button class="btn l" data-act="printResults:${e.id}">${svg('print')}</button>` : ''}` : ''); };
ACTS.attendEvent = id => {
  if (topModal()) closeModal(); const e = byId('events', id), ppl = data.members.filter(m => m.dept !== 'Ausgetreten').sort((a, b) => sortName(a).localeCompare(sortName(b))), st = new Set(e.present);
  const md = openModal({ title: 'Wer war da? – ' + esc(e.title || e.kind), wide: true, body: `<p class="muted" style="margin-top:0">${fmtDateLong(e.date)} · je ${fmtNum(num(e.hours), 1)} Stunden. Antippen, wer dabei war.</p><div class="attgrid" id="atG">${ppl.map(m => `<label data-id="${m.id}" class="${st.has(m.id) ? 'on' : ''}">${avatar(m)}<span>${esc(fullName(m))}</span><small>${workDuty(m, yearOf(e.date)) ? 'Pflicht' : ''}</small></label>`).join('')}</div>`, foot: `<span class="muted small l" id="atC"></span><button class="btn" data-close>Abbrechen</button><button class="btn btn-p" id="atOk">${svg('check')} Speichern</button>` });
  const cnt = () => $('#atC', md).textContent = st.size + ' dabei'; cnt();
  $$('#atG label', md).forEach(l => l.onclick = ev => { ev.preventDefault(); const k = l.dataset.id; st.has(k) ? st.delete(k) : st.add(k); l.classList.toggle('on', st.has(k)); cnt(); });
  $('#atOk', md).onclick = () => { e.present = [...st]; upsert('events', e); closeModal(); render(); toast(`${st.size} Teilnehmer gespeichert.`); };
};
ACTS.results = id => {
  if (topModal()) closeModal(); const e = byId('events', id), ppl = data.members.filter(m => m.dept !== 'Ausgetreten').sort((a, b) => sortName(a).localeCompare(sortName(b))), map = new Map(e.results.map(r => [r.m, r]));
  const md = openModal({ title: 'Ergebnisse – ' + esc(e.title || e.kind), wide: true, body: `<p class="muted" style="margin-top:0">Gewicht in Gramm eintragen. Wer nichts gefangen hat, aber dabei war: 0 eintragen. Leer = nicht dabei.</p><table class="tbl" id="rsT"><thead><tr><th>Name</th><th class="r">Gewicht (g)</th><th class="r">Anzahl Fische</th><th>Größter Fisch</th></tr></thead><tbody>${ppl.map(m => { const r = map.get(m.id) || {}; return `<tr data-id="${m.id}"><td>${esc(fullName(m))}</td><td class="r"><input type="number" class="rs-g" style="width:100px" value="${r.g ?? ''}"></td><td class="r"><input type="number" class="rs-n" style="width:70px" value="${r.n ?? ''}"></td><td><input class="rs-b" placeholder="z. B. Brasse 52 cm" value="${esc(r.big || '')}"></td></tr>`; }).join('')}</tbody></table>`, foot: `<button class="btn" data-close>Abbrechen</button><button class="btn btn-p" id="rsOk">${svg('check')} Speichern</button>` });
  $('#rsOk', md).onclick = () => { e.results = $$('#rsT tbody tr', md).filter(r => $('.rs-g', r).value !== '').map(r => ({ m: r.dataset.id, g: Number($('.rs-g', r).value) || 0, n: Number($('.rs-n', r).value) || 0, big: $('.rs-b', r).value.trim() })).sort((a, b) => b.g - a.g); e.present = e.results.map(r => r.m); upsert('events', e); closeModal(); render(); toast(`${e.results.length} Ergebnisse gespeichert.`); };
};
ACTS.printResults = id => { const e = byId('events', id); printHTML('Ergebnisliste', `${letterhead()}<h1>${esc(e.title || e.kind)}</h1><p>${fmtDateLong(e.date)}${e.water ? ' · ' + esc(waterName(e.water)) : ''}</p><table><thead><tr><th>Platz</th><th>Name</th><th class="r">Fische</th><th class="r">Gewicht</th><th>Größter Fisch</th></tr></thead><tbody>${e.results.map((r, i) => `<tr><td>${i + 1}.</td><td>${esc(memberLabel(r.m))}</td><td class="r">${r.n || ''}</td><td class="r"><b>${fmtNum(r.g / 1000, 3)} kg</b></td><td>${esc(r.big || '')}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">${e.results.length} Teilnehmer</td><td class="r">${sum(e.results, r => r.n)}</td><td class="r">${fmtNum(sum(e.results, r => r.g) / 1000, 3)} kg</td><td></td></tr></tfoot></table><div class="sig"><div>Sportwart/in</div><div>1. Vorsitzende/r</div></div>`); };
ACTS.printChamp = y => { const l = championship(Number(y)); printHTML('Vereinsmeisterschaft ' + y, `${letterhead()}<h1>Vereinsmeisterschaft ${y}</h1><table><thead><tr><th>Platz</th><th>Name</th><th class="r">Wertungsangeln</th><th class="r">Gesamtgewicht</th></tr></thead><tbody>${l.map((r, i) => `<tr><td>${i + 1}.</td><td>${esc(fullName(r.m))}</td><td class="r">${r.n}</td><td class="r"><b>${fmtNum(r.g / 1000, 3)} kg</b></td></tr>`).join('')}</tbody></table>`); };
ACTS.printEvents = y => { const l = data.events.filter(e => yearOf(e.date) === Number(y)).sort((a, b) => a.date.localeCompare(b.date)); printHTML('Terminplan ' + y, `${letterhead()}<h1>Terminplan ${y}</h1><table><thead><tr><th>Datum</th><th>Zeit</th><th>Termin</th><th>Ort / Gewässer</th></tr></thead><tbody>${l.map(e => `<tr><td class="nowrap">${WD[(parseD(e.date).getDay() + 6) % 7]} ${fmtDate(e.date)}</td><td>${esc(e.from || '')}${e.to ? '–' + esc(e.to) : ''}</td><td><b>${esc(e.title || e.kind)}</b><br><span class="small muted">${esc(e.kind)}</span></td><td>${esc([e.place, waterName(e.water)].filter(Boolean).join(' · '))}</td></tr>`).join('')}</tbody></table><p class="small">Arbeitsdienst zählt für die Pflichtstunden. Bitte bei Verhinderung beim Vorstand abmelden.</p>`); };

/* ---------- Beiträge ---------- */
VIEWS.fees = () => {
  const y = Number(viewState.y || curYear()), f = viewState.f || '', q = viewState.q || '';
  const rows = data.members.filter(m => m.dept !== 'Ausgetreten' && yearOf(m.entry) <= y).map(m => ({ m, fee: feeOf(m), b: feeBooking(m, y), wd: num(m.workDue?.[y]), wb: data.bookings.find(b => b.src === `work:${m.id}:${y}`) })).filter(r => r.fee > 0 || r.wd > 0);
  const open = rows.filter(r => (r.fee > 0 && !r.b) || (r.wd > 0 && !r.wb)), list = rows.filter(r => (!f || (f === 'open' ? open.includes(r) : !open.includes(r))) && matchQ(q, fullName(r.m), r.m.no)).sort((a, b) => sortName(a.m).localeCompare(sortName(b.m)));
  const soll = sum(rows, r => r.fee + r.wd), ist = sum(rows, r => (r.b ? r.b.amount : 0) + (r.wb ? r.wb.amount : 0));
  return head('Beiträge', 'Jahresbeiträge und Ersatzgeld für den Arbeitsdienst. Ein Klick auf „Bezahlt“ bucht in die Vereinskasse.', `${yearSel('bookings', y)}<button class="btn" data-act="printFees:${y}">${svg('print')} Beitragsliste</button>`) +
  `<div class="grid g4" style="margin-bottom:16px">${kpi('Soll ' + y, fmtMoney(soll), `${rows.length} Mitglieder`, 'euro')}${kpi('Bezahlt', fmtMoney(ist), soll ? Math.round(ist / soll * 100) + ' %' : '', 'check', 'blue')}${kpi('Offen', fmtMoney(r2(soll - ist)), `${open.length} Mitglieder`, 'alert', 'red')}${kpi('Beitrag Aktiv', fmtMoney(data.settings.feeAktiv), `Jugend ${fmtMoney(data.settings.feeJugend)} · Passiv ${fmtMoney(data.settings.feePassiv)}`, 'card', 'gold')}</div>
  <div class="tools">${searchBox(q, 'Name …')}${chips('f', [['', 'Alle', rows.length], ['open', 'Offen', open.length], ['paid', 'Bezahlt', rows.length - open.length]], f)}</div>
  <div class="card tbl-wrap">${list.length ? `<table class="tbl"><thead><tr><th>Name</th><th>Status</th><th class="r">Beitrag</th><th class="r hm">Ersatzgeld</th><th></th></tr></thead><tbody>${list.map(r => `<tr><td><b>${esc(fullName(r.m))}</b><span class="sub">Nr. ${esc(r.m.no || '–')}</span></td><td>${deptPill(r.m)}</td><td class="r">${fmtMoney(r.fee)}${r.b ? `<span class="sub pos">bezahlt ${fmtDate(r.b.date)}</span>` : ''}</td><td class="r hm">${r.wd ? fmtMoney(r.wd) : ''}${r.wb ? `<span class="sub pos">bezahlt</span>` : ''}</td><td class="r nowrap">${r.fee > 0 && !r.b ? `<button class="btn btn-sm btn-p" data-act="feePaid:${r.m.id}:${y}">${svg('check')} Bezahlt</button>` : ''}${r.wd > 0 && !r.wb ? ` <button class="btn btn-sm" data-act="workPaid:${r.m.id}:${y}">Ersatz bezahlt</button>` : ''}${r.b ? ` <button class="btn btn-sm btn-red" data-act="feeUndo:${r.m.id}:${y}" title="Zahlung zurücknehmen">${svg('x')}</button>` : ''}</td></tr>`).join('')}</tbody></table>` : emptyBox('Keine Beiträge', 'Beitragshöhe je Status unter Einstellungen → Regeln.')}</div>`;
};

async function snapshot() { await flushSave(); const photos = {}; for (const [k, v] of photoCache) photos[k] = v; return { app: APPNAME, version: VERSION, demo: IS_DEMO, created: new Date().toISOString(), data, photos }; }

async function readJsonFile() { const f = await pickFile('.json,application/json'); if (!f) return null; try { return JSON.parse(await f.text()); } catch (e) { toast('Die Datei ist keine ZackAngel-Sicherung.', { err: true }); return null; } }
ACTS.restore = async () => {
  const s = await readJsonFile(); if (!s) return; if (s.app !== APPNAME || !s.data) return toast('Das ist keine ZackAngel-Sicherung.', { err: true });
  if (!await confirmBox(`Sicherung vom ${fmtDate(s.created.slice(0, 10))} laden? Alle Daten auf diesem Gerät werden ersetzt.`, 'Laden', true)) return;
  await store.clear(); photoCache.clear(); for (const [k, v] of Object.entries(s.photos || {})) { await store.set(k, v); photoCache.set(k, v); }
  data = normalize(s.data); data.meta.setupDone = true; await flushSave(); applyTheme(); render(); toast('Sicherung geladen.');
};
ACTS.syncOut = async () => { if (!data.meta.device.code) { toast('Bitte zuerst Name und Kürzel für dieses Gerät eintragen und speichern.', { err: true }); return; } const s = await snapshot(); s.sync = true; s.device = data.meta.device; downloadFile(`zackangel_abgleich_${data.meta.device.code}_${today()}.json`, JSON.stringify(s), 'application/json'); toast('Abgleich-Datei erstellt. Jetzt auf dem anderen Gerät einlesen.'); };
ACTS.syncIn = async () => {
  const s = await readJsonFile(); if (!s) return; if (s.app !== APPNAME || !s.data) return toast('Das ist keine ZackAngel-Datei.', { err: true });
  if (s.device?.code && s.device.code === data.meta.device.code) return toast('Diese Datei kommt von diesem Gerät selbst (gleiches Kürzel).', { err: true });
  const r = mergeData(data, normalize(s.data));
  for (const [k, v] of Object.entries(s.photos || {})) if (!photoCache.has(k)) { await store.set(k, v); photoCache.set(k, v); }
  save(); render(); toast(`Abgleich fertig: ${r.added} neu, ${r.updated} aktualisiert, ${r.removed} gelöscht.`, { ms: 6000 });
};
function mergeData(mine, theirs) {
  const res = { added: 0, updated: 0, removed: 0 }, delMine = mine.meta.deleted || [], delTheirs = theirs.meta.deleted || [];
  const isDel = (list, col, id) => list.some(d => d.col === col && d.id === String(id));
  COLLECTIONS.forEach(col => {
    const map = new Map(mine[col].map(x => [String(x.id), x]));
    theirs[col].forEach(x => { const id = String(x.id); if (isDel(delMine, col, id)) return; const cur = map.get(id); if (!cur) { mine[col].push(x); res.added++; } else if ((x.updatedAt || '') > (cur.updatedAt || '')) { Object.keys(cur).forEach(k => delete cur[k]); Object.assign(cur, x); res.updated++; } else if (col === 'charges') { const mp = mergePayments(cur.payments, x.payments); if (mp.length !== cur.payments.length) { cur.payments = mp; res.updated++; } } });
    const before = mine[col].length; mine[col] = mine[col].filter(x => !isDel(delTheirs, col, String(x.id))); res.removed += before - mine[col].length;
  });
  mine.meta.deleted = [...delMine, ...delTheirs.filter(d => !isDel(delMine, d.col, d.id))];
  if ((theirs.meta.updated || '') > (mine.meta.updated || '')) { mine.club = { ...mine.club, ...theirs.club }; mine.settings = { ...mine.settings, ...theirs.settings }; }
  return res;
}
