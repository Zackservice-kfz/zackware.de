<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a0b1f">
<meta name="description" content="ZackWehr – die App für die Freiwillige Feuerwehr: Einsatzberichte, Atemschutz-Ampel, Dienstplan, Mannschaft, Fahrzeuge, Geräteprüfungen, Jugendfeuerwehr, Ehrungen, Kameradschaftskasse. Offline, ohne Abo.">
<title>ZackWehr</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23c8102e'/%3E%3Cpath d='M20 7c2 5 8 8 8 15a8 8 0 0 1-16 0c0-4 2-6 4-8 0 3 1 5 3 5-1-4 0-8 1-12z' fill='%23fff'/%3E%3C/svg%3E">
<style>:root{--g:#16794c;--g2:#0f5c39;--g3:#0b4a2e;--gl:#e6f4ec;--gll:#f2faf5;--gold:#f0a500;--goldl:#fff4d6;--red:#c8382f;--redl:#fdecea;--blue:#2f6fb5;--bluel:#e8f0fa;--ink:#17261f;--ink2:#34453d;--muted:#66776e;--bg:#f4f6f2;--card:#fff;--line:#e1e7e2;--line2:#eef2ee;--sh:0 1px 2px rgba(16,40,28,.06),0 4px 14px rgba(16,40,28,.06);--r:14px;--side:252px;color-scheme:light}
[data-theme=dark]{--g:#3fbf80;--g2:#62d39a;--g3:#9fe8c2;--gl:#16352a;--gll:#122a21;--gold:#ffbf3c;--goldl:#3a2f12;--red:#ff7a70;--redl:#3c1d1a;--blue:#7fb2ff;--bluel:#172a44;--ink:#e8f1ec;--ink2:#c9d7cf;--muted:#93a69b;--bg:#0f1714;--card:#17221d;--line:#26352e;--line2:#1d2a24;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--g)}
svg{width:18px;height:18px;flex:none}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:13px}.r{text-align:right}.nowrap{white-space:nowrap}
.app{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.brand{display:flex;gap:11px;align-items:center;padding:18px 18px 14px}
.crest{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,var(--g),var(--g3));color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;overflow:hidden;flex:none;box-shadow:0 3px 10px rgba(22,121,76,.3)}
.crest img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:15.5px;line-height:1.2;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted)}
.nav{flex:1;overflow:auto;padding:4px 10px 10px}
.nav h6{margin:14px 10px 5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 11px;border-radius:10px;cursor:pointer;color:var(--ink2);font-weight:550;text-align:left}
.nav button:hover{background:var(--gll)}
.nav button.on{background:var(--gl);color:var(--g2);font-weight:700}
.nav button.on svg{color:var(--g)}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--line2);color:var(--muted);border-radius:20px;padding:1px 8px}
.nav .cnt.warn{background:var(--goldl);color:#8a5a00}.nav .cnt.bad{background:var(--redl);color:var(--red)}
[data-theme=dark] .nav .cnt.warn{color:var(--gold)}
.side-foot{border-top:1px solid var(--line);padding:10px 14px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:space-between}
.main{flex:1;margin-left:var(--side);min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;gap:10px;padding:0 26px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1}
.iconbtn.burger{display:none}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.iconbtn:hover{border-color:var(--g);color:var(--g)}
.demo-bar{background:repeating-linear-gradient(135deg,#f0a500 0 14px,#f4b528 14px 28px);color:#3b2a00;font-weight:700;font-size:13px;text-align:center;padding:5px}
.content{padding:24px 26px 60px;max-width:1360px;width:100%}
.head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.head h2{margin:0;font-size:27px;letter-spacing:-.02em;line-height:1.15}
.head p{margin:4px 0 0;color:var(--muted);max-width:640px}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:8px 14px;font-weight:650;cursor:pointer;white-space:nowrap;color:var(--ink);text-decoration:none;font-size:14.5px}
.btn:hover{border-color:var(--g)}
.btn-p{background:var(--g);border-color:var(--g);color:#fff}
.btn-p:hover{background:var(--g2);border-color:var(--g2)}
[data-theme=dark] .btn-p{color:#06261a}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#2e2100}
.btn-red{color:var(--red)}.btn-red:hover{border-color:var(--red)}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi .ic{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;background:var(--gl);color:var(--g);display:grid;place-items:center}
.kpi.gold .ic{background:var(--goldl);color:#b77d00}.kpi.red .ic{background:var(--redl);color:var(--red)}.kpi.blue .ic{background:var(--bluel);color:var(--blue)}
.hero{background:linear-gradient(120deg,var(--g3),var(--g) 60%,#2a9a63);color:#fff;border-radius:18px;padding:22px 24px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:relative;overflow:hidden;margin-bottom:16px}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h2{margin:0;font-size:24px}.hero p{margin:4px 0 0;opacity:.85}
.hero .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.22)}
[data-theme=dark] .hero{background:linear-gradient(120deg,#0c3a25,#14603e 60%,#1a7a4f)}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-t h3{margin:0;font-size:16px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li b{font-weight:650}
.av{width:36px;height:36px;border-radius:50%;background:var(--gl);color:var(--g2);display:grid;place-items:center;font-weight:750;font-size:13px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.gold{background:var(--goldl);color:#9a6700}.av.blue{background:var(--bluel);color:var(--blue)}.av.red{background:var(--redl);color:var(--red)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{position:relative;flex:1;min-width:220px;max-width:360px}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip i{font-style:normal;opacity:.6;margin-left:3px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:650;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--gll);white-space:nowrap}
.tbl td{padding:11px 14px;border-top:1px solid var(--line2);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl tbody tr:hover td{background:var(--gll)}
.tbl tr.click{cursor:pointer}
.tbl .sub{display:block;font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow:auto;border-radius:var(--r)}
.tbl tfoot td{font-weight:750;border-top:2px solid var(--line);background:var(--gll)}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--line2);color:var(--ink2);white-space:nowrap}
.pill.g{background:var(--gl);color:var(--g2)}.pill.gold{background:var(--goldl);color:#8a5a00}.pill.red{background:var(--redl);color:var(--red)}.pill.blue{background:var(--bluel);color:var(--blue)}
[data-theme=dark] .pill.gold{color:var(--gold)}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--g)}.neg{color:var(--red)}
.rowacts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:5px;min-width:220px;z-index:40}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 11px;border-radius:8px;cursor:pointer;font-weight:550}
.menu button:hover{background:var(--gll)}
.menu button.red{color:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(12,28,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:60;overflow:auto}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:92vh}
.modal.wide{max-width:900px}.modal.xwide{max-width:1100px}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;flex:1;font-size:19px}
.modal-b{padding:20px 22px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f .l{margin-right:auto}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:650;color:var(--ink2)}
.f label .req{color:var(--red)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid color-mix(in srgb,var(--g) 35%,transparent);border-color:var(--g)}
.f textarea{min-height:80px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.f .err{font-size:12px;color:var(--red)}
.f.check{flex-direction:row;align-items:center;gap:9px}
.f.check input{width:18px;height:18px;accent-color:var(--g)}
.f.check label{font-weight:550}
.fsec{grid-column:1/-1;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--g);margin-top:8px;padding-top:10px;border-top:1px solid var(--line2)}
.fsec:first-child{margin-top:0;padding-top:0;border-top:0}
.note{background:var(--gll);border:1px solid var(--gl);border-radius:12px;padding:11px 14px;font-size:13.5px;color:var(--ink2)}
.note.gold{background:var(--goldl);border-color:#f6dc9a;color:#5c4200}
.note.red{background:var(--redl);border-color:#f3c3be;color:#7a1c15}
[data-theme=dark] .note.gold{color:var(--gold);border-color:#5a4615}[data-theme=dark] .note.red{color:var(--red);border-color:#5a2520}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--card);padding:11px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:550;max-width:min(560px,92vw);display:flex;gap:12px;align-items:center}
.toast.err{background:var(--red);color:#fff}
.toast button{background:none;border:0;color:var(--gold);font-weight:800;cursor:pointer}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:650;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--g2);border-bottom-color:var(--g)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .dh{background:var(--gll);font-size:12px;font-weight:700;color:var(--muted);padding:8px;text-align:center}
.cal .d{background:var(--card);min-height:96px;padding:6px;cursor:pointer;font-size:13px}
.cal .d.o{background:var(--bg);color:var(--muted)}
.cal .d.t .n{background:var(--g);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.cal .n{font-weight:700;width:24px;height:24px;display:grid;place-items:center}
.cal .ev{display:block;font-size:11.5px;border-radius:6px;padding:2px 5px;margin-top:3px;background:var(--gl);color:var(--g2);font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;width:100%;text-align:left;cursor:pointer}
.cal .ev.gold{background:var(--goldl);color:#8a5a00}.cal .ev.blue{background:var(--bluel);color:var(--blue)}.cal .ev.red{background:var(--redl);color:var(--red)}
.bar{height:8px;background:var(--line2);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:8px}
.bar.gold i{background:var(--gold)}.bar.red i{background:var(--red)}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.att label{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:8px 10px;cursor:pointer;font-weight:550}
.att label:has(input:checked){background:var(--gl);border-color:var(--g)}
.att input{width:18px;height:18px;accent-color:var(--g)}
.photo-box{display:flex;gap:12px;align-items:center}
.photo-box .av{width:64px;height:64px;font-size:20px}
.sig{border:1.5px dashed var(--line);border-radius:12px;background:#fff;width:100%;height:150px;touch-action:none}
.agenda-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--gll)}
.agenda-item h4{margin:0 0 8px;font-size:15px}
.vote{display:grid;grid-template-columns:repeat(3,1fr) 1.3fr;gap:8px;margin-top:8px}
.vote input,.vote select{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--card);width:100%}
.chart{width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ob{max-width:620px;margin:6vh auto;padding:0 16px}
.ob .card{padding:28px}
.ob h1{margin:0 0 6px;font-size:28px;letter-spacing:-.02em}
.steps{display:flex;gap:6px;margin:0 0 18px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps i.on{background:var(--g)}
.scrim{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .side{transform:translateX(-102%);box-shadow:0 0 40px rgba(0,0,0,.2)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .main{margin-left:0}.iconbtn.burger{display:grid}
  .top{padding:0 14px}.content{padding:16px 14px 70px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .fg,.fg.c3{grid-template-columns:minmax(0,1fr)}
  .head h2{font-size:23px}
  .tbl .hm{display:none}
  .kv{grid-template-columns:110px 1fr}
  .cal .d{min-height:62px;padding:4px}.cal .ev{font-size:10px;padding:1px 3px}
  .vote{grid-template-columns:repeat(3,1fr)}.vote select{grid-column:1/-1}
}
@media (max-width:520px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:21px}.modal-bg{padding:0}.modal{border-radius:0;max-height:100vh;min-height:100vh}}
.daynav{display:flex;gap:6px;margin-top:10px}.daynav .btn{min-width:34px}
.okb{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}.okb.on{background:var(--ok);border-color:var(--ok);color:#fff}.okb svg{width:14px;height:14px}
.tick{width:19px;height:19px;accent-color:var(--g);cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}.dot.red{background:var(--red)}.dot.gold{background:var(--gold)}.dot.g{background:var(--ok)}
/* ---------- ZackWehr: Feuerwehr-Thema ---------- */
:root{--g:#c8102e;--g2:#a10d25;--g3:#6e0a19;--gl:#fbe6e9;--gll:#fdf3f4;--gold:#f2b200;--goldl:#fff5d1;--red:#b3261e;--redl:#fde9e7;--blue:#2459a6;--bluel:#e7eef9;--ok:#1f8a4c;--okl:#e3f4e9;--ink:#1b1d22;--ink2:#373b44;--muted:#6a707c;--bg:#f3f3f5;--line:#e1e2e7;--line2:#eeeff2}
[data-theme=dark]{--g:#ff4d5e;--g2:#ff7682;--g3:#ffb0b7;--gl:#3a161b;--gll:#2a1215;--gold:#ffc83a;--goldl:#3a2f10;--red:#ff7a70;--redl:#3c1d1a;--ok:#4fd18a;--okl:#123222;--bg:#121316;--card:#1b1d22;--line:#2c2f36;--line2:#23252b;--ink:#eceef2;--ink2:#c9ccd4;--muted:#969ba6}
.side{background:#1b1d22;border-right:0;color:#e6e7ea}
.side .brand span,.side .nav h6,.side-foot{color:#9a9fab}.side-foot{border-top-color:#2c2f36}
.side .nav button{color:#d5d7dc}.side .nav button:hover{background:#262931}
.side .nav button.on{background:#c8102e;color:#fff}.side .nav button.on svg{color:#fff}
.side .nav .cnt{background:#30333b;color:#c9ccd4}.side .nav .cnt.warn{background:#f2b200;color:#2a1f00}.side .nav .cnt.bad{background:#fff;color:#c8102e}
.side .nav button.on .cnt{background:rgba(255,255,255,.25);color:#fff}
.side .iconbtn{background:#262931;border-color:#30333b;color:#d5d7dc}
.side .brand{border-bottom:4px solid #c8102e;background:repeating-linear-gradient(-45deg,transparent 0 0)}

/* ---------- Speicher (IndexedDB, Notfall localStorage) ---------- */
const store = (() => {
  let dbp = null, mode = 'idb';
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('kein IndexedDB'));
    let q; try { q = indexedDB.open(DB_NAME, 1); } catch (e) { return rej(e); }
    q.onupgradeneeded = () => q.result.createObjectStore('kv');
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); q.onblocked = () => rej(new Error('blockiert'));
  }));
  const tx = async (m, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('kv', m); const out = fn(t.objectStore('kv')); t.oncomplete = () => res(typeof out === 'function' ? out() : out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return {
    get mode() { return mode; },
    async init() { try { await open(); await tx('readonly', s => { s.count(); }); } catch (e) { mode = 'ls'; } return mode; },
    async get(k) { if (mode === 'ls') { try { const v = localStorage.getItem(LS_PREFIX + k); return v ? JSON.parse(v) : undefined; } catch (e) { return undefined; } } return tx('readonly', s => { let r; const q = s.get(k); q.onsuccess = () => { r = q.result; }; return () => r; }); },
    async set(k, v) { if (mode === 'ls') { localStorage.setItem(LS_PREFIX + k, JSON.stringify(v)); return; } return tx('readwrite', s => { s.put(v, k); }); },
    async del(k) { if (mode === 'ls') { localStorage.removeItem(LS_PREFIX + k); return; } return tx('readwrite', s => { s.delete(k); }); },
    async keys() { if (mode === 'ls') return Object.keys(localStorage).filter(k => k.startsWith(LS_PREFIX)).map(k => k.slice(LS_PREFIX.length)); return tx('readonly', s => { let r = []; const q = s.getAllKeys(); q.onsuccess = () => { r = q.result.map(String); }; return () => r; }); },
    async clear() { if (mode === 'ls') { Object.keys(localStorage).filter(k => k.startsWith(LS_PREFIX)).forEach(k => localStorage.removeItem(k)); return; } return tx('readwrite', s => { s.clear(); }); }
  };
})();

    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

function normalize(d) {
  const f = freshData();
  d = d && typeof d === 'object' ? d : f;
  d.meta = { ...f.meta, ...(d.meta || {}) }; d.meta.device = { ...f.meta.device, ...(d.meta.device || {}) };
  d.club = { ...f.club, ...(d.club || {}) };
  d.settings = { ...f.settings, ...(d.settings || {}) };
  COLLECTIONS.forEach(c => { if (!Array.isArray(d[c])) d[c] = []; });
  if (!d.quals.length) d.quals = DEFAULT_QUALS.map(n => ({ id: 'q_' + n.toLowerCase().replace(/[^a-z0-9äöü]+/g, '_'), name: n }));
  d.members.forEach(m => { m.quals = Array.isArray(m.quals) ? m.quals : []; m.honorsGot = Array.isArray(m.honorsGot) ? m.honorsGot : []; m.funcs = Array.isArray(m.funcs) ? m.funcs : []; if (!m.dept) m.dept = 'Einsatzabteilung'; });
  d.trainings.forEach(t => { t.present = Array.isArray(t.present) ? t.present : []; });
  d.missions.forEach(x => { ['crew', 'vehicles', 'pa', 'ma'].forEach(k => { x[k] = Array.isArray(x[k]) ? x[k] : []; }); });
  d.trainings.forEach(t => { t.excused = Array.isArray(t.excused) ? t.excused : []; });
  d.items.forEach(i => { i.checks = Array.isArray(i.checks) ? i.checks : []; });
  d.vehicles.forEach(v => { v.checks = Array.isArray(v.checks) ? v.checks : []; });
  return d;
}

function nextNo(col, prefix, field = 'no') {
  const y = new Date().getFullYear(), dev = data.meta.device.code ? data.meta.device.code + '-' : '';
  const re = new RegExp(`^${prefix}-${dev}${y}-(\\d+)$`);
  const max = data[col].reduce((m, x) => { const r = re.exec(x[field] || ''); return r ? Math.max(m, Number(r[1])) : m; }, 0);
  return `${prefix}-${dev}${y}-${String(max + 1).padStart(3, '0')}`;
}

const modalStack = [];
function openModal({ title, body, foot = '', wide = false, xwide = false, onOpen, onClose }) {

  bg.innerHTML = `<div class="modal${wide ? ' wide' : ''}${xwide ? ' xwide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(String(title).replace(/<[^>]+>/g, ''))}">
    <div class="modal-h"><h3>${title}</h3><button class="iconbtn" data-close aria-label="Schließen">${svg('x')}</button></div>
    <div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  document.body.appendChild(bg);
  const entry = { bg, onClose }; modalStack.push(entry);
  bg.addEventListener('mousedown', e => { if (e.target === bg) entry.down = true; });
  bg.addEventListener('click', e => { if (e.target === bg && entry.down) closeModal(); entry.down = false; if (e.target.closest('[data-close]')) closeModal(); });
  const first = bg.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea'); if (first && !('ontouchstart' in window)) setTimeout(() => first.focus(), 30);
  onOpen && onOpen(bg.querySelector('.modal'));
  return bg.querySelector('.modal');
}
function closeModal() { const e = modalStack.pop(); if (!e) return; e.bg.remove(); e.onClose && e.onClose(); }
const topModal = () => modalStack.length ? modalStack[modalStack.length - 1].bg.querySelector('.modal') : null;
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('.menu')) closeMenus(); else if (modalStack.length) closeModal(); } });

}

}

function fieldHTML(f, x) {
  if (f.type === 'sec') return `<div class="fsec">${esc(f.label)}</div>`;
  if (f.type === 'note') return `<div class="f full"><div class="note ${f.cls || ''}">${f.html}</div></div>`;
  const id = 'f_' + f.k, v = x[f.k] ?? (f.def ?? ''), req = f.req ? ' required' : '';
  const lab = `<label for="${id}">${esc(f.label)}${f.req ? ' <span class="req">*</span>' : ''}</label>`;
  const hint = f.hint ? `<span class="hint">${f.hint}</span>` : '';
  const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
  const cls = 'f' + (f.full ? ' full' : '');
  switch (f.type) {
    case 'textarea': return `<div class="${cls}">${lab}<textarea id="${id}" name="${f.k}"${ph}${req}>${esc(v)}</textarea>${hint}</div>`;
    case 'select': case 'member': {
      const opts = f.type === 'member' ? hunterOpts(f.filter) : optList(f.opts);
      return `<div class="${cls}">${lab}<select id="${id}" name="${f.k}"${req}>${opts.map(([ov, ol]) => `<option value="${esc(ov)}"${String(ov) === String(v) ? ' selected' : ''}>${esc(ol)}</option>`).join('')}</select>${hint}</div>`;
    }
    case 'check': return `<div class="f check${f.full ? ' full' : ''}"><input type="checkbox" id="${id}" name="${f.k}"${v ? ' checked' : ''}><label for="${id}">${esc(f.label)}</label>${hint}</div>`;

    case 'number': return `<div class="${cls}">${lab}<input id="${id}" name="${f.k}" type="number" step="${f.step || 'any'}" value="${esc(v)}"${ph}${req}>${hint}</div>`;
    case 'iban': return `<div class="${cls}">${lab}<input id="${id}" name="${f.k}" value="${esc(v ? fmtIban(v) : '')}" autocomplete="off" placeholder="DE00 0000 0000 0000 0000 00"${req}><span class="err hidden" data-err="${f.k}">Diese IBAN stimmt nicht – bitte prüfen.</span>${hint}</div>`;

    default: return `<div class="${cls}">${lab}<input id="${id}" name="${f.k}" type="${f.type || 'text'}" value="${esc(v)}"${ph}${req}${f.list ? ` list="dl_${f.k}"` : ''}>${f.list ? `<datalist id="dl_${f.k}">${optList(f.list).map(([o]) => `<option value="${esc(o)}">`).join('')}</datalist>` : ''}${hint}</div>`;

}
function readForm(form, fields) {
  const out = {};
  fields.forEach(f => {
    if (!f.k || ['sec', 'note'].includes(f.type)) return;
    if (f.type === 'check') { out[f.k] = !!form.elements[f.k]?.checked; return; }
    if (f.type === 'multi') { out[f.k] = $$(`[data-multi="${f.k}"] input:checked`, form).map(i => i.value); return; }
    const el = form.elements[f.k]; if (!el) return;
    let v = el.value.trim();
    if (f.type === 'money' || f.type === 'number') v = v === '' ? (f.type === 'money' ? 0 : '') : num(v);
    if (f.type === 'iban') v = cleanIban(v);
    out[f.k] = v;
  });
  return out;
}
/** Allgemeines Formular. def: { title, fields(x), wide, validate(x)->Fehlertext, save(x) } */
function openForm(def, item = {}) {
  const x = { ...item };
  const fields = def.fields(x);
  const m = openModal({
    title: esc(def.title), wide: def.wide !== false,
    body: `<form id="genForm" novalidate>${def.intro ? `<div class="note" style="margin-bottom:14px">${def.intro}</div>` : ''}<div class="fg${def.c3 ? ' c3' : ''}">${fields.map(f => fieldHTML(f, x)).join('')}</div></form>`,
    foot: `${def.del ? `<button class="btn btn-red l" id="fDel">${svg('trash')} Löschen</button>` : ''}<button class="btn" data-close>Abbrechen</button><button class="btn btn-p" id="fSave">${esc(def.saveLabel || 'Speichern')}</button>`
  });
  const form = $('#genForm', m);
  $$('[data-multi] label', form).forEach(l => l.addEventListener('click', e => { e.preventDefault(); const i = l.querySelector('input'); i.checked = !i.checked; l.classList.toggle('on', i.checked); }));
  $$('[data-photo-pick]', form).forEach(b => b.onclick = async () => { const file = await pickFile('image/*'); if (!file) return; const url = await shrinkImage(file, 800); const k = b.dataset.photoPick; form.elements[k].value = url; $(`[data-photo-prev="${k}"]`, form).innerHTML = `<img src="${url}" alt="">`; $(`[data-photo-del="${k}"]`, form).classList.remove('hidden'); });
  $$('[data-photo-del]', form).forEach(b => b.onclick = () => { const k = b.dataset.photoDel; form.elements[k].value = ''; $(`[data-photo-prev="${k}"]`, form).innerHTML = svg('camera'); b.classList.add('hidden'); });
  $$('input[name]', form).forEach(i => { const f = fields.find(f => f.k === i.name); if (f?.type === 'iban') i.addEventListener('blur', () => { const v = cleanIban(i.value); i.value = v ? fmtIban(v) : ''; $(`[data-err="${f.k}"]`, form).classList.toggle('hidden', !v || ibanOk(v)); }); if (f?.type === 'money') i.addEventListener('blur', () => { if (i.value.trim()) i.value = fmtNum(num(i.value), 2); }); });
  def.onOpen && def.onOpen(form, m);
  form.addEventListener('submit', e => { e.preventDefault(); $('#fSave', m).click(); });
  $('#fSave', m).onclick = async () => {
    const vals = readForm(form, fields);
    for (const f of fields) if (f.req && (vals[f.k] === '' || vals[f.k] == null)) { toast(`Bitte „${f.label}“ ausfüllen.`, { err: true }); form.elements[f.k]?.focus(); return; }
    for (const f of fields) if (f.type === 'iban' && vals[f.k] && !ibanOk(vals[f.k])) { toast('Die IBAN stimmt nicht. Bitte prüfen.', { err: true }); form.elements[f.k]?.focus(); return; }
    const merged = { ...x, ...vals };
    for (const f of fields) if (f.type === 'photo' && String(merged[f.k] || '').startsWith('data:')) { if (x[f.k]) await delPhoto(x[f.k]); merged[f.k] = await savePhoto(merged[f.k]); } else if (f.type === 'photo' && !merged[f.k] && x[f.k]) await delPhoto(x[f.k]);

/* Letztes Datum aus eigener Eintragung oder aus Übungen mit Anwesenheit */
function lastFromTrainings(m, field) {

  return data.trainings.filter(t => kinds.includes(t.kind) && t.present.includes(m.id) && t.date <= today()).map(t => t.date).sort().pop() || '';
}
function lastPAMission(m) { return data.missions.filter(x => (x.pa || []).includes(m.id) && x.date <= today()).map(x => x.date).sort().pop() || ''; }
const maxDate = (...a) => a.filter(Boolean).sort().pop() || '';
function g26Due(m) {
  if (m.g26Until) return m.g26Until;
  if (!m.g26) return '';
  const age = ageOn(m.birth, m.g26);
  return addDays(addMonths(m.g26, age !== null && age >= 50 ? 12 : 36), -1);
}
function agtInfo(m) {
  const w = Number(data.settings.warnDays) || 60;
  const brief = maxDate(m.agtBriefing, lastFromTrainings(m, 'agtBriefing'));
  const stress = maxDate(m.agtStress, lastFromTrainings(m, 'agtStress'));
  const drill = maxDate(m.agtDrill, lastFromTrainings(m, 'agtDrill')), paMis = lastPAMission(m), drillAny = maxDate(drill, paMis);
  const items = [
    { k: 'g26', label: 'Untersuchung G 26.3', last: m.g26, due: g26Due(m) },
    { k: 'brief', label: 'Unterweisung', last: brief, due: brief ? addDays(addMonths(brief, 12), -1) : '' },
    { k: 'stress', label: 'Belastungsübung', last: stress, due: stress ? addDays(addMonths(stress, 12), -1) : '' },
    { k: 'drill', label: 'Einsatzübung / PA-Einsatz', last: drillAny, due: drillAny ? addDays(addMonths(drillAny, 12), -1) : '', viaMission: paMis && paMis >= drill }
  ];
  items.forEach(i => { i.st = !i.due || i.due < today() ? 'red' : i.due <= addDays(today(), w) ? 'gold' : 'g'; });
  const st = items.some(i => i.st === 'red') ? 'red' : items.some(i => i.st === 'gold') ? 'gold' : 'g';
  return { m, items, st, next: items.map(i => i.due).filter(Boolean).sort()[0] || '' };
}
const agtList = () => data.members.filter(isAGT).map(agtInfo);

const honorSteps = () => String(data.settings.honors || '').split(/[,; ]+/).map(Number).filter(n => n > 0).sort((a, b) => a - b);
function honorsDue(days = 60, from = today()) {
  const out = [], until = addDays(from, days);

    if (m.birth) { const a = ageOn(m.birth, until); if (a && a % 10 === 0 && a >= 50) { const d = addMonths(m.birth, a * 12); if (d >= addDays(from, -7) && d <= until) out.push({ m, date: d, what: `${a}. Geburtstag`, kind: 'bday', n: a }); } }

/* ---------- Einsätze ---------- */
const missionMinutes = x => { if (!x.time || !x.timeEnd) return 0; const [h1, m1] = x.time.split(':').map(Number), [h2, m2] = x.timeEnd.split(':').map(Number); let d = (h2 * 60 + m2) - (h1 * 60 + m1); if (x.dateEnd && x.dateEnd > x.date) d += daysBetween(x.date, x.dateEnd) * 1440; else if (d < 0) d += 1440; return d; };
const fmtDur = min => !min ? '–' : `${Math.floor(min / 60)}:${pad2(min % 60)} h`;

  const next = data.trainings.filter(t => t.date >= today()).sort((a, b) => (a.date + (a.from || '')).localeCompare(b.date + (b.from || ''))).slice(0, 5);
  const todo = [
    ...data.vehicles.filter(v => !v.retired && v.status === 'Außer Dienst').map(v => [`${v.name} ist außer Dienst${v.statusNote ? ': ' + v.statusNote : ''}`, 'red', 'vehicles']),
    ...agt.filter(a => a.st !== 'g').map(a => { const bad = a.items.filter(i => i.st !== 'g'); return [`Atemschutz ${fullName(a.m)}: ${bad.map(i => `${i.label} ${!i.due ? 'fehlt' : (i.due < today() ? 'abgelaufen ' : 'bis ') + fmtDate(i.due)}`).join(', ')}`, a.st, 'agt']; }),
    ...vehiclesDue().flatMap(v => vehicleWarn(v).map(([w, d]) => [`${v.name}: ${w} ${!d ? 'noch nie eingetragen' : (d < today() ? 'überfällig seit ' : 'fällig ') + fmtDate(d)}`, !d || d < today() ? 'red' : 'gold', 'vehicles'])),
    ...itemsDue().map(i => [`${i.status === 'Mangel' ? 'Mangel' : 'Prüfung'}: ${i.name}${i.invNo ? ' (' + i.invNo + ')' : ''}${i.status === 'Mangel' ? '' : ' – fällig ' + (fmtDate(itemNext(i)) || 'jetzt')}`, i.status === 'Mangel' || !itemNext(i) || itemNext(i) < today() ? 'red' : 'gold', 'items']),
    ...data.tasks.filter(t => !t.done && t.due && t.due <= addDays(today(), 7)).map(t => [`Aufgabe: ${t.title} – bis ${fmtDate(t.due)}`, t.due < today() ? 'red' : '', 'tasks']),
    ...honorsDue(45).map(h => [`${h.kind === 'jub' ? 'Ehrung' : 'Geburtstag'}: ${fullName(h.m)} – ${h.what} am ${fmtDate(h.date)}`, 'blue', 'honors'])
  ];

function missionStats(y) {
  const all = data.missions.filter(m => yearOf(m.date) === y);
  const kinds = MISSION_KINDS.map(k => [k, all.filter(m => m.kind === k).length]).filter(x => x[1]).sort((a, b) => b[1] - a[1]);
  const months = MONTHS.map((n, i) => all.filter(m => parseD(m.date).getMonth() === i).length);
  const hrs = sum(all, m => missionMinutes(m) * m.crew.length) / 60;
  const per = crewMembers().map(m => ({ m, n: all.filter(x => x.crew.includes(m.id)).length, pa: all.filter(x => x.pa.includes(m.id)).length })).sort((a, b) => b.n - a.n);
  const day = all.filter(m => { const h = Number((m.time || '12').split(':')[0]); return h >= 6 && h < 18; }).length;
  const ts = data.trainings.filter(t => yearOf(t.date) === y && t.date <= today());
  const tHrs = sum(ts, t => trainMinutes(t) * t.present.length) / 60;
  return { all, kinds, months, hrs, per, day, night: all.length - day, ts, tHrs };
}
function statTab(y, all) {
  const s = missionStats(y), maxK = Math.max(1, ...s.kinds.map(k => k[1])), maxM = Math.max(1, ...s.months);
  return `<div class="grid g4" style="margin-bottom:16px">${kpi('Einsätze', fmtNum(all.length), `${s.day} am Tag · ${s.night} nachts`, 'flame')}${kpi('Einsatzstunden', fmtNum(Math.round(s.hrs)), 'Kräfte × Einsatzdauer', 'clock', 'red')}${kpi('Dienste', fmtNum(s.ts.length), `${fmtNum(Math.round(s.tHrs))} Ausbildungsstunden`, 'calendar', 'blue')}${kpi('Unter Atemschutz', fmtNum(sum(all, m => m.pa.length)), 'Trupp-Einsätze mit PA', 'mask', 'gold')}</div>
  <div class="grid g2"><div class="card pad"><div class="sec-t"><h3>Nach Einsatzart</h3></div>${s.kinds.length ? s.kinds.map(([k, n]) => `<div class="statbar"><span>${esc(k)}</span><div class="bar"><i style="width:${Math.round(n / maxK * 100)}%"></i></div><b>${n}</b></div>`).join('') : '<p class="muted">Keine Einsätze.</p>'}</div>
  <div class="card pad"><div class="sec-t"><h3>Nach Monat</h3></div>${MONTHS.map((mn, i) => `<div class="statbar"><span>${mn}</span><div class="bar gold"><i style="width:${Math.round(s.months[i] / maxM * 100)}%"></i></div><b>${s.months[i]}</b></div>`).join('')}</div></div>
  <div class="card pad" style="margin-top:16px"><div class="sec-t"><h3>Einsatzbeteiligung ${y}</h3></div>${s.per.length ? `<table class="tbl"><thead><tr><th>Name</th><th class="r">Einsätze</th><th class="r">davon unter PA</th><th class="r">Quote</th></tr></thead><tbody>${s.per.map(p => `<tr><td>${esc(fullName(p.m))}</td><td class="r">${p.n}</td><td class="r">${p.pa || ''}</td><td class="r">${all.length ? Math.round(p.n / all.length * 100) + ' %' : '–'}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Keine Mitglieder in der Einsatzabteilung.</p>'}</div>`;
}

const groupOf = t => t.group || 'Alle';
const invitees = t => data.members.filter(m => { const g = groupOf(t); return g === 'Alle' ? ['Einsatzabteilung'].includes(m.dept) : g === 'Atemschutzgeräteträger' ? isAGT(m) : m.dept === g; });
const TRAIN_GROUPS = ['Alle', 'Einsatzabteilung', 'Atemschutzgeräteträger', 'Jugendfeuerwehr', 'Kinderfeuerwehr', 'Altersabteilung'];

VIEWS.trainings = () => {
  const y = Number(viewState.y || new Date().getFullYear()), tab = viewState.tab || 'plan', q = viewState.q || '';
  const all = data.trainings.filter(t => yearOf(t.date) === y).sort((a, b) => (a.date + (a.from || '')).localeCompare(b.date + (b.from || '')));
  const future = all.filter(t => t.date >= today()), past = all.filter(t => t.date < today()).reverse();
  const card = t => { const p = t.date < today(); return `<div class="li" style="cursor:pointer" data-act="editTraining:${t.id}"><div class="dt${p ? ' past' : ''}"><b>${parseD(t.date).getDate()}</b><span>${MONTHS[parseD(t.date).getMonth()].slice(0, 3)}</span></div><div class="grow"><b>${esc(t.topic || t.kind)}</b><div class="small muted">${WD[(parseD(t.date).getDay() + 6) % 7]} ${esc(t.from || '')}${t.to ? '–' + esc(t.to) : ''} · ${esc(t.kind)}${groupOf(t) !== 'Alle' ? ' · ' + esc(groupOf(t)) : ''}${t.leader ? ' · Leitung ' + esc(memberLabel(t.leader)) : ''}</div></div>${p ? (t.present.length ? pill(`${t.present.length} da`, 'g') : `<button class="btn btn-sm btn-p" data-act="attend:${t.id}">${svg('check')} Anwesenheit</button>`) : `<button class="btn btn-sm" data-act="printAtt:${t.id}" title="Unterschriftenliste">${svg('print')}</button>`}</div>`; };
  return head('Dienstplan & Übungen', 'Übungsdienste, Atemschutz-Unterweisungen, Lehrgänge – mit Anwesenheit per Klick. Atemschutz-Termine laufen automatisch in die Ampel.', `${yearSel('trainings', y)}<button class="btn" data-act="printPlan:${y}">${svg('print')} Dienstplan</button><button class="btn" data-act="newSeries">${svg('calendar')} Serie planen</button><button class="btn btn-p" data-act="newTraining">${svg('plus')} Dienst</button>`) +
  `<div class="tabs">${[['plan', 'Termine'], ['att', 'Beteiligung ' + y]].map(([k, l]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>` +
  (tab === 'att' ? attTab(y, all) : `<div class="grid g2"><div class="card pad"><div class="sec-t"><h3>${svg('calendar')} Kommende Dienste</h3><span class="muted small">${future.length}</span></div>${future.length ? `<div class="list">${future.map(card).join('')}</div>` : emptyBox('Nichts geplant', 'Mit „Serie planen“ legst du z. B. jeden zweiten Mittwoch fürs ganze Jahr an.')}</div>
  <div class="card pad"><div class="sec-t"><h3>${svg('check')} Vergangene Dienste</h3>${searchBox(q, 'Thema …')}</div>${past.length ? `<div class="list">${past.filter(t => matchQ(q, t.topic, t.kind)).map(card).join('')}</div>` : emptyBox('Noch keine', '')}</div></div>`);
};
VIEWS.trainings.after = yearAfter;
function attTab(y, all) {
  const past = all.filter(t => t.date <= today());
  const rows = activeMembers().filter(m => ['Einsatzabteilung', 'Jugendfeuerwehr', 'Kinderfeuerwehr'].includes(m.dept)).map(m => { const inv = past.filter(t => invitees(t).some(x => x.id === m.id)), pr = past.filter(t => t.present.includes(m.id)), ex = past.filter(t => t.excused.includes(m.id)); return { m, inv: inv.length, pr: pr.length, ex: ex.length, min: sum(pr, trainMinutes), pc: inv.length ? Math.round(pr.length / inv.length * 100) : 0 }; }).sort((a, b) => b.min - a.min);
  const target = Number(data.settings.hoursTarget) || 0;
  return `<div class="card tbl-wrap">${rows.length ? `<table class="tbl"><thead><tr><th>Name</th><th class="hm">Abteilung</th><th class="r">Teilnahme</th><th class="r hm">Entschuldigt</th><th class="r">Stunden</th><th style="width:22%" class="hm">Quote</th></tr></thead><tbody>${rows.map(r => `<tr><td><b>${esc(fullName(r.m))}</b></td><td class="hm small">${esc(r.m.dept)}</td><td class="r">${r.pr} / ${r.inv}</td><td class="r hm">${r.ex || ''}</td><td class="r"><span class="${target && r.min / 60 < target ? 'warnc' : ''}">${fmtHours(r.min)}</span></td><td class="hm"><div class="bar ${r.pc < 50 ? 'red' : r.pc < 75 ? 'gold' : ''}"><i style="width:${r.pc}%"></i></div><span class="small muted">${r.pc} %</span></td></tr>`).join('')}</tbody></table>` : emptyBox('Keine Mitglieder', '')}</div>${target ? `<p class="small muted">Gelb: weniger als ${target} Ausbildungsstunden im Jahr (einstellbar unter Einstellungen → Regeln).</p>` : ''}`;
}
function trainingDef(t) {

    { k: 'date', label: 'Datum', type: 'date', req: true }, { k: 'kind', label: 'Art', type: 'select', opts: TRAIN_KINDS },

ACTS.newTraining = (kind = 'Übungsdienst') => openForm(trainingDef({ kind }), { id: pid(), date: today(), from: '19:00', to: '21:00', kind, group: kind.startsWith('Atemschutz') || kind.startsWith('Belastung') ? 'Atemschutzgeräteträger' : kind === 'Jugendfeuerwehr' ? 'Jugendfeuerwehr' : 'Alle', present: [], excused: [] });
ACTS.editTraining = id => { const t = byId('trainings', id); const m = openForm(trainingDef(t), t); $('.modal-f', m).insertAdjacentHTML('afterbegin', `<button class="btn l" data-act="attend:${t.id}">${svg('check')} Anwesenheit${t.present.length ? ` (${t.present.length})` : ''}</button><button class="btn l" data-act="printAtt:${t.id}">${svg('print')} Liste</button>`); };
ACTS.attend = id => {
  if (topModal()) closeModal();
  const t = byId('trainings', id), inv = invitees(t), extra = data.members.filter(m => m.dept !== 'Ausgetreten' && !inv.includes(m) && (t.present.includes(m.id) || t.excused.includes(m.id)));
  const people = [...inv, ...extra].sort((a, b) => sortName(a).localeCompare(sortName(b)));
  const st = new Map(people.map(m => [m.id, t.present.includes(m.id) ? 'on' : t.excused.includes(m.id) ? 'ex' : '']));
  const lab = s => s === 'on' ? 'da' : s === 'ex' ? 'entsch.' : '';
  const md = openModal({ title: `Anwesenheit – ${esc(t.topic || t.kind)}`, wide: true, body: `<p class="muted" style="margin-top:0">${fmtDateLong(t.date)} · Antippen: <b>da</b> → <b>entschuldigt</b> → nicht da.</p><div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn btn-sm" id="atAll">Alle da</button><button class="btn btn-sm" id="atNone">Alle löschen</button><span class="muted small" id="atCnt" style="margin-left:auto;align-self:center"></span></div><div class="attgrid" id="atG">${people.map(m => `<label data-id="${m.id}" class="${st.get(m.id)}">${avatar(m)}<span>${esc(fullName(m))}</span><small>${lab(st.get(m.id))}</small></label>`).join('')}</div>`, foot: `<button class="btn" data-close>Abbrechen</button><button class="btn btn-p" id="atOk">${svg('check')} Speichern</button>` });
  const cnt = () => { $('#atCnt', md).textContent = `${[...st.values()].filter(v => v === 'on').length} anwesend · ${[...st.values()].filter(v => v === 'ex').length} entschuldigt`; };
  const paint = l => { const s = st.get(l.dataset.id); l.className = s; l.querySelector('small').textContent = lab(s); };
  $$('#atG label', md).forEach(l => l.onclick = e => { e.preventDefault(); const s = st.get(l.dataset.id); st.set(l.dataset.id, s === '' ? 'on' : s === 'on' ? 'ex' : ''); paint(l); cnt(); });
  $('#atAll', md).onclick = () => { $$('#atG label', md).forEach(l => { st.set(l.dataset.id, 'on'); paint(l); }); cnt(); };
  $('#atNone', md).onclick = () => { $$('#atG label', md).forEach(l => { st.set(l.dataset.id, ''); paint(l); }); cnt(); };
  cnt();
  $('#atOk', md).onclick = () => { t.present = [...st].filter(([, v]) => v === 'on').map(([k]) => k); t.excused = [...st].filter(([, v]) => v === 'ex').map(([k]) => k); upsert('trainings', t); closeModal(); render(); toast(`${t.present.length} Anwesende gespeichert.`); };
};
ACTS.newSeries = () => openForm({ title: 'Dienste als Serie planen', intro: 'Legt viele Termine auf einmal an – z. B. jeden zweiten Mittwoch. Themen trägst du später einzeln ein.', fields: () => [
  { k: 'start', label: 'Erster Termin', type: 'date', req: true }, { k: 'until', label: 'Letzter möglicher Termin', type: 'date', req: true },

  { k: 'kind', label: 'Art', type: 'select', opts: TRAIN_KINDS }, { k: 'from', label: 'Beginn', type: 'time' }, { k: 'to', label: 'Ende', type: 'time' }, { k: 'group', label: 'Für wen', type: 'select', opts: TRAIN_GROUPS }, { k: 'topic', label: 'Thema (optional, für alle gleich)', full: true }
], validate: v => v.until < v.start ? 'Der letzte Termin liegt vor dem ersten.' : daysBetween(v.start, v.until) > 400 ? 'Bitte höchstens ein gutes Jahr auf einmal.' : '', save: v => { let d = v.start, n = 0; while (d <= v.until) { if (!data.trainings.some(t => t.date === d && t.kind === v.kind)) { data.trainings.push(touch({ id: pid(), date: d, kind: v.kind, from: v.from, to: v.to, group: v.group, topic: v.topic, present: [], excused: [] })); n++; } d = addDays(d, Number(v.every)); } save(); toast(`${n} Termine angelegt.`); } }, { start: today(), until: `${new Date().getFullYear()}-12-31`, every: '14', kind: 'Übungsdienst', from: '19:00', to: '21:00', group: 'Alle' });

function catTable(bs) {

  return `<div class="grid g2">${tb('in', 'Einnahmen')}${tb('out', 'Ausgaben')}</div>`;

async function snapshot() { await flushSave(); const photos = {}; for (const [k, v] of photoCache) photos[k] = v; return { app: APPNAME, version: VERSION, demo: IS_DEMO, created: new Date().toISOString(), data, photos }; }

async function readJsonFile() { const f = await pickFile('.json,application/json'); if (!f) return null; try { return JSON.parse(await f.text()); } catch (e) { toast('Die Datei ist keine ZackWehr-Sicherung.', { err: true }); return null; } }
ACTS.restore = async () => {
  const s = await readJsonFile(); if (!s) return; if (s.app !== APPNAME || !s.data) return toast('Das ist keine ZackWehr-Sicherung.', { err: true });
  if (!await confirmBox(`Sicherung vom ${fmtDate(s.created.slice(0, 10))} laden? Alle Daten auf diesem Gerät werden ersetzt.`, 'Laden', true)) return;
  await store.clear(); photoCache.clear(); for (const [k, v] of Object.entries(s.photos || {})) { await store.set(k, v); photoCache.set(k, v); }
  data = normalize(s.data); data.meta.setupDone = true; await flushSave(); applyTheme(); render(); toast('Sicherung geladen.');
};
ACTS.syncOut = async () => { if (!data.meta.device.code) { toast('Bitte zuerst Name und Kürzel für dieses Gerät eintragen und speichern.', { err: true }); return; } const s = await snapshot(); s.sync = true; s.device = data.meta.device; downloadFile(`zackwehr_abgleich_${data.meta.device.code}_${today()}.json`, JSON.stringify(s), 'application/json'); toast('Abgleich-Datei erstellt. Jetzt auf dem anderen Gerät einlesen.'); };
ACTS.syncIn = async () => {
  const s = await readJsonFile(); if (!s) return; if (s.app !== APPNAME || !s.data) return toast('Das ist keine ZackWehr-Datei.', { err: true });
  if (s.device?.code && s.device.code === data.meta.device.code) return toast('Diese Datei kommt von diesem Gerät selbst (gleiches Kürzel).', { err: true });
  const r = mergeData(data, normalize(s.data));
  for (const [k, v] of Object.entries(s.photos || {})) if (!photoCache.has(k)) { await store.set(k, v); photoCache.set(k, v); }
  save(); render(); toast(`Abgleich fertig: ${r.added} neu, ${r.updated} aktualisiert, ${r.removed} gelöscht.`, { ms: 6000 });
};
function mergeData(mine, theirs) {
  const res = { added: 0, updated: 0, removed: 0 }, delMine = mine.meta.deleted || [], delTheirs = theirs.meta.deleted || [];
  const isDel = (list, col, id) => list.some(d => d.col === col && d.id === String(id));
  COLLECTIONS.forEach(col => {
    const map = new Map(mine[col].map(x => [String(x.id), x]));
    theirs[col].forEach(x => { const id = String(x.id); if (isDel(delMine, col, id)) return; const cur = map.get(id); if (!cur) { mine[col].push(x); res.added++; } else if ((x.updatedAt || '') > (cur.updatedAt || '')) { Object.keys(cur).forEach(k => delete cur[k]); Object.assign(cur, x); res.updated++; } else if (col === 'charges') { const mp = mergePayments(cur.payments, x.payments); if (mp.length !== cur.payments.length) { cur.payments = mp; res.updated++; } } });
    const before = mine[col].length; mine[col] = mine[col].filter(x => !isDel(delTheirs, col, String(x.id))); res.removed += before - mine[col].length;
  });
  mine.meta.deleted = [...delMine, ...delTheirs.filter(d => !isDel(delMine, d.col, d.id))];
  if ((theirs.meta.updated || '') > (mine.meta.updated || '')) { mine.club = { ...mine.club, ...theirs.club }; mine.settings = { ...mine.settings, ...theirs.settings }; }
  return res;
}
function mergePayments(a = [], b = []) { const m = new Map(a.map(p => [p.id, p])); b.forEach(p => { if (!m.has(p.id)) m.set(p.id, p); }); return [...m.values()].sort((x, y) => x.date.localeCompare(y.date)); }
