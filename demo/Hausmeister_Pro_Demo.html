function submitForm(e) {
  e.preventDefault();
  const f = e.target, { type, item, link } = form;
  const missing = $$('[required]', f).filter(x => !x.value.trim() && !x.closest('.hidden'));
  if (missing.length) { missing[0].focus(); return formError(`Bitte ausfüllen: ${missing.map(x => x.closest('.field').querySelector('label').textContent.replace('*', '').trim()).join(', ')}`); }
  const badMail = $$('input[type=email]', f).find(x => x.value && !x.checkValidity());
  if (badMail) { badMail.focus(); return formError('Die E-Mail-Adresse ist ungültig.'); }

  const v = {};
  FORMS[type].forEach(fd => {
    if (['items','photos','moves'].includes(fd.type)) return;
    const el = f.elements[fd.k]; if (!el) return;
    if (fd.kinds && el.closest('.hidden')) return;
    v[fd.k] = fd.type === 'money' ? num(el.value) : el.value.trim();
  });
  if (type === 'times' && item && lockedTime(item)) return formError(`Diese Zeit steht schon auf der Rechnung ${lockedTime(item).number} und kann nicht mehr geändert werden.`);
  if (type === 'times') {
    v.orderId = v.orderId ? Number(v.orderId) : null; v.pause = Math.max(0, Math.round(num(v.pause)));
    if (toMin(v.end) === toMin(v.start)) return formError('Beginn und Ende sind gleich.');
    if (timeMin({ ...v, running: false }) <= 0) return formError('Die Pause ist länger als die Arbeitszeit.');
    if (v.date > today()) return formError('Zeiten können nicht für die Zukunft eingetragen werden.');
    if (item) { item.running = false; delete item.startTs; }
  }
  if (type === 'logs') {
    if (v.date > today()) return formError('Ein Protokoll beschreibt Erledigtes – das Datum liegt in der Zukunft.');
    if (v.kind === 'Winterdienst' && v.wMaterial === 'ohne Streumittel') v.wAmount = 0;
    if (v.kind === 'Prüfung' && v.pNext && v.pNext <= v.date) return formError('Die nächste Prüfung muss nach dem Prüfdatum liegen.');
  }
  if (FORMS[type].some(x => x.type === 'items')) v.items = form.items.filter(i => String(i.desc).trim() || num(i.price)).map(i => ({ ...i, desc: String(i.desc).trim(), qty: num(i.qty), price: num(i.price) }));
  const photoPut = {}, photoDel = [];
  if (type === 'orders' || type === 'logs' || type === 'properties') {
    if (type === 'properties') v.photoCaps = form.photos.map((_, i) => String(form.caps[i] || '').trim());
    v.photos = form.photos.map(ph => { if (!String(ph).startsWith('data:')) return ph; const id = newPhotoId(); photoPut[PHOTO_PREFIX + id] = ph; photoCache.set(id, ph); return id; });
    (item?.photos || []).forEach(ph => { if (!v.photos.includes(ph) && !String(ph).startsWith('data:')) { photoDel.push(PHOTO_PREFIX + ph); photoCache.delete(ph); } });
  }

  // Plausibilität
  if (v.number) {
    const dup = data[type].find(x => x.number === v.number && x !== item);
    if (dup) return formError(`Die Nummer ${v.number} ist bereits vergeben.`);
  }
  if (type === 'articles') {
    const dup = data.articles.find(x => x.articleNo === v.articleNo && x !== item);
    if (dup) return formError(`Die Artikelnummer ${v.articleNo} ist bereits vergeben.`);
  }
  if (type === 'contracts' && item && data.invoices.some(i => i.contractId === item.id && i.status !== 'Storniert') && (v.start !== item.start || v.interval !== item.interval))
    return formError('Beginn und Rhythmus lassen sich nach der ersten Rechnung nicht mehr ändern, sonst würden Zeiträume doppelt berechnet. Bitte den Vertrag beenden (Ende eintragen) und einen neuen anlegen.');
  if (['customers','team','properties','services'].includes(type)) {
    const dup = data[type].find(x => sameName(x.name, v.name) && x !== item);
    if (dup) return formError(`„${v.name}“ gibt es bereits.`);
  }
  if (type === 'invoices') {
    if (item && item.status !== 'Entwurf') return formError('Diese Rechnung ist bereits gestellt und kann nicht mehr geändert werden.');
    if (v.status !== 'Entwurf' && !v.items.length) return formError('Eine gestellte Rechnung braucht mindestens eine Position. Speichere sie sonst als Entwurf.');
    if (v.dueDate < v.date) return formError('„Zahlbar bis“ liegt vor dem Rechnungsdatum.');
    if (v.status === 'Offen') {
      if (!companyReady()) return formError('Bitte zuerst unter „Einstellungen“ Firmenname und IBAN eintragen – oder die Rechnung als Entwurf speichern.');
      const last = lastIssuedDate();
      if (last && v.date < last) return formError(`Das Rechnungsdatum liegt vor der letzten gestellten Rechnung (${fmtDate(last)}). Rechnungsnummern müssen zeitlich fortlaufend sein.`);
      if (v.date > today()) return formError('Das Rechnungsdatum liegt in der Zukunft. Gestellt wird mit dem heutigen oder einem früheren Datum – sonst als Entwurf speichern.');
    }
    v.number = item?.number || '';
  }
  if (type === 'offers' && v.validUntil < v.date) return formError('„Gültig bis“ liegt vor dem Angebotsdatum.');
  if (type === 'contracts') {
    v.active = v.active !== '0';
    if (!v.items.length) return formError('Bitte mindestens eine Leistung eintragen – sonst gibt es nichts abzurechnen.');
    if (v.end && v.end < v.start) return formError('Das Ende liegt vor dem Beginn.');
  }
  if (['offers','invoices'].includes(type)) v.vatRate = form.rate;

  // Kunde automatisch anlegen
  if (v.customer && type !== 'customers' && !customerOf(v.customer)) {
    data.customers.push({ id: nextId(), name: v.customer, contact: '', street: '', zip: '', city: '', phone: '', email: '', notes: '' });
    toast(`Neuer Kunde „${v.customer}“ angelegt – Anschrift bitte ergänzen.`);
  } else if (v.customer) v.customer = customerOf(v.customer)?.name || v.customer;

  // Umbenennungen konsistent nachziehen
  if (item && v.name && item.name !== v.name) {
    const map = { customers: [['orders','offers','invoices','properties','contracts'], 'customer'], properties: [['orders','offers','invoices','tasks','contracts','logs'], 'property'], team: [['orders','tasks'], 'assignee'] }[type];
    if (type === 'team') { data.times.forEach(z => { if (sameName(z.member, item.name)) z.member = v.name; }); data.logs.forEach(z => { if (sameName(z.by, item.name)) z.by = v.name; }); }
    if (map) map[0].forEach(col => data[col].forEach(x => { if (sameName(x[map[1]], item.name)) x[map[1]] = v.name; }));
  }

  const prevStock = type === 'articles' && item ? num(item.stock) : null;
  const prevLog = type === 'logs' && item ? { pNext: item.pNext, pWhat: item.pWhat, property: item.property } : null;
  let rec;
  if (item) { Object.assign(item, v); rec = item; }
  else {
    rec = { id: nextId(), ...v };
    if (type === 'tasks') rec.done = false;
    if (type === 'invoices') { rec.booked = {}; rec.reminders = 0; rec.payments = []; rec.dunning = []; rec.storno = null; if (form.replaces) rec.replaces = form.replaces; }
    if (type === 'articles') rec.moves = num(v.stock) ? [{ date: today(), qty: num(v.stock), note: 'Anfangsbestand' }] : [];
    data[type].push(rec);
  }

  // Verknüpfungen aus Workflow
  if (link) {
    const src = byId(link.type, link.id);
    if (src) {
      if (type === 'invoices') { src.invoiceId = rec.id; rec[link.type === 'orders' ? 'orderId' : 'offerId'] = src.id; if (link.type === 'orders') { src.status = 'Erledigt'; if (src.offerId) rec.offerId = src.offerId; } if (link.type === 'offers') src.status = 'Angenommen'; }
      if (type === 'orders' && link.type === 'offers') { src.orderId = rec.id; src.status = 'Angenommen'; rec.offerId = src.id; }
    }
  }
  if (type === 'logs' && rec.kind === 'Prüfung' && rec.pNext) {
    const title = `${rec.pWhat || 'Prüfung'} prüfen`;
    const old = prevLog && prevLog.pNext && data.tasks.find(x => !x.done && x.kind === 'Prüfung' && sameName(x.property, prevLog.property) && sameName(x.title, `${prevLog.pWhat || 'Prüfung'} prüfen`) && x.date === prevLog.pNext);
    if (old && (old.date !== rec.pNext || old.title !== title || !sameName(old.property, rec.property))) { old.date = rec.pNext; old.title = title; old.property = rec.property; toast(`Aufgabe „${title}“ auf ${fmtDate(rec.pNext)} verschoben.`); }
    else if (!old && !data.tasks.some(x => !x.done && sameName(x.property, rec.property) && sameName(x.title, title) && x.date === rec.pNext)) {
      data.tasks.push({ id: nextId(), title, date: rec.pNext, kind: 'Prüfung', repeat: 'Einmalig', done: false, assignee: rec.by || '', property: rec.property, notes: `Angelegt aus Prüfprotokoll vom ${fmtDate(rec.date)}` });
      toast(`Aufgabe „${title}“ für ${fmtDate(rec.pNext)} angelegt.`);
    }
  }
  if (type === 'orders' && form.fromLog && byId('logs', form.fromLog)) byId('logs', form.fromLog).orderId = rec.id;
  // Zeiten des Auftrags an die neue Rechnung hängen
  if (type === 'invoices' && link && link.type === 'orders') data.times.filter(x => x.orderId === link.id && !x.running && !timeBilled(x)).forEach(x => { x.invoiceId = rec.id; });
  // Rechnung stellen: Nummer vergeben, Zahlungen übertragen, Lager buchen
  let issuedMsg = '';
  if (type === 'invoices' && rec.status === 'Offen' && !rec.number) issuedMsg = onIssue(rec);
  if (type === 'invoices') { const neg = syncStock(rec); if (neg.length) toast(`Achtung: Bestand jetzt negativ bei ${neg.join(', ')}.`, { error: true, ms: 6000 }); }
  if (prevStock !== null && prevStock !== num(rec.stock)) { /* manuelle Bestandsänderung protokollieren */
    rec.moves = [{ date: today(), qty: round2(num(rec.stock) - prevStock), note: 'Korrektur im Formular' }, ...(rec.moves || [])];
  }

  if (Object.keys(photoPut).length || photoDel.length) { data.backup.changes = num(data.backup.changes) + 1; persist({ put: photoPut, del: photoDel }); }
  else if (!save()) return;
  closeModal();
  toast(issuedMsg || (item ? 'Änderungen gespeichert.' : `${SINGULAR[type]} angelegt.`));
  render();
}

/* Lagerbestand an den Zustand einer Rechnung angleichen */
function syncStock(inv, removing = false) {
  const want = {};
  if (!removing && ['Offen','Bezahlt'].includes(inv.status)) (inv.items || []).forEach(i => { if (i.articleId) want[i.articleId] = round2((want[i.articleId] || 0) + num(i.qty)); });
  const had = inv.booked || {}, neg = [];
  new Set([...Object.keys(want), ...Object.keys(had)]).forEach(id => {
    const delta = round2((want[id] || 0) - (had[id] || 0)); if (!delta) return;
    const a = byId('articles', id); if (!a) return;
    a.stock = round2(num(a.stock) - delta);
    (a.moves ||= []).unshift({ date: today(), qty: -delta, note: `${delta > 0 ? 'Rechnung' : 'Rückbuchung'} ${inv.number}` });
    if (a.stock < 0) neg.push(a.name);
  });
  inv.booked = want;
  return neg;
}

/* =========================================================
   Aktionen
   ========================================================= */
function handleAct(spec) {
  const [k, type, id] = spec.split(':');
  const x = byId(type, id);
  const t = today(), c = data.company;
  const done = (msg) => { if (save()) { if (msg) toast(msg); render(); } };

  if (k === 'timeStart') return startTimer(Number(id) || null);
  if (k === 'timeStop') return stopTimer(id);
  if (k === 'edit') return openForm(type, x, { edit: true });
  if (k === 'delete') return deleteRecord(type, x);
  if (!x) return;

  if (k === 'advance') {
    const prev = x.status;
    x.status = x.status === 'Offen' ? 'In Arbeit' : 'Erledigt';
    if (x.status === 'Erledigt' && !x.date) x.date = t;
    save(); render();
    return toast(x.status === 'Erledigt' ? `${x.title} ist erledigt.` : `${x.title} ist in Arbeit.`, {
      action: x.status === 'Erledigt' ? ['Rechnung erstellen', () => handleAct(`invoiceFrom:orders:${x.id}`)] : ['Rückgängig', () => { x.status = prev; done(); }]
    });
  }
  if (k === 'invoiceFrom') {
    const existing = type === 'offers' ? offerInvoice(x) : liveInvoice(x.invoiceId);
    if (existing) { toast(`Dafür gibt es schon die Rechnung ${existing.number}.`); return openForm('invoices', existing, { edit: true }); }
    let items = clone(x.items), timeNote = '';
    if (type === 'orders') {
      const tt = orderTimes(x.id).filter(z => !z.running && !timeBilled(z)), min = tt.reduce((s, z) => s + timeMin(z), 0);
      if (min > 0) {
        const qty = Math.ceil(min / 15) / 4, isWork = i => i.unit === 'Std.' && /^arbeitszeit/i.test(i.desc);
        const fixed = items.filter(i => !isWork(i));
        if (!items.length || items.some(isWork)) {
          const work = items.find(isWork);
          items = items.filter(i => !isWork(i));
          items.unshift({ desc: `Arbeitszeit lt. Zeiterfassung (${[...new Set(tt.map(z => fmtDate(z.date)))].join(', ')})`, qty, unit: 'Std.', price: work ? num(work.price) : num(c.hourlyRate) });
          timeNote = ` Erfasste Arbeitszeit: ${fmtH(min)} → ${fmtNum(qty)} Std. (auf Viertelstunden aufgerundet) – ersetzt die geplante Arbeitszeit.`;
        } else timeNote = ` Erfasste Arbeitszeit: ${fmtH(min)} – nicht übernommen, weil der Auftrag feste Preise hat (${fixed.map(i => i.desc.split('\n')[0]).slice(0, 2).join(', ')}). Bei Bedarf mit „+ Arbeitszeit“ ergänzen.`;
      }
      if (orderTimes(x.id).some(z => z.running)) timeNote += ' Achtung: Für diesen Auftrag läuft noch eine Zeit.';
    }
    if (type === 'orders' && !items.length && !confirm('Dieser Auftrag hat noch keine Positionen. Trotzdem eine Rechnung beginnen?')) return;
    return openForm('invoices', {
      customer: x.customer, property: x.property, date: t,
      serviceDate: type === 'orders' && x.date ? fmtDate(x.date) : '',
      items,
      notes: type === 'orders' ? `Für den Auftrag ${x.number} („${x.title}“) berechnen wir Ihnen:` : `Gemäß unserem Angebot ${x.number} berechnen wir Ihnen:`
    }, { link: { type, id: x.id }, note: `Übernommen aus ${type === 'orders' ? 'Auftrag' : 'Angebot'} ${x.number}. Nach dem Speichern sind beide verknüpft.${timeNote}` });
  }
  if (k === 'orderFrom') {
    const oi = offerInvoice(x); if (oi) return toast(`Zu diesem Angebot gibt es schon die Rechnung ${invNo(oi)}.`, { error: true });
    if (x.orderId && byId('orders', x.orderId)) return toast(`Zu diesem Angebot gibt es schon den Auftrag ${byId('orders', x.orderId).number}.`, { error: true });
    return openForm('orders', { title: firstLine(x.notes) || `Auftrag aus ${x.number}`, customer: x.customer, property: x.property, items: clone(x.items), notes: x.notes, status: 'Offen' },
      { link: { type: 'offers', id: x.id }, note: `Übernommen aus Angebot ${x.number}. Das Angebot wird als angenommen markiert.` });
  }
  if (k.startsWith('status-')) { x.status = k.slice(7); return done(`${x.number}: ${x.status}.`); }
  if (k === 'print') return printDoc(type, x);
  if (k === 'printJob') return printJob(x);
  if (k === 'issue') {
    if (!x.items.length) return toast('Füge zuerst Positionen hinzu.', { error: true });
    if (x.status !== 'Entwurf') return;
    if (needCompany()) return;
    if (!confirm('Rechnung jetzt stellen? Sie bekommt eine feste Nummer und kann danach nicht mehr geändert werden.')) return;
    const last = lastIssuedDate();
    if (!x.date || x.date !== t) { x.date = t; x.dueDate = addDays(t, c.paymentDays); }
    x.vatRate = currentRate(); x.status = 'Offen';
    const msg = onIssue(x); syncStock(x); save(); render(); toast(msg);
    return printDoc('invoices', x);
  }
  if (k === 'pay') return openPayModal(x);
  if (k === 'storno' || k === 'stornoFix') return stornoInvoice(x, k === 'stornoFix');
  if (k === 'printStorno') return printStorno(x);
  if (k === 'remind') return openDunModal(x);
  if (k === 'duplicate') {
    const copy = clone(x); delete copy.id; ['invoiceId','orderId','offerId','booked','paidDate','reminders','lastReminder','payments','storno','replaces','dunning','contractId','period','addr'].forEach(p => delete copy[p]);
    copy.number = ''; if (type === 'orders') { copy.status = 'Offen'; copy.date = ''; copy.photos = []; }
    if (type !== 'orders') { copy.status = 'Entwurf'; copy.date = t; delete copy.validUntil; delete copy.dueDate; }
    return openForm(type, copy);
  }
  if (k === 'file') return customerFile(x);
  if (k === 'newOrderFor') return openForm('orders', { customer: x.name });
  if (k === 'newOfferFor') return openForm('offers', { customer: x.name });
  if (k === 'newPropertyFor') return openForm('properties', { customer: x.name, zip: x.zip, city: x.city });
  if (k === 'newOrderAt') return openForm('orders', { customer: x.customer, property: x.name });
  if (k === 'stockIn' || k === 'stockOut') return stockForm(x, k === 'stockIn' ? 1 : -1);
  if (k === 'logsFor') return go('logs', { search: x.name });
  if (k === 'photos') return showPhotos(x.photos || [], x.photoCaps || [], 0);
  if (k === 'notice') return openNotice(x.name);
  if (k === 'msgTo') { newDraft('all', { recipients: recipientsFor('all').filter(r => r.key === 'c' + x.id) }); return go('messages'); }
  if (k === 'orderFromLog') {
    return openForm('orders', { title: `Mangel beheben: ${x.pWhat || 'Prüfung'}`, customer: propertyOf(x.property)?.customer || '', property: x.property, date: '', priority: 'Hoch', notes: `Aus Prüfprotokoll vom ${fmtDate(x.date)}:\n${x.pDefects || ''}` }, { note: 'Nach dem Speichern ist der Auftrag mit dem Protokoll verknüpft.', fromLog: x.id });
  }
}

function deleteRecord(type, x) {
  if (!x) return;
  const label = x.number || x.name || x.title;
  let msg = `„${label}“ wirklich löschen?`;
  if (type === 'invoices' && x.status !== 'Entwurf') return toast(`Rechnung ${x.number} ist gestellt und muss aufbewahrt werden. Bitte stornieren statt löschen.`, { error: true, ms: 6000 });
  if (type === 'invoices') msg = 'Diesen Rechnungsentwurf löschen?';
  if (type === 'times' && lockedTime(x)) return toast(`Diese Zeit steht schon auf der Rechnung ${lockedTime(x).number} und muss erhalten bleiben.`, { error: true, ms: 6000 });
  if (type === 'customers') {
    const n = ['orders','offers','invoices','properties','contracts'].reduce((s, k) => s + data[k].filter(r => sameName(r.customer, x.name)).length, 0);
    if (n) msg = `Zu „${x.name}“ gibt es noch ${n} Aufträge, Angebote, Rechnungen oder Objekte. Diese bleiben erhalten, verlieren aber die Kundenanschrift. Trotzdem löschen?`;
  }
  if (type === 'customers' && data.contracts.some(ct => ct.active && sameName(ct.customer, x.name))) return toast(`Zu „${x.name}“ gibt es aktive Verträge. Bitte die Verträge zuerst beenden.`, { error: true, ms: 6000 });
  if (type === 'properties') {
    const nc = data.contracts.filter(ct => ct.active && sameName(ct.property, x.name)).length, nl = data.logs.filter(l => sameName(l.property, x.name)).length;
    if (nc || nl) msg = `Zu „${x.name}“ gibt es ${[nc ? plural(nc, 'aktiven Vertrag', 'aktive Verträge') : '', nl ? plural(nl, 'Protokoll', 'Protokolle') : ''].filter(Boolean).join(' und ')}. Sie bleiben erhalten (Nachweise weiter druckbar). Objekt trotzdem löschen?`;
  }
  if (type === 'customers' && data.invoices.some(i => sameName(i.customer, x.name) && i.status !== 'Entwurf')) return toast(`Zu „${x.name}“ gibt es gestellte Rechnungen – der Kunde bleibt deshalb in der Kartei.`, { error: true, ms: 6000 });
  if (type === 'articles' && data.invoices.some(i => i.items.some(it => it.articleId === x.id) && i.status !== 'Storniert')) msg = `„${x.name}“ steht auf Rechnungen. Die Rechnungen bleiben unverändert. Trotzdem löschen?`;
  if (!confirm(msg)) return;
  if (type === 'invoices') {
    syncStock(x, true);
    data.orders.forEach(o => { if (o.invoiceId === x.id) delete o.invoiceId; });
    data.offers.forEach(o => { if (o.invoiceId === x.id) delete o.invoiceId; });
  }
  if (type === 'orders') {
    const tt = orderTimes(x.id);
    if (tt.length && !confirm(`Zu diesem Auftrag gibt es ${plural(tt.length, 'Zeiteintrag', 'Zeiteinträge')}. Sie bleiben als „ohne Auftrag“ erhalten. Weiter?`)) return;
    tt.forEach(z => { z.orderId = null; });
    data.logs.forEach(l => { if (l.orderId === x.id) delete l.orderId; });
    data.offers.forEach(o => { if (o.orderId === x.id) delete o.orderId; });
    data.invoices.forEach(i => { if (i.orderId === x.id) delete i.orderId; });
  }
  if (type === 'offers') {
    data.orders.forEach(o => { if (o.offerId === x.id) delete o.offerId; });
    data.invoices.forEach(i => { if (i.offerId === x.id) delete i.offerId; });
  }
  data[type] = data[type].filter(r => r !== x);
  if (['orders', 'logs', 'properties'].includes(type) && (x.photos || []).length) {
    const del = x.photos.filter(ph => !String(ph).startsWith('data:')); del.forEach(ph => photoCache.delete(ph));
    data.backup.changes = num(data.backup.changes) + 1; persist({ del: del.map(ph => PHOTO_PREFIX + ph) });
    toast(`${SINGULAR[type]} gelöscht.`); return render();
  }
  if (save()) { toast(`${SINGULAR[type]} gelöscht.`); render(); }
}

function toggleTask(id, checked) {
  const x = byId('tasks', id); if (!x) return;
  if (checked && x.repeat && x.repeat !== 'Einmalig') {
    const prevDate = x.date, prevLast = x.lastDone;
    x.lastDone = today();
    let n = nextOccurrence(x.date || today(), x.repeat);
    while (n <= today()) n = nextOccurrence(n, x.repeat);
    x.date = n; x.done = false;
    save(); render();
    return toast(`Erledigt. Nächste Fälligkeit: ${fmtDate(n)}.`, { action: ['Rückgängig', () => { x.date = prevDate; x.lastDone = prevLast; save(); render(); }] });
  }
  x.done = checked; if (checked) x.lastDone = today();
  save(); render();
}

function stockForm(a, dir) {
  openModal({
    title: `${dir > 0 ? 'Zugang' : 'Entnahme'} buchen`,
    body: `<form id="stockF"><div class="modal-body"><p style="margin-top:0"><b>${esc(a.name)}</b><br><span class="muted">Aktueller Bestand: ${fmtNum(a.stock)} ${esc(a.unit)}</span></p>
      <div class="form-grid"><div class="field"><label for="sq">Menge (${esc(a.unit)}) <span class="req">*</span></label><input id="sq" name="qty" inputmode="decimal" required value="${dir > 0 ? Math.max(1, round2(num(a.minStock) * 2 - num(a.stock))) : 1}"></div>
      <div class="field"><label for="sn">Vermerk</label><input id="sn" name="note" placeholder="${dir > 0 ? 'z. B. Lieferung Raiffeisen' : 'z. B. Objekt Hauptstraße'}"></div></div></div>
      <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Abbrechen</button><button class="btn btn-primary">Buchen</button></div></form>`,
    onMount: root => { $('#stockF', root).onsubmit = e => {
      e.preventDefault();

}

function customerFile(c) {

function printHTML(title, body) {
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(f);
  const d = f.contentDocument;
  d.open(); d.write(`<!doctype html><html lang="de"><head><meta charset="utf-8"><title>${esc(title)}</title><style>${PRINT_CSS}</style></head><body><table class="pl"><tbody><tr><td>${body}</td></tr></tbody><tfoot><tr><td><div class="pl-space"></div></td></tr></tfoot></table></body></html>`); d.close();
  const fire = () => {
    f.contentWindow.onafterprint = () => setTimeout(() => f.remove(), 200);
    f.contentWindow.focus(); f.contentWindow.print();
    setTimeout(() => f.isConnected && f.remove(), 60000);
  };
  const imgs = [...d.images];
  Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))).then(() => setTimeout(fire, 60));
}

const SYNC_COLS = COLLECTIONS;

let sync = emptySync(), device = {}, syncPrev = null, syncSkipOnce = false, pendingSync = null;
const companyKey = () => { const { lastBackup, ...rest } = data.company; return JSON.stringify(rest); };
function syncIndex() {

function stampChanges() {
  if (!data) return;
  const idx = syncIndex();
  if (!syncPrev || syncSkipOnce) { syncPrev = idx; syncSkipOnce = false; return; }
  const now = Date.now();
  SYNC_COLS.forEach(c => {
    const before = syncPrev[c] || {}, after = idx[c];
    Object.keys(after).forEach(id => {
      if (before[id] === after[id]) return;
      sync.stamps[`${c}:${id}`] = now; delete sync.tomb[`${c}:${id}`];
      if (c === 'invoices' && before[id]) {
        const keep = new Set((JSON.parse(after[id]).payments || []).map(x => x.id));
        (JSON.parse(before[id]).payments || []).forEach(x => { if (!keep.has(x.id)) sync.tomb['pay:' + x.id] = now; });
      }
    });
    Object.keys(before).forEach(id => { if (!(id in after)) { sync.tomb[`${c}:${id}`] = now; delete sync.stamps[`${c}:${id}`]; } });
  });
  if (syncPrev.company !== idx.company) sync.companyTs = now;
  syncPrev = idx;
}
function resetSyncState() { sync = emptySync(); syncSkipOnce = true; }
function mergeSync(L, R) {
  const stamps = { ...L.sync.stamps }, tomb = { ...L.sync.tomb };
  Object.entries(R.sync.tomb || {}).forEach(([k, t]) => { if (!tomb[k] || t > tomb[k]) tomb[k] = t; });
  const out = {}, stats = { added: 0, updated: 0, deleted: 0, company: false };
  SYNC_COLS.forEach(c => {
    const lm = new Map((L.data[c] || []).map(r => [String(r.id), r])), rm = new Map((R.data[c] || []).map(r => [String(r.id), r]));
    const list = [];

      const key = `${c}:${id}`, lr = lm.get(id), rr = rm.get(id), ls = L.sync.stamps[key] || 0, rs = (R.sync.stamps || {})[key] || 0;
      const best = Math.max(lr ? ls : -1, rr ? rs : -1), t = tomb[key] || 0;
      if (t > 0 && t >= best) { delete stamps[key]; if (lr) stats.deleted++; return; }
      delete tomb[key];
      let rec = lr, st = ls;
      if (rr && (!lr || rs > ls)) { rec = rr; st = rs; if (!lr) stats.added++; else if (JSON.stringify(lr) !== JSON.stringify(rr)) stats.updated++; }
      if (c === 'invoices' && lr && rr) {
        const map = new Map();
        [...(lr.payments || []), ...(rr.payments || [])].forEach(x => { if (!tomb['pay:' + x.id] && !map.has(x.id)) map.set(x.id, x); });
        const payments = [...map.values()].sort((a, b) => String(a.date).localeCompare(String(b.date)));

        if (inv) rec = { ...rec, invoiceId: inv.id };

    });

  if ((R.sync.companyTs || 0) > companyTs) { company = { ...R.data.company, lastBackup: L.data.company.lastBackup }; companyTs = R.sync.companyTs; stats.company = true; }

}

/* =========================================================

const LOG_KINDS = ['Winterdienst', 'Prüfung', 'Zählerstand', 'Kontrollgang', 'Sonstiges'];
const isWinter = () => [10, 11, 0, 1, 2].includes(new Date().getMonth());
function logSummary(l) {

  if (l.kind === 'Prüfung') return `${l.pWhat || 'Prüfung'}: ${l.pResult || '–'}${l.pDefects ? ' – ' + l.pDefects : ''}`;
  if (l.kind === 'Zählerstand') { const prev = prevReading(l); return `${l.mType || 'Zähler'}${l.mNo ? ' Nr. ' + l.mNo : ''}: ${fmtNum(l.mValue)}${prev ? ` (Verbrauch seit ${fmtDate(prev.date)}: ${fmtNum(round2(num(l.mValue) - num(prev.mValue)))})` : ''}`; }

}

}
function newLog(kind, preset = {}) { openForm('logs', { kind, date: today(), time: nowHM(), ...preset }); }
function printLogs() {
  const props = [...new Set(data.logs.map(l => l.property).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'de'));

/* =========================================================
   Objektverträge & Monatsabrechnung
   ========================================================= */
const INTERVALS = { 'Monatlich': 1, 'Vierteljährlich': 3, 'Halbjährlich': 6, 'Jährlich': 12 };
const ymIndex = ym => { const [y, m] = String(ym).slice(0, 7).split('-').map(Number); return y * 12 + (m - 1); };
const ymFromIndex = n => `${Math.floor(n / 12)}-${pad(n % 12 + 1)}`;
const ymLabel = ym => parseISO(ym + '-01').toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
/** Ist der Vertrag in diesem Monat abzurechnen? (Abrechnung jeweils zu Beginn des Zeitraums) */
function contractDue(c, ym) {
  if (!c.active || !c.items.length) return false;
  const n = ymIndex(ym), s0 = ymIndex(c.start), k = INTERVALS[c.interval] || 1;
  if (n < s0 || (c.end && n > ymIndex(c.end))) return false;
  return (n - s0) % k === 0;
}
function periodLabel(c, ym) {
  const k = INTERVALS[c.interval] || 1;
  if (k === 1) return ymLabel(ym);
  const endYm = ymFromIndex(ymIndex(ym) + k - 1), [y, m] = endYm.split('-').map(Number);
  return `${fmtDate(ym + '-01')} – ${fmtDate(toISO(new Date(y, m, 0)))}`;
}
const contractInvoice = (c, ym) => data.invoices.find(i => i.contractId === c.id && i.period === ym && i.status !== 'Storniert');
const contractNet = c => round2(c.items.reduce((s, i) => s + num(i.qty) * num(i.price), 0));
/** Fällige, noch nicht abgerechnete Verträge eines Monats */
const dueContracts = ym => data.contracts.filter(c => contractDue(c, ym) && !contractInvoice(c, ym));
function nextDueYm(c, from = today().slice(0, 7)) {
  if (!c.active) return '';
  for (let n = Math.max(ymIndex(from), ymIndex(c.start)), stop = n + 13; n < stop; n++) {
    const ym = ymFromIndex(n);
    if (c.end && n > ymIndex(c.end)) return '';
    if (contractDue(c, ym) && !contractInvoice(c, ym)) return ym;
  }
  return '';
}
let billMonth = today().slice(0, 7);
function contractBilling() {
  const due = data.contracts.filter(c => contractDue(c, billMonth));
  const rate = currentRate();
  const rows = due.map(c => { const inv = contractInvoice(c, billMonth), net = contractNet(c);
    return `<tr><td><div class="cell-title" data-act="edit:contracts:${c.id}">${esc(c.title)}</div><div class="cell-sub">${esc(c.customer)}${c.property ? ' · ' + esc(c.property) : ''}</div></td>
      <td class="cell-sub">${esc(periodLabel(c, billMonth))}</td><td class="r num">${euro(net)}<div class="cell-sub">brutto ${euro(round2(net * (1 + rate / 100)))}</div></td>
      <td>${inv ? `<button class="btn btn-ghost btn-sm" data-act="edit:invoices:${inv.id}">${esc(invNo(inv))}</button>` : '<span class="pill">noch offen</span>'}</td></tr>`; }).join('');
  const todo = due.filter(c => !contractInvoice(c, billMonth)).length;
  return `<div class="panel" style="margin-bottom:20px">
    <div class="panel-head"><h3>Abrechnung ${esc(ymLabel(billMonth))}</h3>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="month" id="billMonth" class="inp" style="width:auto" value="${billMonth}">
        <label class="check-field" style="padding:6px 10px"><input type="checkbox" class="check" id="billIssue" checked><span style="font-size:13.5px">gleich stellen</span></label>
        <button class="btn btn-primary" data-do="billContracts" ${todo ? '' : 'disabled'}>${todo ? `${plural(todo, 'Rechnung', 'Rechnungen')} erstellen` : 'Alles abgerechnet'}</button></div></div>
    ${due.length ? `<div class="table-wrap"><table class="data"><thead><tr><th>Vertrag</th><th>Zeitraum</th><th class="r">Betrag netto</th><th>Rechnung</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<p class="empty-note">In diesem Monat ist kein Vertrag abzurechnen.</p>`}
    <p class="muted" style="font-size:13px;margin:10px 0 0">Abgerechnet wird jeweils zu Beginn des Zeitraums. Ohne „gleich stellen“ entstehen Entwürfe, die du vorher noch prüfen kannst.</p>
  </div>`;
}
function billContracts() {
  const issue = $('#billIssue')?.checked !== false, t = today(), c = data.company;
  if (issue && needCompany()) return;
  const list = dueContracts(billMonth);
  if (!list.length) return toast('Nichts abzurechnen.');
  if (issue) { const last = lastIssuedDate(); if (last && t < last) return toast('Es gibt bereits eine Rechnung mit späterem Datum.', { error: true }); }
  if (!confirm(`${plural(list.length, 'Rechnung', 'Rechnungen')} für ${ymLabel(billMonth)} ${issue ? 'erstellen und stellen (feste Nummern)' : 'als Entwurf erstellen'}?`)) return;
  const made = [];
  list.forEach(ct => {
    if (!customerOf(ct.customer)) data.customers.push({ id: nextId(), name: ct.customer, contact: '', street: '', zip: '', city: '', phone: '', email: '', notes: '' });
    const label = periodLabel(ct, billMonth);
    const inv = { id: nextId(), number: '', customer: ct.customer, property: ct.property || '', date: t, serviceDate: label, dueDate: addDays(t, c.paymentDays),
      status: issue ? 'Offen' : 'Entwurf', items: clone(ct.items), vatRate: currentRate(), notes: `für ${ct.title}${ct.property ? ' im Objekt ' + ct.property : ''} im Zeitraum ${label} berechnen wir Ihnen:`,
      footerText: c.footerText, booked: {}, reminders: 0, payments: [], dunning: [], storno: null, contractId: ct.id, period: billMonth };
    data.invoices.push(inv);

  save(); render();
  const noAddr = made.filter(i => !customerOf(i.customer)?.street).length;
  toast(`${plural(made.length, 'Rechnung', 'Rechnungen')} erstellt${issue ? ` (${made[0].number}${made.length > 1 ? ' bis ' + made[made.length - 1].number : ''})` : ' als Entwurf'}${noAddr ? ` – bei ${noAddr} fehlt die Kundenanschrift` : ''}.`, { error: !!noAddr, ms: 6000 });
}

/* =========================================================
   Feste Rechnungen: Stellen, Storno, Zahlungen
   ========================================================= */
function lastIssuedDate() { return data.invoices.filter(i => i.number && i.status !== 'Entwurf').map(i => i.date).sort().pop() || ''; }
/** Rechnung wird gestellt: lückenlose Nummer, Zahlungen einer stornierten Vorgängerin übernehmen */
function onIssue(inv) {
  if (!inv.number) inv.number = nextNumber('RE', data.invoices, Number(String(inv.date || today()).slice(0, 4)));
  inv.payments = inv.payments || [];
  { const cu = customerOf(inv.customer) || {}; inv.addr = { name: inv.customer, contact: cu.contact || '', street: cu.street || '', zip: cu.zip || '', city: cu.city || '' }; }
  let msg = `Rechnung ${inv.number} gestellt.`;
  const old = inv.replaces && byId('invoices', inv.replaces);
  if (old && old.status === 'Storniert') {
    const p = paidOf(old);
    if (p > 0.004) {
      inv.payments.push({ id: pid(), date: inv.date, amount: p, method: 'Umbuchung', note: `übertragen von ${old.number}`, transfer: true });
      old.payments.push({ id: pid(), date: inv.date, amount: -p, method: 'Umbuchung', note: `übertragen auf ${inv.number}`, transfer: true });
      msg += ` Bereits gezahlte ${euro(p)} wurden übernommen.`;
      const over = round2(p - totals(inv).gross); if (over > 0.004) msg += ` Überzahlt: ${euro(over)} – bitte erstatten.`;
    }
  }
  refreshPaid(inv);
  return msg;
}
function stornoInvoice(x, fix) {
  if (!['Offen', 'Bezahlt'].includes(x.status)) return;
  const p = paidOf(x);
  const info = fix ? `\n\nDanach öffnet sich eine Kopie als Entwurf zum Korrigieren.${p > 0.004 ? ` Die bereits gezahlten ${euro(p)} werden beim Stellen übertragen.` : ''}`
    : (p > 0.004 ? `\n\nAchtung: Es wurden schon ${euro(p)} gezahlt. Diese müssen erstattet oder verrechnet werden.` : '');
  if (!confirm(`Rechnung ${x.number} über ${euro(totals(x).gross)} stornieren?\n\nEs entsteht eine Stornorechnung mit eigener Nummer. Lagerbuchungen werden zurückgenommen.${info}`)) return;
  x.status = 'Storniert';
  x.storno = { number: nextNumber('ST', data.invoices.filter(i => i.storno && i.storno.number).map(i => ({ number: i.storno.number })), new Date().getFullYear()), date: today() };
  syncStock(x); save(); render();
  toast(`${x.number} storniert – Stornorechnung ${x.storno.number}.`);
  printStorno(x);
  if (fix) {
    const copy = clone(x);
    ['id', 'number', 'invoiceId', 'booked', 'paidDate', 'reminders', 'lastReminder', 'payments', 'storno', 'replaces', 'dunning', 'addr'].forEach(k => delete copy[k]);
    copy.status = 'Offen'; copy.date = today(); copy.dueDate = addDays(today(), data.company.paymentDays);
    const link = x.orderId && byId('orders', x.orderId) ? { type: 'orders', id: x.orderId } : x.offerId && byId('offers', x.offerId) ? { type: 'offers', id: x.offerId } : null;
    setTimeout(() => openForm('invoices', copy, { link, replaces: x.id, note: `Korrektur zu ${x.number} (storniert mit ${x.storno.number}). Bitte ändern und dann stellen.` }), 500);
  }
}
const fmtIn = n => String(round2(n)).replace('.', ',');

      <div class="field full" style="margin-top:16px"><span class="lbl">Positionen</span>
        <div class="pay-list">${inv.items.map(i => `<div><span style="white-space:pre-wrap">${esc(i.desc)} <span class="muted">· ${fmtNum(i.qty)} ${esc(i.unit)} × ${euro(i.price)}</span></span><b class="num">${euro(num(i.qty) * num(i.price))}</b></div>`).join('')}</div></div>
      <div class="field full" style="margin-top:16px"><span class="lbl">Zahlungen</span>${payRows(inv, inv.status !== 'Storniert')}</div>
    </div>`,
    foot: `<div class="modal-foot">
      <button class="btn btn-ghost" data-act="print:invoices:${inv.id}">Drucken / PDF</button>
      ${inv.storno?.number ? `<button class="btn btn-ghost" data-act="printStorno:invoices:${inv.id}">Stornorechnung drucken</button>` : ''}
      ${['Offen', 'Bezahlt'].includes(inv.status) ? `<button class="btn btn-ghost" data-act="stornoFix:invoices:${inv.id}">Stornieren &amp; korrigieren</button>` : ''}
      ${canDun(inv) ? `<button class="btn btn-ghost" data-act="remind:invoices:${inv.id}">${DUN_NAMES[dunLevel(inv) + 1]}</button>` : ''}
      ${openOf(inv) > 0.004 ? `<button class="btn btn-primary" data-act="pay:invoices:${inv.id}">Zahlung erfassen</button>` : ''}
      <button class="btn btn-ghost" data-close>Schließen</button></div>`
  });
}
function printStorno(inv) {
  if (!inv.storno) return;
  const c = data.company, t = totals(inv);
  const rows = inv.items.map((i, n) => `<tr><td>${n + 1}</td><td class="d">Storno: ${esc(i.desc)}</td><td class="r">${fmtNum(i.qty)} ${esc(i.unit)}</td><td class="r">${euro(i.price)}</td><td class="r">− ${euro(num(i.qty) * num(i.price))}</td></tr>`).join('');
  const body = `${letterhead()}${addressBlock(inv.customer, [['Storno-Nr.', inv.storno.number || '–'], ['Datum', fmtDate(inv.storno.date)], ['zur Rechnung', `${inv.number} vom ${fmtDate(inv.date)}`], ['Leistungsdatum', inv.serviceDate]])}
    <h1>Stornorechnung ${esc(inv.storno.number || '')}</h1>
    <p class="pre">${esc(customerOf(inv.customer)?.contact ? `Guten Tag ${customerOf(inv.customer).contact},` : 'Sehr geehrte Damen und Herren,')}\nhiermit stornieren wir unsere Rechnung ${esc(inv.number)} vom ${fmtDate(inv.date)} vollständig.</p>
    <table class="pos"><thead><tr><th style="width:28px">Pos.</th><th>Beschreibung</th><th class="r">Menge</th><th class="r">Einzelpreis</th><th class="r">Gesamt</th></tr></thead><tbody>${rows}</tbody></table>
    <table class="tot"><tr><td>Summe netto</td><td class="r">− ${euro(t.net)}</td></tr>${t.rate ? `<tr><td>${fmtNum(t.rate)} % USt</td><td class="r">− ${euro(t.vat)}</td></tr>` : ''}<tr class="g"><td>Gutschrift gesamt</td><td class="r">− ${euro(t.gross)}</td></tr></table>
    ${paidOf({ payments: (inv.payments || []).filter(p => !isTransfer(p)) }) > 0.004 ? `<div class="box">Bereits gezahlte Beträge werden mit der korrigierten Rechnung verrechnet bzw. erstattet.</div>` : ''}
    <p style="margin-top:18px">Mit freundlichen Grüßen<br><br>${esc(c.owner)}</p>${footerBlock()}`;
  printHTML(`Stornorechnung ${inv.storno.number}`, body);
}

/* =========================================================
   Datensicherung, Speicher, App
   ========================================================= */
function backupState() {
  const b = data.backup || {}, last = data.company.lastBackup;
  const hasData = COLLECTIONS.some(k => data[k].length);
  const days = last ? daysBetween(last, today()) : null;
  const every = b.every ?? 7, ch = num(b.changes);
  const ago = days === null ? 'noch nie' : days <= 0 ? 'heute' : days === 1 ? 'gestern' : `vor ${days} Tagen`;
  if (!hasData) return { level: 'ok', short: 'Noch keine Daten', msg: '' };
  if (days === null) return { level: every ? 'late' : 'ok', short: 'Noch nie gesichert', msg: 'Es gibt noch keine Datensicherung.' };
  const late = every > 0 && days >= every && ch > 0;
  return { level: late && days >= every * 2 ? 'late' : late ? 'due' : 'ok', short: `Gesichert: ${ago}`, msg: `Letzte Sicherung ${ago}${ch ? `, seitdem ${plural(ch, 'Änderung', 'Änderungen')}` : ''}.` };
}
async function buildBackup() {
  await saveChain;
  const ids = allPhotoIds();
  const stored = ids.length ? await Store.getMany(ids.map(x => PHOTO_PREFIX + x)) : {};
  const photos = {};
  ids.forEach(x => { const src = stored[PHOTO_PREFIX + x] || photoCache.get(x); if (src) photos[x] = src; });
  const file = { app: 'hausmeister-pro', version: Number(APP_VERSION), exported: new Date().toISOString(), copyright: COPYRIGHT, data, photos };
  return { name: `hausmeister_sicherung_${today()}.json`, blob: new Blob([JSON.stringify(file)], { type: 'application/json' }), n: Object.keys(photos).length };
}
function markBackupDone() { data.company.lastBackup = today(); data.backup.changes = 0; save(false); render(); }
function canShareFiles() { try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 't.json', { type: 'application/json' })] })); } catch (e) { return false; } }
async function shareBackup() {
  try {
    const { name, blob } = await buildBackup();
    await navigator.share({ files: [new File([blob], name, { type: 'application/json' })], title: 'Hausmeister Pro – Sicherung' });
    markBackupDone(); toast('Sicherung geteilt.');
  } catch (e) { if (e && e.name === 'AbortError') return; toast('Teilen nicht möglich – die Sicherung wird gespeichert.'); exportData(); }
}
const fmtBytes = b => b >= 1024 ** 3 ? `${(b / 1024 ** 3).toLocaleString('de-DE', { maximumFractionDigits: 1 })} GB` : b >= 1024 ** 2 ? `${(b / 1024 ** 2).toLocaleString('de-DE', { maximumFractionDigits: 1 })} MB` : `${Math.round(b / 1024)} KB`;
async function requestPersist(interactive = false) {
  try {
    if (!navigator.storage || !navigator.storage.persist) { if (interactive) toast('Dieser Browser unterstützt das nicht.', { error: true }); return; }
    if (await navigator.storage.persisted()) { if (interactive) toast('Der Speicher ist bereits geschützt.'); return; }
    const ok = await navigator.storage.persist();
    if (interactive) toast(ok ? 'Speicher geschützt – der Browser löscht die Daten nicht mehr von selbst.' : 'Der Browser hat abgelehnt. Tipp: App installieren oder als Lesezeichen speichern.', { error: !ok });
    if (view === 'settings') fillAppStatus();
  } catch (e) {}
}
let deferredInstall = window.__deferredInstall || null, swReady = false;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (view === 'settings') fillAppStatus(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('Hausmeister Pro wurde als App installiert.'); });
const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
async function installApp() { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) {} deferredInstall = null; fillAppStatus(); }
function initServiceWorker() {
  if (!IS_PWA || !('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) toast('Neue Version installiert – bitte die Seite neu laden.', { ms: 8000 }); });
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => { swReady = true; if (view === 'settings') fillAppStatus(); }).catch(() => {});
}
async function fillAppStatus() {
  const box = $('#appStatus'); if (!box) return;
  let persisted = false, est = null;
  try { persisted = !!(navigator.storage && navigator.storage.persisted && await navigator.storage.persisted()); } catch (e) {}
  try { est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null; } catch (e) {}
  const row = (state, text) => `<div class="status-row"><span class="si ${state}">${state === 'ok' ? '✓' : state === 'warn' ? '!' : '–'}</span><span>${text}</span></div>`;
  let h = IS_PWA
    ? row(isStandalone() ? 'ok' : 'off', isStandalone() ? 'Läuft als installierte App' : 'Läuft im Browser – kann als App installiert werden') + row(swReady ? 'ok' : 'warn', swReady ? 'Offline bereit – funktioniert auch ohne Internet' : 'Offline-Modus wird eingerichtet …')
    : row('ok', 'Läuft als Datei – funktioniert ohne Internet') + row('off', 'Für Handy und Tablet: das App-Paket installieren (siehe Anleitung)');
  h += row(Store.mode === 'idb' ? 'ok' : 'warn', Store.mode === 'idb' ? 'Großer Speicher aktiv (Datenbank im Browser)' : 'Nur kleiner Notspeicher verfügbar – bitte regelmäßig sichern');
  h += row(persisted ? 'ok' : 'warn', persisted ? 'Speicher dauerhaft geschützt' : 'Speicher nicht dauerhaft geschützt – der Browser könnte bei Platzmangel Daten löschen');
  box.innerHTML = h;
  const si = $('#storageInfo'); if (si) si.textContent = est && est.usage !== undefined ? `${fmtBytes(est.usage)}${est.quota ? ' von ' + fmtBytes(est.quota) : ''}` : 'unbekannt';
  const ib = $('#installBtn'); if (ib) ib.classList.toggle('hidden', !deferredInstall);
  const pb = $('#persistBtn'); if (pb) pb.classList.toggle('hidden', persisted || !(navigator.storage && navigator.storage.persist));
  const ih = $('#iosHint'); if (ih) ih.classList.toggle('hidden', !(IS_PWA && isIOS() && !isStandalone()));
}

/* =========================================================
   Export / Import
   ========================================================= */
function download(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function exportData() {
  try {
    const { name, blob, n } = await buildBackup();
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    markBackupDone();
    toast(`Sicherung gespeichert${n ? ` (mit ${plural(n, 'Foto', 'Fotos')})` : ''}.`);
  } catch (e) { toast('Sicherung fehlgeschlagen: ' + (e.message || e), { error: true }); }
}
async function importData(file) {
  let incoming;
  try { incoming = JSON.parse(await file.text()); } catch (e) { return toast('Die Datei ist keine gültige Sicherung dieser App.', { error: true }); }
  const src = incoming && typeof incoming.data === 'object' && incoming.data ? incoming.data : incoming;
  if (!src || typeof src !== 'object' || !COLLECTIONS.some(k => Array.isArray(src[k]))) return toast('Die Datei ist keine gültige Sicherung dieser App.', { error: true });
  let next;
  try { next = normalize(clone(src)); } catch (e) { return toast('Die Sicherung konnte nicht gelesen werden.', { error: true }); }
  const n = COLLECTIONS.reduce((s, k) => s + next[k].length, 0);
  if (!confirm(`Die Sicherung enthält ${n} Datensätze. Alle aktuellen Daten auf diesem Gerät werden ersetzt. Fortfahren?`)) return;
  photoCache.clear();
  const put = extractPhotos(next);
  Object.entries(incoming.photos || {}).forEach(([id, img]) => { put[PHOTO_PREFIX + id] = img; photoCache.set(id, img); });
  try { await saveChain; await Store.clear(); data = next; resetSyncState(); msgDraft = null; await persist({ put }); }
  catch (e) { return toast('Import fehlgeschlagen: ' + (e.message || e), { error: true }); }
  toast('Sicherung importiert.'); go('dashboard');
}
function exportCSV() {
  const rows = [['Rechnungsnr.','Datum','Leistungsdatum','Kunde','Netto','USt-Satz','USt','Brutto','Mahngebühren','Bezahlt','Offen','Status','Fällig','Bezahlt am','Storno-Nr.','Storno-Datum']];
  data.invoices.filter(i => i.status !== 'Entwurf').sort((a, b) => a.number.localeCompare(b.number)).forEach(i => {
    const t = totals(i), n = v => v.toFixed(2).replace('.', ',');
    rows.push([i.number, fmtDate(i.date), i.serviceDate || '', i.customer, n(t.net), fmtNum(t.rate), n(t.vat), n(t.gross), n(feesOf(i)), n(paidOf(i)), n(openOf(i)), invStatus(i), fmtDate(i.dueDate), i.paidDate ? fmtDate(i.paidDate) : '', i.storno?.number || '', i.storno?.date ? fmtDate(i.storno.date) : '']);
  });
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  download(`rechnungen-${today()}.csv`, csv, 'text/csv;charset=utf-8');
  toast('CSV exportiert.');
}

async function saveCompany(e) {
  e.preventDefault();
  const f = e.target, fd = new FormData(f), c = { ...data.company };
  ['name','owner','phone','street','zipCity','email','web','taxNo','vatId','bank','bic','iban','footerText'].forEach(k => c[k] = String(fd.get(k) ?? '').trim());
  ['vatRate','paymentDays','offerDays','hourlyRate','dunDays','dunFee1','dunFee2','dunFee3'].forEach(k => c[k] = Math.max(0, num(fd.get(k))));
  if (c.dunDays < 1) c.dunDays = 7;
  c.smallBusiness = fd.has('smallBusiness');
  if (!c.name) return toast('Der Firmenname fehlt.', { error: true });
  if (c.paymentDays <= 0) c.paymentDays = 14;
  if (c.offerDays <= 0) c.offerDays = 30;
  const file = $('#logoInput')?.files[0];
  if (file) { try { c.logo = await shrinkImage(file, 600, 'image/png'); } catch (err) { return toast('Das Logo konnte nicht gelesen werden.', { error: true }); } }
  const prev = data.company; data.company = c;
  if (!save()) { data.company = prev; return; }
  toast('Einstellungen gespeichert.'); render();
}

/* =========================================================
   Toast
   ========================================================= */
let toastTimer;
function toast(msg, { error = false, ms = 3800, action = null } = {}) {
  clearTimeout(toastTimer);
  const root = $('#toastRoot');
  root.innerHTML = `<div class="toast ${error ? 'err' : ''}" role="status"><span>${esc(msg)}</span>${action ? `<button>${esc(action[0])}</button>` : ''}</div>`;
  if (action) $('button', root).onclick = () => { root.innerHTML = ''; action[1](); };
  toastTimer = setTimeout(() => root.innerHTML = '', action ? Math.max(ms, 6000) : ms);
}

/* =========================================================
   Globale Ereignisse
   ========================================================= */
function closeSidebar() { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); }
function closeMenus(except) { $$('details.more[open]').forEach(d => { if (d !== except) d.open = false; }); }

document.addEventListener('click', e => {
  const sb = e.target.closest('[data-send]');
  if (sb) { const [ch, key] = sb.dataset.send.split(':'); return sendOne(ch, key); }
  const ru = e.target.closest('[data-reuse]');
  if (ru) { const m = data.messages.find(x => x.id === Number(ru.dataset.reuse)); if (m && !m.channels.includes('Aushang')) { syncDraftFields(); msgDraft.subject = m.subject; msgDraft.text = m.text; msgDraft.tpl = ''; msgDraft.done = new Set(); msgDraft.logId = null; render(); toast('Text übernommen – jetzt Empfänger wählen.'); } return; }
  const el = e.target.closest('[data-view],[data-go],[data-new],[data-act],[data-filter],[data-do],[data-cal],[data-calmode],[data-calday],[data-goto-doc]');
  if (!el) { if (!e.target.closest('details.more')) closeMenus(); return; }
  if (el.closest('.more-pop')) closeMenus();
  const ds = el.dataset;
  if (ds.view) return go(ds.view);
  if (ds.go) return go(ds.go, { filter: ds.filterSet });
  if (ds.new) { e.stopPropagation(); return openForm(ds.new, ds.presetDate ? { date: ds.presetDate } : null); }
  if (ds.act) {
    e.stopPropagation();
    if (el.closest('#modalRoot') && !el.closest('form')) closeModal();
    return handleAct(ds.act);
  }
  if (ds.gotoDoc) { const [v, s] = ds.gotoDoc.split(':'); return go(v, { search: s }); }
  if (ds.filter) { filter = ds.filter; return render(); }
  if (ds.cal !== undefined) {
    const n = +ds.cal;
    calMonth = n === 0 ? new Date(new Date().getFullYear(), new Date().getMonth(), 1) : new Date(calMonth.getFullYear(), calMonth.getMonth() + n, 1);
    return render();
  }
  if (ds.calmode) { calMode = ds.calmode; return render(); }
  if (ds.calday) return openForm('orders', { date: ds.calday });
  if (ds.do) {
    const k = ds.do;
    if (k === 'export') return exportData();
    if (k === 'share') return shareBackup();
    if (k === 'install') return installApp();
    if (k === 'persist') return requestPersist(true);
    if (k === 'import') return $('#importFile').click();
    if (k === 'csv') return exportCSV();
    if (k === 'billContracts') return billContracts();
    if (k === 'printTimesheet') return printTimesheet();
    if (k === 'notice') return openNotice();
    if (k === 'mailAll') return sendAll();
    if (k === 'copyMsg') { syncDraftFields(); return copyText(fillMsg(msgDraft.text, null), 'Text kopiert – z. B. für eine WhatsApp-Gruppe.'); }
    if (k === 'rcAll' || k === 'rcNone') { syncDraftFields(); msgDraft.recipients.forEach(r => k === 'rcAll' ? msgDraft.selected.add(r.key) : msgDraft.selected.delete(r.key)); return render(); }
    if (k === 'saveTpl') { syncDraftFields(); const name = prompt('Name der Vorlage:', msgDraft.subject); if (!name || !name.trim()) return; const t = { id: nextId(), name: name.trim(), subject: msgDraft.subject, text: msgDraft.text }; data.templates.push(t); msgDraft.tpl = 'o' + t.id; save(); toast('Vorlage gespeichert.'); return render(); }
    if (k === 'delTpl') { const t = data.templates.find(x => 'o' + x.id === msgDraft.tpl); if (!t || !confirm(`Vorlage „${t.name}“ löschen?`)) return; data.templates = data.templates.filter(x => x !== t); msgDraft.tpl = ''; save(); return render(); }
    if (k === 'printLogs') return printLogs();
    if (k === 'newWinter') return newLog('Winterdienst');
    if (k === 'newCheck') return newLog('Prüfung', { pResult: 'in Ordnung' });
    if (k === 'newMeter') return newLog('Zählerstand');
    if (k === 'orderList') return printOrderList();
    if (k === 'removeLogo') { data.company.logo = ''; save(); toast('Logo entfernt.'); return render(); }
    if (k === 'demo') { if (confirm('Demo-Daten laden? Alle aktuellen Daten werden ersetzt.')) { const lb = data.company.lastBackup; photoCache.clear(); data = demoData(); data.company.lastBackup = lb; saveChain.then(() => Store.clear()).then(() => persist()); toast('Demo-Daten geladen.'); go('dashboard'); } return; }
    if (k === 'wipe') return resetAllData();
    if (k === 'setupDevice') return setupDevice($('#devName').value, $('#devCode').value);
    if (k === 'changeDevice') { const c0 = prompt('Neues Kürzel (ein Buchstabe) für dieses Gerät:', device.code); if (c0 === null) return; const n0 = prompt('Name dieses Geräts:', device.name); return setupDevice(n0 || device.name, c0); }
    if (k === 'syncOut' || k === 'syncShare') return createSyncFile(k === 'syncShare');
    if (k === 'syncIn') return $('#syncFile').click();
  }
});

// Aktionsmenü: als fixiertes Popover positionieren (wird sonst von der Tabelle abgeschnitten)
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.matches?.('details.more') || !d.open) return;
  closeMenus(d);
  const pop = $('.more-pop', d), r = $('summary', d).getBoundingClientRect();
  pop.style.visibility = 'hidden'; pop.style.left = '0px'; pop.style.top = '0px';
  requestAnimationFrame(() => {
    const w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
    pop.style.top = (r.bottom + h + 8 > innerHeight ? Math.max(8, r.top - h - 6) : r.bottom + 6) + 'px';
    pop.style.visibility = '';
  });
}, true);
window.addEventListener('scroll', () => closeMenus(), true);
window.addEventListener('resize', () => closeMenus());

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.taskdone) return toggleTask(t.dataset.taskdone, t.checked);
  if (t.id === 'importFile' && t.files[0]) { importData(t.files[0]); t.value = ''; }
  if (t.id === 'syncFile' && t.files[0]) { readSyncFile(t.files[0]); t.value = ''; }
  if (t.id === 'billMonth' && t.value) { billMonth = t.value; return render(); }
  if (t.id === 'timeMonth' && t.value) { timeMonth = t.value; return render(); }
  if (t.id === 'timeMember') { timeMember = t.value; return render(); }
  if (t.dataset.rc) { syncDraftFields(); t.checked ? msgDraft.selected.add(t.dataset.rc) : msgDraft.selected.delete(t.dataset.rc); return render(); }
  if (t.id === 'msgGroup') { syncDraftFields(); const keep = { subject: msgDraft.subject, text: msgDraft.text }; const tpl = msgDraft.tpl; newDraft(t.value, keep); msgDraft.tpl = tpl; return render(); }
  if (t.id === 'msgTpl') {
    const v = t.value, tp = v.startsWith('b') ? MSG_TEMPLATES[+v.slice(1)] : data.templates.find(x => 'o' + x.id === v);
    msgDraft.tpl = v; if (tp) { msgDraft.subject = tp.subject; msgDraft.text = tp.text; } return render();
  }
  if (t.id === 'backupEvery') { data.backup.every = Math.max(0, parseInt(t.value, 10) || 0); save(false); render(); }
});
document.addEventListener('input', e => { if (e.target.id === 'search') { search = e.target.value; applySearch(); } if (e.target.id === 'msgText' || e.target.id === 'msgSubject') updatePreview(); });
document.addEventListener('submit', e => { if (e.target.id === 'companyForm') saveCompany(e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('details.more[open]')) return closeMenus(); if ($('#modalRoot').innerHTML) return closeModal(); closeSidebar(); }
  if (e.key === '/' && !e.target.closest('input,textarea,select') && $('#search')) { e.preventDefault(); $('#search').focus(); }
});

$('#menuToggle').onclick = () => { $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); };
$('#scrim').onclick = closeSidebar;
$('#printView').onclick = () => window.print();
$('#themeToggle').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; localStorage.setItem('theme', next); renderChrome();
};

(function initTheme() {
  const saved = localStorage.getItem('theme');
  document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
})();

(async function start() {
  const r = await loadData();
  data = r.d; wasMigrated = !!r.migrated; wasBroken = !!r.broken;
  syncPrev = syncIndex();   // Ausgangsstand für den Abgleich – jede spätere Änderung bekommt einen Zeitstempel
  await preloadPhotos();
  if (r.put) { try { await persist({ put: r.put }); } catch (e) {} }
  if (IS_DEMO) $('#demoBar').classList.remove('hidden');
  render();
  if (wasMigrated) toast('Alle Daten aus der Vorversion wurden übernommen – jetzt mit großem Speicher.', { ms: 7000 });
  if (wasBroken) toast('Gespeicherte Daten waren beschädigt – Demo-Daten geladen.', { error: true, ms: 7000 });
  requestPersist(false); initServiceWorker();
})();
