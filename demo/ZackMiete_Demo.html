<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b5432a">
<meta name="description" content="ZackMiete – die Vermieter-App: Mieter, Mieteingang, Nebenkostenabrechnung, Zähler, Kaution. Offline, ohne Abo.">
<title>ZackMiete</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23b5432a'/%3E%3Cpath d='M14 31 32 16l18 15' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M19 28v20h26V28' fill='none' stroke='%23fff' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M25 36h14M25 42h14' stroke='%23f3c9a8' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root{--g:#b5432a;--g2:#8e3320;--g3:#6e2717;--gl:#f7e4dc;--gll:#fbf4ef;--sea:#2f7d6d;--seal:#dcefe9;--gold:#d99a2b;--goldl:#fbefd6;--red:#c0392b;--redl:#fbe6e3;--blue:#2c6e9b;--bluel:#e3eef6;--ink:#1d2329;--ink2:#3a434c;--muted:#6c737a;--bg:#f5f1ea;--card:#fff;--line:#e8e0d4;--line2:#f1ebe2;--side-bg:#16232d;--side-ink:#d9e1e7;--side-mut:#8fa0ad;--sh:0 1px 2px rgba(40,24,10,.05),0 6px 20px rgba(40,24,10,.06);--r:16px;--side:256px;color-scheme:light}
[data-theme=dark]{--g:#e0775a;--g2:#f0967c;--g3:#f6b8a5;--gl:#3a2219;--gll:#2a1b15;--sea:#5cc0a8;--seal:#183630;--gold:#f2b84b;--goldl:#3a2e14;--red:#ff7b6b;--redl:#3d1d19;--blue:#7fb5e0;--bluel:#172b3b;--ink:#ece7e1;--ink2:#cfc7bf;--muted:#9a938c;--bg:#14171a;--card:#1d2125;--line:#2d3237;--line2:#24282c;--side-bg:#0e1418;--sh:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--g)}
svg{width:18px;height:18px;flex:none}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:13px}.r{text-align:right}.nowrap{white-space:nowrap}
.app{display:flex;min-height:100vh}
/* Seitenleiste – dunkles Nordsee-Blau mit Klinker-Akzent */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.side:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(90deg,var(--g) 0 22px,#9a3822 22px 24px,var(--g) 24px 46px,#c2563b 46px 48px)}
.brand{display:flex;gap:12px;align-items:center;padding:24px 20px 18px}
.crest{width:44px;height:44px;border-radius:13px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;overflow:hidden;flex:none;box-shadow:0 6px 16px rgba(181,67,42,.35)}
.crest img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:17px;letter-spacing:-.01em;line-height:1.15;color:#fff}
.brand span{font-size:12px;color:var(--side-mut);display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{flex:1;overflow:auto;padding:2px 12px 12px}
.nav h6{margin:16px 10px 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-mut);font-weight:700}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 12px;border-radius:11px;cursor:pointer;color:var(--side-ink);font-weight:550;text-align:left;font-size:14.5px}
.nav button svg{color:var(--side-mut)}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:rgba(224,119,90,.16);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--g)}
.nav button.on svg{color:#f08a6c}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);color:var(--side-ink);border-radius:20px;padding:1px 8px;white-space:nowrap}
.nav .cnt.warn{background:rgba(217,154,43,.22);color:#f6cf86}.nav .cnt.bad{background:rgba(224,90,70,.25);color:#ffb3a6}
.side-foot{border-top:1px solid rgba(255,255,255,.08);padding:12px 16px;font-size:12px;color:var(--side-mut);display:flex;gap:8px;align-items:center;justify-content:space-between}
.side-foot .iconbtn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);color:var(--side-ink)}
.main{flex:1;margin-left:var(--side);min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;gap:10px;padding:0 30px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:15px;margin:0;font-weight:650;flex:1;color:var(--muted)}
.iconbtn.burger{display:none}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.iconbtn:hover{border-color:var(--g);color:var(--g)}
.demo-bar{background:var(--sea);color:#fff;font-weight:700;font-size:13px;text-align:center;padding:6px}
.demo-bar .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
.content{padding:28px 30px 64px;max-width:1380px;width:100%}
.head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.head h2{margin:0;font-size:30px;letter-spacing:-.025em;line-height:1.1;font-weight:800}
.head p{margin:6px 0 0;color:var(--muted);max-width:660px}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 15px;font-weight:650;cursor:pointer;white-space:nowrap;color:var(--ink);text-decoration:none;font-size:14.5px}
.btn:hover{border-color:var(--g)}
.btn-p{background:var(--g);border-color:var(--g);color:#fff;box-shadow:0 4px 12px rgba(181,67,42,.22)}
.btn-p:hover{background:var(--g2);border-color:var(--g2)}
[data-theme=dark] .btn-p{color:#2a0f07}
.btn-sea{background:var(--sea);border-color:var(--sea);color:#fff}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#2e2100}
.btn-red{color:var(--red)}.btn-red:hover{border-color:var(--red)}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.025em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi .ic{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:11px;background:var(--gl);color:var(--g);display:grid;place-items:center}
.kpi.sea .ic,.kpi.g .ic{background:var(--seal);color:var(--sea)}.kpi.gold .ic{background:var(--goldl);color:#a26d0e}.kpi.red .ic{background:var(--redl);color:var(--red)}.kpi.blue .ic{background:var(--bluel);color:var(--blue)}
.hero{background:var(--side-bg);color:#fff;border-radius:20px;padding:26px 28px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:26px;align-items:center;position:relative;overflow:hidden;margin-bottom:16px}
.hero:after{content:"";position:absolute;right:-40px;bottom:-70px;width:260px;height:260px;border-radius:50%;border:38px solid rgba(224,119,90,.14)}
.hero h2{margin:0;font-size:15px;font-weight:650;color:#b9c6cf;text-transform:uppercase;letter-spacing:.08em}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:18px;color:#9fb0bc;font-weight:650}
.hero p{margin:0;color:#c5d0d7}
.hero .meter{height:12px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden;margin:14px 0 8px}
.hero .meter i{display:block;height:100%;background:linear-gradient(90deg,#e0775a,#f2a37f);border-radius:8px}
.hero .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.18)}
.hero .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;position:relative;z-index:1}
.hero .stats div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 14px}
.hero .stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.hero .stats span{font-size:12px;color:#9fb0bc}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.sec-t h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:center}
.sec-t h3 svg{color:var(--g)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line2)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li b{font-weight:650}
.av{width:38px;height:38px;border-radius:12px;background:var(--gl);color:var(--g2);display:grid;place-items:center;font-weight:750;font-size:13px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.sea,.av.g{background:var(--seal);color:var(--sea)}.av.gold{background:var(--goldl);color:#9a6700}.av.blue{background:var(--bluel);color:var(--blue)}.av.red{background:var(--redl);color:var(--red)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:220px;max-width:360px}
.search input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--side-bg);border-color:var(--side-bg);color:#fff}
[data-theme=dark] .chip.on{background:var(--g);border-color:var(--g);color:#1d0d07}
.chip i{font-style:normal;opacity:.6;margin-left:3px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--muted);font-weight:700;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--gll);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.tbl td{padding:12px 16px;border-top:1px solid var(--line2);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl tbody tr:hover td{background:var(--gll)}
.tbl tr.click{cursor:pointer}
.tbl .sub{display:block;font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow:auto;border-radius:var(--r)}
.tbl tfoot td{font-weight:750;border-top:2px solid var(--line);background:var(--gll)}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--line2);color:var(--ink2);white-space:nowrap}
.pill.g,.pill.sea{background:var(--seal);color:var(--sea)}.pill.gold{background:var(--goldl);color:#8a5a00}.pill.red{background:var(--redl);color:var(--red)}.pill.blue{background:var(--bluel);color:var(--blue)}.pill.brick{background:var(--gl);color:var(--g2)}
[data-theme=dark] .pill.gold{color:var(--gold)}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--sea)}.neg{color:var(--red)}
.rowacts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:5px;min-width:230px;z-index:40}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 11px;border-radius:8px;cursor:pointer;font-weight:550}
.menu button:hover{background:var(--gll)}
.menu button.red{color:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(18,26,33,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:60;overflow:auto}
.modal{background:var(--card);border-radius:20px;width:100%;max-width:640px;box-shadow:0 24px 70px rgba(0,0,0,.28);display:flex;flex-direction:column;max-height:92vh}
.modal.wide{max-width:900px}.modal.xwide{max-width:1120px}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 24px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;flex:1;font-size:19px;letter-spacing:-.01em}
.modal-b{padding:20px 24px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f .l{margin-right:auto}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:650;color:var(--ink2)}
.f label .req{color:var(--red)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--card);width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid color-mix(in srgb,var(--g) 30%,transparent);border-color:var(--g)}
.f textarea{min-height:80px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.f .err{font-size:12px;color:var(--red)}
.f.check{flex-direction:row;align-items:center;gap:9px}
.f.check input{width:18px;height:18px;accent-color:var(--g)}
.f.check label{font-weight:550}
.fsec{grid-column:1/-1;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--g);margin-top:8px;padding-top:12px;border-top:1px solid var(--line2)}
.fsec:first-child{margin-top:0;padding-top:0;border-top:0}
.note{background:var(--gll);border:1px solid var(--gl);border-radius:13px;padding:12px 14px;font-size:13.5px;color:var(--ink2)}
.note.sea{background:var(--seal);border-color:#bfe0d6;color:#1d5348}
.note.gold{background:var(--goldl);border-color:#f2d9a3;color:#5c4200}
.note.red{background:var(--redl);border-color:#f2c3bd;color:#7a1c15}
[data-theme=dark] .note.gold{color:var(--gold);border-color:#5a4615}[data-theme=dark] .note.red{color:var(--red);border-color:#5a2520}[data-theme=dark] .note.sea{color:var(--sea);border-color:#1f4a41}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--side-bg);color:#fff;padding:12px 16px;border-radius:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:550;max-width:min(560px,92vw);display:flex;gap:12px;align-items:center}
.toast.err{background:var(--red);color:#fff}
.toast button{background:none;border:0;color:#f6cf86;font-weight:800;cursor:pointer}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:650;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--g2);border-bottom-color:var(--g)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:7px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.bar{height:8px;background:var(--line2);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea);border-radius:8px}
.bar.gold i{background:var(--gold)}.bar.red i{background:var(--red)}.bar.brick i{background:var(--g)}
/* Häuser-Karten */
.house{overflow:hidden;display:flex;flex-direction:column}
.house .roof{height:86px;background:var(--side-bg);position:relative;display:flex;align-items:flex-end;padding:14px 18px;color:#fff;overflow:hidden}
.house .roof:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 13px,rgba(255,255,255,.04) 13px 14px),repeating-linear-gradient(90deg,transparent 0 27px,rgba(255,255,255,.035) 27px 28px)}
.house .roof:after{content:"";position:absolute;right:16px;top:14px;width:58px;height:58px;background:var(--g);clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%);opacity:.9}
.house .roof b{font-size:18px;position:relative;z-index:1}.house .roof span{display:block;font-size:12.5px;color:#b9c6cf;position:relative;z-index:1}
.house .body{padding:14px 18px 16px;flex:1;display:flex;flex-direction:column;gap:10px}
.unitrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;background:var(--gll);border:1px solid var(--line2);cursor:pointer}
.unitrow:hover{border-color:var(--g)}
.unitrow .dot{width:9px;height:9px;border-radius:50%;background:var(--sea);flex:none}.unitrow .dot.vac{background:var(--gold)}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.statgrid div{background:var(--gll);border-radius:11px;padding:9px 11px}.statgrid b{display:block;font-variant-numeric:tabular-nums}.statgrid span{font-size:11.5px;color:var(--muted)}
/* Mietkalender */
.mgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.mgrid i{display:block;height:26px;border-radius:7px;background:var(--line2);font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted);display:grid;place-items:center}
.mgrid i.g{background:var(--seal);color:var(--sea)}.mgrid i.gold{background:var(--goldl);color:#8a5a00}.mgrid i.red{background:var(--redl);color:var(--red)}
.result{border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.result.nach{background:var(--redl);color:#7a1c15}.result.gut{background:var(--seal);color:#1d5348}
[data-theme=dark] .result.nach{color:var(--red)}[data-theme=dark] .result.gut{color:var(--sea)}
.result b{font-size:22px;font-variant-numeric:tabular-nums}
.ob{max-width:640px;margin:6vh auto;padding:0 16px}
.ob .card{padding:30px}
.ob h1{margin:0 0 6px;font-size:30px;letter-spacing:-.025em}
.steps{display:flex;gap:6px;margin:0 0 18px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps i.on{background:var(--g)}
.scrim{display:none}
.mtable input{border:1px solid var(--line);border-radius:9px;padding:7px 9px;width:120px;background:var(--card);text-align:right}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .side{transform:translateX(-102%);box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  .main{margin-left:0}.iconbtn.burger{display:grid}
  .top{padding:0 14px}.content{padding:18px 14px 72px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .fg,.fg.c3{grid-template-columns:minmax(0,1fr)}
  .head h2{font-size:24px}
  .tbl .hm{display:none}
  .kv{grid-template-columns:120px 1fr}
  .hero .big{font-size:32px}
}

}

/* ---------- Monats-Soll ---------- */
const ym = d => String(d).slice(0, 7);
const monthStart = m => m + '-01';

/** Soll eines Monats – angefangene Monate tagesgenau anteilig */
function monthSoll(c, m) {

  if (s > e) return null;
  const t = termAt(c, s), dim = daysBetween(ms, me) + 1, act = daysBetween(s, e) + 1, f = act >= dim ? 1 : act / dim;
  const x = { rent: r2(t.rent * f), nk: r2(t.nk * f), heat: r2(t.heat * f) };
  x.net = r2(x.rent + x.nk + x.heat); x.vat = r2(x.net * vatRateOf(c) / 100); x.total = r2(x.net + x.vat); x.partial = f < 1; x.month = m; x.due = dueOf(c, m); return x;
}
/** Mietkonto: alle Soll-Posten, Sonderposten und Zahlungen bis zu einem Tag */
/** Ab wann das Mietkonto in der App geführt wird (bei Bestandsmietern später als der Mietbeginn) */
const ledgerStart = c => c.ledgerFrom && c.ledgerFrom > c.start ? c.ledgerFrom : c.start;
function ledger(c, until = today()) {
  const end = c.end && c.end < until ? c.end : until;
  const items = [];
  const from = ledgerStart(c);
  if (num(c.openBal) && from <= until) items.push({ kind: 'extra', id: 'open', date: from, title: num(c.openBal) > 0 ? 'Rückstand aus der Zeit vor der App' : 'Guthaben aus der Zeit vor der App', amount: r2(num(c.openBal)) });
  if (from <= until) monthsBetween(from, end).forEach(m => { const s = monthSoll(c, m); if (s && s.due <= until) items.push({ kind: 'soll', id: 'm' + m, date: s.due, title: `Miete ${monthLabel(m)}${s.partial ? ' (anteilig)' : ''}`, amount: s.total, s }); });
  data.extras.filter(x => String(x.contract) === String(c.id) && x.date <= until).forEach(x => items.push({ kind: 'extra', id: x.id, date: x.date, title: x.title, amount: r2(x.amount), x }));
  items.sort((a, b) => a.date.localeCompare(b.date));
  const pays = data.payments.filter(p => String(p.contract) === String(c.id) && p.date <= until && p.date >= from).sort((a, b) => a.date.localeCompare(b.date));
  // Zahlungen der Reihe nach auf die ältesten offenen Posten verteilen (Guthaben-Posten zuerst verrechnen)

const openItems = c => ledger(c).items.filter(i => i.open > 0.004);

/* ---------- Zähler ---------- */
const metersOf = (p, u) => data.meters.filter(m => String(m.property) === String(p.id) && (u === undefined || String(m.unit || '') === String(u?.id || '')));

/** Zählerstand am Ende eines Tages (Zwischenwerte werden nach Tagen geschätzt) */
function meterValueAt(m, d) {

  const ex = r.find(x => x.date === d); if (ex) return num(ex.value);

/* ---------- Nebenkostenabrechnung ---------- */

    const s = ov[0] < cur ? cur : ov[0]; if (s <= ov[1]) segs.push({ c, from: s, to: ov[1] });

const keyOf = (p, catId) => p.keys?.[catId] || catById(catId)?.key || 'area';
function costsFor(p, year, umlageOnly = true) { return data.costs.filter(c => String(c.property) === String(p.id) && Number(c.year || yearOf(c.date)) === Number(year) && (!umlageOnly || catById(c.cat)?.umlage)); }

/** Kernrechnung: verteilt alle umlagefähigen Kosten eines Jahres auf Mieter und Leerstand */
function nkCalc(p, year, from = `${year}-01-01`, to = `${year}-12-31`) {
  const units = unitsOf(p).filter(u => !['Stellplatz', 'Garage'].includes(u.type) || num(u.area) > 0);
  const segs = units.flatMap(u => unitSegments(u, from, to));
  const warn = [], periodDays = daysBetween(from, to) + 1;
  const weight = (key, s, extra) => {
    if (key === 'area') return num(s.u.area) * s.days;
    if (key === 'units') return s.days;
    if (key === 'mea') return num(s.u.mea) * s.days;
    if (key === 'persons') return s.vac ? 0 : personDays(s.c, s.from, s.to);
    if (key.startsWith('m:')) return unitConsumption(s.u, key.slice(2).split('+'), s.from, s.to);
    if (key === 'direct') return String(s.u.id) === String(extra) ? s.days : 0;
    return 0;
  };
  const byCat = {};
  costsFor(p, year).forEach(c => { (byCat[c.cat] ||= []).push(c); });
  const lines = [];
  Object.entries(byCat).forEach(([cat, list]) => {
    let key = keyOf(p, cat);
    const groups = key === 'direct' ? Object.entries(list.reduce((a, c) => { (a[c.unit || ''] ||= []).push(c); return a; }, {})) : [['', list]];
    groups.forEach(([unitId, li]) => {
      const total = sum(li, c => c.amount), labor = sum(li, c => c.labor !== '' && c.labor != null ? num(c.labor) : (catById(cat)?.s35 ? num(c.amount) : 0));
      const parts = []; // [key, amount]
      if (key === 'heat') {
        const pct = Math.min(70, Math.max(50, Number(data.settings.heatPct) || 70)) / 100;
        const w = segs.map(s => weight('m:heat', s)); if (w.some(v => v == null) || !w.some(v => v > 0)) { warn.push(`${catName(cat)}: Wärmezähler fehlen oder Ablesungen unvollständig – komplett nach Wohnfläche verteilt. Die Heizkostenverordnung verlangt eine Verteilung nach Verbrauch.`); parts.push(['area', total]); }

function taxYear(p, year) {
  const cs = data.contracts.filter(c => String(unitById(c.unit)?.property) === String(p.id));
  let rent = 0, umlage = 0, vat = 0;
  cs.forEach(c => data.payments.filter(x => String(x.contract) === String(c.id) && yearOf(x.date) === Number(year)).forEach(x => { const t = termAt(c, x.date); const tot = t.total || 1; rent += x.amount * t.rent / tot; umlage += x.amount * (t.nk + t.heat) / tot; vat += x.amount * t.vat / tot; }));
  const costs = data.costs.filter(c => String(c.property) === String(p.id) && yearOf(c.date) === Number(year));
  const byCat = {}; costs.forEach(c => { byCat[c.cat] = r2((byCat[c.cat] || 0) + num(c.amount)); });
  const interest = byCat.zinsen || 0;
  const afaBase = num(p.price) * (1 - (Number(p.landPct) || 0) / 100);
  const afa = p.price ? r2(afaBase * (Number(p.afaPct) || 2) / 100 * (p.bought && yearOf(p.bought) === Number(year) ? (13 - Number(p.bought.slice(5, 7))) / 12 : p.bought && yearOf(p.bought) > Number(year) ? 0 : 1)) : 0;
  const expenses = sum(costs, c => c.amount);
  return { vat: r2(vat), rent: r2(rent), umlage: r2(umlage), income: r2(rent + umlage), byCat, interest, afa, expenses, result: r2(rent + umlage - expenses - afa) };
}

  <div class="body"><div class="statgrid"><div><b>${fmtNum(propArea(p), 0)} m²</b><span>Wohnfläche</span></div><div><b>${occ.length}/${us.length}</b><span>vermietet</span></div><div><b>${fmtMoney(rentM).replace(',00', '')}</b><span>Kaltmiete/Monat</span></div></div>
  <div class="list" style="gap:6px">${us.map(u => { const c = currentContract(u); return `<div class="unitrow" data-act="unitInfo:${u.id}"><span class="dot ${c ? '' : 'vac'}"></span><div class="grow" style="min-width:0"><b>${esc(u.name)}</b> <span class="muted small">${u.area ? fmtNum(u.area, 1) + ' m²' : esc(u.type)}</span><div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c ? esc(tenantName(c)) : 'frei'}</div></div>${c ? amt(termAt(c, today()).total) : pill('Leerstand', 'gold')}</div>`; }).join('') || '<span class="muted small">Noch keine Wohnungen.</span>'}</div>

}

VIEWS.tenants = () => {
  const f = viewState.f || 'aktiv', q = viewState.q || '';
  const all = data.contracts.slice().sort((a, b) => unitLabel(unitById(a.unit)).localeCompare(unitLabel(unitById(b.unit)), 'de', { numeric: true }));
  const fut = c => c.start > today();
  const list = all.filter(c => f === 'alle' || (f === 'aktiv' ? isActive(c) || fut(c) : !isActive(c) && !fut(c))).filter(c => matchQ(q, tenantName(c), unitLabel(unitById(c.unit)), c.email, c.phone));
  return head('Mieter & Verträge', 'Alle Mietverhältnisse mit Miete, Personen, Kaution und Mietkonto.', `<button class="btn btn-p" data-act="newContract">${svg('plus')} Neuer Mieter</button>`) +
  `<div class="tools">${searchBox(q, 'Name, Wohnung, Telefon …')}${chips('f', [['aktiv', 'Aktuell', all.filter(c => isActive(c) || fut(c)).length], ['ehemalig', 'Ausgezogen', all.filter(c => !isActive(c) && !fut(c)).length], ['alle', 'Alle', all.length]], f)}</div>` +
  (list.length ? `<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Mieter</th><th>Wohnung</th><th class="hm">Seit</th><th class="r">Miete warm</th><th class="r">Mietkonto</th><th></th></tr></thead><tbody>${list.map(c => {
    const t = termAt(c, isActive(c) ? today() : c.end || c.start), bal = contractBalance(c);
    return `<tr class="click" data-open="openContract:${c.id}"><td><div style="display:flex;gap:10px;align-items:center">${avatar(c, isActive(c) ? '' : 'blue')}<div><b>${esc(tenantName(c))}</b><span class="sub">${esc([c.phone, c.email].filter(Boolean).join(' · ') || '–')}</span></div></div></td>
    <td>${esc(unitLabel(unitById(c.unit)))}<span class="sub">${plural(personsAt(c, today()), 'Person', 'Personen')}</span></td><td class="hm">${fmtDate(c.start)}${c.end ? `<span class="sub">bis ${fmtDate(c.end)}</span>` : ''}${fut(c) ? `<span class="sub">${pill('zieht ein', 'blue')}</span>` : ''}</td>
    <td class="r">${amt(t.total)}<span class="sub">kalt ${fmtMoney(t.rent)}</span></td><td class="r">${bal > 0.5 ? `<span class="pill red">${fmtMoney(bal)} offen</span>` : bal < -0.5 ? `<span class="pill g">${fmtMoney(-bal)} Guthaben</span>` : pill('ausgeglichen', 'g')}</td>
    <td><div class="rowacts"><button class="btn btn-sm" data-act="newPayment:${c.id}">${svg('euro')} Zahlung</button></div></td></tr>`; }).join('')}</tbody></table></div>` :
    `<div class="card">${emptyBox(data.contracts.length ? 'Nichts gefunden' : 'Noch keine Mieter', data.contracts.length ? 'Ändere die Suche oder den Filter.' : 'Lege einen Mietvertrag an – Name, Wohnung, Miete und Einzug genügen.', data.units.length ? `<button class="btn btn-p" data-act="newContract">${svg('plus')} Neuer Mieter</button>` : `<button class="btn btn-p" data-act="newProperty">${svg('plus')} Zuerst Haus anlegen</button>`)}</div>`);
};

    { k: 'indexPct', label: 'Anpassung ab Änderung von (%)', type: 'number', step: '0.5', hint: 'Laut Vertrag, z. B. 5 %. Leer = jede Änderung.' },

const contractDef = c => ({
  title: c.id ? 'Mietvertrag bearbeiten' : 'Neuer Mieter / Mietvertrag', wide: true,
  intro: c.id ? 'Mieterhöhungen und neue Vorauszahlungen bitte unter „Miete ändern“ eintragen – dann bleiben alte Monate richtig.' : '',
  fields: contractFields,
  validate: x => {
    if (x.end && x.end < x.start) return 'Das Mietende liegt vor dem Beginn.';
    if (!isCommercial(unitById(x.unit)) && num(x.deposit) > 3 * num(x.rent) + 0.01) return 'Die Kaution darf höchstens drei Kaltmieten betragen (§ 551 BGB).';
    const clash = data.contracts.find(o => o.id !== x.id && o.unit === x.unit && overlap(o.start, o.end || '9999-12-31', x.start, x.end || '9999-12-31'));
    if (clash) return `Die Wohnung ist in dieser Zeit schon an ${tenantName(clash)} vermietet (${fmtDate(clash.start)} – ${clash.end ? fmtDate(clash.end) : 'offen'}). Bitte dort zuerst das Mietende eintragen.`;
  },
  save: x => { const isNew = !x.id; const m0 = today().slice(0, 8) + '01'; if (isNew && x.start < m0 && !x.ledgerFrom) { x.ledgerFrom = m0; setTimeout(() => toast(`Mietbeginn liegt in der Vergangenheit: Das Mietkonto startet ab ${fmtDate(m0)}. Ältere Mieten gelten als bezahlt. Ändern kannst du das unter „Bearbeiten“.`, { ms: 9000 }), 400); } if (isNew) x.id = pid(); x.persons = Number(x.persons) || 1; x.changes ||= []; x.personChanges ||= []; upsert('contracts', x); toast(isNew ? 'Mieter angelegt.' : 'Gespeichert.'); if (isNew) setTimeout(() => ACTS.openContract(x.id), 50); },
  del: c.id ? async x => { const n = data.payments.filter(p => p.contract === x.id).length; if (!await confirmBox(`Mietvertrag von ${esc(tenantName(x))} löschen?${n ? ` Dabei werden auch ${plural(n, 'Zahlung', 'Zahlungen')} gelöscht.` : ''}<br><br>Tipp: Bei Auszug lieber nur das Mietende eintragen – dann bleibt alles für die Nebenkostenabrechnung erhalten.`, 'Löschen', true)) return false; data.payments = data.payments.filter(p => p.contract !== x.id); data.extras = data.extras.filter(p => p.contract !== x.id); removeFrom('contracts', x.id); return true; } : null
});
ACTS.newContract = uid => {
  if (!data.units.length) return toast('Bitte zuerst ein Haus und eine Wohnung anlegen.', { err: true });
  const u = uid ? unitById(uid) : data.units.find(x => !currentContract(x)) || data.units[0];
  openForm(contractDef({}), { unit: u.id, start: today().slice(0, 8) + '01', persons: 1, dueDay: data.settings.dueDay, payway: 'Überweisung', rent: u.targetRent || '' });
};
ACTS.editContract = id => { closeModal(); openForm(contractDef(contractById(id)), contractById(id)); };

/* ---------- Detail: Mietkonto ---------- */
ACTS.openContract = (id, tab) => {
  const c = contractById(id); if (!c) return;
  const t = tab || 'konto';
  const u = unitById(c.unit), p = propById(u?.property), L = ledger(c), term = termAt(c, isActive(c) ? today() : (c.end || c.start));
  const body = {
    konto: () => {
      const months = monthsBetween(`${new Date().getFullYear()}-01-01`, `${new Date().getFullYear()}-12-31`);
      return `<div class="grid g3" style="margin-bottom:14px">${kpi('Mietkonto', L.balance > 0.5 ? `<span class="neg">${fmtMoney(L.balance)}</span>` : L.balance < -0.5 ? `<span class="pos">${fmtMoney(-L.balance)}</span>` : fmtMoney(0), L.balance > 0.5 ? 'offen' : L.balance < -0.5 ? 'Guthaben' : 'alles bezahlt', 'euro', L.balance > 0.5 ? 'red' : 'sea')}${kpi(term.vat ? 'Miete brutto' : 'Miete warm', fmtMoney(term.total), `kalt ${fmtMoney(term.rent)} · BK ${fmtMoney(term.nk)} · HK ${fmtMoney(term.heat)}${term.vat ? ` · USt ${fmtMoney(term.vat)}` : ''}`, 'home')}${kpi('Gezahlt gesamt', fmtMoney(L.paid), plural(L.pays.length, 'Zahlung', 'Zahlungen'), 'coins', 'sea')}</div>
      <div class="sec-t"><h3>${svg('calendar')} ${new Date().getFullYear()} auf einen Blick</h3></div><div class="mgrid" style="margin-bottom:16px">${months.map(m => { const s = monthStatus(c, m); return `<i class="${s ? PAY_CLS[s.status] : ''}" title="${monthLabel(m)}${s ? ': ' + s.status : ''}">${MONTHS[Number(m.slice(5)) - 1].slice(0, 3)}</i>`; }).join('')}</div>
      <div class="sec-t"><h3>${svg('receipt')} Buchungen</h3><div style="display:flex;gap:6px"><button class="btn btn-sm" data-act="newExtra:${c.id}">${svg('plus')} Sonderposten</button><button class="btn btn-sm btn-p" data-act="newPayment:${c.id}">${svg('euro')} Zahlung</button></div></div>

/* ---------- Kontoauszug (CSV) einlesen ---------- */
function parseCSV(text) {
  const sep = (text.split('\n').slice(0, 5).join('').match(/;/g) || []).length >= (text.split('\n').slice(0, 5).join('').match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i]; if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; } else if (ch === '"') q = true; else if (ch === sep) { row.push(cur); cur = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += ch; }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()));
}
const parseDE = s => { s = String(s || '').trim(); let m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/); if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${pad2(m[2])}-${pad2(m[1])}`; } m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[1]}-${m[2]}-${m[3]}` : ''; };
ACTS.importBank = async () => {

    <tr><td style="padding:8px 0"><b>Kosten gesamt</b></td><td class="r"><b>${amt(t.cost)}</b></td></tr><tr><td style="padding:4px 0">Vorauszahlungen</td><td class="r">− ${amt(t.prepaid)}</td></tr></tbody></table>
    <div class="result ${t.result > 0 ? 'nach' : 'gut'}" style="margin-top:10px"><span>${t.result > 0 ? 'Nachzahlung' : 'Guthaben'}</span><b>${fmtMoney(Math.abs(t.result))}</b></div>
    <div class="small muted" style="margin-top:8px">Vorschlag neue Vorauszahlung: <b>${fmtMoney(t.suggest)}</b>/Monat (bisher ${fmtMoney(t.term.nk + t.term.heat)})${t.labor > 0 ? ` · § 35a-Anteil ${fmtMoney(t.labor)}` : ''}${t.arrears ? ` · ${pill('Mieter hat Rückstand', 'red')}` : ''}</div>
    <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap"><button class="btn btn-sm" data-act="nkPrint:${p.id}:${y}:${t.c.id}">${svg('print')} Drucken</button>${isActive(t.c) && Math.abs(t.suggest - (t.term.nk + t.term.heat)) >= 1 ? `<button class="btn btn-sm" data-act="nkAdopt:${p.id}:${y}:${t.c.id}">Vorauszahlung anpassen</button>` : ''}</div></div>`).join('')}</div>

VIEWS.nk.after = bindSelects;
ACTS.nkKeys = id => {
  const p = propById(id), cats = data.cats.filter(c => c.umlage);
  const md = openModal({ title: `Verteilerschlüssel · ${esc(p.name)}`, wide: true,
    body: `<div class="note" style="margin-bottom:12px">So wird jede Kostenart auf die Mieter verteilt. Halte dich an das, was im Mietvertrag steht. Heizkosten: ${data.settings.heatPct} % nach Verbrauch, der Rest nach Fläche (Heizkostenverordnung, 50–70 % – unter Einstellungen änderbar).</div>
    <div class="tbl-wrap" style="border:1px solid var(--line)"><table class="tbl"><thead><tr><th>Kostenart</th><th>Verteilen nach</th></tr></thead><tbody>${cats.map(c => `<tr><td>${esc(c.name)}</td><td><select data-key="${c.id}" style="border:1px solid var(--line);border-radius:9px;padding:6px 8px">${Object.entries(KEYS).map(([k, l]) => `<option value="${k}"${keyOf(p, c.id) === k ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`,
    foot: `<button class="btn" data-close>Abbrechen</button><button class="btn btn-p" id="kOk">Speichern</button>` });
  $('#kOk', md).onclick = () => { $$('[data-key]', md).forEach(s => { if (s.value === catById(s.dataset.key)?.key) delete p.keys[s.dataset.key]; else p.keys[s.dataset.key] = s.value; }); upsert('properties', p); closeModal(); render(); toast('Verteilerschlüssel gespeichert.'); };
};
ACTS.nkAdopt = async (pidA, y, cid) => {
  const t = nkCalc(propById(pidA), Number(y)).tenants.find(x => x.c.id === cid); if (!t) return;
  const c = t.c, cur = termAt(c, today()), tot = cur.nk + cur.heat, share = tot ? cur.heat / tot : 0;
  const heat = Math.round(t.suggest * share), nk = t.suggest - heat, from = addMonths(today().slice(0, 8) + '01', 2);
  if (!await confirmBox(`Neue Vorauszahlung für ${esc(tenantName(c))} ab ${fmtDate(from)}: <b>${fmtMoney(t.suggest)}</b> (Betriebskosten ${fmtMoney(nk)}, Heizung ${fmtMoney(heat)}).<br><br>Nach einer Abrechnung darf die Vorauszahlung angemessen angepasst werden (§ 560 Abs. 4 BGB). Teile es dem Mieter mit der Abrechnung schriftlich mit.`, 'Übernehmen')) return;
  c.changes.push({ id: pid(), from, note: `Neue Vorauszahlung nach Abrechnung ${y}`, rent: cur.rent, nk, heat }); upsert('contracts', c); render(); toast('Neue Vorauszahlung eingetragen.');
};
ACTS.nkBook = async (pidA, y) => {
  const p = propById(pidA), R = nkCalc(p, Number(y));
  if (R.warn.length && !await confirmBox(`Es gibt noch ${plural(R.warn.length, 'Hinweis', 'Hinweise')} zur Abrechnung. Trotzdem buchen?`, 'Trotzdem buchen')) return;
  if (!await confirmBox(`Ergebnisse ${y} für ${plural(R.tenants.length, 'Mieter', 'Mieter')} ins Mietkonto buchen?`, 'Buchen')) return;
  const due = addDays(today(), 30);
  R.tenants.forEach(t => { if (Math.abs(t.result) < 0.01) return; data.extras.push(touch({ id: pid(), contract: t.c.id, date: due, title: `Nebenkosten ${y}: ${t.result > 0 ? 'Nachzahlung' : 'Guthaben'}`, amount: t.result, ref: `nk:${p.id}:${y}` })); });
  const st = statementFor(p, y) || { id: pid(), property: p.id, year: Number(y) };
  Object.assign(st, { at: today(), booked: true, total: R.total, results: Object.fromEntries(R.tenants.map(t => [t.c.id, t.result])) }); upsert('statements', st);
  save(); render(); toast('Abrechnung gebucht. Guthaben werden mit der nächsten Miete verrechnet.', { ms: 6000 });
};

const rowKeyLabel = (p, r) => (catById(r.cat)?.gew ? 'nur Gewerbe: ' : '') + rowKeyLabel0(p, r);
const rowKeyLabel0 = (p, r) => r.key === 'area' && keyOf(p, r.cat) === 'heat' ? 'Grundkosten nach Wohnfläche' : r.key === 'm:heat' ? 'Verbrauchskosten (Wärmezähler)' : KEYL(r.key);

  const keyTxt = r => { if (r.key === 'heat') return ''; const s = KEY_SHORT[r.key]; const pd = daysBetween(R.from, R.to) + 1, part = t.days < pd ? ` · anteilig ${t.days} von ${pd} Tagen` : '';
    if (r.key === 'area' && catById(r.cat)?.gew) return `${fmtNum(num(t.u.area), 2)} m² von ${fmtNum(sum(unitsOf(p).filter(isCommercial), u => num(u.area)), 2)} m² Gewerbefläche${part}`;
    if (r.key === 'area') return `${fmtNum(num(t.u.area), 2)} m² von ${fmtNum(propArea(p), 2)} m²${part}`; if (r.key === 'mea') return `${fmtNum(num(t.u.mea), 2)} von ${fmtNum(sum(unitsOf(p), u => num(u.mea)), 2)} MEA${part}`; if (r.key === 'persons') return `${fmtNum(r.mine, 0)} von ${fmtNum(r.W, 0)} Personentagen`; if (r.key === 'units') return `${fmtNum(r.mine, 0)} von ${fmtNum(r.W, 0)} Einheitstagen`; if (r.key.startsWith('m:')) return `${fmtNum(r.mine, 2)} von ${fmtNum(r.W, 2)} ${s}`; if (r.key === 'direct') return 'direkt'; return `${fmtNum(r.mine, 2)} von ${fmtNum(r.W, 2)}`; };
  const partial = t.from !== R.from || t.to !== R.to;
  return `${letterhead()}${addressBlock(tenantAddressLines(c))}<div class="right">${placeDate()}</div>
  <h1>${t.commercial ? 'Nebenkostenabrechnung' : 'Betriebskostenabrechnung'} ${R.year}</h1>
  <p><b>Mietobjekt:</b> ${esc(propAddress(p))}, ${esc(t.u.name)}${t.u.area ? ` (${fmtNum(num(t.u.area), 2)} m²)` : ''}<br><b>Abrechnungszeitraum:</b> ${fmtDate(R.from)} – ${fmtDate(R.to)}${partial ? `<br><b>Ihr Nutzungszeitraum:</b> ${fmtDate(t.from)} – ${fmtDate(t.to)} (${t.days} Tage)` : ''}</p>
  <p>${esc(tenantSalutation(c))},</p><p>hiermit erhalten Sie die Abrechnung der Betriebskosten für den oben genannten Zeitraum.</p>
  <table><thead><tr><th>Kostenart</th><th class="r">Gesamtkosten Haus</th><th>Verteilung</th><th class="r">Ihr Anteil</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td>${esc(catName(r.cat))}</td><td class="r">${fmtMoney(r.total)}</td><td>${esc(rowKeyLabel(p, r))}<br><span class="small muted">${esc(keyTxt(r))}</span></td><td class="r">${fmtMoney(r.amount)}</td></tr>`).join('')}
  </tbody><tfoot><tr><td colspan="3">Ihre Kosten</td><td class="r">${fmtMoney(t.cost)}</td></tr><tr><td colspan="3" style="font-weight:400">abzüglich Ihrer Vorauszahlungen${t.vatRate ? ' (netto)' : ''}</td><td class="r" style="font-weight:400">− ${fmtMoney(t.prepaid)}</td></tr>${t.vatRate ? `<tr><td colspan="3" style="font-weight:400">Ergebnis netto</td><td class="r" style="font-weight:400">${fmtMoney(t.resultNet)}</td></tr><tr><td colspan="3" style="font-weight:400">zzgl. Umsatzsteuer ${t.vatRate} %</td><td class="r" style="font-weight:400">${fmtMoney(t.vatAmt)}</td></tr>` : ''}<tr><td colspan="3">${t.result > 0 ? 'Nachzahlung' : 'Guthaben'}</td><td class="r big">${fmtMoney(Math.abs(t.result))}</td></tr></tfoot></table>
  ${rows.some(r => r.key === 'heat' || r.key === 'm:heat') ? `<p class="small">Heizkosten: ${data.settings.heatPct} % nach erfasstem Verbrauch, ${100 - data.settings.heatPct} % nach Wohnfläche (Heizkostenverordnung).</p>` : ''}
  <div class="box">${t.result > 0 ? `Bitte überweisen Sie die Nachzahlung von <b>${fmtMoney(t.result)}</b> innerhalb von 30 Tagen${data.owner.iban ? ` auf das Konto IBAN ${esc(fmtIban(data.owner.iban))}` : ''}.` : `Ihr Guthaben von <b>${fmtMoney(-t.result)}</b> ${isActive(c) ? 'verrechne ich mit der nächsten Mietzahlung' : 'überweise ich auf Ihr Konto'}${!isActive(c) && c.iban ? ` (IBAN ${esc(fmtIban(c.iban))})` : ''}.`}</div>
  ${isActive(c) && Math.abs(t.suggest - (t.term.nk + t.term.heat)) >= 1 ? `<p>Auf Grundlage dieser Abrechnung passe ich die monatliche Vorauszahlung an${t.commercial ? '' : ' (§ 560 Abs. 4 BGB)'}: ab ${fmtDate(addMonths(today().slice(0, 8) + '01', 2))} beträgt sie <b>${fmtMoney(t.suggest)}</b>${t.vatRate ? ' netto' : ''} statt bisher ${fmtMoney(t.term.nk + t.term.heat)}. Ihre Gesamtmiete beträgt dann ${fmtMoney(t.term.rent + t.suggest)}${t.vatRate ? ` netto zzgl. ${t.vatRate} % USt (${fmtMoney(r2((t.term.rent + t.suggest) * (1 + t.vatRate / 100)))} brutto)` : ''}.</p>` : ''}
  ${t.labor > 0 && !t.commercial ? `<p class="small"><b>Steuerhinweis (§ 35a EStG):</b> In Ihren Kosten sind Arbeitskosten für haushaltsnahe Dienstleistungen und Handwerkerleistungen von <b>${fmtMoney(t.labor)}</b> enthalten (z. B. Hausreinigung, Gartenpflege, Winterdienst, Schornsteinfeger). Diesen Betrag können Sie in Ihrer Steuererklärung angeben.</p>` : ''}

  <p>Mit freundlichen Grüßen</p><div class="sig"><div>${esc(data.owner.name)}</div><div style="border:0"></div></div>${ownerFoot()}`;

Zwischen
**{{VERMIETER}}**, {{VERMIETER_ANSCHRIFT}}

und

wird folgender Mietvertrag geschlossen:

## § 1 Mietsache
(1) Vermietet wird die Wohnung **{{WOHNUNG}}** ({{LAGE}}) im Haus {{OBJEKT_ANSCHRIFT}}.
(2) Die Wohnung hat {{ZIMMER}} Zimmer und eine Wohnfläche von ca. {{FLAECHE}}. Die Flächenangabe dient der Beschreibung, nicht der Festlegung der Mietsache.

## § 2 Mietzeit
(1) Das Mietverhältnis beginnt am **{{BEGINN}}** und läuft auf unbestimmte Zeit.
(2) Die Kündigung muss schriftlich erfolgen. Es gelten die gesetzlichen Kündigungsfristen (§§ 573, 573c BGB).
(3) Setzt der Mieter den Gebrauch nach Ablauf der Mietzeit fort, verlängert sich das Mietverhältnis nicht stillschweigend (§ 545 BGB ist ausgeschlossen).

## § 3 Miete und Betriebskosten
(1) Die Miete beträgt monatlich:
| Grundmiete (kalt) | {{KALTMIETE}} |
| Vorauszahlung Betriebskosten | {{BK}} |
| Vorauszahlung Heizung und Warmwasser | {{HK}} |
| **Gesamtmiete** | **{{GESAMTMIETE}}** |
(2) Der Mieter trägt die Betriebskosten im Sinne der Betriebskostenverordnung (BetrKV) in ihrer jeweils gültigen Fassung. Über die Vorauszahlungen wird jährlich abgerechnet. Nach einer Abrechnung können die Vorauszahlungen angemessen angepasst werden (§ 560 Abs. 4 BGB).
(3) Die Heiz- und Warmwasserkosten werden nach der Heizkostenverordnung verteilt. Die übrigen Betriebskosten werden nach Wohnfläche verteilt, soweit nicht nach Verbrauch, Personen oder Einheiten abgerechnet wird.
(4) Die Miete ist monatlich im Voraus, spätestens bis zum dritten Werktag eines Monats, zu zahlen auf das Konto:
IBAN {{IBAN}} bei {{BANK}}. Maßgeblich ist der Eingang des Geldes.

## § 4 Mietsicherheit (Kaution)
(1) Der Mieter leistet eine Kaution von **{{KAUTION}}**. Er darf sie in drei gleichen monatlichen Teilzahlungen erbringen; die erste ist zu Beginn des Mietverhältnisses fällig (§ 551 BGB).

/** Einfache Auszeichnung: # Titel, ## Abschnitt, **fett**, | Tabelle |, [ ] Kästchen, [[UNTERSCHRIFT:A|B]] */
function tplRender(text, vals) {
  const fill = s => s.replace(/\{\{([A-Z_]+)\}\}/g, (_, k) => vals[k] ?? '');
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[ \]/g, '<span class="chk"></span>').replace(/\[x\]/gi, '<span class="chk">✓</span>');
  const lines = fill(text).split('\n'); let html = '', table = null, para = [];
  const flushP = () => { if (para.length) { html += `<p>${para.map(inline).join('<br>')}</p>`; para = []; } };
  const flushT = () => { if (table) { html += `<table>${table.map((r, i) => `<tr>${r.map(c => i === 0 && table.headerRow ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</table>`; table = null; } };
  lines.forEach(raw => {
    const l = raw.trimEnd();
    if (l.startsWith('§TABLE§')) { flushP(); flushT(); const rows = JSON.parse(l.slice(7)); html += `<table><tr>${rows[0].map(h => `<th>${esc(h)}</th>`).join('')}</tr>${rows.slice(1).map(r => `<tr>${r.map(c => `<td style="height:7mm">${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`; return; }
    if (/^\|.*\|$/.test(l)) { flushP(); const cells = l.slice(1, -1).split('|').map(s => s.trim()); if (!table) { table = []; table.headerRow = /^#|Raum|Schlüssel|Zähler|Mietinteressent/.test(cells.join(' ')) || cells[0] === ''; } table.push(cells); return; }
    flushT();
    if (!l.trim()) { flushP(); return; }
    const sig = l.match(/^\[\[UNTERSCHRIFT:(.+)\]\]$/); if (sig) { flushP(); html += `<div class="sig">${sig[1].split('|').map(s => `<div>${esc(s)}</div>`).join('')}</div>`; return; }
    if (l.startsWith('## ')) { flushP(); html += `<h2>${inline(l.slice(3))}</h2>`; return; }
    if (l.startsWith('# ')) { flushP(); html += `<h1>${inline(l.slice(2))}</h1>`; return; }
    para.push(l);
  });
  flushP(); flushT();
  return html;
}

  if (!data.properties.length) return `<div class="hero"><div><h2>Willkommen bei ${APPNAME}</h2><div class="big" style="font-size:30px">Lass uns dein erstes Haus anlegen.</div><p>Danach die Wohnungen, die Mieter – und schon siehst du hier jeden Monat, wer gezahlt hat.</p><div style="margin-top:16px"><button class="btn" data-act="newProperty">${svg('plus')} Erstes Haus anlegen</button></div></div></div>`;
  const m = ym(today()), rows = data.contracts.map(c => ({ c, s: monthStatus(c, m) })).filter(x => x.s);
  const soll = sum(rows, r => r.s.total), paid = sum(rows, r => r.s.paid), pct = soll ? Math.min(100, paid / soll * 100) : 0;
  const lettable = data.units.filter(u => !['Stellplatz', 'Garage'].includes(u.type)), occ = lettable.filter(u => currentContract(u));
  const y = new Date().getFullYear(), income = sum(data.payments.filter(p => yearOf(p.date) === y), p => p.amount), costs = sum(data.costs.filter(c => yearOf(c.date) === y), c => c.amount);
  const arr = tenantsInArrears(), unpaid = rows.filter(r => r.s.open > 0.004 && r.s.due <= today());
  const todo = [];
  nkDue().forEach(d => todo.push([d.days < 60 ? 'red' : 'gold', 'calc', `Nebenkostenabrechnung ${d.year} für ${d.p.name}`, `spätestens bis ${fmtDate(d.deadline)} – noch ${plural(d.days, 'Tag', 'Tage')}`, `go:nk:${d.p.id}`]));
  data.contracts.filter(c => c.end && c.end >= today() && c.end <= addDays(today(), 90)).forEach(c => todo.push(['blue', 'door', `${tenantShort(c)} zieht aus`, `am ${fmtDate(c.end)} · Zähler ablesen, Übergabe, Kaution`, `openContract:${c.id}`]));
  data.contracts.filter(c => c.start > today() && c.start <= addDays(today(), 60)).forEach(c => todo.push(['sea', 'users', `${tenantShort(c)} zieht ein`, `am ${fmtDate(c.start)} · Wohnungsgeberbestätigung nicht vergessen`, `letterRegister:${c.id}`]));
  data.contracts.filter(c => isActive(c) && num(c.deposit) > 0 && !c.depositPaid).forEach(c => todo.push(['gold', 'shield', `Kaution von ${tenantShort(c)} fehlt`, fmtMoney(c.deposit), `depositIn:${c.id}`]));
  data.contracts.filter(c => c.end && c.end < today() && c.depositPaid && !c.depositBack).forEach(c => todo.push(['gold', 'shield', `Kaution ${tenantShort(c)} abrechnen`, `ausgezogen am ${fmtDate(c.end)}`, `letterDeposit:${c.id}`]));
  data.contracts.filter(c => typeof indexDue === 'function' && indexDue(c)).forEach(c => todo.push(['sea', 'calc', `Indexmiete ${tenantShort(c)} prüfen`, `letzte Anpassung vor über 12 Monaten`, `indexCheck:${c.id}`]));
  if (IS_PRO) data.contracts.filter(c => c.term && c.term >= today() && c.term <= addMonths(today(), 9)).forEach(c => todo.push(['gold', 'calendar', `Feste Mietzeit ${tenantShort(c)} endet`, `am ${fmtDate(c.term)} · Verlängerung / Option klären`, `openContract:${c.id}`]));
  const mo = new Date().getMonth(); if ((mo === 11 || mo === 0) && data.meters.length) todo.push(['blue', 'gauge', 'Zähler zum Jahreswechsel ablesen', 'Stand am 31.12. für die Abrechnung', 'readMeters:']);
  data.tickets.filter(t => t.status !== 'Erledigt').slice(0, 4).forEach(t => todo.push([TICKET_CLS[t.status], 'wrench', t.title, `${t.status} · ${unitLabel(unitById(t.unit)) || propById(t.property)?.name || ''}`, `editTicket:${t.id}`]));
  const bk = data.meta.lastBackup ? daysBetween(data.meta.lastBackup.slice(0, 10), today()) : 999; if (bk >= (data.settings.backupDays || 14)) todo.push(['red', 'download', 'Datensicherung machen', data.meta.lastBackup ? `zuletzt vor ${plural(bk, 'Tag', 'Tagen')}` : 'noch nie gesichert', 'backup']);
  return `<div class="hero"><div><h2>Mieteingang ${MONTHS[Number(m.slice(5)) - 1]}</h2><div class="big">${fmtMoney(paid)} <small>von ${fmtMoney(soll)}</small></div><div class="meter"><i style="width:${pct}%"></i></div><p>${unpaid.length ? `${plural(unpaid.length, 'Miete', 'Mieten')} noch nicht eingegangen.` : rows.length ? 'Alle fälligen Mieten sind da. 👍' : 'Noch keine Mieten in diesem Monat.'}</p>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn" data-go="rent">${svg('euro')} Mieteingang</button><button class="btn" data-act="importBank">${svg('upload')} Kontoauszug einlesen</button></div></div>
    <div class="stats"><div><b>${occ.length}/${lettable.length}</b><span>Wohnungen vermietet</span></div><div><b>${fmtMoney(sum(activeContracts(), c => termAt(c, today()).rent)).replace(',00', '')}</b><span>Kaltmiete pro Monat</span></div><div><b>${fmtMoney(income).replace(',00', '')}</b><span>Einnahmen ${y}</span></div><div><b>${fmtMoney(costs).replace(',00', '')}</b><span>Ausgaben ${y}</span></div></div></div>
  <div class="grid g2">
    <div class="card pad"><div class="sec-t"><h3>${svg('alert')} Noch nicht gezahlt</h3><button class="btn btn-sm" data-go="rent">Alle</button></div>${unpaid.length ? `<div class="list">${unpaid.map(({ c, s }) => `<div class="li">${avatar(c, s.due < today() ? 'red' : 'gold')}<div class="grow"><b>${esc(tenantName(c))}</b><div class="small muted">${esc(unitLabel(unitById(c.unit)))} · fällig ${fmtDate(s.due)}</div></div><b class="amt">${fmtMoney(s.open)}</b><button class="btn btn-sm btn-sea" data-act="quickPay:${c.id}:${m}">${svg('check')}</button></div>`).join('')}</div>` : `<div class="empty" style="padding:20px"><b>Alles da</b>Diesen Monat fehlt keine Miete.</div>`}
      ${arr.filter(a => !unpaid.some(u => u.c.id === a.c.id)).length ? `<div class="note red" style="margin-top:10px">Ältere Rückstände: ${arr.filter(a => !unpaid.some(u => u.c.id === a.c.id)).map(a => `${esc(tenantShort(a.c))} ${fmtMoney(a.bal)}`).join(', ')}</div>` : ''}</div>
    <div class="card pad"><div class="sec-t"><h3>${svg('clipboard')} Zu erledigen</h3></div>${todo.length ? `<div class="list">${todo.map(([cls, ic, t, s, act]) => `<div class="li"><div class="av ${cls}">${svg(ic)}</div><div class="grow"><b>${esc(t)}</b><div class="small muted">${esc(s)}</div></div><button class="btn btn-sm" data-act="${act}">${svg('arrowr')}</button></div>`).join('')}</div>` : `<div class="empty" style="padding:20px"><b>Nichts zu tun</b>Zeit für einen Tee. ☕</div>`}</div>
  </div>
  <div class="grid g3" style="margin-top:16px">${data.properties.map(p => { const us = unitsOf(p), o = us.filter(u => currentContract(u)).length; return `<div class="card pad" style="cursor:pointer" data-go="properties"><div style="display:flex;gap:12px;align-items:center"><div class="av">${svg('building')}</div><div class="grow"><b>${esc(p.name)}</b><div class="small muted">${esc(propAddress(p))}</div></div></div><div class="bar brick" style="margin:12px 0 6px"><i style="width:${us.length ? o / us.length * 100 : 0}%"></i></div><div class="small muted">${o} von ${us.length} Einheiten vermietet · ${fmtNum(propArea(p), 0)} m²</div></div>`; }).join('')}</div>`;
};

async function readJsonFile() { const f = await pickFile('.json,application/json'); if (!f) return null; try { return JSON.parse(await f.text()); } catch (e) { toast('Die Datei ist keine ZackMiete-Sicherung.', { err: true }); return null; } }
ACTS.restore = async () => {
  const s = await readJsonFile(); if (!s) return; if (!String(s.app || '').startsWith('ZackMiete') || !s.data) return toast('Das ist keine ZackMiete-Sicherung.', { err: true });
  if (!await confirmBox(`Sicherung vom ${fmtDate(s.created.slice(0, 10))} laden? Alle Daten auf diesem Gerät werden ersetzt.`, 'Laden', true)) return;
  await store.clear(); photoCache.clear(); for (const [k, v] of Object.entries(s.photos || {})) { await store.set(k, v); photoCache.set(k, v); }

ACTS.syncIn = async () => {
  const s = await readJsonFile(); if (!s) return; if (!String(s.app || '').startsWith('ZackMiete') || !s.data) return toast('Das ist keine ZackMiete-Datei.', { err: true });
  if (s.device?.code && s.device.code === data.meta.device.code) return toast('Diese Datei kommt von diesem Gerät selbst (gleiches Kürzel).', { err: true });
  const r = mergeData(data, normalize(s.data));
  for (const [k, v] of Object.entries(s.photos || {})) if (!photoCache.has(k)) { await store.set(k, v); photoCache.set(k, v); }
  save(); render(); toast(`Abgleich fertig: ${r.added} neu, ${r.updated} aktualisiert, ${r.removed} gelöscht.`, { ms: 6000 });
};
function mergeData(mine, theirs) {
  const res = { added: 0, updated: 0, removed: 0 }, delMine = mine.meta.deleted || [], delTheirs = theirs.meta.deleted || [];
  const isDel = (list, col, id) => list.some(d => d.col === col && d.id === String(id));
  COLLECTIONS.forEach(col => {
    const map = new Map(mine[col].map(x => [String(x.id), x]));
    theirs[col].forEach(x => { const id = String(x.id); if (isDel(delMine, col, id)) return; const cur = map.get(id); if (!cur) { mine[col].push(x); res.added++; } else if ((x.updatedAt || '') > (cur.updatedAt || '')) { Object.keys(cur).forEach(k => delete cur[k]); Object.assign(cur, x); res.updated++; } });
    const before = mine[col].length; mine[col] = mine[col].filter(x => !isDel(delTheirs, col, String(x.id))); res.removed += before - mine[col].length;
  });
  mine.meta.deleted = [...delMine, ...delTheirs.filter(d => !isDel(delMine, d.col, d.id))];
  if ((theirs.meta.updated || '') > (mine.meta.updated || '')) { mine.owner = { ...mine.owner, ...theirs.owner }; mine.settings = { ...mine.settings, ...theirs.settings }; mine.cats = theirs.cats; }
  return res;
}
function mergePayments(a = [], b = []) { const m = new Map(a.map(p => [p.id, p])); b.forEach(p => { if (!m.has(p.id)) m.set(p.id, p); }); return [...m.values()].sort((x, y) => x.date.localeCompare(y.date)); }

ACTS.exportDatev = () => {
  const y0 = new Date().getFullYear(), S = data.settings;
  openForm({ title: 'DATEV-Export', wide: false, saveLabel: 'Datei speichern', intro: 'Erstellt einen Buchungsstapel mit allen Mieteingängen und Ausgaben eines Jahres. Dein Steuerberater liest die Datei in DATEV ein (Import → ASCII-Daten / Buchungsstapel).',
    fields: () => [{ k: 'year', label: 'Jahr', type: 'select', opts: [y0 - 2, y0 - 1, y0].map(String) }],
    save: x => {
      const y = Number(x.year), q = v => `"${String(v ?? '').replace(/"/g, '""')}"`, mon = v => fmtNum(Math.abs(v), 2).replace(/\./g, '');
      const acc = (k, d) => String(S[k] || d), len = Number(S.dvLen) || 4, now = new Date();
      const stamp = `${now.getFullYear()}${pad2(now.getMonth() + 1)}${pad2(now.getDate())}${pad2(now.getHours())}${pad2(now.getMinutes())}${pad2(now.getSeconds())}000`;
      const head = ['"EXTF"', 700, 21, '"Buchungsstapel"', 13, stamp, '', '"RE"', '""', '""', S.dvBerater || '', S.dvMandant || '', `${y}0101`, len, `${y}0101`, `${y}1231`, q(`ZackMiete ${y}`), '""', 1, 0, 0, '"EUR"'].join(';');
      const cols = 'Umsatz (ohne Soll/Haben-Kz);Soll/Haben-Kennzeichen;WKZ Umsatz;Kurs;Basis-Umsatz;WKZ Basis-Umsatz;Konto;Gegenkonto (ohne BU-Schlüssel);BU-Schlüssel;Belegdatum;Belegfeld 1;Belegfeld 2;Skonto;Buchungstext';
      const rows = [], ttmm = d => d.slice(8, 10) + d.slice(5, 7);
      data.payments.filter(p => yearOf(p.date) === y).sort((a, b) => a.date.localeCompare(b.date)).forEach(p => {
        const c = contractById(p.contract); if (!c) return; const vat = vatRateOf(c);
        rows.push([mon(p.amount), q(p.amount >= 0 ? 'S' : 'H'), q('EUR'), '', '', '', acc('dvBank', '1200'), vat ? acc('dvRentVat', '2750') : acc('dvRent', '2750'), vat ? q(S.dvBU || '3') : '""', ttmm(p.date), q(`M${p.date.replace(/-/g, '').slice(2)}`), '""', '', q(`Miete ${tenantShort(c)} ${unitById(c.unit)?.name || ''}`.slice(0, 60))].join(';'));
      });
      data.costs.filter(c => yearOf(c.date) === y).sort((a, b) => a.date.localeCompare(b.date)).forEach(c => {
        rows.push([mon(c.amount), q('S'), q('EUR'), '', '', '', c.cat === 'zinsen' ? acc('dvInterest', '2120') : acc('dvCost', '2350'), acc('dvBank', '1200'), '""', ttmm(c.date), q(c.invoice || ''), '""', '', q(`${catName(c.cat)} ${c.vendor || ''} ${propById(c.property)?.name || ''}`.trim().slice(0, 60))].join(';'));
      });
      if (!rows.length) return toast(`Für ${y} gibt es keine Buchungen.`, { err: true });
      const txt = [head, cols, ...rows].join('\r\n') + '\r\n';
      const bytes = new Uint8Array([...txt].map(ch => { const cp = ch.codePointAt(0); return cp === 8364 ? 128 : cp === 8211 ? 150 : cp < 256 ? cp : 63; }));
      downloadFile(`EXTF_Buchungsstapel_ZackMiete_${y}.csv`, new Blob([bytes], { type: 'text/csv' }));
      toast(`${plural(rows.length, 'Buchung', 'Buchungen')} exportiert.`);
    } }, { year: String(y0 - 1) });
};
