<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141719">
<meta name="description" content="ZackDart – die App für Dartvereine: Liga, Spielberichte, Tabelle, Zähler, Turniere, Mitglieder, Beiträge, Kasse. Offline, ohne Abo.">
<title>ZackDart</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19.5' fill='%23101214'/%3E%3Ccircle cx='20' cy='20' r='15.6' fill='none' stroke='%2314834b' stroke-width='3'/%3E%3Ccircle cx='20' cy='20' r='15.6' fill='none' stroke='%23d1202f' stroke-width='3' stroke-dasharray='4.9 4.9'/%3E%3Ccircle cx='20' cy='20' r='8.6' fill='none' stroke='%23f2e6c9' stroke-width='11.2'/%3E%3Ccircle cx='20' cy='20' r='2.6' fill='%2314834b'/%3E%3Ccircle cx='20' cy='20' r='1.2' fill='%23d1202f'/%3E%3C/svg%3E">
<style>:root{--g:#16794c;--g2:#0f5c39;--g3:#0b4a2e;--gl:#e6f4ec;--gll:#f2faf5;--gold:#f0a500;--goldl:#fff4d6;--red:#c8382f;--redl:#fdecea;--blue:#2f6fb5;--bluel:#e8f0fa;--ink:#17261f;--ink2:#34453d;--muted:#66776e;--bg:#f4f6f2;--card:#fff;--line:#e1e7e2;--line2:#eef2ee;--sh:0 1px 2px rgba(16,40,28,.06),0 4px 14px rgba(16,40,28,.06);--r:14px;--side:252px;color-scheme:light}
[data-theme=dark]{--g:#3fbf80;--g2:#62d39a;--g3:#9fe8c2;--gl:#16352a;--gll:#122a21;--gold:#ffbf3c;--goldl:#3a2f12;--red:#ff7a70;--redl:#3c1d1a;--blue:#7fb2ff;--bluel:#172a44;--ink:#e8f1ec;--ink2:#c9d7cf;--muted:#93a69b;--bg:#0f1714;--card:#17221d;--line:#26352e;--line2:#1d2a24;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--g)}
svg{width:18px;height:18px;flex:none}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:13px}.r{text-align:right}.nowrap{white-space:nowrap}
.app{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.brand{display:flex;gap:11px;align-items:center;padding:18px 18px 14px}
.crest{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,var(--g),var(--g3));color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;overflow:hidden;flex:none;box-shadow:0 3px 10px rgba(22,121,76,.3)}
.crest img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:15.5px;line-height:1.2;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted)}
.nav{flex:1;overflow:auto;padding:4px 10px 10px}
.nav h6{margin:14px 10px 5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 11px;border-radius:10px;cursor:pointer;color:var(--ink2);font-weight:550;text-align:left}
.nav button:hover{background:var(--gll)}
.nav button.on{background:var(--gl);color:var(--g2);font-weight:700}
.nav button.on svg{color:var(--g)}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--line2);color:var(--muted);border-radius:20px;padding:1px 8px}
.nav .cnt.warn{background:var(--goldl);color:#8a5a00}.nav .cnt.bad{background:var(--redl);color:var(--red)}
[data-theme=dark] .nav .cnt.warn{color:var(--gold)}
.side-foot{border-top:1px solid var(--line);padding:10px 14px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:space-between}
.main{flex:1;margin-left:var(--side);min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;gap:10px;padding:0 26px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1}
.iconbtn.burger{display:none}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.iconbtn:hover{border-color:var(--g);color:var(--g)}
.demo-bar{background:repeating-linear-gradient(135deg,#f0a500 0 14px,#f4b528 14px 28px);color:#3b2a00;font-weight:700;font-size:13px;text-align:center;padding:5px}
.content{padding:24px 26px 60px;max-width:1360px;width:100%}
.head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.head h2{margin:0;font-size:27px;letter-spacing:-.02em;line-height:1.15}
.head p{margin:4px 0 0;color:var(--muted);max-width:640px}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:8px 14px;font-weight:650;cursor:pointer;white-space:nowrap;color:var(--ink);text-decoration:none;font-size:14.5px}
.btn:hover{border-color:var(--g)}
.btn-p{background:var(--g);border-color:var(--g);color:#fff}
.btn-p:hover{background:var(--g2);border-color:var(--g2)}
[data-theme=dark] .btn-p{color:#06261a}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#2e2100}
.btn-red{color:var(--red)}.btn-red:hover{border-color:var(--red)}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi .ic{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;background:var(--gl);color:var(--g);display:grid;place-items:center}
.kpi.gold .ic{background:var(--goldl);color:#b77d00}.kpi.red .ic{background:var(--redl);color:var(--red)}.kpi.blue .ic{background:var(--bluel);color:var(--blue)}
.hero{background:linear-gradient(120deg,var(--g3),var(--g) 60%,#2a9a63);color:#fff;border-radius:18px;padding:22px 24px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:relative;overflow:hidden;margin-bottom:16px}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h2{margin:0;font-size:24px}.hero p{margin:4px 0 0;opacity:.85}
.hero .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.22)}
[data-theme=dark] .hero{background:linear-gradient(120deg,#0c3a25,#14603e 60%,#1a7a4f)}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-t h3{margin:0;font-size:16px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li b{font-weight:650}
.av{width:36px;height:36px;border-radius:50%;background:var(--gl);color:var(--g2);display:grid;place-items:center;font-weight:750;font-size:13px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.gold{background:var(--goldl);color:#9a6700}.av.blue{background:var(--bluel);color:var(--blue)}.av.red{background:var(--redl);color:var(--red)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{position:relative;flex:1;min-width:220px;max-width:360px}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip i{font-style:normal;opacity:.6;margin-left:3px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:650;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--gll);white-space:nowrap}
.tbl td{padding:11px 14px;border-top:1px solid var(--line2);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl tbody tr:hover td{background:var(--gll)}
.tbl tr.click{cursor:pointer}
.tbl .sub{display:block;font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow:auto;border-radius:var(--r)}
.tbl tfoot td{font-weight:750;border-top:2px solid var(--line);background:var(--gll)}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--line2);color:var(--ink2);white-space:nowrap}
.pill.g{background:var(--gl);color:var(--g2)}.pill.gold{background:var(--goldl);color:#8a5a00}.pill.red{background:var(--redl);color:var(--red)}.pill.blue{background:var(--bluel);color:var(--blue)}
[data-theme=dark] .pill.gold{color:var(--gold)}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--g)}.neg{color:var(--red)}
.rowacts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:5px;min-width:220px;z-index:40}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 11px;border-radius:8px;cursor:pointer;font-weight:550}
.menu button:hover{background:var(--gll)}
.menu button.red{color:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(12,28,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:60;overflow:auto}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:92vh}
.modal.wide{max-width:900px}.modal.xwide{max-width:1100px}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;flex:1;font-size:19px}
.modal-b{padding:20px 22px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f .l{margin-right:auto}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:650;color:var(--ink2)}
.f label .req{color:var(--red)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid color-mix(in srgb,var(--g) 35%,transparent);border-color:var(--g)}
.f textarea{min-height:80px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.f .err{font-size:12px;color:var(--red)}
.f.check{flex-direction:row;align-items:center;gap:9px}
.f.check input{width:18px;height:18px;accent-color:var(--g)}
.f.check label{font-weight:550}
.fsec{grid-column:1/-1;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--g);margin-top:8px;padding-top:10px;border-top:1px solid var(--line2)}
.fsec:first-child{margin-top:0;padding-top:0;border-top:0}
.note{background:var(--gll);border:1px solid var(--gl);border-radius:12px;padding:11px 14px;font-size:13.5px;color:var(--ink2)}
.note.gold{background:var(--goldl);border-color:#f6dc9a;color:#5c4200}
.note.red{background:var(--redl);border-color:#f3c3be;color:#7a1c15}
[data-theme=dark] .note.gold{color:var(--gold);border-color:#5a4615}[data-theme=dark] .note.red{color:var(--red);border-color:#5a2520}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--card);padding:11px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:550;max-width:min(560px,92vw);display:flex;gap:12px;align-items:center}
.toast.err{background:var(--red);color:#fff}
.toast button{background:none;border:0;color:var(--gold);font-weight:800;cursor:pointer}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:650;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--g2);border-bottom-color:var(--g)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .dh{background:var(--gll);font-size:12px;font-weight:700;color:var(--muted);padding:8px;text-align:center}
.cal .d{background:var(--card);min-height:96px;padding:6px;cursor:pointer;font-size:13px}
.cal .d.o{background:var(--bg);color:var(--muted)}
.cal .d.t .n{background:var(--g);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.cal .n{font-weight:700;width:24px;height:24px;display:grid;place-items:center}
.cal .ev{display:block;font-size:11.5px;border-radius:6px;padding:2px 5px;margin-top:3px;background:var(--gl);color:var(--g2);font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;width:100%;text-align:left;cursor:pointer}
.cal .ev.gold{background:var(--goldl);color:#8a5a00}.cal .ev.blue{background:var(--bluel);color:var(--blue)}.cal .ev.red{background:var(--redl);color:var(--red)}
.bar{height:8px;background:var(--line2);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:8px}
.bar.gold i{background:var(--gold)}.bar.red i{background:var(--red)}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.att label{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:8px 10px;cursor:pointer;font-weight:550}
.att label:has(input:checked){background:var(--gl);border-color:var(--g)}
.att input{width:18px;height:18px;accent-color:var(--g)}
.photo-box{display:flex;gap:12px;align-items:center}
.photo-box .av{width:64px;height:64px;font-size:20px}
.sig{border:1.5px dashed var(--line);border-radius:12px;background:#fff;width:100%;height:150px;touch-action:none}
.agenda-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--gll)}
.agenda-item h4{margin:0 0 8px;font-size:15px}
.vote{display:grid;grid-template-columns:repeat(3,1fr) 1.3fr;gap:8px;margin-top:8px}
.vote input,.vote select{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--card);width:100%}
.chart{width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ob{max-width:620px;margin:6vh auto;padding:0 16px}
.ob .card{padding:28px}
.ob h1{margin:0 0 6px;font-size:28px;letter-spacing:-.02em}
.steps{display:flex;gap:6px;margin:0 0 18px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps i.on{background:var(--g)}
.scrim{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .side{transform:translateX(-102%);box-shadow:0 0 40px rgba(0,0,0,.2)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .main{margin-left:0}.iconbtn.burger{display:grid}
  .top{padding:0 14px}.content{padding:16px 14px 70px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .fg,.fg.c3{grid-template-columns:minmax(0,1fr)}
  .head h2{font-size:23px}
  .tbl .hm{display:none}
  .kv{grid-template-columns:110px 1fr}
  .cal .d{min-height:62px;padding:4px}.cal .ev{font-size:10px;padding:1px 3px}
  .vote{grid-template-columns:repeat(3,1fr)}.vote select{grid-column:1/-1}
}
@media (max-width:520px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:21px}.modal-bg{padding:0}.modal{border-radius:0;max-height:100vh;min-height:100vh}}
/* ---------- Dart ---------- */
.dsheet select,.dsheet input{padding:7px 9px;font-size:14px}
.scorer{max-width:980px}
.sc-top{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.sc-players{display:grid;gap:12px}
.sc-p{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--sh);transition:border-color .15s}
.sc-p.on{border-color:var(--g);box-shadow:0 0 0 4px var(--gl)}
.sc-name{font-weight:800;font-size:17px;display:flex;gap:8px;align-items:center}
.sc-rest{font-size:72px;font-weight:900;line-height:1;margin:8px 0 4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sc-legs{font-size:14px;color:var(--muted);min-height:18px}
.sc-stats{display:flex;gap:12px;font-size:13px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.sc-last{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;min-height:26px}
.sc-last i{font-style:normal;font-size:13px;background:var(--line2);border-radius:8px;padding:3px 8px;font-weight:700}
.sc-last i.bust{background:var(--redl);color:var(--red)}
.sc-co{text-align:center;font-size:17px;margin:14px 0 10px;min-height:24px}
.sc-co b{color:var(--g);font-size:20px}
.sc-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:0 auto}
.sc-in{grid-column:1/-1;text-align:center;font-size:38px;font-weight:800;padding:8px;border:2px solid var(--line);border-radius:14px;background:var(--card);min-height:64px}
.sc-pad button,.sc-quick button,.cr-pad button{font:inherit;font-size:24px;font-weight:700;padding:14px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;touch-action:manipulation}
.sc-pad button:active,.sc-quick button:active,.cr-pad button:active{transform:scale(.97)}
.sc-pad .btn-p,.cr-pad .btn-p{background:var(--g);color:#fff;border-color:var(--g)}
.sc-quick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:620px;margin:12px auto 0}

const fmtMoney = n => (Number(n) || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
const fmtNum = (n, d = 0) => (Number(n) || 0).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const pad2 = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => isoDate(new Date());
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return isoDate(d); };
const addMonths = (s, n) => { const d = parseD(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return isoDate(d); };

const fmtDate = s => { if (!s) return ''; const [y, m, d] = String(s).split('-'); return d ? `${d}.${m}.${y}` : s; };

const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

const initials = s => String(s || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';

const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ---------- IBAN / Gläubiger-ID ---------- */
const cleanIban = s => String(s || '').replace(/\s+/g, '').toUpperCase();
function mod97(s) { let r = 0; for (const ch of s) { const v = /[A-Z]/.test(ch) ? String(ch.charCodeAt(0) - 55) : ch; for (const c of v) r = (r * 10 + Number(c)) % 97; } return r; }

const fmtIban = s => cleanIban(s).replace(/(.{4})/g, '$1 ').trim();
function credIdOk(s) { const c = cleanIban(s); if (!/^[A-Z]{2}\d{2}[A-Z0-9]{3}[A-Z0-9]{1,28}$/.test(c)) return false; return mod97(c.slice(7) + c.slice(0, 4)) === 1; }

/* ---------- Speicher (IndexedDB, Notfall localStorage) ---------- */
const store = (() => {
  let dbp = null, mode = 'idb';
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('kein IndexedDB'));
    let q; try { q = indexedDB.open(DB_NAME, 1); } catch (e) { return rej(e); }
    q.onupgradeneeded = () => q.result.createObjectStore('kv');
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); q.onblocked = () => rej(new Error('blockiert'));
  }));
  const tx = async (m, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('kv', m); const out = fn(t.objectStore('kv')); t.oncomplete = () => res(typeof out === 'function' ? out() : out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return {
    get mode() { return mode; },
    async init() { try { await open(); await tx('readonly', s => { s.count(); }); } catch (e) { mode = 'ls'; } return mode; },
    async get(k) { if (mode === 'ls') { try { const v = localStorage.getItem(LS_PREFIX + k); return v ? JSON.parse(v) : undefined; } catch (e) { return undefined; } } return tx('readonly', s => { let r; const q = s.get(k); q.onsuccess = () => { r = q.result; }; return () => r; }); },
    async set(k, v) { if (mode === 'ls') { localStorage.setItem(LS_PREFIX + k, JSON.stringify(v)); return; } return tx('readwrite', s => { s.put(v, k); }); },
    async del(k) { if (mode === 'ls') { localStorage.removeItem(LS_PREFIX + k); return; } return tx('readwrite', s => { s.delete(k); }); },
    async keys() { if (mode === 'ls') return Object.keys(localStorage).filter(k => k.startsWith(LS_PREFIX)).map(k => k.slice(LS_PREFIX.length)); return tx('readonly', s => { let r = []; const q = s.getAllKeys(); q.onsuccess = () => { r = q.result.map(String); }; return () => r; }); },
    async clear() { if (mode === 'ls') { Object.keys(localStorage).filter(k => k.startsWith(LS_PREFIX)).forEach(k => localStorage.removeItem(k)); return; } return tx('readwrite', s => { s.clear(); }); }
  };
})();

/* ---------- Fotos (getrennt gespeichert, damit die Hauptdaten klein bleiben) ---------- */
const photoCache = new Map();
const photoSrc = ref => !ref ? '' : String(ref).startsWith('data:') ? ref : (photoCache.get(ref) || '');
async function loadPhotos() { const ks = (await store.keys()).filter(k => k.startsWith('ph_')); for (const k of ks) photoCache.set(k, await store.get(k)); }
async function savePhoto(dataUrl) { const k = 'ph_' + pid(); await store.set(k, dataUrl); photoCache.set(k, dataUrl); return k; }
async function delPhoto(k) { if (!k || !String(k).startsWith('ph_')) return; await store.del(k); photoCache.delete(k); }
function shrinkImage(file, max = 1280, q = 0.82) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function pickFile(accept, capture) {

  let s = num(acc.opening);
  data.bookings.forEach(b => {

    if (b.type === 'transfer') { if (String(b.account) === String(acc.id)) s -= Math.abs(b.amount); if (String(b.to) === String(acc.id)) s += Math.abs(b.amount); }
    else if (String(b.account) === String(acc.id)) s += bookingAmount(b);

}

  bg.addEventListener('click', e => { if (e.target === bg && entry.down) closeModal(); entry.down = false; if (e.target.closest('[data-close]')) closeModal(); });

}

ACTS.importMembers = async () => {
  const file = await pickFile('.csv,text/csv,.txt'); if (!file) return;
  const text = await file.text(); const rows = parseCSV(text); if (rows.length < 2) return toast('Die Datei enthält keine Daten.', { err: true });
  const hd = rows[0].map(h => h.toLowerCase().replace(/[^a-zäöüß]/g, ''));
  const col = (...names) => { for (const n of names) { const i = hd.indexOf(n); if (i >= 0) return i; } for (const n of names) { const i = hd.findIndex(h => h.includes(n) && !(n === 'name' && h.includes('vorname'))); if (i >= 0) return i; } return -1; };
  const map = { first: col('vorname'), last: col('nachname', 'name'), birth: col('geburt'), street: col('straße', 'strasse', 'adresse'), zip: col('plz', 'postleitzahl'), city: col('ort', 'stadt', 'wohnort'), phone: col('telefon', 'tel'), mobile: col('handy', 'mobil'), email: col('email', 'mail'), joined: col('eintritt', 'mitgliedseit'), no: col('nr', 'nummer', 'mitgliedsnr'), iban: col('iban'), gender: col('anrede', 'geschlecht') };
  if (map.last < 0) return toast('Ich finde keine Spalte „Nachname“. Bitte die erste Zeile prüfen.', { err: true });
  const dt = s => { const r = /^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/.exec(String(s).trim()); if (!r) return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : ''; let y = Number(r[3]); if (y < 100) y += y > 30 ? 1900 : 2000; return `${y}-${pad2(r[2])}-${pad2(r[1])}`; };
  let n = 0;
  rows.slice(1).forEach(r => {
    const g = k => map[k] >= 0 ? String(r[map[k]] || '').trim() : '';
    if (!g('last')) return;
    const an = g('gender').toLowerCase();
    const m = { id: pid(), first: g('first'), last: g('last'), birth: dt(g('birth')), street: g('street'), zip: g('zip'), city: g('city'), phone: g('phone'), mobile: g('mobile'), email: g('email'), joined: dt(g('joined')) || today(), status: 'Aktiv', gender: an.startsWith('f') || an.startsWith('w') ? 'w' : an.startsWith('h') || an.startsWith('m') ? 'm' : 'd', groups: [], consent: { email: false, photos: false, publish: false }, fee: data.fees[0]?.id || '', pay: cleanIban(g('iban')) ? 'Lastschrift' : 'Überweisung', iban: cleanIban(g('iban')) };
    m.no = g('no') && !data.members.some(o => String(o.no) === g('no')) ? g('no') : nextMemberNo();
    data.members.push(touch(m)); n++;
  });
  save(); render(); toast(`${plural(n, 'Mitglied', 'Mitglieder')} eingelesen. Bitte Beitragsgruppe, Mandat und Einwilligungen prüfen.`, { ms: 7000 });
};
function parseCSV(text) {
  text = text.replace(/^﻿/, ''); const first = text.split(/\r?\n/)[0] || ''; const sep = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i]; if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; } else if (ch === '"') q = true; else if (ch === sep) { row.push(cell); cell = ''; } else if (ch === '\n') { row.push(cell.replace(/\r$/, '')); rows.push(row); row = []; cell = ''; } else cell += ch; }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}

function nextBirthday(m, from = today()) { if (!m.birth) return null; const f = parseD(from); let d = new Date(f.getFullYear(), Number(m.birth.slice(5, 7)) - 1, Number(m.birth.slice(8, 10))); if (d < new Date(f.getFullYear(), f.getMonth(), f.getDate())) d.setFullYear(d.getFullYear() + 1); return isoDate(d); }

const ROUND_AGES = [18, 30, 40, 50, 60, 65, 70, 75, 80, 85, 90, 95, 100];
const JUBILEES = [10, 25, 40, 50, 60, 70, 75];

  return head('Geburtstage & Ehrungen', 'Wer hat bald Geburtstag, wer feiert einen runden, wer ist 25 Jahre dabei? Mit Glückwunschbrief und Urkunde.', `<button class="btn" data-act="printBirthdays:${y}">${svg('print')} Jahresliste</button>`) +

/* ---------- Beitragslauf ---------- */
function periodStarts(fee, year) { const n = INTERVALS[fee.interval] || 1, step = 12 / n, sm = Number(fee.startMonth) || 1; return Array.from({ length: n }, (_, i) => { const mm = ((sm - 1 + i * step) % 12) + 1; const yy = year + Math.floor((sm - 1 + i * step) / 12); return `${yy}-${pad2(mm)}-01`; }); }
function periodLabel(fee, from) { const n = INTERVALS[fee.interval]; const to = addDays(addMonths(from, 12 / n), -1); if (n === 1) return Number(fee.startMonth || 1) === 1 ? from.slice(0, 4) : `${fmtDate(from)}–${fmtDate(to)}`; if (n === 12) return `${MONTHS[parseD(from).getMonth()]} ${from.slice(0, 4)}`; if (n === 4) return `${Math.floor(parseD(from).getMonth() / 3) + 1}. Quartal ${from.slice(0, 4)}`; return `${parseD(from).getMonth() < 6 ? '1.' : '2.'} Halbjahr ${from.slice(0, 4)}`; }
/** Vorschau: welche Beiträge würden für den Monat entstehen? */
function feeRunPreview(month) {
  const from0 = month + '-01', out = [];
  data.members.forEach(m => {
    const fee = feeOf(m); const fh = familyHead(m);
    if (fh && feeOf(fh)?.family && isMember(fh, from0)) return; // läuft über die Familie
    if (!fee || !(fee.amount > 0)) return;
    if (!periodStarts(fee, Number(month.slice(0, 4))).concat(periodStarts(fee, Number(month.slice(0, 4)) - 1)).includes(from0)) return;
    const n = INTERVALS[fee.interval], to = addDays(addMonths(from0, 12 / n), -1);
    if (m.status === 'Ausgetreten' && (!m.left || m.left < from0)) return;
    if (m.joined && m.joined > to) return;
    if (m.left && m.left < from0) return;
    const key = `${m.id}:${fee.id}:${from0}`;
    if (data.charges.some(c => c.key === key)) return;
    const base = feeAmountAt(fee, from0); let amount = base, note = '';
    if (data.settings.proRata && m.joined && m.joined > from0 && n === 1) { const months = 12 - Math.floor(daysBetween(from0, m.joined) / 30.44); amount = r2(base * Math.max(1, Math.min(12, months)) / 12); note = `anteilig ${Math.max(1, Math.min(12, months))}/12`; }
    out.push({ m, fee, amount, key, from: from0, to, period: periodLabel(fee, from0), note, title: `${fee.family ? 'Familienbeitrag' : 'Mitgliedsbeitrag'} ${periodLabel(fee, from0)}` });
  });
  // Abteilungsbeiträge: einmal pro Kalenderjahr – im Januar für alle, später für neu Hinzugekommene
  const yy = month.slice(0, 4), monthEnd = addDays(addMonths(from0, 1), -1);
  data.groups.filter(g => num(g.fee) > 0).forEach(g => data.members.filter(m => m.status !== 'Ehrenmitglied' && m.groups.map(String).includes(String(g.id)) && (!m.joined || m.joined <= monthEnd) && (!m.left || m.left >= from0) && (m.status !== 'Ausgetreten' || (m.left && m.left >= from0))).forEach(m => { const key = `${m.id}:grp${g.id}:${yy}-01-01`; if (!data.charges.some(c => c.key === key) && !out.some(x => x.key === key)) out.push({ m, fee: null, amount: num(g.fee), key, from: `${yy}-01-01`, to: `${yy}-12-31`, period: yy, note: 'Abteilung', title: `Abteilungsbeitrag ${g.name} ${yy}` }); }));
  return out.sort((a, b) => sortName(a.m).localeCompare(sortName(b.m)));
}

/* ---------- Zahl in Worten ---------- */
function numWords(n) {
  const e = ['null', 'ein', 'zwei', 'drei', 'vier', 'fünf', 'sechs', 'sieben', 'acht', 'neun', 'zehn', 'elf', 'zwölf', 'dreizehn', 'vierzehn', 'fünfzehn', 'sechzehn', 'siebzehn', 'achtzehn', 'neunzehn'];
  const z = ['', '', 'zwanzig', 'dreißig', 'vierzig', 'fünfzig', 'sechzig', 'siebzig', 'achtzig', 'neunzig'];
  const u100 = x => x < 20 ? e[x] : (x % 10 ? (x % 10 === 1 ? 'ein' : e[x % 10]) + 'und' : '') + z[Math.floor(x / 10)];
  const u1000 = x => (x >= 100 ? (Math.floor(x / 100) === 1 ? 'ein' : e[Math.floor(x / 100)]) + 'hundert' : '') + (x % 100 ? u100(x % 100) : '');
  if (n === 0) return 'null';
  let s = ''; const mio = Math.floor(n / 1e6), t = Math.floor((n % 1e6) / 1000), r = n % 1000;
  if (mio) s += (mio === 1 ? 'eine Million ' : u1000(mio) + ' Millionen ');
  if (t) s += u1000(t) + 'tausend';
  if (r) s += u1000(r);
  s = s.trim(); if (s.endsWith('ein')) s += 's';
  return s;
}
function euroWords(v) { const eu = Math.floor(r2(v)), ct = Math.round(r2(v) * 100) % 100; const w = numWords(eu); return `${w.charAt(0).toUpperCase() + w.slice(1)} Euro${ct ? ` und ${numWords(ct)} Cent` : ''}`; }

  const limit = c.exemptKind === 'Feststellungsbescheid (§ 60a AO)' ? 3 : 5; const age = daysBetween(c.exemptDate, today()) / 365.25;
  if (age > limit) return { cls: 'red', text: `Der ${esc(c.exemptKind)} ist älter als ${limit} Jahre. Bestätigungen werden vom Finanzamt dann nicht mehr anerkannt. Bitte neuen Bescheid eintragen.` };
  if (age > limit - 0.5) return { cls: 'gold', text: `Der ${esc(c.exemptKind)} wird bald ${limit} Jahre alt (vom ${fmtDate(c.exemptDate)}).` };

}

ACTS.receipt = async id => {
  const d = byId('donations', id); const ex = exemptCheck(); if (ex?.cls === 'red' || (ex && !data.club.taxOffice)) { toast('Bitte zuerst die Steuerdaten des Vereins in den Einstellungen eintragen.', { err: true }); go('settings'); return; }
  if (d.sammel) return toast(`Diese Spende steht schon in der Sammelbestätigung ${d.receiptNo}.`, { err: true });
  if (d.receiptNo && !await confirmBox(`Für diese Spende gibt es schon die Bestätigung ${esc(d.receiptNo)}. Nochmal drucken (Zweitschrift)?`, 'Drucken')) return;
  if (!d.receiptNo) { d.receiptNo = nextReceiptNo(); d.receiptDate = today(); upsert('donations', d); render(); }
  printHTML('Zuwendungsbestätigung', receiptBody(donorAddress(d), [d], { kind: d.kind, no: d.receiptNo }));
};
ACTS.yearReceipts = async y => {
  const groups = {};
  data.donations.filter(d => d.date.startsWith(y) && d.kind === 'Geldspende' && !d.receiptNo).forEach(d => (groups[donorKey(d)] ||= []).push(d));
  if (data.club.feesDeductible) data.charges.filter(c => c.kind === 'Mitgliedsbeitrag').forEach(c => c.payments.filter(p => p.date.startsWith(y) && !p.receiptNo).forEach(p => (groups['m' + c.member] ||= []).push({ id: 'fee:' + c.id + ':' + p.id, member: c.member, date: p.date, amount: p.amount, kindLabel: 'Mitgliedsbeitrag', fee: true, ref: p })));
  const keys = Object.keys(groups); if (!keys.length) return toast(`Für ${y} sind keine offenen Bestätigungen da.`);
  if (exemptCheck()?.cls === 'red' || !data.club.taxOffice) { toast('Bitte zuerst die Steuerdaten des Vereins in den Einstellungen eintragen.', { err: true }); return; }
  if (!await confirmBox(`${plural(keys.length, 'Sammelbestätigung', 'Sammelbestätigungen')} für ${y} erstellen und drucken?`, 'Erstellen')) return;
  const html = keys.map(k => { const rows = groups[k].sort((a, b) => a.date.localeCompare(b.date)); const no = nextReceiptNo(); rows.forEach(r => { if (r.fee) r.ref.receiptNo = no; else { const d = byId('donations', r.id); d.receiptNo = no; d.receiptDate = today(); d.sammel = true; touch(d); } }); if (rows.every(r => r.fee)) data.donations.push(touch({ id: pid(), receiptOnly: true, receiptNo: no, date: rows[0].date, member: rows[0].member, kind: 'Geldspende', amount: 0, purpose: 'Sammelbestätigung Mitgliedsbeiträge' })); return receiptBody(donorAddress(rows[0].member ? { member: rows[0].member } : rows[0]), rows, { sammel: true, no, from: `${y}-01-01`, to: `${y}-12-31` }); }).join('<div class="pb"></div>');
  save(); render(); printHTML(`Sammelbestätigungen ${y}`, html);
};

const isMatch = e => MATCH_KINDS.includes(e.kind);
const SCORE_UNITS = ['Tore', 'Punkte', 'Sätze', 'Legs'];
const scoreUnit = e => e?.unit || byId('groups', e?.group)?.scoreUnit || data.settings.scoreUnit || 'Tore';
const hasScore = e => e.scoreUs !== '' && e.scoreUs != null && e.scoreThem !== '' && e.scoreThem != null;

const OUT_CLS = { Sieg: 'g', Unentschieden: 'gold', Niederlage: 'red' };
const scoreText = e => hasScore(e) ? (e.venue === 'Auswärts' ? `${e.scoreThem}:${e.scoreUs}` : `${e.scoreUs}:${e.scoreThem}`) : '';
const pairing = e => { const us = groupName(e.group) || data.club.short || 'Wir', them = e.opponent || '?'; return e.venue === 'Auswärts' ? `${them} – ${us}` : `${us} – ${them}`; };
function matchSub(e) { if (!isMatch(e)) return ''; const parts = []; if (e.opponent) parts.push(`${e.venue === 'Auswärts' ? 'bei' : e.venue === 'Neutral' ? 'gegen' : 'gegen'} ${esc(e.opponent)}${e.venue === 'Heim' ? ' (Heim)' : ''}`); if (hasScore(e)) parts.push(`<b>${esc(scoreText(e))}</b>`); if (e.placement) parts.push(`<b>${esc(e.placement)}</b>`); return parts.join(' · '); }

function eventsOn(d) { return data.events.filter(e => e.date === d || (e.repeatUntil && e.repeat && e.date < d && e.repeatUntil >= d && ((e.repeat === 'weekly' && daysBetween(e.date, d) % 7 === 0) || (e.repeat === 'biweekly' && daysBetween(e.date, d) % 14 === 0)))).sort((a, b) => (a.time || '').localeCompare(b.time || '')); }
function calendarView(ym) {

function bindMeeting(m, t, md, draw) {
  if (t === 'agenda') {
    const sync = () => $$('.agT', md).forEach(i => { m.agenda[Number(i.dataset.i)].title = i.value; });
    $$('.agT', md).forEach(i => i.oninput = () => { sync(); touch(m); save(); });
    $$('[data-up]', md).forEach(b => b.onclick = () => { sync(); const i = Number(b.dataset.up); [m.agenda[i - 1], m.agenda[i]] = [m.agenda[i], m.agenda[i - 1]]; save(); draw('agenda'); });
    $$('[data-rm]', md).forEach(b => b.onclick = () => { sync(); m.agenda.splice(Number(b.dataset.rm), 1); save(); draw('agenda'); });
    $('#agAdd', md).onclick = () => { sync(); m.agenda.splice(Math.max(0, m.agenda.length - (m.agenda.at(-1)?.title === 'Verschiedenes' ? 1 : 0)), 0, { id: pid(), title: 'Neuer Punkt', text: '', votes: null }); save(); draw('agenda'); };
  }
  if (t === 'invite') {
    const txt = () => { m.inviteText = $('#ivT', md).value; save(); return m.inviteText; };
    $('#ivT', md).oninput = txt;
    $('#ivMail', md).onclick = () => { const r = inviteRecipients(m); openBccMail(r.mail.map(x => x.email), `Einladung ${m.kind} am ${fmtDate(m.date)}`, inviteMailText(m, txt())); };
    $('#ivCopy', md).onclick = () => copyEmails(inviteRecipients(m).mail.map(x => x.email));
    $('#ivPost', md).onclick = () => { txt(); const r = inviteRecipients(m); if (!r.post.length) return toast('Alle bekommen die Einladung per E-Mail.'); printHTML('Einladungen', r.post.map(x => inviteLetter(m, x)).join('<div class="pb"></div>')); };
    $('#ivAll', md).onclick = () => { txt(); printHTML('Einladung', inviteLetter(m, null)); };
    $('#ivDone', md).onclick = () => { m.invited = today(); upsert('meetings', m); toast('Als eingeladen markiert.'); draw('invite'); };
  }
  if (t === 'present') {
    const upd = () => { m.present = $$('.att input:checked', md).map(i => i.value); m.guests = Number($('#prG', md).value) || 0; m.chair = $('#prL', md).value; m.writer = $('#prP', md).value; touch(m); save(); $('#prN', md).textContent = `${m.present.length} anwesend`; };
    $$('.att input, #prG, #prL, #prP', md).forEach(i => i.onchange = upd); $('#prN', md).textContent = `${m.present.length} anwesend`;
  }
  if (t === 'protocol') {
    const sync = () => { m.start = $('#ptS', md).value; m.endTime = $('#ptE', md).value; $$('.ptT', md).forEach(tx => { const a = m.agenda[Number(tx.dataset.i)]; a.text = tx.value; const box = $(`[data-vote="${tx.dataset.i}"]`, md); a.votes = $(`.ptV[data-i="${tx.dataset.i}"]`, md).checked ? { yes: $('.vY', box).value, no: $('.vN', box).value, abst: $('.vA', box).value, text: $('.vT', box).value } : null; }); touch(m); save(); };
    $$('.ptV', md).forEach(c => c.onchange = () => { $(`[data-vote="${c.dataset.i}"]`, md).classList.toggle('hidden', !c.checked); sync(); });
    $$('#mtBody textarea, #mtBody input', md).forEach(i => i.addEventListener('change', sync));
    $('#ptSave', md).onclick = () => { sync(); toast('Gespeichert.'); };
    $('#ptPrint', md).onclick = () => { sync(); m.protocolDone = true; upsert('meetings', m); printHTML('Protokoll', protocolHTML(m)); };
  }
}
function inviteRecipients(m) { const ms = m.kind.includes('Vorstand') ? data.roles.filter(r => !r.until || r.until >= m.date).map(r => memberById(r.member)).filter(Boolean) : activeMembers().filter(x => !x.birth || ageOn(x.birth, m.date) >= 14); const uniq = [...new Map(ms.map(x => [x.id, x])).values()]; return { mail: uniq.filter(x => x.email && x.consent.email), post: uniq.filter(x => !(x.email && x.consent.email)) }; }
function inviteDefaultText(m) { return `hiermit laden wir dich herzlich zur ${m.kind} ein.\n\nAnträge zur Tagesordnung bitte bis spätestens eine Woche vorher schriftlich beim Vorstand einreichen.\n\nWir freuen uns auf dein Kommen!`; }
function inviteMailText(m, txt) { return `Hallo,\n\n${txt}\n\nWann: ${fmtDateLong(m.date)}${m.time ? ', ' + m.time + ' Uhr' : ''}\nWo: ${m.place}\n\nTagesordnung:\n${m.agenda.map((a, i) => `TOP ${i + 1}: ${a.title}`).join('\n')}\n\nViele Grüße\nDer Vorstand des ${data.club.name}`; }
function inviteLetter(m, x) { const v1 = roleHolder('1. Vorsitzende/r'); return `${letterhead()}${x ? addressBlock(x) : ''}<p class="right">${esc(data.club.city || '')}, ${fmtDate(m.invited || today())}</p><h1>Einladung zur ${esc(m.kind)}</h1><p>${x ? esc(salutation(x)) + ',' : 'Liebe Mitglieder,'}</p><p style="white-space:pre-wrap">${esc(m.inviteText || inviteDefaultText(m))}</p>
  <div class="box"><b>Wann:</b> ${fmtDateLong(m.date)}${m.time ? ', ' + esc(m.time) + ' Uhr' : ''}<br><b>Wo:</b> ${esc(m.place)}</div><h2>Tagesordnung</h2><table>${m.agenda.map((a, i) => `<tr><td style="width:18mm"><b>TOP ${i + 1}</b></td><td>${esc(a.title)}</td></tr>`).join('')}</table><p>Mit freundlichen Grüßen<br><br>${v1 ? esc(fullName(v1)) + '<br>1. Vorsitzende/r' : 'Der Vorstand'}</p>`; }
function protocolHTML(m) {
  const chair = memberById(m.chair), writer = memberById(m.writer), voters = m.present.map(memberById).filter(x => x && (!x.birth || ageOn(x.birth, m.date) >= 16)).length;
  return `${letterhead()}<h1>Protokoll der ${esc(m.kind)}</h1><table><tr><td style="width:45mm">Datum</td><td>${fmtDateLong(m.date)}</td></tr><tr><td>Ort</td><td>${esc(m.place)}</td></tr><tr><td>Beginn / Ende</td><td>${esc(m.start || m.time || '')} – ${esc(m.endTime || '')} Uhr</td></tr><tr><td>Versammlungsleitung</td><td>${esc(fullName(chair))}</td></tr><tr><td>Protokoll</td><td>${esc(fullName(writer))}</td></tr><tr><td>Anwesend</td><td>${plural(m.present.length, 'Mitglied', 'Mitglieder')}${m.kind.includes('Mitglieder') ? `, davon ${voters} stimmberechtigt` : ''}${m.guests ? `, ${plural(Number(m.guests), 'Gast', 'Gäste')}` : ''}${m.invited ? ` · eingeladen am ${fmtDate(m.invited)}` : ''}</td></tr></table>
  ${m.agenda.map((a, i) => `<h3>TOP ${i + 1}: ${esc(a.title)}</h3>${a.text ? `<p style="white-space:pre-wrap">${esc(a.text)}</p>` : ''}${a.votes ? `<div class="box"><b>Beschluss:</b> ${esc(a.votes.text || '')}<br>Abstimmung: ${esc(a.votes.yes || 0)} Ja · ${esc(a.votes.no || 0)} Nein · ${esc(a.votes.abst || 0)} Enthaltungen → <b>${Number(a.votes.yes || 0) > Number(a.votes.no || 0) ? 'angenommen' : 'abgelehnt'}</b></div>` : ''}`).join('')}
  <h3>Anwesenheitsliste</h3><p class="small">${m.present.map(memberLabel).filter(Boolean).sort().map(esc).join(', ')}</p>
  <div class="sig"><div>${esc(fullName(chair))}<br>Versammlungsleitung</div><div>${esc(fullName(writer))}<br>Protokoll</div></div>`;

/* ---------- Arbeitsstunden ---------- */
function hoursOf(mid, y) { return sum(data.hours.filter(h => String(h.member) === String(mid) && h.date.startsWith(String(y))), h => h.hours); }
function hoursTargetFor(m, y) { const s = data.settings; if (!(num(s.hoursTarget) > 0)) return 0; if (s.hoursExempt.includes(m.status) || m.status === 'Ausgetreten') return 0; const a = m.birth ? y - yearOf(m.birth) : 30; if (a < num(s.hoursFromAge) || a > num(s.hoursToAge)) return 0; if (m.joined && yearOf(m.joined) === y) return r2(num(s.hoursTarget) * (12 - Number(m.joined.slice(5, 7)) + 1) / 12); if (m.joined && yearOf(m.joined) > y) return 0; return num(s.hoursTarget); }
VIEWS.hours = () => {
  const y = Number(viewState.y || new Date().getFullYear()), s = data.settings, q = viewState.q || '';
  const rows = activeMembers().map(m => ({ m, h: hoursOf(m.id, y), t: hoursTargetFor(m, y) })).filter(r => r.t > 0 || r.h > 0).filter(r => matchQ(q, fullName(r.m))).sort((a, b) => (a.h - a.t) - (b.h - b.t));
  const entries = data.hours.filter(h => h.date.startsWith(String(y))).sort((a, b) => b.date.localeCompare(a.date));
  const missing = rows.filter(r => r.t > r.h);
  return head('Arbeitsstunden', num(s.hoursTarget) > 0 ? `Pflicht: ${fmtNum(num(s.hoursTarget), 1)} Stunden im Jahr (${fmtNum(s.hoursFromAge)}–${fmtNum(s.hoursToAge)} Jahre). Fehlende Stunden kosten ${fmtMoney(s.hoursRate)} je Stunde.` : 'Ehrenamtliche Stunden erfassen. Pflichtstunden kannst du in den Einstellungen festlegen.', `<button class="btn" data-act="chargeHours:${y}" ${missing.length ? '' : 'disabled'}>${svg('euro')} Ersatzbeträge berechnen</button><button class="btn btn-p" data-act="newHours">${svg('plus')} Stunden eintragen</button>`) +
  `<div class="grid g3" style="margin-bottom:16px">${kpi(`Stunden ${y}`, fmtNum(sum(entries, h => h.hours), 1), plural(entries.length, 'Eintrag', 'Einträge'), 'clock')}${kpi('Pflicht erfüllt', `${rows.filter(r => r.t > 0 && r.h >= r.t).length} / ${rows.filter(r => r.t > 0).length}`, 'Mitglieder', 'check', 'blue')}${kpi('Es fehlen', fmtNum(sum(missing, r => r.t - r.h), 1) + ' Std.', missing.length ? `= ${fmtMoney(sum(missing, r => (r.t - r.h) * num(s.hoursRate)))}` : 'alle erfüllt', 'alert', missing.length ? 'gold' : '')}</div>
  <div class="tools">${searchBox(q, 'Mitglied …')}${chips('y', [y - 1, y, y + 1].map(v => [v, String(v)]), y)}</div>
  <div class="grid g2"><div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Mitglied</th><th>Stand</th><th class="r">Std.</th></tr></thead><tbody>${rows.length ? rows.map(r => `<tr class="click" data-open="newHoursFor:${r.m.id}"><td><b>${esc(fullName(r.m))}</b></td><td style="width:45%">${r.t > 0 ? `<div class="bar ${r.h >= r.t ? '' : r.h >= r.t / 2 ? 'gold' : 'red'}"><i style="width:${Math.min(100, r.h / r.t * 100)}%"></i></div>` : '<span class="muted small">keine Pflicht</span>'}</td><td class="r nowrap">${fmtNum(r.h, 1)}${r.t > 0 ? ` / ${fmtNum(r.t, 1)}` : ''}</td></tr>`).join('') : '<tr><td colspan="3" class="muted">Keine Einträge.</td></tr>'}</tbody></table></div>
  <div class="card"><div class="sec-t pad" style="padding-bottom:0"><h3>Letzte Einträge</h3></div><div class="list" style="padding:0 18px 10px">${entries.slice(0, 15).map(h => `<div class="li"><div class="grow"><b>${esc(memberLabel(h.member))}</b><div class="muted small">${fmtDate(h.date)} · ${esc(h.task || '')}</div></div><b>${fmtNum(h.hours, 1)} Std.</b>${h.event ? '' : `<button class="iconbtn" data-act="delHours:${h.id}" aria-label="Löschen">${svg('trash')}</button>`}</div>`).join('') || '<p class="muted">Noch keine Stunden.</p>'}</div></div></div>`;
};
const hoursDef = () => ({ title: 'Arbeitsstunden eintragen', fields: () => [{ k: 'member', label: 'Mitglied', type: 'member', req: true }, { k: 'date', label: 'Datum', type: 'date', req: true }, { k: 'hours', label: 'Stunden', type: 'number', step: '0.25', req: true }, { k: 'task', label: 'Tätigkeit', list: ['Platzpflege', 'Thekendienst', 'Aufbau / Abbau', 'Reinigung Vereinsheim', 'Fahrdienst', 'Kuchen backen'] }], validate: v => v.hours <= 0 || v.hours > 24 ? 'Bitte eine Stundenzahl zwischen 0 und 24 eintragen.' : '', save: v => { upsert('hours', v); toast('Stunden eingetragen.'); } });
ACTS.newHours = () => openForm(hoursDef(), { id: pid(), date: today(), hours: 2 });
ACTS.newHoursFor = mid => openForm(hoursDef(), { id: pid(), member: mid, date: today(), hours: 2 });
ACTS.delHours = id => { removeFrom('hours', id); render(); };
ACTS.chargeHours = async y => { y = Number(y); const s = data.settings; const rows = activeMembers().map(m => ({ m, miss: r2(hoursTargetFor(m, y) - hoursOf(m.id, y)) })).filter(r => r.miss > 0 && !data.charges.some(c => c.key === `hrs:${r.m.id}:${y}`));
  if (!rows.length) return toast('Keine neuen Ersatzbeträge.');

  rows.forEach(r => data.charges.push(touch({ id: pid(), key: `hrs:${r.m.id}:${y}`, member: r.m.id, kind: 'Arbeitsstunden-Ersatz', title: `Arbeitsstunden ${y}: ${fmtNum(r.miss, 1)} Std. fehlen`, amount: r2(r.miss * num(s.hoursRate)), due: addDays(today(), s.payDays), period: String(y), payments: [] })));
  save(); render(); toast('Ersatzbeträge eingetragen. Sie stehen unter „Beiträge“.'); };

/* ---------- Inventar & Verleih ---------- */

  `<div class="tools">${searchBox(q, 'Name, Nr., Ort …')}${chips('f', [['Alle', 'Alle'], ['Verliehen', 'Verliehen'], ['Prüfung fällig', 'Prüfung fällig'], ...cats.map(c => [c, c])], f)}</div>

const BEST_KINDS = { '180': '180er', '171': '171er', 'HF': 'High Finish', 'SL': 'Short Leg' };
/* Vorlagen für Mannschaftsspiele: Reihenfolge der Spiele (E = Einzel, D = Doppel) */
const LEAGUE_TPL = {

/* ---------- Helfer ---------- */
const dLeague = id => data.dLeagues.find(l => String(l.id) === String(id));
const dTeam = (lg, id) => lg?.teams.find(t => String(t.id) === String(id));
const dTeamName = (lg, id) => { const t = dTeam(lg, id); return t ? (t.member ? fullName(memberById(t.member)) : t.name) : '–'; };
const dPlayerName = p => { const m = memberById(p); return m ? fullName(m) : (p || '–'); };
const dNeed = lg => Math.ceil((Number(lg?.bestOf) || 3) / 2);
const dGameWinner = (g, lg) => { const n = dNeed(lg), h = Number(g.lh) || 0, a = Number(g.la) || 0; return h === n && a < n ? 'h' : a === n && h < n ? 'a' : ''; };
function dMatchResult(m) {
  const lg = dLeague(m.league); const r = { gh: 0, ga: 0, lh: 0, la: 0, done: false };
  if (m.simple) { Object.assign(r, { gh: Number(m.simple.gh) || 0, ga: Number(m.simple.ga) || 0, lh: Number(m.simple.lh) || 0, la: Number(m.simple.la) || 0 }); r.done = !dSimpleError(m.simple, lg); return r; }
  (m.games || []).forEach(g => { r.lh += Number(g.lh) || 0; r.la += Number(g.la) || 0; const w = dGameWinner(g, lg); if (w === 'h') r.gh++; if (w === 'a') r.ga++; });
  r.done = !!m.games?.length && m.games.every(g => dGameWinner(g, lg));
  return r;
}
const dPlayed = m => m.done && dMatchResult(m).done;
/** Prüft ein reines Endergebnis auf Plausibilität (Anzahl Spiele, Legs) */
function dSimpleError(x, lg) {
  const n = dNeed(lg), total = (lg?.games || 'E').length, gh = Number(x.gh) || 0, ga = Number(x.ga) || 0, lh = Number(x.lh) || 0, la = Number(x.la) || 0;
  if (gh + ga === 0) return 'Bitte das Endergebnis eintragen.';
  if (gh + ga !== total) return `In dieser Liga gibt es ${total} Spiele je Begegnung – die Spiele müssen zusammen ${total} ergeben (eingetragen: ${gh + ga}).`;
  if (lh < gh * n || la < ga * n) return `Die Legs passen nicht: Wer ${gh} Spiele gewinnt, hat mindestens ${gh * n} Legs (Best of ${lg.bestOf}).`;
  if (lh > gh * n + ga * (n - 1) || la > ga * n + gh * (n - 1)) return 'Die Legs sind zu hoch für diese Anzahl Spiele.';
  return '';
}
/** Wird ein Mitglied im Dart-Bereich verwendet? */
const dartUsesMember = id => { id = String(id); return data.dLeagues.some(l => l.teams.some(t => String(t.member) === id || String(t.captain) === id || (t.roster || []).map(String).includes(id))) || data.dMatches.some(m => (m.games || []).some(g => [...(g.hp || []), ...(g.ap || [])].map(String).includes(id)) || (m.bests || []).some(b => String(b.p) === id)) || data.dTourneys.some(t => t.players.map(String).includes(id)) || data.dLegs.some(g => (g.players || []).some(q => String(q.p) === id)); };
function dTable(lg) {
  const P = lg.points || { win: 2, draw: 1, loss: 0 };
  const rows = Object.fromEntries(lg.teams.map(t => [t.id, { t, sp: 0, s: 0, u: 0, n: 0, pts: 0, gw: 0, gl: 0, lw: 0, ll: 0 }]));
  data.dMatches.filter(m => String(m.league) === String(lg.id) && dPlayed(m)).forEach(m => {
    const r = dMatchResult(m), h = rows[m.home], a = rows[m.away]; if (!h || !a) return;
    h.sp++; a.sp++; h.gw += r.gh; h.gl += r.ga; a.gw += r.ga; a.gl += r.gh; h.lw += r.lh; h.ll += r.la; a.lw += r.la; a.ll += r.lh;
    if (r.gh > r.ga) { h.s++; a.n++; h.pts += P.win; a.pts += P.loss; } else if (r.gh < r.ga) { a.s++; h.n++; a.pts += P.win; h.pts += P.loss; } else { h.u++; a.u++; h.pts += P.draw; a.pts += P.draw; }
  });
  return Object.values(rows).sort((x, y) => y.pts - x.pts || (y.gw - y.gl) - (x.gw - x.gl) || (y.lw - y.ll) - (x.lw - x.ll) || y.lw - x.lw || dTeamName(lg, x.t.id).localeCompare(dTeamName(lg, y.t.id), 'de'));
}
const ownSide = (lg, teamId) => { const t = dTeam(lg, teamId); return !!(t && (t.own || t.member)); };
/** Statistik je Mitglied aus Spielberichten, Turnieren und dem Zähler */
function dartStats(filter = {}) {
  const S = {}; const P = id => (S[id] ||= { id, es: 0, en: 0, ds: 0, dn: 0, lw: 0, ll: 0, n180: 0, n171: 0, hf: 0, sl: 0, pts: 0, darts: 0, n100: 0, n140: 0, legsSc: 0 });
  const inYear = d => !filter.year || String(d || '').startsWith(filter.year);
  data.dMatches.forEach(m => {
    const lg = dLeague(m.league); if (!lg || !m.done || !inYear(m.date) || (filter.league && String(m.league) !== String(filter.league))) return;
    (m.games || []).forEach(g => { const w = dGameWinner(g, lg); if (!w) return;
      [['h', g.hp, m.home], ['a', g.ap, m.away]].forEach(([side, ps, team]) => { if (!ownSide(lg, team)) return;
        const t = dTeam(lg, team), players = t?.member ? [t.member] : (ps || []).filter(p => memberById(p));
        players.forEach(p => { const s = P(p), dbl = g.t === 'D'; if (w === side) dbl ? s.ds++ : s.es++; else dbl ? s.dn++ : s.en++; s.lw += Number(side === 'h' ? g.lh : g.la) || 0; s.ll += Number(side === 'h' ? g.la : g.lh) || 0; }); }); });
    (m.bests || []).forEach(b => { if (!memberById(b.p)) return; const s = P(b.p), v = Number(b.v) || 0; if (b.k === '180') s.n180 += v || 1; if (b.k === '171') s.n171 += v || 1; if (b.k === 'HF') s.hf = Math.max(s.hf, v); if (b.k === 'SL' && v) s.sl = s.sl ? Math.min(s.sl, v) : v; });
  });
  if (!filter.league) data.dTourneys.forEach(t => { if (!inYear(t.date)) return; [...(t.rounds || []).flat(), ...(t.groups || []).flatMap(g => g.matches)].forEach(x => { if (!x || !x.w) return; [['a', x.a], ['b', x.b]].forEach(([k, p]) => { const dbl = !!t.teams?.[p]; (t.teams?.[p] || [p]).forEach(q => { if (!memberById(q)) return; const s = P(q); if (x.w === p) dbl ? s.ds++ : s.es++; else dbl ? s.dn++ : s.en++; s.lw += Number(k === 'a' ? x.la : x.lb) || 0; s.ll += Number(k === 'a' ? x.lb : x.la) || 0; }); }); }); });
  if (!filter.league) data.dLegs.forEach(g => { if (!inYear(g.date)) return; (g.players || []).forEach(q => { if (!memberById(q.p)) return; const s = P(q.p); s.pts += q.pts || 0; s.darts += q.darts || 0; s.f9p = (s.f9p || 0) + (q.f9p || 0); s.f9d = (s.f9d || 0) + (q.f9d || 0); s.bestAvg = Math.max(s.bestAvg || 0, q.darts ? q.pts / q.darts * 3 : 0); s.n180 += q.n180 || 0; s.n140 += q.n140 || 0; s.n100 += q.n100 || 0; if (q.hf) s.hf = Math.max(s.hf, q.hf); if (q.sl) s.sl = s.sl ? Math.min(s.sl, q.sl) : q.sl; s.legsSc += q.legs || 0; }); });
  return Object.values(S).map(s => ({ ...s, f9: s.f9d ? s.f9p / s.f9d * 3 : 0, avg: s.darts ? s.pts / s.darts * 3 : 0, games: s.es + s.en + s.ds + s.dn, won: s.es + s.ds }));
}

/* ---------- Checkout-Vorschläge (Double Out) ---------- */
const DART_SETUP = [...Array.from({ length: 11 }, (_, i) => ['T' + (20 - i), 3 * (20 - i)]), ...Array.from({ length: 20 }, (_, i) => [String(20 - i), 20 - i]), ['25', 25], ['Bull', 50], ...Array.from({ length: 9 }, (_, i) => ['T' + (9 - i), 3 * (9 - i)]), ...Array.from({ length: 20 }, (_, i) => ['D' + (20 - i), 2 * (20 - i)])];
const DART_FIN = [20, 16, 18, 12, 10, 8, 14, 6, 4, 2, 19, 17, 15, 13, 11, 9, 7, 5, 3, 1].map(n => ['D' + n, 2 * n]).concat([['Bull', 50]]);
const DART_FIN_MASTER = DART_FIN.concat(Array.from({ length: 20 }, (_, i) => ['T' + (20 - i), 3 * (20 - i)]));
const checkoutCache = {};
const DART_ALL = [...DART_SETUP, ['Bull', 50]];
function checkout(rest, out = 'Double Out') {
  const key = out + rest; if (key in checkoutCache) return checkoutCache[key];
  const fin = out === 'Master Out' ? DART_FIN_MASTER : out === 'Single Out' ? DART_ALL : DART_FIN; let res = null;
  if (rest >= (out === 'Single Out' ? 1 : 2) && rest <= 180) {
    const one = fin.find(d => d[1] === rest); if (one) res = [one[0]];
    /* Bewertung: bevorzugtes Doppel wiegt schwerer als die Vorbereitungs-Darts */
    const rank = new Map(DART_SETUP.map((x, i) => [x[0], i]));
    if (!res) { let best = null; fin.forEach((d, fi) => DART_SETUP.forEach(a => { if (a[1] + d[1] === rest) { const sc = fi * 5 + rank.get(a[0]); if (!best || sc < best[0]) best = [sc, [a[0], d[0]]]; } })); if (best) res = best[1]; }
    if (!res) { let best = null; fin.forEach((d, fi) => DART_SETUP.forEach(a => { const r2_ = rest - d[1] - a[1]; if (r2_ <= 0) return; DART_SETUP.forEach(b => { if (b[1] === r2_ && rank.get(a[0]) <= rank.get(b[0])) { const sc = fi * 5 + rank.get(a[0]) + rank.get(b[0]); if (!best || sc < best[0]) best = [sc, [a[0], b[0], d[0]]]; } }); })); if (best) res = best[1]; }
  }
  return (checkoutCache[key] = res);
}

function roundRobin(ids, back) {

}

  const draft = () => { read(); const x = { ...m, games: simple ? m.games : games.map(g => ({ ...g, hp: (g.hp || []).filter(Boolean), ap: (g.ap || []).filter(Boolean) })), bests: bests.filter(b => b.p && b.k), simple: simple ? { gh: Math.round(num($('#sgh', md).value)), ga: Math.round(num($('#sga', md).value)), lh: Math.round(num($('#slh', md).value)), la: Math.round(num($('#sla', md).value)) } : null }; return x; };
  const upd = () => { const x = draft(), r = dMatchResult(x); games.forEach((g, i) => { const w = dGameWinner(g, lg), tr = $(`tr[data-row="${i}"]`, md); tr.style.background = w === 'h' ? 'var(--gl)' : w === 'a' ? 'var(--bluel)' : ''; const bad = (Number(g.lh) > n || Number(g.la) > n || (Number(g.lh) === n && Number(g.la) === n)); tr.querySelectorAll('[data-l]').forEach(i2 => i2.style.borderColor = bad ? 'var(--red)' : ''); });
    const missing = simple ? 0 : games.filter(g => !dGameWinner(g, lg)).length; $('#dmRes', md).className = 'result ' + (r.gh > r.ga ? 'gut' : r.gh < r.ga ? 'schlecht' : ''); $('#dmRes', md).innerHTML = `<span>${missing ? `Noch ${plural(missing, 'Spiel', 'Spiele')} offen` : 'Endstand'} · Legs ${r.lh}:${r.la}</span><b>${r.gh} : ${r.ga}</b>`; };
  const drawBests = () => { $('#dmBests', md).innerHTML = bests.map(bestRow).join('') || '<tr><td colspan="4" class="muted small" style="padding:10px">180er, 171er, High Finishes ab 100 und Short Legs hier eintragen.</td></tr>'; };
  drawBests(); upd(); md.addEventListener('input', upd); md.addEventListener('change', upd);
  $$('[data-mode]', md).forEach(b => b.onclick = () => { simple = b.dataset.mode === 'simple'; $$('[data-mode]', md).forEach(x => x.classList.toggle('on', x === b)); $('#dmFull', md).style.display = simple ? 'none' : ''; $('#dmSimple', md).style.display = simple ? '' : 'none'; upd(); });

  $('#dmBests', md).addEventListener('click', e => { const b = e.target.closest('[data-brm]'); if (!b) return; read(); bests.splice(Number(b.dataset.brm), 1); drawBests(); });
  const store_ = done => { const x = draft();
    if (!simple) { const dup = x.games.findIndex(g => new Set(g.hp).size < g.hp.length || new Set(g.ap).size < g.ap.length); if (dup >= 0) { toast(`Spiel ${dup + 1}: Ein Spieler steht zweimal im selben Doppel.`, { err: true, ms: 5000 }); return false; }
      const bad = x.games.findIndex(g => (g.lh !== '' && Number(g.lh) > n) || (g.la !== '' && Number(g.la) > n) || (Number(g.lh) === n && Number(g.la) === n)); if (bad >= 0) { toast(`Spiel ${bad + 1}: Bei Best of ${lg.bestOf} gewinnt man mit genau ${n} Legs – bitte prüfen.`, { err: true, ms: 5000 }); return false; } }
    const bb = x.bests.find(b => (b.k === 'HF' && !(Number(b.v) >= 100 && Number(b.v) <= 170 && checkout(Number(b.v)))) || (b.k === 'SL' && !(Number(b.v) >= 9 && Number(b.v) <= 30)) || ((b.k === '180' || b.k === '171') && b.v !== '' && !(Number(b.v) >= 1 && Number(b.v) <= 30)));
    if (bb) { toast(bb.k === 'HF' ? `High Finish ${bb.v || ''}: Gültig sind Finishes von 100 bis 170 (nicht 159, 162, 163, 165, 166, 168, 169).` : bb.k === 'SL' ? 'Short Leg: Bitte die Anzahl Darts eintragen (mindestens 9).' : 'Bei 180 / 171 bitte die Anzahl eintragen.', { err: true, ms: 6000 }); return false; }
    if (done) { const r = dMatchResult(x); if (!r.done) { toast(simple ? dSimpleError(x.simple, lg) : 'Noch nicht alle Spiele haben einen Sieger. Bitte die Legs prüfen.', { err: true, ms: 6000 }); return false; } } Object.assign(m, x, { done: done || (m.done && dMatchResult(x).done) }); touch(m); dSyncEvent(m); save(); return true; };
  $('#dmSave', md).onclick = () => { if (!store_(false)) return; closeModal(); render(); toast('Gespeichert.'); };
  $('#dmDone', md).onclick = () => { if (!store_(true)) return; closeModal(); render(); const r = dMatchResult(m); toast(`Ergebnis ${r.gh}:${r.ga} eingetragen – die Tabelle ist aktualisiert.`); };
  $('#dmPrint', md).onclick = () => { store_(false); dPrintSheet(lg, m); };
};

/* ---------- Rangliste ---------- */
function dPlayersTab() {
  const y = viewState.py || '', lgId = viewState.plg || '', sort = viewState.ps || 'quote';
  const years = [...new Set([today().slice(0, 4), ...data.dMatches.map(m => m.date.slice(0, 4)), ...data.dLegs.map(l => l.date.slice(0, 4))])].sort().reverse();
  const rows = dartStats({ year: y, league: lgId }).filter(s => s.games || s.darts || s.n180 || s.hf);
  const q = s => (s.games ? s.won / s.games : 0);
  const sorters = { quote: (a, b) => q(b) - q(a) || b.games - a.games, avg: (a, b) => b.avg - a.avg, n180: (a, b) => b.n180 - a.n180, hf: (a, b) => b.hf - a.hf, legs: (a, b) => (b.lw - b.ll) - (a.lw - a.ll) };
  rows.sort(sorters[sort] || sorters.quote);
  return `<div class="tools"><select class="btn" id="dPlSel"><option value="">Alle Jahre</option>${years.map(v => `<option${v === y ? ' selected' : ''}>${v}</option>`).join('')}</select><select class="btn" id="dPlLg"><option value="">Alles (Ligen, Turniere, Zähler)</option>${data.dLeagues.map(l => `<option value="${l.id}"${String(l.id) === String(lgId) ? ' selected' : ''}>${esc(l.name)} ${esc(l.season || '')}</option>`).join('')}</select>${chips('ps', [['quote', 'Siegquote'], ['avg', 'Average'], ['n180', '180er'], ['hf', 'High Finish'], ['legs', 'Legs']], sort)}<span style="flex:1"></span><button class="btn btn-sm" data-act="dPrintRanking">${svg('print')} Drucken</button></div>` +
    (rows.length ? `<div class="card tbl-wrap"><table class="tbl"><thead><tr><th class="r" style="width:36px">#</th><th>Spieler</th><th class="r">Einzel</th><th class="r hm">Doppel</th><th class="r">Quote</th><th class="r hm">Legs</th><th class="r">Average</th><th class="r hm">First 9</th><th class="r">180</th><th class="r hm">171</th><th class="r">HF</th><th class="r hm">Short Leg</th></tr></thead><tbody>${rows.map((s, i) => `<tr class="click" data-open="dPlayer:${s.id}"><td class="r"><b>${i + 1}</b></td><td><b>${esc(dPlayerName(s.id))}</b></td><td class="r">${s.es}:${s.en}</td><td class="r hm">${s.ds}:${s.dn}</td><td class="r">${s.games ? fmtNum(q(s) * 100) + ' %' : '–'}</td><td class="r hm">${s.lw}:${s.ll}</td><td class="r">${s.darts ? fmtNum(s.avg, 2) : '–'}</td><td class="r hm">${s.f9 ? fmtNum(s.f9, 2) : '–'}</td><td class="r">${s.n180 || '–'}</td><td class="r hm">${s.n171 || '–'}</td><td class="r">${s.hf || '–'}</td><td class="r hm">${s.sl ? s.sl + ' Darts' : '–'}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted">Einzel und Doppel als Siege:Niederlagen. Der Average (Punkte je 3 Darts) und First 9 (Schnitt der ersten 9 Darts eines Legs) kommen aus dem Zähler. Auf einen Namen tippen für das Spielerprofil. HF = höchstes Finish, Short Leg = wenigste Darts für ein Leg.</p>` :
    `<div class="card">${emptyBox('Noch keine Statistik', 'Sobald Spielberichte eingetragen sind oder mit dem Zähler gespielt wurde, erscheint hier die Rangliste.', '')}</div>`);
}

/* ---------- Turniere (K.-o.-System) ---------- */
function dTourneysTab() {

  const t = data.dTourneys.find(x => x.id === viewState.tr) || ts[0];

}
ACTS.dPickTourney = id => { viewState.tr = id; render(); };
const roundName = (r, total) => { const left = total - r; return left === 1 ? 'Finale' : left === 2 ? 'Halbfinale' : left === 3 ? 'Viertelfinale' : left === 4 ? 'Achtelfinale' : `${r + 1}. Runde`; };
const tPName = (t, x) => t?.teams?.[x] ? t.teams[x].map(dPlayerName).join(' / ') : dPlayerName(x);
function dBracketHTML(t) {
  const R = t.rounds, champ = R.at(-1)?.[0]?.w;
  return `<div class="card pad" style="margin-bottom:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="grow"><b style="font-size:18px">${esc(t.name)}</b><div class="small muted">${fmtDate(t.date)} · ${esc(t.mode || '501')} ${esc(t.out || 'Double Out')} · Best of ${t.bestOf} · ${plural(t.players.length, 'Teilnehmer', 'Teilnehmer')}</div></div>${champ ? `<div class="pill gold" style="font-size:15px;padding:8px 14px">🏆 ${esc(tPName(t, champ))}</div>` : ''}</div>
  <div class="bracket">${R.map((round, r) => `<div class="bcol"><h4>${roundName(r, R.length)}</h4>${round.map((x, i) => `<div class="bm${x.w ? ' done' : ''}${x.a && x.b && !x.w ? ' ready' : ''}" ${x.a && x.b ? `data-act="dTMatch:${t.id}:${r}:${i}"` : ''}><div class="${x.w && x.w === x.a ? 'win' : ''}"><span>${x.a ? esc(tPName(t, x.a)) : r ? '…' : '<i>Freilos</i>'}</span><b>${x.la ?? ''}</b></div><div class="${x.w && x.w === x.b ? 'win' : ''}"><span>${x.b ? esc(tPName(t, x.b)) : r ? '…' : '<i>Freilos</i>'}</span><b>${x.lb ?? ''}</b></div></div>`).join('')}</div>`).join('')}</div>
  <p class="small muted">Auf ein Spiel tippen, um das Ergebnis einzutragen. Der Sieger rückt automatisch in die nächste Runde.</p>`;
}
ACTS.dNewTourney = () => openForm({ title: 'Neues Turnier', fields: () => [{ k: 'name', label: 'Name', req: true, full: true, ph: 'z. B. Vereinsmeisterschaft 2026' }, { k: 'date', label: 'Datum', type: 'date', req: true }, { k: 'bestOf', label: 'Legs je Spiel', type: 'select', opts: [['1', 'Best of 1'], ['3', 'Best of 3'], ['5', 'Best of 5'], ['7', 'Best of 7']] }, { k: 'mode', label: 'Startpunkte', type: 'select', opts: DART_MODES }, { k: 'out', label: 'Beenden mit', type: 'select', opts: DART_OUTS },
    { k: 'players', label: 'Teilnehmer (Mitglieder)', type: 'multi', opts: () => activeMembers().sort((a, b) => sortName(a).localeCompare(sortName(b))).map(m => [m.id, fullName(m)]) }, { k: 'guests', label: 'Gäste (ein Name pro Zeile)', type: 'textarea', full: true }, { k: 'event', label: 'Als Turnier in den Kalender eintragen', type: 'check', full: true }],
  validate: v => { const n = (v.players || []).length + String(v.guests || '').split('\n').filter(s => s.trim()).length; if (n < 2) return 'Bitte mindestens 2 Teilnehmer auswählen.'; if (n > 64) return 'Höchstens 64 Teilnehmer.'; },
  save: v => { const ps = [...(v.players || []), ...String(v.guests || '').split('\n').map(s => s.trim()).filter(Boolean)];
    for (let i = ps.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ps[i], ps[j]] = [ps[j], ps[i]]; }
    let size = 2; while (size < ps.length) size *= 2; const slots = Array(size).fill(null); const byes = size - ps.length;
    let k = 0; for (let i = 0; i < size / 2; i++) { slots[2 * i] = ps[k++] ?? null; slots[2 * i + 1] = i < byes ? null : (ps[k++] ?? null); }
    const rounds = []; let cnt = size / 2; rounds.push(Array.from({ length: cnt }, (_, i) => ({ a: slots[2 * i], b: slots[2 * i + 1] }))); while (cnt > 1) { cnt /= 2; rounds.push(Array.from({ length: cnt }, () => ({ a: null, b: null }))); }
    const t = touch({ id: pid(), name: v.name, date: v.date, bestOf: Number(v.bestOf) || 3, mode: v.mode, out: v.out, players: ps, rounds });
    rounds[0].forEach((x, i) => { if (x.a && !x.b) dAdvance(t, 0, i, x.a); });
    data.dTourneys.push(t); if (v.event) data.events.push(touch({ id: pid(), title: 'Dart: ' + v.name, kind: 'Turnier', date: v.date, time: '', attendance: {} })); if (view !== 'dTourneys') go('dTourneys'); viewState.tr = t.id; toast('Ausgelost! Der Turnierbaum steht.'); } }, { date: today(), bestOf: '3', mode: '501', out: 'Double Out', players: [], event: true });
function dAdvance(t, r, i, w) { const x = t.rounds[r][i]; x.w = w; const nx = t.rounds[r + 1]?.[Math.floor(i / 2)]; if (nx) { if (i % 2) nx.b = w; else nx.a = w; } }
ACTS.dTMatch = (tid, r, i) => { const t = data.dTourneys.find(x => x.id === tid), x = t.rounds[r][i], n = Math.ceil(t.bestOf / 2), nx = t.rounds[Number(r) + 1]?.[Math.floor(i / 2)];
  if (nx?.w) return toast('Das nächste Spiel ist schon gespielt. Zuerst dort das Ergebnis löschen.', { err: true });
  openForm({ title: `${esc(tPName(t, x.a))} gegen ${esc(tPName(t, x.b))}`, intro: `Gewonnen hat, wer zuerst ${plural(n, 'Leg', 'Legs')} hat.`, fields: () => [{ k: 'la', label: tPName(t, x.a), type: 'number', step: '1' }, { k: 'lb', label: tPName(t, x.b), type: 'number', step: '1' }, ...(x.w ? [{ k: 'clear', label: 'Ergebnis löschen', type: 'check' }] : [])],
    save: v => { if (v.clear) { delete x.w; x.la = undefined; x.lb = undefined; if (nx) { if (i % 2) nx.b = null; else nx.a = null; } return save(); }
      const a = Math.round(num(v.la)), b = Math.round(num(v.lb)); if (!((a === n && b < n) || (b === n && a < n))) throw new Error(`Einer muss genau ${n} Legs haben, der andere weniger.`);
      x.la = a; x.lb = b; dAdvance(t, Number(r), Number(i), a > b ? x.a : x.b); touch(t); save(); if (!nx) toast(`🏆 ${tPName(t, x.w)} gewinnt „${t.name}“!`, { ms: 6000 }); } }, { la: x.la ?? '', lb: x.lb ?? '' }); };
ACTS.dDelTourney = async id => { const t = data.dTourneys.find(x => x.id === id); if (!await confirmBox(`Turnier „${esc(t.name)}“ löschen?`, 'Löschen', true)) return; removeFrom('dTourneys', id); viewState.tr = ''; render(); };

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}<polyline fill="none" stroke="var(--g)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p, i) => `${X(i)},${Y(p.v)}`).join(' ')}"/>${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="4.5" fill="var(--card)" stroke="var(--g)" stroke-width="2"><title>${fmtDate(p.d)}: ${fmtNum(p.v, 1)}</title></circle>`).join('')}<text x="${P}" y="${H - 4}" font-size="11" fill="var(--muted)">${fmtDate(pts[0].d)}</text><text x="${W - 10}" y="${H - 4}" font-size="11" text-anchor="end" fill="var(--muted)">${fmtDate(pts.at(-1).d)}</text></svg>`;

/* ---------- Jahreswertung (Turnierpunkte) ---------- */
const YEAR_PTS = { win: 10, final: 7, semi: 5, quarter: 3, part: 1 };
function dYearTable() {
  const years = [...new Set([String(new Date().getFullYear()), ...data.dTourneys.map(t => t.date.slice(0, 4))])].sort().reverse(), y = viewState.yy || years[0];
  const P = {}; const add = (p, k, t) => { (P[p] ||= { p, pts: 0, n: 0, best: 9, titles: 0 }); P[p].pts += YEAR_PTS[k]; P[p].n++; const rank = { win: 1, final: 2, semi: 3, quarter: 4, part: 5 }[k]; P[p].best = Math.min(P[p].best, rank); if (k === 'win') P[p].titles++; };
  data.dTourneys.filter(t => t.date.startsWith(y)).forEach(t => { const R = t.rounds || [], L = R.length; const reached = {};
    (t.players || []).forEach(p => { reached[p] = 'part'; });
    R.forEach((round, r) => round.forEach(x => [x.a, x.b].forEach(p => { if (!p) return; const left = L - r; const k = left === 1 ? 'final' : left === 2 ? 'semi' : left === 3 ? 'quarter' : 'part'; if (YEAR_PTS[k] > YEAR_PTS[reached[p] || 'part']) reached[p] = k; })));
    const champ = R.at(-1)?.[0]?.w; if (champ) reached[champ] = 'win';
    Object.entries(reached).forEach(([p, k]) => (t.teams?.[p] || [p]).forEach(q => memberById(q) && add(q, k, t))); });
  const rows = Object.values(P).sort((a, b) => b.pts - a.pts || a.best - b.best);
  const lbl = { 1: 'Sieger', 2: 'Finale', 3: 'Halbfinale', 4: 'Viertelfinale', 5: 'Teilnahme' };
  return `<div class="tools">${chips('yy', years.map(v => [v, v]), y)}</div>` + (rows.length ? `<div class="card tbl-wrap"><table class="tbl"><thead><tr><th class="r" style="width:40px">#</th><th>Spieler</th><th class="r">Turniere</th><th>Bestes Ergebnis</th><th class="r">Titel</th><th class="r">Punkte</th></tr></thead><tbody>${rows.map((r, i) => `<tr class="click" data-open="dPlayer:${r.p}"><td class="r"><b>${i + 1}</b></td><td><b>${esc(dPlayerName(r.p))}</b></td><td class="r">${r.n}</td><td>${lbl[r.best]}</td><td class="r">${r.titles ? '🏆'.repeat(Math.min(r.titles, 5)) : '–'}</td><td class="r"><b style="font-size:16px">${r.pts}</b></td></tr>`).join('')}</tbody></table></div>
    <p class="small muted">Punkte je Turnier: Sieg ${YEAR_PTS.win}, Finale ${YEAR_PTS.final}, Halbfinale ${YEAR_PTS.semi}, Viertelfinale ${YEAR_PTS.quarter}, Teilnahme ${YEAR_PTS.part}. Bei Blind-Doppel bekommen beide Partner die Punkte.</p>` : `<div class="card">${emptyBox('Noch keine Turniere in ' + y, 'Sobald Turniere gespielt sind, entsteht hier die Jahreswertung.', `<button class="btn btn-p" data-act="dNewTourney">${svg('plus')} Turnier</button>`)}</div>`);
}

/* ---------- Hall of Fame ---------- */
function dHallData() {

function msgRecipients(f) {
  let ms = activeMembers();
  if (f === 'active') ms = ms.filter(m => m.status === 'Aktiv'); else if (f === 'youth') ms = ms.filter(m => m.status === 'Jugend' || (m.birth && ageOn(m.birth) < 18));
  else if (f === 'open') ms = ms.filter(m => memberOpen(m.id) > 0); else if (f === 'board') ms = ms.filter(m => data.roles.some(r => String(r.member) === String(m.id) && (!r.until || r.until >= today())));
  else if (f === 'bdmonth') ms = ms.filter(m => m.birth && m.birth.slice(5, 7) === today().slice(5, 7)); else if (f === 'nosepa') ms = ms.filter(m => m.pay !== 'Lastschrift');
  else if (f && f.startsWith('g:')) ms = ms.filter(m => m.groups.map(String).includes(f.slice(2)));
  else if (f && f.startsWith('fee:')) { const fid = f.slice(4); ms = ms.filter(m => String(m.fee) === fid || (familyHead(m) && String(familyHead(m).fee) === fid)); }
  return ms.sort((a, b) => sortName(a).localeCompare(sortName(b)));
}

const AGE_GROUPS = [[0, 6, 'bis 6'], [7, 14, '7–14'], [15, 18, '15–18'], [19, 26, '19–26'], [27, 40, '27–40'], [41, 60, '41–60'], [61, 200, 'über 60']];
function barChart(rows, { h = 200, colors = ['var(--g)', 'var(--gold)'], legend = [] } = {}) {
  const W = 600, H = h, pad = 26, n = rows.length, max = Math.max(1, ...rows.flatMap(r => r.v)), bw = (W - pad * 2) / n, series = rows[0]?.v.length || 1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H + 30}" role="img">${[0, .5, 1].map(f => `<line x1="${pad}" x2="${W - pad}" y1="${H - (H - 20) * f}" y2="${H - (H - 20) * f}" stroke="var(--line)"/>`).join('')}
  ${rows.map((r, i) => r.v.map((v, s) => { const bh = (H - 20) * v / max, x = pad + i * bw + bw * .18 + s * (bw * .64 / series), w = bw * .64 / series - 2; return `<rect x="${x}" y="${H - bh}" width="${Math.max(2, w)}" height="${bh}" rx="3" fill="${colors[s]}"><title>${esc(r.l)}: ${v}</title></rect>${v ? `<text x="${x + w / 2}" y="${H - bh - 4}" font-size="11" text-anchor="middle" fill="var(--muted)">${v}</text>` : ''}`; }).join('') + `<text x="${pad + i * bw + bw / 2}" y="${H + 18}" font-size="12" text-anchor="middle" fill="var(--ink2)">${esc(r.l)}</text>`).join('')}</svg>${legend.length ? `<div class="legend">${legend.map((l, i) => `<span><i style="background:${colors[i]}"></i>${esc(l)}</span>`).join('')}</div>` : ''}`;
}
VIEWS.stats = () => {

/* ---------- In die Zwischenablage ---------- */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;left:-9999px'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); return ok;
  }
}
async function copyEmails(list) {
  const mails = [...new Set(list.filter(Boolean))]; if (!mails.length) return toast('Keine E-Mail-Adressen.', { err: true });
  const ok = await copyText(mails.join(', ')); window.__copied = mails.join(', ');
  toast(ok ? `${plural(mails.length, 'Adresse', 'Adressen')} kopiert. Im Mailprogramm ins Feld „Bcc“ einfügen (Strg+V).` : 'Kopieren hat nicht geklappt.', { err: !ok, ms: 6000 });
}
/** mailto mit vielen Empfängern ist für manche Mailprogramme zu lang */
function openBccMail(mails, subject, body) {
  const url = `mailto:?bcc=${encodeURIComponent(mails.join(','))}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  if (url.length > 1900) { copyEmails(mails); location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`; toast('Viele Empfänger: Die Adressen sind kopiert – bitte im Mailprogramm ins Feld „Bcc“ einfügen.', { ms: 8000 }); return; }
  location.href = url;
}

const allowPaid = (mid, kind, y) => sum(data.allowances.filter(a => String(a.member) === String(mid) && a.kind === kind && a.date.startsWith(String(y))), a => a.amount);

  COLLECTIONS.forEach(col => {
    const map = new Map(mine[col].map(x => [String(x.id), x]));
    theirs[col].forEach(x => { const id = String(x.id); if (isDel(delMine, col, id)) return; const cur = map.get(id); if (!cur) { mine[col].push(x); res.added++; } else if ((x.updatedAt || '') > (cur.updatedAt || '')) { if (col === 'charges') x.payments = mergePayments(cur.payments, x.payments); Object.keys(cur).forEach(k => delete cur[k]); Object.assign(cur, x); res.updated++; } else if (col === 'charges') { const mp = mergePayments(cur.payments, x.payments); if (mp.length !== cur.payments.length) { cur.payments = mp; res.updated++; } } });
    const before = mine[col].length; mine[col] = mine[col].filter(x => !isDel(delTheirs, col, String(x.id))); res.removed += before - mine[col].length;
