<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf">
<meta name="description" content="ZackVertrieb – die Vertriebs-App: Kunden, Pipeline, Wiedervorlagen, Angebote, Provisionen. Offline, ohne Abo.">
<title>ZackVertrieb</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f5fbf'/%3E%3Cpath d='M14 44 26 30l8 7 16-18' fill='none' stroke='%23fff' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M40 19h10v10' fill='none' stroke='%23f5a524' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>:root{--g:#1f5fbf;--g2:#164a99;--g3:#0f3874;--gl:#e2ebfa;--gll:#f4f7fd;--sea:#2f7d6d;--seal:#dcefe9;--gold:#d99a2b;--goldl:#fbefd6;--red:#c0392b;--redl:#fbe6e3;--blue:#2c6e9b;--bluel:#e3eef6;--ink:#1d2329;--ink2:#3a434c;--muted:#6c737a;--bg:#f3f5f9;--card:#fff;--line:#dfe4ec;--line2:#edf0f5;--side-bg:#0f1a2b;--side-ink:#d9e1e7;--side-mut:#8fa0ad;--sh:0 1px 2px rgba(15,30,60,.05),0 6px 20px rgba(15,30,60,.06);--r:16px;--side:256px;color-scheme:light}
[data-theme=dark]{--g:#5b9bf0;--g2:#86b6f5;--g3:#b3d1fa;--gl:#172a45;--gll:#121e30;--sea:#5cc0a8;--seal:#183630;--gold:#f2b84b;--goldl:#3a2e14;--red:#ff7b6b;--redl:#3d1d19;--blue:#7fb5e0;--bluel:#172b3b;--ink:#ece7e1;--ink2:#cfc7bf;--muted:#9a938c;--bg:#14171a;--card:#1d2125;--line:#2d3237;--line2:#24282c;--side-bg:#0e1418;--sh:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--g)}
svg{width:18px;height:18px;flex:none}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:13px}.r{text-align:right}.nowrap{white-space:nowrap}
.app{display:flex;min-height:100vh}
/* Seitenleiste – dunkles Nordsee-Blau mit Klinker-Akzent */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.side:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--g) 0 60%,#f5a524 60% 100%)}
.brand{display:flex;gap:12px;align-items:center;padding:24px 20px 18px}
.crest{width:44px;height:44px;border-radius:13px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;overflow:hidden;flex:none;box-shadow:0 6px 16px rgba(31,95,191,.4)}
.crest img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:17px;letter-spacing:-.01em;line-height:1.15;color:#fff}
.brand span{font-size:12px;color:var(--side-mut);display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{flex:1;overflow:auto;padding:2px 12px 12px}
.nav h6{margin:16px 10px 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-mut);font-weight:700}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 12px;border-radius:11px;cursor:pointer;color:var(--side-ink);font-weight:550;text-align:left;font-size:14.5px}
.nav button svg{color:var(--side-mut)}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:rgba(91,155,240,.18);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--g)}
.nav button.on svg{color:#f5b84a}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);color:var(--side-ink);border-radius:20px;padding:1px 8px;white-space:nowrap}
.nav .cnt.warn{background:rgba(217,154,43,.22);color:#f6cf86}.nav .cnt.bad{background:rgba(224,90,70,.25);color:#ffb3a6}
.side-foot{border-top:1px solid rgba(255,255,255,.08);padding:12px 16px;font-size:12px;color:var(--side-mut);display:flex;gap:8px;align-items:center;justify-content:space-between}
.side-foot .iconbtn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);color:var(--side-ink)}
.main{flex:1;margin-left:var(--side);min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;gap:10px;padding:0 30px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:15px;margin:0;font-weight:650;flex:1;color:var(--muted)}
.iconbtn.burger{display:none}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.iconbtn:hover{border-color:var(--g);color:var(--g)}
.demo-bar{background:var(--sea);color:#fff;font-weight:700;font-size:13px;text-align:center;padding:6px}
.demo-bar .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
.content{padding:28px 30px 64px;max-width:1380px;width:100%}
.head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.head h2{margin:0;font-size:30px;letter-spacing:-.025em;line-height:1.1;font-weight:800}
.head p{margin:6px 0 0;color:var(--muted);max-width:660px}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 15px;font-weight:650;cursor:pointer;white-space:nowrap;color:var(--ink);text-decoration:none;font-size:14.5px}
.btn:hover{border-color:var(--g)}
.btn-p{background:var(--g);border-color:var(--g);color:#fff;box-shadow:0 4px 12px rgba(31,95,191,.25)}
.btn-p:hover{background:var(--g2);border-color:var(--g2)}
[data-theme=dark] .btn-p{color:#06142b}
.btn-sea{background:var(--sea);border-color:var(--sea);color:#fff}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#2e2100}
.btn-red{color:var(--red)}.btn-red:hover{border-color:var(--red)}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.025em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi .ic{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:11px;background:var(--gl);color:var(--g);display:grid;place-items:center}
.kpi.sea .ic,.kpi.g .ic{background:var(--seal);color:var(--sea)}.kpi.gold .ic{background:var(--goldl);color:#a26d0e}.kpi.red .ic{background:var(--redl);color:var(--red)}.kpi.blue .ic{background:var(--bluel);color:var(--blue)}
.hero{background:var(--side-bg);color:#fff;border-radius:20px;padding:26px 28px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:26px;align-items:center;position:relative;overflow:hidden;margin-bottom:16px}
.hero:after{content:"";position:absolute;right:-40px;bottom:-70px;width:260px;height:260px;border-radius:50%;border:38px solid rgba(245,165,36,.14)}
.hero h2{margin:0;font-size:15px;font-weight:650;color:#b9c6cf;text-transform:uppercase;letter-spacing:.08em}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:18px;color:#9fb0bc;font-weight:650}
.hero p{margin:0;color:#c5d0d7}
.hero .meter{height:12px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden;margin:14px 0 8px}
.hero .meter i{display:block;height:100%;background:linear-gradient(90deg,#f5a524,#ffd27a);border-radius:8px}
.hero .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.18)}
.hero .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;position:relative;z-index:1}
.hero .stats div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 14px}
.hero .stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.hero .stats span{font-size:12px;color:#9fb0bc}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.sec-t h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:center}
.sec-t h3 svg{color:var(--g)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line2)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li b{font-weight:650}
.av{width:38px;height:38px;border-radius:12px;background:var(--gl);color:var(--g2);display:grid;place-items:center;font-weight:750;font-size:13px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.sea,.av.g{background:var(--seal);color:var(--sea)}.av.gold{background:var(--goldl);color:#9a6700}.av.blue{background:var(--bluel);color:var(--blue)}.av.red{background:var(--redl);color:var(--red)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:220px;max-width:360px}
.search input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--side-bg);border-color:var(--side-bg);color:#fff}
[data-theme=dark] .chip.on{background:var(--g);border-color:var(--g);color:#06142b}
.chip i{font-style:normal;opacity:.6;margin-left:3px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--muted);font-weight:700;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--gll);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.tbl td{padding:12px 16px;border-top:1px solid var(--line2);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl tbody tr:hover td{background:var(--gll)}
.tbl tr.click{cursor:pointer}
.tbl .sub{display:block;font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow:auto;border-radius:var(--r)}
.tbl tfoot td{font-weight:750;border-top:2px solid var(--line);background:var(--gll)}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--line2);color:var(--ink2);white-space:nowrap}
.pill.g,.pill.sea{background:var(--seal);color:var(--sea)}.pill.gold{background:var(--goldl);color:#8a5a00}.pill.red{background:var(--redl);color:var(--red)}.pill.blue{background:var(--bluel);color:var(--blue)}.pill.brick{background:var(--gl);color:var(--g2)}
[data-theme=dark] .pill.gold{color:var(--gold)}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--sea)}.neg{color:var(--red)}
.rowacts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:5px;min-width:230px;z-index:40}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 11px;border-radius:8px;cursor:pointer;font-weight:550}
.menu button:hover{background:var(--gll)}
.menu button.red{color:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:60;overflow:auto}
.modal{background:var(--card);border-radius:20px;width:100%;max-width:640px;box-shadow:0 24px 70px rgba(0,0,0,.28);display:flex;flex-direction:column;max-height:92vh}
.modal.wide{max-width:900px}.modal.xwide{max-width:1120px}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 24px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;flex:1;font-size:19px;letter-spacing:-.01em}
.modal-b{padding:20px 24px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f .l{margin-right:auto}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:650;color:var(--ink2)}
.f label .req{color:var(--red)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--card);width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid color-mix(in srgb,var(--g) 30%,transparent);border-color:var(--g)}
.f textarea{min-height:80px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.f .err{font-size:12px;color:var(--red)}
.f.check{flex-direction:row;align-items:center;gap:9px}
.f.check input{width:18px;height:18px;accent-color:var(--g)}
.f.check label{font-weight:550}
.fsec{grid-column:1/-1;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--g);margin-top:8px;padding-top:12px;border-top:1px solid var(--line2)}
.fsec:first-child{margin-top:0;padding-top:0;border-top:0}
.note{background:var(--gll);border:1px solid var(--gl);border-radius:13px;padding:12px 14px;font-size:13.5px;color:var(--ink2)}
.note.sea{background:var(--seal);border-color:#bfe0d6;color:#1d5348}
.note.gold{background:var(--goldl);border-color:#f2d9a3;color:#5c4200}
.note.red{background:var(--redl);border-color:#f2c3bd;color:#7a1c15}
[data-theme=dark] .note.gold{color:var(--gold);border-color:#5a4615}[data-theme=dark] .note.red{color:var(--red);border-color:#5a2520}[data-theme=dark] .note.sea{color:var(--sea);border-color:#1f4a41}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--side-bg);color:#fff;padding:12px 16px;border-radius:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:550;max-width:min(560px,92vw);display:flex;gap:12px;align-items:center}
.toast.err{background:var(--red);color:#fff}
.toast button{background:none;border:0;color:#f6cf86;font-weight:800;cursor:pointer}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:650;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--g2);border-bottom-color:var(--g)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:7px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.bar{height:8px;background:var(--line2);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea);border-radius:8px}
.bar.gold i{background:var(--gold)}.bar.red i{background:var(--red)}.bar.brick i{background:var(--g)}
/* Häuser-Karten */
.house{overflow:hidden;display:flex;flex-direction:column}
.house .roof{height:86px;background:var(--side-bg);position:relative;display:flex;align-items:flex-end;padding:14px 18px;color:#fff;overflow:hidden}
.house .roof:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 13px,rgba(255,255,255,.04) 13px 14px),repeating-linear-gradient(90deg,transparent 0 27px,rgba(255,255,255,.035) 27px 28px)}
.house .roof:after{content:"";position:absolute;right:16px;top:14px;width:58px;height:58px;background:var(--g);clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%);opacity:.9}
.house .roof b{font-size:18px;position:relative;z-index:1}.house .roof span{display:block;font-size:12.5px;color:#b9c6cf;position:relative;z-index:1}
.house .body{padding:14px 18px 16px;flex:1;display:flex;flex-direction:column;gap:10px}
.unitrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;background:var(--gll);border:1px solid var(--line2);cursor:pointer}
.unitrow:hover{border-color:var(--g)}
.unitrow .dot{width:9px;height:9px;border-radius:50%;background:var(--sea);flex:none}.unitrow .dot.vac{background:var(--gold)}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.statgrid div{background:var(--gll);border-radius:11px;padding:9px 11px}.statgrid b{display:block;font-variant-numeric:tabular-nums}.statgrid span{font-size:11.5px;color:var(--muted)}
/* Mietkalender */
.mgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.mgrid i{display:block;height:26px;border-radius:7px;background:var(--line2);font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted);display:grid;place-items:center}
.mgrid i.g{background:var(--seal);color:var(--sea)}.mgrid i.gold{background:var(--goldl);color:#8a5a00}.mgrid i.red{background:var(--redl);color:var(--red)}
.result{border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.result.nach{background:var(--redl);color:#7a1c15}.result.gut{background:var(--seal);color:#1d5348}
[data-theme=dark] .result.nach{color:var(--red)}[data-theme=dark] .result.gut{color:var(--sea)}
.result b{font-size:22px;font-variant-numeric:tabular-nums}
.ob{max-width:640px;margin:6vh auto;padding:0 16px}
.ob .card{padding:30px}
.ob h1{margin:0 0 6px;font-size:30px;letter-spacing:-.025em}
.steps{display:flex;gap:6px;margin:0 0 18px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps i.on{background:var(--g)}
.scrim{display:none}
.mtable input{border:1px solid var(--line);border-radius:9px;padding:7px 9px;width:120px;background:var(--card);text-align:right}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .side{transform:translateX(-102%);box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  .main{margin-left:0}.iconbtn.burger{display:grid}
  .top{padding:0 14px}.content{padding:18px 14px 72px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .fg,.fg.c3{grid-template-columns:minmax(0,1fr)}
  .head h2{font-size:24px}
  .tbl .hm{display:none}
  .kv{grid-template-columns:120px 1fr}
  .hero .big{font-size:32px}
}

const modalStack = [];

  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal${wide ? ' wide' : ''}${xwide ? ' xwide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(String(title).replace(/<[^>]+>/g, ''))}">
    <div class="modal-h"><h3>${title}</h3><button class="iconbtn" data-close aria-label="Schließen">${svg('x')}</button></div>
    <div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  document.body.appendChild(bg);
  const entry = { bg, onClose }; modalStack.push(entry);
  bg.addEventListener('mousedown', e => { if (e.target === bg) entry.down = true; });
  bg.addEventListener('click', e => { if (e.target === bg && entry.down) closeModal(); entry.down = false; if (e.target.closest('[data-close]')) closeModal(); });
  const first = bg.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea'); if (first && !('ontouchstart' in window)) setTimeout(() => first.focus(), 30);
  onOpen && onOpen(bg.querySelector('.modal'));
  return bg.querySelector('.modal');
}

  ['stages', 'lostReasons', 'sources'].forEach(k => { if (!Array.isArray(d[k]) || !d[k].length) d[k] = f[k]; });
  ['sellers', 'blocklist'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });

}

/* ---------- Geschäfte (Deals) ---------- */

}

/* ---------- Auswertung ---------- */
function periodRange(p) {
  const t = today(), y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7));
  if (p === 'monat') return [`${t.slice(0, 7)}-01`, t];
  if (p === 'quartal') { const qm = Math.floor((m - 1) / 3) * 3 + 1; return [`${y}-${pad2(qm)}-01`, t]; }
  if (p === 'vorjahr') return [`${y - 1}-01-01`, `${y - 1}-12-31`];
  if (p === '12m') return [addDays(addMonths(t, -12), 1), t];
  return [`${y}-01-01`, t];
}
function stats(from, to, seller = '') {
  const inS = d => !seller || d.owner === seller;
  const closed = data.deals.filter(d => inS(d) && d.status !== 'open' && d.closed >= from && d.closed <= to);
  const won = closed.filter(d => d.status === 'won'), lost = closed.filter(d => d.status === 'lost');
  const created = data.deals.filter(d => inS(d) && (d.created || '') >= from && (d.created || '') <= to);
  const acts = data.activities.filter(a => (!seller || a.owner === seller) && (a.done || !a.planned) && a.date >= from && a.date <= to);
  const calls = acts.filter(a => a.kind === 'call'), mails = acts.filter(a => a.kind === 'mail'), meets = acts.filter(a => a.kind === 'meeting');
  const durCalls = calls.filter(a => num(a.duration) > 0);
  const cycle = won.filter(d => d.created).map(d => daysBetween(d.created, d.closed));
  const reasons = {}; lost.forEach(d => { const r = d.lostReason || 'ohne Angabe'; reasons[r] = (reasons[r] || 0) + 1; });
  const sources = {}; won.forEach(d => { const s = d.source || 'ohne Angabe'; sources[s] = r2((sources[s] || 0) + num(d.value)); });
  return {
    won, lost, created, wonValue: sum(won, d => d.value), lostValue: sum(lost, d => d.value), winRate: closed.length ? won.length / closed.length * 100 : 0,
    avgDeal: won.length ? sum(won, d => d.value) / won.length : 0, cycle: cycle.length ? cycle.reduce((a, b) => a + b, 0) / cycle.length : 0,
    calls: calls.length, mails: mails.length, meets: meets.length, avgCall: durCalls.length ? sum(durCalls, a => a.duration) / durCalls.length : 0,

}

function monthlySeries(monthsBack = 6, monthsFwd = 3, seller = '') {
  const out = [], t = today();
  for (let i = -monthsBack + 1; i <= monthsFwd; i++) {
    const m = ym(addMonths(t.slice(0, 8) + '01', i));
    const won = sum(data.deals.filter(d => (!seller || d.owner === seller) && d.status === 'won' && ym(d.closed) === m), d => d.value);
    const fc = sum(data.deals.filter(d => (!seller || d.owner === seller) && d.status === 'open' && ym(d.expected || addDays(t, 30)) === m), d => dealWeighted(d));
    out.push({ m, won, fc, future: m > ym(t) });

}

    <td class="hm">${esc(companyById(c.company)?.name || '–')}</td><td>${esc(c.phone || c.mobile || '–')}<span class="sub">${esc(c.email || '')}</span></td><td class="hm">${consentPills(c)}</td>
    <td><div class="rowacts">${c.phone || c.mobile ? `<button class="btn btn-sm" data-act="callContact:${c.id}">${svg('phone')} Anrufen</button>` : ''}${c.email ? `<button class="btn btn-sm" data-act="mailContact:${c.id}">${svg('mail')}</button>` : ''}</div></td></tr>`).join('')}</tbody></table></div>` :
  `<div class="card">${emptyBox(all.length ? 'Nichts gefunden' : 'Noch keine Kontakte', all.length ? 'Ändere die Suche oder den Filter.' : 'Lege einen Kontakt an oder lies Kontakte aus Excel (CSV) oder vom Handy (vCard) ein.', `<button class="btn btn-p" data-act="newContact">${svg('plus')} Kontakt anlegen</button>`)}</div>`);
};

});

/* ---------- Verlauf (gemeinsam für Firma, Kontakt, Geschäft) ---------- */
function timeline(list, empty = 'Noch nichts festgehalten.') {
  const items = list.slice().sort((a, b) => ((b.done || !b.planned ? b.doneAt || b.date : b.date) + (b.time || '')).localeCompare((a.done || !a.planned ? a.doneAt || a.date : a.date) + (a.time || ''))).slice(0, 80);
  if (!items.length) return `<div class="muted small" style="padding:10px 0">${empty}</div>`;
  return `<div class="tl">${items.map(a => { const k = ACT_KINDS[a.kind] || ACT_KINDS.note, open = a.planned && !a.done;
    return `<div class="it"><div class="av ${k[2]}">${svg(k[1])}</div><div class="grow"><div style="display:flex;gap:8px;justify-content:space-between;align-items:baseline"><b>${esc(actTitle(a))}</b><span class="t">${fmtDate(a.date)}${a.time ? ' ' + esc(a.time) : ''}</span></div>
    <div class="t">${esc(k[0])}${a.result ? ' · ' + esc(a.result) : ''}${num(a.duration) ? ' · ' + fmtNum(num(a.duration)) + ' Min.' : ''}${open ? ' · ' + (a.date < today() ? '<span class="neg">überfällig</span>' : 'geplant') : a.planned ? ' · erledigt' : ''}${sellerName(a.owner) ? ' · ' + esc(sellerName(a.owner)) : ''}</div>${a.text ? `<p>${esc(a.text)}</p>` : ''}</div>
    <div class="rowacts">${open ? `<button class="btn btn-sm" data-act="doneTask:${a.id}">${svg('check')}</button>` : ''}<button class="iconbtn" style="width:32px;height:32px" data-act="editAct:${a.id}" aria-label="Bearbeiten">${svg('edit')}</button></div></div>`; }).join('')}</div>`;
}
const actBar = (ctx) => `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><button class="btn btn-sm" data-act="logCall:${ctx}">${svg('phone')} Anruf</button><button class="btn btn-sm" data-act="mailFor:${ctx}">${svg('mail')} E-Mail</button><button class="btn btn-sm" data-act="newTask:${ctx}">${svg('clock')} Wiedervorlage</button><button class="btn btn-sm" data-act="newMeeting:${ctx}">${svg('calendar')} Termin</button><button class="btn btn-sm" data-act="newNote:${ctx}">${svg('note')} Notiz</button></div>`;

      <div class="sec-t" style="margin-top:16px"><h3>${svg('users')} Ansprechpartner</h3><button class="btn btn-sm" data-act="newContact:${co.id}">${svg('plus')}</button></div><div class="list">${cs.map(c => `<div class="li" style="cursor:pointer" data-act="openContact:${c.id}">${avatar(contactName(c), CONTACT_STATUS[c.status]?.[1] || '')}<div class="grow"><b>${esc(contactName(c))}</b><div class="small muted">${esc([c.role, c.phone || c.mobile].filter(Boolean).join(' · '))}</div></div>${consentPills(c)}</div>`).join('') || '<span class="muted small">Noch keine.</span>'}</div></div>

    <div class="tabs">${[['verlauf', 'Übersicht & Verlauf'], ['deals', `Geschäfte (${ds.length})`]].map(([k, l]) => `<button class="${t === k ? 'on' : ''}" data-act="openCompany:${co.id}:${k}">${l}</button>`).join('')}</div>${body}`,

function refreshDetail() {
  const m = topModal(); if (!m) return render();
  const cur = $('.tabs .on', m)?.dataset.act?.split(':')[2];
  if (m.dataset.contact) { const id = m.dataset.contact; closeModal(); ACTS.openContact(id, cur); }
  else if (m.dataset.company) { const id = m.dataset.company; closeModal(); ACTS.openCompany(id, cur); }
  else if (m.dataset.deal) { const id = m.dataset.deal; closeModal(); ACTS.openDeal(id, cur); }
  render();
}

/* ---------- Datenschutz ---------- */

  <h2>Einwilligungen</h2><table><tbody><tr><td style="width:38%">Werbung per E-Mail</td><td>${c.mailOk ? 'ja' + (c.mailOkDate ? ', seit ' + fmtDate(c.mailOkDate) : '') + (c.mailOkSrc ? ' (' + esc(c.mailOkSrc) + ')' : '') : 'nein'}</td></tr><tr><td>Anrufe</td><td>${c.phoneOk ? 'ja' + (c.phoneOkDate ? ', seit ' + fmtDate(c.phoneOkDate) : '') : 'nein'}</td></tr></tbody></table>
  <h2>Kontakte und Gespräche (${acts.length})</h2>${acts.length ? `<table><thead><tr><th>Datum</th><th>Art</th><th>Inhalt</th></tr></thead><tbody>${acts.sort((a, b) => a.date.localeCompare(b.date)).map(a => `<tr><td>${fmtDate(a.date)}</td><td>${esc(ACT_KINDS[a.kind]?.[0] || '')}</td><td>${esc([actTitle(a), a.text].filter(Boolean).join(' – '))}</td></tr>`).join('')}</tbody></table>` : '<p>keine</p>'}

function parseCSV(text) {
  const sep = (text.split('\n')[0].match(/;/g) || []).length >= (text.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i]; if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; } else if (ch === '"') q = true; else if (ch === sep) { row.push(cur); cur = ''; } else if (ch === '\n') { row.push(cur.replace(/\r$/, '')); rows.push(row); row = []; cur = ''; } else cur += ch; }
  if (cur || row.length) { row.push(cur.replace(/\r$/, '')); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function parseVCF(text) {
  const out = []; text.replace(/\r\n[ \t]/g, '').split(/BEGIN:VCARD/i).slice(1).forEach(block => {
    const c = {}; block.split(/\r?\n/).forEach(line => {
      const m = line.match(/^([^:;]+)([^:]*):(.*)$/); if (!m) return; const k = m[1].toUpperCase(), p = m[2].toUpperCase(), v = m[3].replace(/\\,/g, ',').replace(/\\n/gi, ' ').trim();
      if (k === 'N') { const [last, first] = v.split(';'); c.last = last; c.first = first; }
      else if (k === 'FN' && !c.last) { const parts = v.split(' '); c.last = parts.pop(); c.first = parts.join(' '); }
      else if (k === 'ORG') c.company = v.split(';')[0];
      else if (k === 'TITLE') c.role = v;
      else if (k === 'EMAIL' && !c.email) c.email = v;
      else if (k === 'TEL') { if (/CELL/.test(p) && !c.mobile) c.mobile = v; else if (!c.phone) c.phone = v; else if (!c.mobile) c.mobile = v; }
      else if (k === 'ADR') { const a = v.split(';'); c.street = a[2]; c.city = a[3]; c.zip = a[5]; }
    }); if (c.last || c.email) out.push(c);
  }); return out;
}
const COLMAP = { first: /^vorname|first/i, last: /^nachname|^name$|last|familienname/i, company: /firma|unternehmen|company|organisation/i, role: /position|funktion|titel|title/i, email: /mail/i, phone: /^telefon|^phone|tel\b|festnetz/i, mobile: /mobil|handy|mobile|cell/i, street: /stra(ß|ss)e|street|adresse/i, zip: /plz|postleitzahl|zip/i, city: /^ort|stadt|city/i, source: /quelle|source/i, notes: /notiz|bemerkung|note/i };

      <div class="tbl-wrap" style="border:1px solid var(--line)"><table class="tbl mtable" style="font-size:14px"><thead><tr><th>Beschreibung</th><th class="r">Menge</th><th>Einheit</th><th class="r">Einzelpreis</th><th class="r">Rabatt %</th><th class="r">Summe</th><th></th></tr></thead><tbody id="qItems">${q.items.map(itemRow).join('')}</tbody></table></div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px"><table class="tbl" style="width:auto;min-width:300px" id="qTot"></table></div>

    foot: `${q.id ? `<button class="btn btn-red l" id="qDel">${svg('trash')}</button>` : ''}<select id="qStatus" class="btn">${['entwurf', 'offen', 'angenommen', 'abgelehnt'].map(s => `<option value="${s}"${quoteStatus(q) === s ? ' selected' : ''}>Status: ${s}</option>`).join('')}</select><button class="btn" id="qPrint">${svg('print')} Drucken</button><button class="btn btn-p" id="qSave">${svg('check')} Speichern</button>` });
  const tb = $('#qItems', md), form = $('#qF', md);
  const read = () => { const f = form.elements; Object.assign(q, { no: f.no.value.trim(), date: f.date.value, valid: f.valid.value, company: f.company.value, contact: f.contact.value, deal: f.deal.value, subject: f.subject.value, intro: f.intro.value, outro: $('#qOutro', md).value, status: $('#qStatus', md).value });
    q.items = $$('tr[data-i]', tb).map(tr => { const g = k => tr.querySelector(`[data-k="${k}"]`).value; return { text: g('text'), qty: num(g('qty')), unit: g('unit'), price: num(g('price')), disc: num(g('disc')) }; }).filter(it => it.text || it.price); };
  const tot = () => { $$('tr[data-i]', tb).forEach(tr => { const g = k => num(tr.querySelector(`[data-k="${k}"]`).value); tr.querySelector('[data-sum]').textContent = fmtMoney(g('qty') * g('price') * (1 - g('disc') / 100)); }); read(); const t = quoteTotals(q); $('#qTot', md).innerHTML = `<tr><td>Summe netto</td><td class="r">${fmtMoney(t.net)}</td></tr>${data.settings.smallBiz ? '' : `<tr><td>zzgl. ${t.rate} % USt</td><td class="r">${fmtMoney(t.vat)}</td></tr>`}<tr><td><b>Gesamt</b></td><td class="r"><b>${fmtMoney(t.gross)}</b></td></tr>`; };

  const persist = () => { read(); if (!q.no) { toast('Bitte eine Nummer eintragen.', { err: true }); return false; } const isNew = !q.id; if (isNew) { q.id = pid(); data.settings.quoteNo = (Number(data.settings.quoteNo) || 1) + 1; }
    const old = quoteById(q.id); if (q.status === 'offen' && !q.sent) q.sent = today();

  $('#qSave', md).onclick = () => { if (!persist()) return; closeModal(); render(); toast('Angebot gespeichert.'); };

}

  <div class="grid g4" style="margin-top:16px">${kpi('Anrufe', S.calls, S.avgCall ? `Ø ${fmtNum(S.avgCall, 1)} Min. Gesprächsdauer` : '', 'phone', 'blue')}${kpi('E-Mails', S.mails, 'gesendet (festgehalten)', 'mail', 'sea')}${kpi('Termine', S.meets, 'Besuche & Meetings', 'calendar', 'gold')}${kpi('Neue Geschäfte', S.created.length, fmtMoney(sum(S.created, d => d.value)), 'plus')}</div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card pad"><div class="sec-t"><h3>${svg('chart')} Umsatz je Monat & Prognose</h3><span class="small muted">▮ gewonnen · ▨ erwartet (gewichtet)</span></div><div class="chart">${series.map(x => `<div title="${monthShort(x.m)}: ${fmtMoney(x.won || x.fc)}"><em>${x.won || x.fc ? fmtNum(Math.round((x.won || x.fc) / 1000)) + 'k' : ''}</em><i class="${x.future ? 'f' : ''}" style="height:${Math.round((x.future ? x.fc : x.won) / mx * 130)}px"></i><span>${monthShort(x.m)}</span></div>`).join('')}</div></div>
    <div class="card pad"><div class="sec-t"><h3>${svg('kanban')} Pipeline nach Phase</h3><span class="small muted">heute</span></div><div class="funnel">${stg.map(x => `<div><b>${esc(x.st.name)}</b><div class="bar"><i style="width:${Math.round(x.v / smx * 100)}%"></i></div><span>${fmtMoney(x.v)} · ${x.n}</span></div>`).join('')}</div></div>
    <div class="card pad"><div class="sec-t"><h3>${svg('x')} Warum verloren?</h3></div>${reasons.length ? `<div class="funnel">${reasons.map(([r, n]) => `<div><b>${esc(r)}</b><div class="bar red"><i style="width:${Math.round(n / rmx * 100)}%"></i></div><span>${plural(n, 'Mal', 'Mal')}</span></div>`).join('')}</div>` : '<span class="muted small">Keine verlorenen Geschäfte im Zeitraum.</span>'}</div>
    <div class="card pad"><div class="sec-t"><h3>${svg('target')} Woher kommen die Aufträge?</h3></div>${sources.length ? `<div class="funnel">${sources.map(([r, v]) => `<div><b>${esc(r)}</b><div class="bar"><i style="width:${Math.round(v / somx * 100)}%;background:var(--sea)"></i></div><span>${fmtMoney(v)}</span></div>`).join('')}</div>` : '<span class="muted small">Noch keine gewonnenen Aufträge im Zeitraum.</span>'}</div>

VIEWS.commissions = () => {

  `<div class="grid g3" style="margin-bottom:16px">${kpi('Noch nicht bezahlt', fmtMoney(open), plural(won.filter(d => !d.provPaid).length, 'Auftrag', 'Aufträge'), 'coins', 'red')}${kpi('Provision ' + new Date().getFullYear(), fmtMoney(yr), 'aus gewonnenen Aufträgen', 'percent', 'sea')}${kpi('Auftraggeber', data.principals.length, data.principals.map(p => p.name).slice(0, 3).join(', '), 'building', 'blue')}</div>
  <div class="tools">${chips('pr', [['', 'Alle Auftraggeber'], ...data.principals.map(p => [p.id, p.name])], pf)}${chips('f', [['offen', 'Offen'], ['abgerechnet', 'Abgerechnet'], ['bezahlt', 'Bezahlt'], ['alle', 'Alle']], f)}</div>` +
  (data.principals.length ? '' : `<div class="note" style="margin-bottom:12px">Lege zuerst deine Auftraggeber (Hersteller, Firmen, die du vertrittst) mit ihrem Provisionssatz an. Bei jedem Geschäft wählst du dann den Auftraggeber aus.</div>`) +
  (list.length ? `<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Auftrag</th><th class="hm">Auftraggeber</th><th class="r">Umsatz</th><th class="r">Satz</th><th class="r">Provision</th><th>Status</th><th></th></tr></thead><tbody>${list.map(d => `<tr><td><b>${esc(dealTitle(d))}</b><span class="sub">${fmtDate(d.closed)} · ${esc(dealCompany(d)?.name || '')}</span></td><td class="hm">${esc(principalById(d.principal)?.name || '')}</td><td class="r">${amt(num(d.value))}</td><td class="r">${fmtNum(dealProvPct(d), 1)} %</td><td class="r"><b>${amt(dealProv(d))}</b></td>
    <td>${pill(st(d), { offen: 'gold', abgerechnet: 'blue', bezahlt: 'g' }[st(d)])}${d.provSettled ? `<span class="sub">abger. ${fmtDate(d.provSettled)}</span>` : ''}</td><td><div class="rowacts">${!d.provSettled ? `<button class="btn btn-sm" data-act="provMark:${d.id}:settled">Abgerechnet</button>` : ''}${!d.provPaid ? `<button class="btn btn-sm btn-p" data-act="provMark:${d.id}:paid">${svg('check')} Bezahlt</button>` : `<button class="btn btn-sm" data-act="provMark:${d.id}:undo">Zurück</button>`}</div></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">Summe</td><td class="r">${fmtMoney(sum(list, dealProv))}</td><td colspan="2"></td></tr></tfoot></table></div>` :
  `<div class="card">${emptyBox('Keine Provisionen', 'Gewonnene Geschäfte mit Auftraggeber erscheinen hier.')}</div>`) +
  `<div class="card pad" style="margin-top:16px"><div class="sec-t"><h3>${svg('building')} Auftraggeber</h3></div><div class="list">${data.principals.map(p => `<div class="li"><div class="av blue">${svg('building')}</div><div class="grow"><b>${esc(p.name)}</b><div class="small muted">${fmtNum(num(p.pct), 1)} % Provision${p.note ? ' · ' + esc(p.note) : ''}</div></div><button class="btn btn-sm" data-act="editPrincipal:${p.id}">${svg('edit')}</button></div>`).join('') || '<span class="muted small">Noch keine.</span>'}</div>
  <p class="small muted" style="margin-bottom:0">Hinweis: Die Provisionsabrechnung erstellt dein Auftraggeber (§ 87c HGB). Mit dieser Übersicht prüfst du, ob alle Aufträge enthalten sind und alles bezahlt wurde.</p></div>`;
};
ACTS.provMark = (id, what) => { const d = dealById(id); if (what === 'settled') d.provSettled = today(); else if (what === 'paid') { d.provPaid = today(); d.provSettled ||= today(); } else { d.provPaid = ''; d.provSettled = ''; } upsert('deals', d); render(); };
ACTS.editPrincipal = id => { const p = byId('principals', id) || {};
  openForm({ title: id ? 'Auftraggeber bearbeiten' : 'Neuer Auftraggeber', fields: () => [{ k: 'name', label: 'Firma (Hersteller / Auftraggeber)', req: true, full: true }, { k: 'pct', label: 'Provisionssatz %', type: 'number', step: '0.1', req: true }, { k: 'contact', label: 'Ansprechpartner' }, { k: 'note', label: 'Notiz (z. B. Abrechnung monatlich)', full: true }],
    save: x => { if (!x.id) x.id = pid(); upsert('principals', x); },
    del: id ? async x => { if (!await confirmBox('Auftraggeber löschen? Geschäfte bleiben erhalten.', 'Löschen', true)) return false; removeFrom('principals', x.id); return true; } : null }, p); };
ACTS.printProv = pf => {

/* ---------- Sicherung ---------- */
async function snapshot() { await flushSave(); const photos = {}; for (const [k, v] of photoCache) photos[k] = v; return { app: APPNAME, version: VERSION, demo: IS_DEMO, created: new Date().toISOString(), data, photos }; }
ACTS.backup = async () => { const s = await snapshot(); downloadFile(`zackvertrieb_sicherung_${today()}.json`, JSON.stringify(s), 'application/json'); data.meta.lastBackup = new Date().toISOString(); save(); render(); toast('Sicherung gespeichert. Bitte an einem sicheren Ort aufbewahren.'); };
async function readJsonFile() { const f = await pickFile('.json,application/json'); if (!f) return null; try { return JSON.parse(await f.text()); } catch (e) { toast('Die Datei ist keine ZackVertrieb-Sicherung.', { err: true }); return null; } }
ACTS.restore = async () => {
  const s = await readJsonFile(); if (!s) return; if (!String(s.app || '').startsWith('ZackVertrieb') || !s.data) return toast('Das ist keine ZackVertrieb-Sicherung.', { err: true });
  if (!await confirmBox(`Sicherung vom ${fmtDate(s.created.slice(0, 10))} laden? Alle Daten auf diesem Gerät werden ersetzt.`, 'Laden', true)) return;
  await store.clear(); photoCache.clear(); for (const [k, v] of Object.entries(s.photos || {})) { await store.set(k, v); photoCache.set(k, v); }
  data = normalize(s.data); data.meta.setupDone = true; await flushSave(); applyTheme(); render(); toast('Sicherung geladen.');
};
ACTS.syncOut = async () => { if (!data.meta.device.code) { toast('Bitte zuerst Name und Kürzel für dieses Gerät eintragen und speichern.', { err: true }); return; } const s = await snapshot(); s.sync = true; s.device = data.meta.device; downloadFile(`zackvertrieb_abgleich_${data.meta.device.code}_${today()}.json`, JSON.stringify(s), 'application/json'); toast('Abgleich-Datei erstellt. Jetzt auf dem anderen Gerät einlesen.'); };
ACTS.syncIn = async () => {
  const s = await readJsonFile(); if (!s) return; if (!String(s.app || '').startsWith('ZackVertrieb') || !s.data) return toast('Das ist keine ZackVertrieb-Datei.', { err: true });
  if (s.device?.code && s.device.code === data.meta.device.code) return toast('Diese Datei kommt von diesem Gerät selbst (gleiches Kürzel).', { err: true });
  const r = mergeData(data, normalize(s.data));
  for (const [k, v] of Object.entries(s.photos || {})) if (!photoCache.has(k)) { await store.set(k, v); photoCache.set(k, v); }
  save(); render(); toast(`Abgleich fertig: ${r.added} neu, ${r.updated} aktualisiert, ${r.removed} gelöscht.`, { ms: 6000 });
};
function mergeData(mine, theirs) {
  const res = { added: 0, updated: 0, removed: 0 }, delMine = mine.meta.deleted || [], delTheirs = theirs.meta.deleted || [];
  const isDel = (list, col, id) => list.some(d => d.col === col && d.id === String(id));
  COLLECTIONS.forEach(col => {
    const map = new Map(mine[col].map(x => [String(x.id), x]));
    theirs[col].forEach(x => { const id = String(x.id); if (isDel(delMine, col, id)) return; const cur = map.get(id); if (!cur) { mine[col].push(x); res.added++; } else if ((x.updatedAt || '') > (cur.updatedAt || '')) { Object.keys(cur).forEach(k => delete cur[k]); Object.assign(cur, x); res.updated++; } });
    const before = mine[col].length; mine[col] = mine[col].filter(x => !isDel(delTheirs, col, String(x.id))); res.removed += before - mine[col].length;
  });
  mine.meta.deleted = [...delMine, ...delTheirs.filter(d => !isDel(delMine, d.col, d.id))];
  if ((theirs.meta.updated || '') > (mine.meta.updated || '')) { mine.owner = { ...mine.owner, ...theirs.owner }; mine.settings = { ...mine.settings, ...theirs.settings }; ['stages', 'lostReasons', 'sources', 'sellers'].forEach(k => { mine[k] = theirs[k]; }); const bl = new Map(mine.blocklist.map(b => [b.key, b])); theirs.blocklist.forEach(b => bl.set(b.key, b)); mine.blocklist = [...bl.values()]; }
  return res;
}
function mergePayments(a = [], b = []) { const m = new Map(a.map(p => [p.id, p])); b.forEach(p => { if (!m.has(p.id)) m.set(p.id, p); }); return [...m.values()].sort((x, y) => x.date.localeCompare(y.date)); }

async function boot() {

  if (!saved && IS_DEMO) { saved = demoData(); saved.meta.setupDone = true; }
  data = normalize(saved || freshData());
  await loadPhotos(); applyTheme();
  const h = location.hash.slice(1); if (VIEWS[h]) view = h;
  if (!saved || IS_DEMO) await flushSave();
  render();
  if (store.mode !== 'idb') toast('Hinweis: Der Browser erlaubt nur den Notfallspeicher. Bitte oft sichern.', { ms: 7000 });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && window.__ZV_SW__) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.__ready = true;
}
window.addEventListener('beforeunload', () => { if (saveTimer) { clearTimeout(saveTimer); store.set('data', data); } });
