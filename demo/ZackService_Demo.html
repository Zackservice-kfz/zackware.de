/* Lagerbestand an den Zustand einer Rechnung angleichen */
function syncStock(inv, removing = false) {
  const want = {};
  if (!removing && ['Offen','Bezahlt'].includes(inv.status)) (inv.items || []).forEach(i => { if (i.articleId) want[i.articleId] = round2((want[i.articleId] || 0) + num(i.qty)); });
  const had = inv.booked || {}, neg = [];
  new Set([...Object.keys(want), ...Object.keys(had)]).forEach(id => {
    const delta = round2((want[id] || 0) - (had[id] || 0)); if (!delta) return;
    const a = byId('articles', id); if (!a) return;
    a.stock = round2(num(a.stock) - delta);
    (a.moves ||= []).unshift({ date: today(), qty: -delta, note: `${delta > 0 ? 'Rechnung' : 'Rückbuchung'} ${inv.number}` });
    if (a.stock < 0) neg.push(a.name);
  });
  inv.booked = want;
  return neg;
}

  if (k === 'refund') return refundPay(x);
  if (k === 'einvoiceStorno') return downloadXRechnung(x, true);
  if (k === 'einvShow' && x?.einvoice) { try { return showEInvoice(parseEInvoice(x.einvoice.xml), x.einvoice.xml, x.einvoice.name); } catch (e) { return toast(e.message, { error: true }); } }
  if (k === 'timeStop') return stopTimer(id);
  if (k === 'edit') return openForm(type, x, { edit: true });
  if (k === 'delete') return deleteRecord(type, x);
  if (!x) return;

  if (k === 'advance') {
    const prev = x.status;
    x.status = x.status === 'Offen' ? 'In Arbeit' : 'Erledigt';
    if (x.status === 'Erledigt' && !x.date) x.date = t;
    save(); render();
    return toast(x.status === 'Erledigt' ? `${x.title} ist erledigt.` : `${x.title} ist in Arbeit.`, {
      action: x.status === 'Erledigt' ? ['Rechnung erstellen', () => handleAct(`invoiceFrom:orders:${x.id}`)] : ['Rückgängig', () => { x.status = prev; done(); }]
    });
  }
  if (k === 'invoiceFrom') {
    const existing = type === 'offers' ? offerInvoice(x) : liveInvoice(x.invoiceId);
    if (existing) { toast(`Dafür gibt es schon die Rechnung ${existing.number}.`); return openForm('invoices', existing, { edit: true }); }
    if (type === 'offers' && x.orderId && byId('orders', x.orderId)) { toast(`Zu diesem Angebot gibt es den Auftrag ${byId('orders', x.orderId).number} – die Rechnung entsteht dort, damit Zeiten und Abschläge stimmen.`); return handleAct(`invoiceFrom:orders:${x.orderId}`); }
    let items = clone(x.items), timeNote = '';
    if (type === 'orders') {
      const tt = orderTimes(x.id).filter(z => !z.running && !timeBilled(z)), min = tt.reduce((s, z) => s + timeMin(z), 0);
      if (x.contractId) timeNote += ' Wartung aus einem Vertrag: Die Arbeitszeit ist mit dem Vertrag abgegolten – hier nur Zusatzarbeiten und Ersatzteile berechnen.';
      if (min > 0 && !x.contractId) {
        const isWork = i => i.kind === 'Lohn' && i.unit === 'Std.';
        // Festpreis-Lohn (z. B. Wartungspauschale, m²-Preis) ersetzt die Stunden – ein Zuschlag (Notdienst, Wochenende) nicht
        const fixed = items.filter(i => i.kind === 'Lohn' && !isWork(i) && !/zuschlag/i.test(i.desc));
        if (items.some(isWork) || !fixed.length) {
          // Stunden je Qualifikation (Meister, Geselle, Azubi …) mit dem passenden Stundensatz
          const byLv = {}; tt.forEach(z => { const lv = data.team.find(m => sameName(m.name, z.member))?.level || 'Geselle'; byLv[lv] = (byLv[lv] || 0) + timeMin(z); });
          const days = [...new Set(tt.map(z => fmtDate(z.date).slice(0, 6)))].join(', ');
          const rows = RATE_LEVELS.filter(lv => byLv[lv]).map(lv => { const nm = rateName(lv), old = items.find(i => isWork(i) && i.desc === `Arbeitszeit ${nm}`); return { desc: `Arbeitszeit ${nm} lt. Zeiterfassung (${days})`, qty: Math.ceil(byLv[lv] / 15) / 4, unit: 'Std.', price: old ? num(old.price) : rateOf(lv), kind: 'Lohn', nm }; });
          items = [...rows.map(({ nm, ...r }) => r), ...items.filter(i => !isWork(i))];
          timeNote = ` Erfasste Arbeitszeit: ${fmtH(min)} → ${rows.map(r => `${r.nm} ${fmtNum(r.qty)} Std.`).join(', ')} (auf Viertelstunden aufgerundet) – ersetzt die geplanten Stunden.`;
        } else timeNote = ` Erfasste Arbeitszeit: ${fmtH(min)} – nicht übernommen, weil der Lohn schon mit festen Preisen drinsteht (${fixed.map(i => i.desc.split('\n')[0]).slice(0, 2).join(', ')}). Bei Bedarf mit „+ Stunde“ ergänzen.`;
      }
      if (orderTimes(x.id).some(z => z.running)) timeNote += ' Achtung: Für diesen Auftrag läuft noch eine Zeit.';
    }
    if (type === 'orders') {
      const parts = partsOf(x.id), drafts = parts.filter(i => i.status === 'Entwurf');
      if (drafts.length) return toast(`Erst den Entwurf der ${drafts[0].abschlag}. Abschlagsrechnung stellen oder löschen – dann die Schlussrechnung.`, { error: true, ms: 6000 });
      if (parts.length) {
        // je Steuersatz der Abschlags-/Anzahlungsrechnung eine Abzugszeile, damit die Umsatzsteuer stimmt
        parts.forEach(p => { const gr = totals(p).groups.filter(g => g.net), mixed = gr.length > 1;
          gr.forEach(g => items.push({ desc: `abzüglich ${p.abschlag}. ${PARTN()}srechnung ${p.number} vom ${fmtDate(p.date)}${mixed ? ` (${fmtNum(g.rate)} % USt)` : ''}`, qty: 1, unit: 'Pauschal', price: -g.net, kind: 'Sonstiges', ded: p.id, ...(mixed || num(p.vatRate) !== currentRate() ? { vat: g.rate } : {}) })); });
        timeNote += ` Schlussrechnung: ${plural(parts.length, PARTN(), PARTN() === 'Anzahlung' ? 'Anzahlungen' : 'Abschläge')} über zusammen ${euro(round2(parts.reduce((s, p) => s + totals(p).net, 0)))} netto werden abgezogen.`;
      }
    }
    if (type === 'orders' && !items.length && !confirm('Dieser Auftrag hat noch keine Positionen. Trotzdem eine Rechnung beginnen?')) return;
    return openForm('invoices', {
      customer: x.customer, property: x.property, date: t, ...(x.measure ? { measure: clone(x.measure) } : {}), ...(x.km ? { km: x.km } : {}),
      serviceDate: type === 'orders' && x.date ? fmtDate(x.date) : '',
      items,
      notes: type === 'orders' ? `für den Auftrag ${x.number} („${x.title}“) berechnen wir Ihnen:` : `gemäß unserem Angebot ${x.number} berechnen wir Ihnen:`
    }, { link: { type, id: x.id }, note: `Übernommen aus ${type === 'orders' ? 'Auftrag' : 'Angebot'} ${x.number}. Nach dem Speichern sind beide verknüpft.${timeNote}` });
  }
  if (k === 'orderFrom') {
    const oi = offerInvoice(x); if (oi) return toast(`Zu diesem Angebot gibt es schon die Rechnung ${invNo(oi)}.`, { error: true });
    if (x.orderId && byId('orders', x.orderId)) return toast(`Zu diesem Angebot gibt es schon den Auftrag ${byId('orders', x.orderId).number}.`, { error: true });
    return openForm('orders', { title: firstLine(x.notes) || `Auftrag aus ${x.number}`, customer: x.customer, property: x.property, items: clone(x.items), notes: x.notes, status: 'Offen', ...(x.measure ? { measure: clone(x.measure) } : {}), ...(x.guests ? { guests: x.guests } : {}), ...(x.occasion ? { occasion: x.occasion, title: `${x.occasion} ${x.customer}` } : {}), ...(x.eventDate ? { date: x.eventDate } : {}) },
      { link: { type: 'offers', id: x.id }, note: `Übernommen aus Angebot ${x.number}. Das Angebot wird als angenommen markiert.` });
  }
  if (k.startsWith('status-')) { x.status = k.slice(7); return done(`${x.number}: ${x.status}.`); }
  if (k === 'print') return printDoc(type, x);
  if (k === 'printJob') return printJob(x);
  if (k === 'printMeasure') return printMeasure(x);
  if (k === 'partInvoice') return openPartModal(x);
  if (k === 'jobFile') return jobFile(x);
  if (k === 'check') return checkModal(x);
  if (k === 'printEqOne') return printEquipment([x]);
  if (k === 'visitOrder') return visitOrder(x);
  if (k === 'diaryFor') return newLog('Bautagebuch', { property: x.property || '', job: x.id, by: x.assignee || '' });
  if (k === 'printDiary') return printDiary(x);
  if (k === 'proofWork') return openProof(x, 'work');
  if (k === 'proofAccept') return openProof(x, 'accept');
  if (k === 'issue') {
    if (!x.items.length) return toast('Füge zuerst Positionen hinzu.', { error: true });
    if (x.status !== 'Entwurf') return;
    if (needCompany()) return;
    { const bad = badDeductions(x, x.items); if (bad.length) return toast('Abzug nicht möglich: ' + bad.join('; ') + '. Bitte den Entwurf öffnen und die Zeile entfernen.', { error: true, ms: 8000 }); }
    if (!confirm('Rechnung jetzt stellen? Sie bekommt eine feste Nummer und kann danach nicht mehr geändert werden.')) return;
    const last = lastIssuedDate();
    if (!x.date || x.date !== t) { x.date = t; x.dueDate = addDays(t, c.paymentDays); }
    x.vatRate = currentRate(); x.status = 'Offen';
    const msg = onIssue(x); syncStock(x); save(); render(); toast(msg);
    return printDoc('invoices', x);
  }
  if (k === 'pay') return openPayModal(x);
  if (k === 'storno' || k === 'stornoFix') return stornoInvoice(x, k === 'stornoFix');
  if (k === 'printStorno') return printStorno(x);
  if (k === 'remind') return openDunModal(x);
  if (k === 'duplicate') {
    const copy = clone(x); delete copy.id; ['invoiceId','orderId','offerId','booked','paidDate','reminders','lastReminder','payments','storno','replaces','dunning','contractId','period','addr'].forEach(p => delete copy[p]);
    copy.number = ''; if (type === 'orders') { copy.status = 'Offen'; copy.date = ''; copy.photos = []; }
    if (type === 'invoices') { copy.items = (copy.items || []).filter(i => !i.ded); delete copy.abschlag; }
    if (type !== 'orders') { copy.status = 'Entwurf'; copy.date = t; delete copy.validUntil; delete copy.dueDate; }
    return openForm(type, copy);
  }
  if (k === 'file') return customerFile(x);
  if (k === 'newOrderFor') return openForm('orders', { customer: x.name });
  if (k === 'newOfferFor') return openForm('offers', { customer: x.name });
  if (k === 'newPropertyFor') return openForm('properties', { customer: x.name, zip: x.zip, city: x.city });
  if (k === 'newOrderAt') return openForm('orders', { customer: x.customer, property: x.name });
  if (k === 'stockIn' || k === 'stockOut') return stockForm(x, k === 'stockIn' ? 1 : -1);
  if (k === 'logsFor') return go('logs', { search: x.name });
  if (k === 'photos') return showPhotos(x.photos || [], x.photoCaps || [], 0);
  if (k === 'notice') return openNotice(x.name);
  if (k === 'msgTo') { newDraft('all', { recipients: recipientsFor('all').filter(r => r.key === 'c' + x.id) }); return go('messages'); }
  if (k === 'orderFromLog') {
    return openForm('orders', { title: `Mangel beheben: ${x.pWhat || 'Prüfung'}`, customer: propertyOf(x.property)?.customer || '', property: x.property, date: '', priority: 'Hoch', notes: `Aus Prüfprotokoll vom ${fmtDate(x.date)}:\n${x.pDefects || ''}` }, { note: 'Nach dem Speichern ist der Auftrag mit dem Protokoll verknüpft.', fromLog: x.id });
  }
}

function deleteRecord(type, x) {
  if (!x) return;
  const label = x.number || x.name || x.title || x.no;
  if (['expenses', 'cash'].includes(type) && fibuLocked(x.date)) return toast(lockMsg(), { error: true, ms: 7000 });
  if (type === 'expenses' && x.autoCar) return toast('Dieser Ankauf gehört zu einem Fahrzeug im Fahrzeughandel – bitte dort ändern oder löschen.', { error: true, ms: 7000 });
  if (type === 'cars') {
    if (x.status === 'Verkauft') return toast('Das Fahrzeug ist verkauft und hat eine Rechnung – es bleibt im Verlauf.', { error: true, ms: 7000 });
    const ex = x.expId && byId('expenses', x.expId);
    if (ex && fibuLocked(ex.date)) return toast(lockMsg(), { error: true, ms: 7000 });
    if (data.invoices.some(i => i.status !== 'Storniert' && (i.payments || []).some(p => p.method === 'Inzahlungnahme' && String(p.note || '').includes(`(${x.no})`)))) return toast('Dieses Fahrzeug wurde in Zahlung genommen und ist mit einer Rechnung verrechnet – es bleibt erhalten.', { error: true, ms: 7000 });
  }
  let msg = `„${label}“ wirklich löschen?`;
  if (type === 'invoices' && x.status !== 'Entwurf') return toast(`Rechnung ${x.number} ist gestellt und muss aufbewahrt werden. Bitte stornieren statt löschen.`, { error: true, ms: 6000 });
  if (type === 'invoices') msg = 'Diesen Rechnungsentwurf löschen?';
  if (type === 'times' && lockedTime(x)) return toast(`Diese Zeit steht schon auf der Rechnung ${lockedTime(x).number} und muss erhalten bleiben.`, { error: true, ms: 6000 });
  if (type === 'customers') {
    const n = ['orders','offers','invoices','properties','contracts'].reduce((s, k) => s + data[k].filter(r => sameName(r.customer, x.name)).length, 0);
    if (n) msg = `Zu „${x.name}“ gibt es noch ${n} Aufträge, Angebote, Rechnungen oder Objekte. Diese bleiben erhalten, verlieren aber die Kundenanschrift. Trotzdem löschen?`;
  }
  if (type === 'customers' && data.contracts.some(ct => ct.active && sameName(ct.customer, x.name))) return toast(`Zu „${x.name}“ gibt es aktive Verträge. Bitte die Verträge zuerst beenden.`, { error: true, ms: 6000 });
  if (type === 'properties') {
    const nc = data.contracts.filter(ct => ct.active && sameName(ct.property, x.name)).length, nl = data.logs.filter(l => sameName(l.property, x.name)).length;
    if (nc || nl) msg = `Zu „${x.name}“ gibt es ${[nc ? plural(nc, 'aktiven Vertrag', 'aktive Verträge') : '', nl ? plural(nl, 'Protokoll', 'Protokolle') : ''].filter(Boolean).join(' und ')}. Sie bleiben erhalten (Nachweise weiter druckbar). Objekt trotzdem löschen?`;
  }
  if (type === 'customers' && data.invoices.some(i => sameName(i.customer, x.name) && i.status !== 'Entwurf')) return toast(`Zu „${x.name}“ gibt es gestellte Rechnungen – der Kunde bleibt deshalb in der Kartei.`, { error: true, ms: 6000 });
  if (type === 'articles' && data.invoices.some(i => i.items.some(it => it.articleId === x.id) && i.status !== 'Storniert')) msg = `„${x.name}“ steht auf Rechnungen. Die Rechnungen bleiben unverändert. Trotzdem löschen?`;
  if (!confirm(msg)) return;
  if (type === 'invoices') {
    syncStock(x, true);
    data.orders.forEach(o => { if (o.invoiceId === x.id) delete o.invoiceId; });
    data.offers.forEach(o => { if (o.invoiceId === x.id) delete o.invoiceId; });
  }
  if (type === 'orders') {
    const tt = orderTimes(x.id);
    if (tt.length && !confirm(`Zu diesem Auftrag gibt es ${plural(tt.length, 'Zeiteintrag', 'Zeiteinträge')}. Sie bleiben als „ohne Auftrag“ erhalten. Weiter?`)) return;
    tt.forEach(z => { z.orderId = null; });
    data.logs.forEach(l => { if (l.orderId === x.id) delete l.orderId; if (l.job === x.id) delete l.job; });
    { const c = x.contractId && byId('contracts', x.contractId); if (c && x.visitDate && c.nextVisit === addMonths(x.visitDate, VISIT[c.visitEvery] || 12)) { c.nextVisit = x.visitDate; toast(`Wartungstermin im Vertrag wieder auf ${fmtDate(x.visitDate)} gesetzt.`); } }
    data.offers.forEach(o => { if (o.orderId === x.id) delete o.orderId; });
    data.invoices.forEach(i => { if (i.orderId === x.id) delete i.orderId; });
  }
  if (type === 'offers') {
    data.orders.forEach(o => { if (o.offerId === x.id) delete o.offerId; });
    data.invoices.forEach(i => { if (i.offerId === x.id) delete i.offerId; });
  }
  data[type] = data[type].filter(r => r !== x);
  if (['orders', 'logs', 'properties', 'expenses', 'tires', 'cars'].includes(type) && (x.photos || []).length) {
    const del = x.photos.filter(ph => !String(ph).startsWith('data:')); del.forEach(ph => photoCache.delete(ph));
    data.backup.changes = num(data.backup.changes) + 1; persist({ del: del.map(ph => PHOTO_PREFIX + ph) });
    toast(`${SINGULAR[type]} gelöscht.`); return render();
  }
  if (save()) { toast(`${SINGULAR[type]} gelöscht.`); render(); }
}

function toggleTask(id, checked) {
  const x = byId('tasks', id); if (!x) return;
  if (checked && x.repeat && x.repeat !== 'Einmalig') {
    const prevDate = x.date, prevLast = x.lastDone;
    x.lastDone = today();
    let n = nextOccurrence(x.date || today(), x.repeat);
    while (n <= today()) n = nextOccurrence(n, x.repeat);
    x.date = n; x.done = false;
    save(); render();
    return toast(`Erledigt. Nächste Fälligkeit: ${fmtDate(n)}.`, { action: ['Rückgängig', () => { x.date = prevDate; x.lastDone = prevLast; save(); render(); }] });
  }
  x.done = checked; if (checked) x.lastDone = today();
  save(); render();
}

function stockForm(a, dir) {
  openModal({
    title: `${dir > 0 ? 'Zugang' : 'Entnahme'} buchen`,
    body: `<form id="stockF"><div class="modal-body"><p style="margin-top:0"><b>${esc(a.name)}</b><br><span class="muted">Aktueller Bestand: ${fmtNum(a.stock)} ${esc(a.unit)}</span></p>
      <div class="form-grid"><div class="field"><label for="sq">Menge (${esc(a.unit)}) <span class="req">*</span></label><input id="sq" name="qty" inputmode="decimal" required value="${dir > 0 ? Math.max(1, round2(num(a.minStock) * 2 - num(a.stock))) : 1}"></div>
      <div class="field"><label for="sn">Vermerk</label><input id="sn" name="note" placeholder="${dir > 0 ? (isKfz() ? 'z. B. Lieferung Teilehandel' : 'z. B. Lieferung Raiffeisen') : (isKfz() ? 'z. B. Auftrag AU-2026-001' : 'z. B. Objekt Hauptstraße')}"></div></div></div>
      <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Abbrechen</button><button class="btn btn-primary">Buchen</button></div></form>`,
    onMount: root => { $('#stockF', root).onsubmit = e => {
      e.preventDefault();
      const q = num(e.target.qty.value);
      if (q <= 0) return toast('Bitte eine Menge größer 0 eingeben.', { error: true });
      a.stock = round2(num(a.stock) + dir * q);
      (a.moves ||= []).unshift({ date: today(), qty: dir * q, note: e.target.note.value.trim() || (dir > 0 ? 'Zugang' : 'Entnahme') });
      if (!save()) return;
      closeModal(); render();
      toast(`Neuer Bestand: ${fmtNum(a.stock)} ${a.unit}${a.stock < 0 ? ' (negativ!)' : ''}.`, { error: a.stock < 0 });
    }; }
  });
}

function customerFile(c) {
  const of = k => data[k].filter(x => sameName(x.customer, c.name));
  const props = of('properties'), orders = of('orders'), offers = of('offers'), invs = of('invoices');
  const open = invs.reduce((s, i) => s + openOf(i), 0);
  const paid = invs.reduce((s, i) => s + (i.payments || []).filter(p => !isTransfer(p)).reduce((a, p) => a + num(p.amount), 0), 0);
  const li = (txt, right, act) => `<li><span ${act ? `class="cell-title" data-act="${act}"` : ''}>${txt}</span><span>${right}</span></li>`;
  const sec = (h, arr, fn) => arr.length ? `<div class="file-sec"><h4>${h}</h4><ul>${arr.map(fn).join('')}</ul></div>` : '';
  openModal({
    title: esc(c.name), wide: true,
    body: `<div class="modal-body">
      <p class="muted" style="margin-top:0">${[c.contact, addrLine(c), c.phone, c.email].filter(Boolean).map(esc).join('<br>') || 'Keine Kontaktdaten hinterlegt.'}</p>
      ${c.notes ? `<div class="form-note">${esc(c.notes)}</div>` : ''}
      <div class="file-grid"><div class="file-stat"><b>${orders.filter(o => ['Offen','In Arbeit'].includes(o.status)).length}</b><span>offene Aufträge</span></div>
        <div class="file-stat"><b>${euro(open)}</b><span>offene Forderungen</span></div><div class="file-stat"><b>${euro(paid)}</b><span>bezahlt gesamt</span></div></div>
      ${sec(PROPN(), props, p => li(esc(p.name), esc(addrLine(p)), `edit:properties:${p.id}`))}
      ${sec('Aufträge', orders.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')), o => li(`${esc(o.number)} ${esc(o.title)}`, `${fmtDate(o.date)} ${pill(orderStatus(o))}`, `edit:orders:${o.id}`))}
      ${sec('Verträge', data.contracts.filter(x => sameName(x.customer, c.name)), x => li(esc(x.title), `${euro(contractNet(x))} · ${esc(x.interval)}`, `edit:contracts:${x.id}`))}
      ${sec('Angebote', offers, o => li(esc(o.number), `${euro(totals(o).gross)} ${pill(offerStatus(o))}`, `edit:offers:${o.id}`))}
      ${sec('Rechnungen', invs, i => li(esc(invNo(i)), `${euro(totals(i).gross)} ${pill(invStatus(i))}`, `edit:invoices:${i.id}`))}
      ${!props.length && !orders.length && !offers.length && !invs.length ? '<p class="empty-note">Zu diesem Kunden gibt es noch keine Vorgänge.</p>' : ''}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" data-act="edit:customers:${c.id}">Stammdaten bearbeiten</button><button class="btn btn-ghost" data-act="newOfferFor:customers:${c.id}">Neues Angebot</button><button class="btn btn-primary" data-act="newOrderFor:customers:${c.id}">Neuer Auftrag</button></div>`
  });
}

function printHTML(title, body) {
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(f);
  const d = f.contentDocument;
  d.open(); d.write(`<!doctype html><html lang="de"><head><meta charset="utf-8"><title>${esc(title)}</title><style>${PRINT_CSS}</style></head><body>${pageWrap(body)}</body></html>`); d.close();
  const fire = () => {
    f.contentWindow.onafterprint = () => setTimeout(() => f.remove(), 200);
    f.contentWindow.focus(); f.contentWindow.print();
    setTimeout(() => f.isConnected && f.remove(), 60000);
  };
  const imgs = [...d.images];
  Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))).then(() => setTimeout(fire, 60));
}

    : 'trotz unserer bisherigen Erinnerungen ist der unten genannte Betrag weiterhin offen. Dies ist unsere letzte Mahnung. Geht der Betrag nicht fristgerecht ein, behalten wir uns weitere Schritte vor.';

function chooseTrade(key, asMain) {

  if (!first && c.trade === key && !asMain) return toast(`${g.name} ist dein Hauptgewerk. Ein anderes Hauptgewerk wählst du oben in der Auswahl.`);
  if (!first && !asMain && (c.trades || []).includes(key)) {
    if (!confirm(`„${g.name}“ als Zusatzgewerk abwählen?\n\nLeistungen und Material bleiben erhalten – nur die Kategorien und die Anzeige oben fallen weg.`)) return;

/* =========================================================
   Objektverträge & Monatsabrechnung
   ========================================================= */
const INTERVALS = { 'Monatlich': 1, 'Vierteljährlich': 3, 'Halbjährlich': 6, 'Jährlich': 12 };
const ymIndex = ym => { const [y, m] = String(ym).slice(0, 7).split('-').map(Number); return y * 12 + (m - 1); };
const ymFromIndex = n => `${Math.floor(n / 12)}-${pad(n % 12 + 1)}`;
const ymLabel = ym => parseISO(ym + '-01').toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
/** Ist der Vertrag in diesem Monat abzurechnen? (Abrechnung jeweils zu Beginn des Zeitraums) */
function contractDue(c, ym) {
  if (!c.active || !c.items.length) return false;
  const n = ymIndex(ym), s0 = ymIndex(c.start), k = INTERVALS[c.interval] || 1;
  if (n < s0 || (c.end && n > ymIndex(c.end))) return false;
  return (n - s0) % k === 0;
}
function periodLabel(c, ym) {
  const k = INTERVALS[c.interval] || 1;
  if (k === 1) return ymLabel(ym);
  const endYm = ymFromIndex(ymIndex(ym) + k - 1), [y, m] = endYm.split('-').map(Number);
  return `${fmtDate(ym + '-01')} – ${fmtDate(toISO(new Date(y, m, 0)))}`;
}
const contractInvoice = (c, ym) => data.invoices.find(i => i.contractId === c.id && i.period === ym && i.status !== 'Storniert');
const contractNet = c => round2(c.items.reduce((s, i) => s + lineNet(i), 0));
/** Fällige, noch nicht abgerechnete Verträge eines Monats */
const dueContracts = ym => data.contracts.filter(c => contractDue(c, ym) && !contractInvoice(c, ym));
function nextDueYm(c, from = today().slice(0, 7)) {
  if (!c.active) return '';
  for (let n = Math.max(ymIndex(from), ymIndex(c.start)), stop = n + 13; n < stop; n++) {
    const ym = ymFromIndex(n);
    if (c.end && n > ymIndex(c.end)) return '';
    if (contractDue(c, ym) && !contractInvoice(c, ym)) return ym;
  }
  return '';
}
let billMonth = today().slice(0, 7);
function contractBilling() {

      <td class="cell-sub">${esc(periodLabel(c, billMonth))}</td><td class="r num">${euro(net)}<div class="cell-sub">brutto ${euro(round2(net * (1 + rate / 100)))}</div></td>
      <td>${inv ? `<button class="btn btn-ghost btn-sm" data-act="edit:invoices:${inv.id}">${esc(invNo(inv))}</button>` : '<span class="pill">noch offen</span>'}</td></tr>`; }).join('');
  const todo = due.filter(c => !contractInvoice(c, billMonth)).length;
  return `<div class="panel" style="margin-bottom:20px">
    <div class="panel-head"><h3>Abrechnung ${esc(ymLabel(billMonth))}</h3>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="month" id="billMonth" class="inp" style="width:auto" value="${billMonth}">
        <label class="check-field" style="padding:6px 10px"><input type="checkbox" class="check" id="billIssue" checked><span style="font-size:13.5px">gleich stellen</span></label>
        <button class="btn btn-primary" data-do="billContracts" ${todo ? '' : 'disabled'}>${todo ? `${plural(todo, 'Rechnung', 'Rechnungen')} erstellen` : 'Alles abgerechnet'}</button></div></div>
    ${due.length ? `<div class="table-wrap"><table class="data"><thead><tr><th>Vertrag</th><th>Zeitraum</th><th class="r">Betrag netto</th><th>Rechnung</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<p class="empty-note">In diesem Monat ist kein Vertrag abzurechnen.</p>`}
    <p class="muted" style="font-size:13px;margin:10px 0 0">Abgerechnet wird jeweils zu Beginn des Zeitraums. Ohne „gleich stellen“ entstehen Entwürfe, die du vorher noch prüfen kannst.</p>
  </div>`;
}
function billContracts() {

/* =========================================================
   Auftragsakte: alles zu einem Auftrag – Zeiten, Bautagebuch, Fotos, Rechnungen, Nachkalkulation
   ========================================================= */
const costOf = lv => num(data.company.costRates?.[lv] ?? data.company.costRates?.Geselle);
const jobLogs = id => data.logs.filter(l => l.job === Number(id)).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
const jobProofs = id => data.proofs.filter(p => p.orderId === Number(id)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
/** Nachkalkulation: Was war geplant, was ist angefallen, was bleibt übrig? */
function jobCalc(o) {
  const items = o.items || [], isWork = i => i.kind === 'Lohn' && i.unit === 'Std.';
  const sp = splitOf(o);
  const planH = round2(items.filter(isWork).reduce((s, i) => s + num(i.qty), 0));
  const tt = orderTimes(o.id).filter(z => !z.running), byLv = {};
  tt.forEach(z => { const lv = data.team.find(m => sameName(m.name, z.member))?.level || 'Geselle'; byLv[lv] = (byLv[lv] || 0) + timeMin(z); });
  const istH = round2(tt.reduce((s, z) => s + timeMin(z), 0) / 60);
  let labourCost = round2(Object.entries(byLv).reduce((s, [lv, m]) => s + m / 60 * costOf(lv), 0));
  const fin = liveInvoice(o.invoiceId), billed = fin && fin.status !== 'Entwurf';
  // Prognose bei laufenden Aufträgen: noch offene geplante Stunden mit einrechnen
  let openH = 0;
  if (!billed && ['Offen', 'In Arbeit'].includes(o.status) && planH > istH) {
    const lvOf = d => RATE_LEVELS.find(lv => new RegExp(rateName(lv), 'i').test(d)) || 'Geselle';
    const planCost = items.filter(isWork).reduce((s, i) => s + num(i.qty) * costOf(lvOf(i.desc)), 0);
    openH = round2(planH - istH); labourCost = round2(labourCost + openH * planCost / planH);
  }
  const parts = partsOf(o.id).filter(i => i.status !== 'Entwurf');
  const src = billed ? fin.items.filter(i => !i.ded) : items;
  const revenue = round2(billed ? src.reduce((s, i) => s + lineNet(i), 0) : totals(o, 0).net);
  let matEK = 0, estimated = false;
  src.filter(i => (i.kind || guessKind(i)) === 'Material').forEach(i => { const q = num(i.qty), b = i.buy !== undefined && i.buy !== '' ? num(i.buy) : (estimated = true, num(i.price) / (1 + num(data.company.markup) / 100)); matEK += q * b; });
  matEK = round2(matEK);
  const result = round2(revenue - labourCost - matEK), margin = revenue ? round2(result / revenue * 100) : 0;
  return { planH, istH, openH, byLv, labourCost, matEK, estimated, revenue, result, margin, billed, partsNet: round2(parts.reduce((s, i) => s + totals(i).net, 0)), planLohn: sp.Lohn, hasTimes: tt.length > 0 };
}
const marginPill = c => `<span class="pill ${c.margin >= 15 ? 'ok' : c.margin >= 0 ? 'warn' : 'bad'}">${c.result >= 0 ? '+' : ''}${fmtNum(c.margin)} %</span>`;
function jobFile(o) {
  const c = jobCalc(o), logs = jobLogs(o.id), proofs = jobProofs(o.id), parts = partsOf(o.id), fin = liveInvoice(o.invoiceId);
  const tt = orderTimes(o.id), byMember = {}; tt.forEach(z => { byMember[z.member] = (byMember[z.member] || 0) + timeMin(z); });
  const photos = [...(o.photos || []), ...logs.flatMap(l => l.photos || [])].filter(r => photoSrc(r));
  const bar = c.planH ? Math.min(100, Math.round(c.istH / c.planH * 100)) : 0, over = c.planH && c.istH > c.planH;
  const k = (label, val, cls = '') => `<div class="calc-k ${cls}"><span>${label}</span><b class="num">${val}</b></div>`;
  openModal({
    title: `${esc(ORDER1())}sakte ${esc(o.number)}`, wide: true,
    body: `<div class="modal-body">
      <div class="file-head"><div><div class="mini-title" style="font-size:19px;white-space:normal">${esc(o.title)}</div><div class="muted">${esc(o.customer)}${o.property ? ' · ' + esc(o.property) : ''} · ${fmtDate(o.date)}</div></div>${pill(orderStatus(o))}${o.acceptedAt ? `<span class="pill ok">✍ abgenommen ${fmtDate(o.acceptedAt)}</span>` : ''}${o.warrantyEnd ? `<span class="pill">Gewährleistung bis ${fmtDate(o.warrantyEnd)}</span>` : ''}</div>
      <section class="calc">
        <div class="calc-head"><h3>Nachkalkulation</h3>${c.revenue ? marginPill(c) : ''}<span class="muted" style="font-size:13px">${c.billed ? 'nach Schlussrechnung' : 'Prognose aus den geplanten Positionen'}</span></div>
        <div class="calc-grid">
          ${k(c.billed ? 'Erlös netto' : 'Erlös netto (geplant)', euro(c.revenue))}
          ${k(c.openH ? `Lohnkosten (inkl. ${fmtNum(c.openH)} Std. noch offen)` : 'Lohnkosten', '− ' + euro(c.labourCost))}
          ${k(`Material im Einkauf${c.estimated ? ' (teils geschätzt)' : ''}`, '− ' + euro(c.matEK))}
          ${k(c.result >= 0 ? 'Ergebnis' : 'Verlust', euro(c.result), c.result >= 0 ? 'good' : 'bad')}
        </div>
        <div class="hours"><div class="hours-lab"><span>Stunden: <b>${fmtNum(c.istH)}</b> gearbeitet${c.planH ? ` von <b>${fmtNum(c.planH)}</b> geplant` : ''}</span>${c.planH ? `<b style="color:${over ? 'var(--bad-fg)' : 'var(--ok-fg)'}">${over ? '+' : ''}${fmtNum(round2(c.istH - c.planH))} Std.</b>` : ''}</div>${c.planH ? `<div class="hbar"><i style="width:${bar}%;background:${over ? 'var(--red)' : 'var(--signal)'}"></i></div>` : ''}</div>
        <p class="muted" style="font-size:12.5px;margin:8px 0 0">Lohnkosten = gearbeitete Stunden × Selbstkosten je Stufe (Einstellungen). Material ohne Einkaufspreis wird über den Aufschlag geschätzt.</p>

function sigPad(canvas) {
  const ctx = canvas.getContext('2d'); let drawing = false, has = false, last = null;

  const pos = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * canvas.width / r.width, (e.clientY - r.top) * canvas.height / r.height]; };
  canvas.addEventListener('pointerdown', e => { drawing = true; last = pos(e); try { canvas.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault(); });
  canvas.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; has = true; e.preventDefault(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => canvas.addEventListener(t, () => { drawing = false; }));
  return { get has() { return has; }, clear() { ctx.clearRect(0, 0, canvas.width, canvas.height); has = false; }, data() { return has ? canvas.toDataURL('image/png') : ''; } };
}

    else if (data.invoices.some(o => o !== inv && o.id !== inv?.id && o.status !== 'Storniert' && (o.items || []).some(y => y.ded === x.ded))) out.push(`${a.number} wird schon in einer anderen Rechnung abgezogen`);

}
function openPartModal(o) {

  const parts = partsOf(o.id), drafts = parts.filter(i => i.status === 'Entwurf');

  const done = round2(parts.reduce((s, i) => s + totals(i).net, 0)), rest = round2(total - done), n = (parts.length ? Math.max(...parts.map(i => i.abschlag)) : 0) + 1;
  if (rest <= 0.004) return toast('Die Abschläge decken schon den ganzen Auftrag. Jetzt kommt die Schlussrechnung.', { error: true, ms: 6000 });

      ${parts.length ? `<div class="pay-list" style="margin-bottom:12px">${parts.map(i => `<div><span>${i.abschlag}. ${PARTN()} · ${esc(invNo(i))} · ${fmtDate(i.date)}</span><b class="num">${euro(totals(i).net)} netto</b></div>`).join('')}</div>` : ''}
      <div class="form-grid">
        <div class="field"><label for="pm">Berechnen als</label><select id="pm" name="mode"><option value="pct">Prozent der Auftragssumme</option><option value="eur">fester Betrag netto</option></select></div>
        <div class="field"><label for="pv">Wert <span class="req">*</span></label><input id="pv" name="val" inputmode="decimal" value="${parts.length ? '' : '30'}" required><span class="hint" id="pvHint"></span></div>
        <div class="field full"><label for="ps">Leistungsstand / erbrachte Leistungen</label><input id="ps" name="state" placeholder="z. B. Rohinstallation fertig, Vorwand gestellt"></div>

    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Abbrechen</button><button class="btn btn-primary">Weiter zur Rechnung</button></div></form>`,

      f.val.addEventListener('input', hint); f.mode.addEventListener('change', () => { f.val.value = ''; hint(); f.val.focus(); }); hint();

        let left = a; const lines = gr.map((g, k) => { const v = k === gr.length - 1 ? round2(left) : round2(a * g.net / total); left = round2(left - v); return { rate: g.rate, v }; });

          items: mixed ? lines.map(l => ({ desc: `${label} – Anteil ${fmtNum(l.rate)} % USt`, qty: 1, unit: 'Pauschal', price: l.v, kind: 'Sonstiges', vat: l.rate })) : [{ desc: `${label}${state ? `\nLeistungsstand: ${state}` : ''}`, qty: 1, unit: 'Pauschal', price: a, kind: 'Sonstiges' }],

/* =========================================================
   Feste Rechnungen: Stellen, Storno, Zahlungen
   ========================================================= */
function lastIssuedDate() { return data.invoices.filter(i => i.number && i.status !== 'Entwurf').map(i => i.date).sort().pop() || ''; }
/** Rechnung wird gestellt: lückenlose Nummer, Zahlungen einer stornierten Vorgängerin übernehmen */
function onIssue(inv) {
  if (!inv.number) inv.number = nextNumber('RE', data.invoices, Number(String(inv.date || today()).slice(0, 4)));
  inv.payments = inv.payments || [];
  { const cu = customerOf(inv.customer) || {}; inv.addr = { name: inv.customer, contact: cu.contact || '', street: cu.street || '', zip: cu.zip || '', city: cu.city || '' }; }
  let msg = `Rechnung ${inv.number} gestellt.`;
  const old = inv.replaces && byId('invoices', inv.replaces);
  if (old && old.carId && !inv.carId) { inv.carId = old.carId; if (old.diff && !inv.diff) inv.diff = clone(old.diff); }
  { const car = inv.carId && byId('cars', inv.carId); if (car) { car.status = 'Verkauft'; car.sale = { ...(car.sale || {}), date: car.sale?.date || inv.date, price: round2(totals(inv).gross), buyer: inv.customer, invoiceId: inv.id }; } }
  if (old && old.status === 'Storniert') {
    const p = paidOf(old);
    if (p > 0.004) {
      inv.payments.push({ id: pid(), date: inv.date, amount: p, method: 'Umbuchung', note: `übertragen von ${old.number}`, transfer: true });
      old.payments.push({ id: pid(), date: inv.date, amount: -p, method: 'Umbuchung', note: `übertragen auf ${inv.number}`, transfer: true });
      msg += ` Bereits gezahlte ${euro(p)} wurden übernommen.`;
      const over = round2(p - totals(inv).gross); if (over > 0.004) msg += ` Überzahlt: ${euro(over)} – bitte erstatten.`;
    }
  }
  refreshPaid(inv);
  return msg;
}
function stornoInvoice(x, fix) {
  if (!['Offen', 'Bezahlt'].includes(x.status)) return;
  if (x.abschlag) { const fin = data.invoices.find(i => i.status !== 'Storniert' && (i.items || []).some(y => y.ded === x.id)); if (fin) return toast(`${x.number} ist in der ${fin.status === 'Entwurf' ? 'Schlussrechnung (Entwurf)' : 'Schlussrechnung ' + fin.number} abgezogen. Bitte zuerst die Schlussrechnung ${fin.status === 'Entwurf' ? 'löschen' : 'stornieren'}.`, { error: true, ms: 8000 }); }
  const p = paidOf(x);
  const info = fix ? `\n\nDanach öffnet sich eine Kopie als Entwurf zum Korrigieren.${p > 0.004 ? ` Die bereits gezahlten ${euro(p)} werden beim Stellen übertragen.` : ''}`
    : (p > 0.004 ? `\n\nAchtung: Es wurden schon ${euro(p)} gezahlt. Diese müssen erstattet oder verrechnet werden.` : '');
  if (!confirm(`Rechnung ${x.number} über ${euro(totals(x).gross)} stornieren?\n\nEs entsteht eine Stornorechnung mit eigener Nummer. Lagerbuchungen werden zurückgenommen.${info}`)) return;
  x.status = 'Storniert';
  x.storno = { number: nextNumber('ST', data.invoices.filter(i => i.storno && i.storno.number).map(i => ({ number: i.storno.number })), new Date().getFullYear()), date: today() };
  syncStock(x);
  { const car = x.carId && byId('cars', x.carId); if (car && car.sale?.invoiceId === x.id) { car.status = 'Bestand'; toast(`${car.make} ist wieder im Fahrzeugbestand.`); } }
  save(); render();
  toast(`${x.number} storniert – Stornorechnung ${x.storno.number}.`);
  printStorno(x);
  if (fix) {
    const copy = clone(x);
    ['id', 'number', 'invoiceId', 'booked', 'paidDate', 'reminders', 'lastReminder', 'payments', 'storno', 'replaces', 'dunning', 'addr'].forEach(k => delete copy[k]);
    copy.status = 'Offen'; copy.date = today(); copy.dueDate = addDays(today(), data.company.paymentDays);
    const link = x.orderId && byId('orders', x.orderId) ? { type: 'orders', id: x.orderId } : x.offerId && byId('offers', x.offerId) ? { type: 'offers', id: x.offerId } : null;
    setTimeout(() => openForm('invoices', copy, { link, replaces: x.id, note: `Korrektur zu ${x.number} (storniert mit ${x.storno.number}). Bitte ändern und dann stellen.` }), 500);
  }
}

function backupState() {
  const b = data.backup || {}, last = data.company.lastBackup;
  const hasData = COLLECTIONS.some(k => data[k].length);
  const days = last ? daysBetween(last, today()) : null;
  const every = b.every ?? 7, ch = num(b.changes);
  const ago = days === null ? 'noch nie' : days <= 0 ? 'heute' : days === 1 ? 'gestern' : `vor ${days} Tagen`;
  if (!hasData) return { level: 'ok', short: 'Noch keine Daten', msg: '' };
  if (days === null) return { level: every ? 'late' : 'ok', short: 'Noch nie gesichert', msg: 'Es gibt noch keine Datensicherung.' };
  const late = every > 0 && days >= every && ch > 0;
  return { level: late && days >= every * 2 ? 'late' : late ? 'due' : 'ok', short: `Gesichert: ${ago}`, msg: `Letzte Sicherung ${ago}${ch ? `, seitdem ${plural(ch, 'Änderung', 'Änderungen')}` : ''}.` };
}
async function buildBackup() {

  const file = { app: 'handwerker-pro', version: Number(APP_VERSION), exported: new Date().toISOString(), copyright: COPYRIGHT, edition: EDITION, betrieb: { code: PROFILE.code, name: data.company.name || '' }, data, photos };
  return { name: `${FILEBASE}_sicherung_${PROFILE.code ? PROFILE.code + '_' : ''}${today()}.json`, blob: new Blob([JSON.stringify(file)], { type: 'application/json' }), n: Object.keys(photos).length };
}
function markBackupDone() { data.company.lastBackup = today(); data.backup.changes = 0; save(false); render(); }
function canShareFiles() { try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 't.json', { type: 'application/json' })] })); } catch (e) { return false; } }
async function shareBackup() {

}
const fmtBytes = b => b >= 1024 ** 3 ? `${(b / 1024 ** 3).toLocaleString('de-DE', { maximumFractionDigits: 1 })} GB` : b >= 1024 ** 2 ? `${(b / 1024 ** 2).toLocaleString('de-DE', { maximumFractionDigits: 1 })} MB` : `${Math.round(b / 1024)} KB`;
async function requestPersist(interactive = false) {
  try {
    if (!navigator.storage || !navigator.storage.persist) { if (interactive) toast('Dieser Browser unterstützt das nicht.', { error: true }); return; }
    if (await navigator.storage.persisted()) { if (interactive) toast('Der Speicher ist bereits geschützt.'); return; }
    const ok = await navigator.storage.persist();
    if (interactive) toast(ok ? 'Speicher geschützt – der Browser löscht die Daten nicht mehr von selbst.' : 'Der Browser hat abgelehnt. Tipp: App installieren oder als Lesezeichen speichern.', { error: !ok });
    if (view === 'settings') fillAppStatus();

}
let deferredInstall = window.__deferredInstall || null, swReady = false;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (view === 'settings') fillAppStatus(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast(`${APPNAME} wurde als App installiert.`); });
const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
async function installApp() { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) {} deferredInstall = null; fillAppStatus(); }
function initServiceWorker() {
  if (!IS_PWA || !('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;

  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) toast('Neue Version installiert – bitte die Seite neu laden.', { ms: 8000 }); });

async function fillAppStatus() {
  const box = $('#appStatus'); if (!box) return;

  const row = (state, text) => `<div class="status-row"><span class="si ${state}">${state === 'ok' ? '✓' : state === 'warn' ? '!' : '–'}</span><span>${text}</span></div>`;

  box.innerHTML = h;

function download(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function exportData() {

    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();

  } catch (e) { toast('Sicherung fehlgeschlagen: ' + (e.message || e), { error: true }); }
}
async function importData(file) {
  let incoming;
  try { incoming = JSON.parse(await file.text()); } catch (e) { return toast('Die Datei ist keine gültige Sicherung dieser App.', { error: true }); }
  const src = incoming && typeof incoming.data === 'object' && incoming.data ? incoming.data : incoming;
  if (!src || typeof src !== 'object' || !COLLECTIONS.some(k => Array.isArray(src[k]))) return toast('Die Datei ist keine gültige Sicherung dieser App.', { error: true });
  let next;
  try { next = normalize(clone(src)); } catch (e) { return toast('Die Sicherung konnte nicht gelesen werden.', { error: true }); }
  const n = COLLECTIONS.reduce((s, k) => s + next[k].length, 0);
  if ((incoming.edition || 'all') !== EDITION && !confirm(`Diese Sicherung stammt aus ${(incoming.edition || 'all') === 'kfz' ? 'ZackService Kfz' : 'ZackService'}. Trotzdem hier in ${APPNAME} laden?${IS_KFZ_ED ? ' Die App bleibt auf Kfz-Werkstatt eingestellt.' : ''}`)) return;

  photoCache.clear();

  requestAnimationFrame(() => {
    const w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
    pop.style.top = (r.bottom + h + 8 > innerHeight ? Math.max(8, r.top - h - 6) : r.bottom + 6) + 'px';
    pop.style.visibility = '';
  });
}, true);
window.addEventListener('scroll', () => closeMenus(), true);
window.addEventListener('resize', () => closeMenus());

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.taskdone) return toggleTask(t.dataset.taskdone, t.checked);
  if (t.id === 'importFile' && t.files[0]) { importData(t.files[0]); t.value = ''; }
  if (t.id === 'syncFile' && t.files[0]) { readSyncFile(t.files[0]); t.value = ''; }
  if (t.id === 'billMonth' && t.value) { billMonth = t.value; return render(); }
  if (t.id === 'fibuMode') { const m0 = new Date().getMonth(); fibuP.mode = t.value; fibuP.n = t.value === 'q' ? Math.floor(m0 / 3) + 1 : t.value === 'm' ? m0 + 1 : 1; return render(); }
  if (t.id === 'fibuN') { fibuP.n = +t.value; return render(); }
  if (t.id === 'fibuY') { fibuP.y = +t.value; return render(); }
  if (t.id === 'timeMonth' && t.value) { timeMonth = t.value; return render(); }
  if (t.id === 'timeMember') { timeMember = t.value; return render(); }
  if (t.dataset.rc) { syncDraftFields(); t.checked ? msgDraft.selected.add(t.dataset.rc) : msgDraft.selected.delete(t.dataset.rc); return render(); }
  if (t.id === 'msgGroup') { syncDraftFields(); const keep = { subject: msgDraft.subject, text: msgDraft.text }; const tpl = msgDraft.tpl; newDraft(t.value, keep); msgDraft.tpl = tpl; return render(); }
  if (t.id === 'msgTpl') {
    const v = t.value, tp = v.startsWith('b') ? MSG_TEMPLATES[+v.slice(1)] : data.templates.find(x => 'o' + x.id === v);
    msgDraft.tpl = v; if (tp) { msgDraft.subject = tp.subject; msgDraft.text = isKfz() ? tp.text.replace(/\{Objekte\}/g, '{Fahrzeuge}') : tp.text; } return render();
  }
  if (t.id === 'backupEvery') { data.backup.every = Math.max(0, parseInt(t.value, 10) || 0); save(false); render(); }
});
document.addEventListener('input', e => { if (e.target.id === 'search') { search = e.target.value; applySearch(); } if (e.target.id === 'msgText' || e.target.id === 'msgSubject') updatePreview(); });
document.addEventListener('submit', e => { if (e.target.id === 'companyForm') saveCompany(e); if (e.target.id === 'fibuForm') { e.preventDefault(); saveFibuForm(e.target); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('details.more[open]')) return closeMenus(); if ($('#modalRoot').innerHTML) return closeModal(); closeSidebar(); }
  if (e.key === '/' && !e.target.closest('input,textarea,select') && $('#search')) { e.preventDefault(); $('#search').focus(); }
});

$('#menuToggle').onclick = () => { $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); };
$('#scrim').onclick = closeSidebar;
$('#printView').onclick = () => window.print();
$('#themeToggle').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; localStorage.setItem('theme', next); renderChrome();
};

(function initTheme() {
  const saved = localStorage.getItem('theme');
  document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
})();

(async function start() {
  const r = await loadData();
  data = r.d; wasMigrated = !!r.migrated; wasBroken = !!r.broken;
  syncPrev = syncIndex();   // Ausgangsstand für den Abgleich – jede spätere Änderung bekommt einen Zeitstempel
  await preloadPhotos();
  if (r.put) { try { await persist({ put: r.put }); } catch (e) {} }
  if (IS_DEMO) $('#demoBar').classList.remove('hidden');
  render();
  if (wasMigrated) toast('Alle Daten aus der Vorversion wurden übernommen – jetzt mit großem Speicher.', { ms: 7000 });
  if (wasBroken) toast('Gespeicherte Daten waren beschädigt – Demo-Daten geladen.', { error: true, ms: 7000 });
  requestPersist(false); initServiceWorker();
})();
</script>
</body>
</html>
