@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes popIn {
  from {
    opacity: 0;
    transform: translateY(12px) scale(.98);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.anim-fade {
  animation: fadeIn .18s ease-out;
}
.anim-pop {
  animation: popIn .22s cubic-bezier(.2,.8,.2,1);
}
.print-only {

}

  .print-sheet {
    box-shadow: none !important;
    border: none !important;
    padding: 0 !important;
    max-width: none !important;
